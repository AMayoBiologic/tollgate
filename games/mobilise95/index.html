<style>
[hidden]{display:none!important}

/* Layout: a fake 640x480 CD-ROM window centred on a teal Win95 desktop; single deliberate 1995 look */
:root{
  --desk:#008080; --win:#c0c0c0; --win-dark:#808080; --win-light:#ffffff; --win-black:#000000;
  --title:#000080; --title-fg:#ffffff;
  --screen:#1a1420; --screen-fg:#f2e9c9; --amber:#ffb000; --lime:#7fff2a; --red:#ff3c3c; --sky:#4fb7ff;
  --font-head:'Press Start 2P',monospace; --font-body:'VT323',monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--desk);color:var(--win-black);font-family:var(--font-body);font-size:22px;line-height:1.15;padding-block:12px;padding-inline:16px;box-sizing:border-box;
  background-image:linear-gradient(90deg,rgba(0,0,0,.08) 1px,transparent 1px),linear-gradient(rgba(0,0,0,.08) 1px,transparent 1px);background-size:4px 4px}
*{box-sizing:border-box}
.win{max-width:720px;margin:0 auto;background:var(--win);border:2px solid;border-color:var(--win-light) var(--win-black) var(--win-black) var(--win-light);box-shadow:inset 1px 1px 0 var(--win),inset -1px -1px 0 var(--win-dark),6px 6px 0 rgba(0,0,0,.35);padding:3px}
.tb{background:var(--title);color:var(--title-fg);display:flex;align-items:center;gap:8px;padding:3px 6px;font-family:var(--font-head);font-size:10px;letter-spacing:.5px}
.tb .sp{flex:1}
.tb b{display:inline-block;width:16px;height:14px;background:var(--win);color:var(--win-black);border:1px solid;border-color:var(--win-light) var(--win-black) var(--win-black) var(--win-light);font:bold 10px/12px sans-serif;text-align:center}
.menu{display:flex;gap:14px;padding:3px 8px;font-size:18px}
.menu span:first-letter{text-decoration:underline}
.screen{background:var(--screen);color:var(--screen-fg);border:2px solid;border-color:var(--win-dark) var(--win-light) var(--win-light) var(--win-dark);margin:2px;padding:14px;min-height:420px;position:relative;overflow:hidden;image-rendering:pixelated}
.screen.scan::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(transparent 0 2px,rgba(0,0,0,.18) 2px 4px);mix-blend-mode:multiply}
.status{display:flex;gap:4px;padding:2px;font-size:18px}
.status span{flex:1;border:1px solid;border-color:var(--win-dark) var(--win-light) var(--win-light) var(--win-dark);padding:1px 6px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
h1,h2{font-family:var(--font-head);text-wrap:balance;line-height:1.5}
h1{font-size:22px;color:var(--amber);margin:0 0 6px;text-shadow:3px 3px 0 #7a3b00}
h2{font-size:12px;color:var(--lime);margin:0 0 10px;letter-spacing:.5px}
p{margin:0 0 10px;max-width:60ch}
.btn{font-family:var(--font-body);font-size:22px;background:var(--win);color:var(--win-black);border:2px solid;border-color:var(--win-light) var(--win-black) var(--win-black) var(--win-light);padding:4px 14px;cursor:pointer;text-align:left}
.btn:active{border-color:var(--win-black) var(--win-light) var(--win-light) var(--win-black)}
.btn:focus-visible{outline:2px dotted var(--win-black);outline-offset:-5px}
.btn:disabled{color:var(--win-dark);text-shadow:1px 1px 0 var(--win-light);cursor:default}
.btn.big{font-family:var(--font-head);font-size:12px;padding:12px 18px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stack{display:grid;gap:8px}
.hud{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px;font-size:20px}
.hud div{border:1px dashed rgba(255,255,255,.35);padding:4px 8px;font-variant-numeric:tabular-nums}
.hud b{display:block;font-family:var(--font-head);font-size:9px;color:var(--sky);margin-bottom:4px}
.bar{height:12px;background:#000;border:1px solid var(--screen-fg);margin-top:4px}
.bar i{display:block;height:100%;background:var(--lime);transition:width .3s}
.tasks{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.tasks .btn{white-space:normal;line-height:1.1}
.tasks .btn.done{color:var(--win-dark);text-decoration:line-through}
.crew{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.card{display:grid;justify-items:center;gap:4px;padding:8px 4px;text-align:center}
canvas{width:96px;height:96px;image-rendering:pixelated;max-width:100%}
.talk{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:start}
.talk .bub{background:var(--screen-fg);color:var(--screen);padding:10px 12px;position:relative;font-size:22px;min-width:0}
.talk .bub::before{content:"";position:absolute;left:-12px;top:20px;border:6px solid transparent;border-right-color:var(--screen-fg)}
.who{font-family:var(--font-head);font-size:9px;color:var(--amber);text-align:center;margin-top:4px;line-height:1.4}
.opts{display:grid;gap:6px;margin-top:12px}
.opts .btn{white-space:normal}
.res{margin-top:12px;padding:10px 12px;border:2px solid var(--amber);background:rgba(255,176,0,.08)}
.res.bad{border-color:var(--red);background:rgba(255,60,60,.1)}
.res.good{border-color:var(--lime);background:rgba(127,255,42,.08)}
.log{font-size:18px;opacity:.8;max-height:110px;overflow:auto;border-top:1px dotted rgba(255,255,255,.3);margin-top:12px;padding-top:6px}
.log div::before{content:"> "}
.blink{animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.cd{position:absolute;right:14px;top:14px;font-family:var(--font-head);font-size:8px;color:var(--sky);border:1px solid var(--sky);padding:4px 6px;transform:rotate(6deg)}
.fine{font-size:16px;opacity:.7}
.stars{font-size:32px;color:var(--amber);letter-spacing:4px}
.cert{background:#fffdf0;color:#222;padding:16px;border:6px double #8a6d1f;font-family:Georgia,serif;text-align:center;margin-top:12px}
.cert b{font-size:26px;display:block}
@media (prefers-reduced-motion:reduce){.blink{animation:none}.bar i{transition:none}}
@media (max-width:480px){body{font-size:19px}.hud{grid-template-columns:1fr 1fr}.talk{grid-template-columns:72px 1fr}canvas{width:72px;height:72px}}
</style>
</head>

  o:[{l:"Rebook the original. Stop looking.",r:"Rebooked. $300 more than the original because it's now Tuesday. Done.",done:1,d:0,c:300,m:-5},
     {l:"Take the Kalgoorlie one.",r:"Done. Team will see a great deal of Kalgoorlie airport.",done:1,d:0,m:-15},
     {l:"Give her the travel policy and a deadline.",r:"She reads all 22 pages, books correctly by 3pm. Done.",done:1,d:0,m:5}]},
 {t:"I made a laminated hydration schedule for each person. Colour coded. Then I realised I'd used the wrong shift times, so I made new ones. The laminator has jammed.",
  o:[{l:"Leave the laminator. Do the task.",r:"Done. The laminator is still making a noise.",done:1,d:0,m:-5},
     {l:"Fix the laminator.",r:"It's a plastic pouch folded in half. 40 minutes. Then the task. Done.",done:1,d:0,m:10},
     {l:"Buy a new laminator.",r:"$180. It also jams. Day gone.",done:0,d:1,c:180,m:0}]},
 {t:"I wanted to double-check the permit conditions so I rang the department. They've put me through to four people. I'm currently on hold to the Minister's office.",
  o:[{l:"Hang up. The conditions are on the permit.",r:"They are. Done in ten minutes.",done:1,d:0,m:0},
     {l:"Let her see it through.",r:"The Minister's office is very polite. Nothing is confirmed. Day gone.",done:0,d:1,m:5},
     {l:"Send her the last trip's permit as a template.",r:"Done. She annotates it in three colours.",done:1,d:0,m:5}]}
);
EVENTS.dazza.push(
 {t:"The ute's loaded. Bit of a problem with the fuel, though. Fuel card got declined. Then it got declined at the next servo. And the next one.",
  o:[{l:"Ring the fuel card people.",r:"Card was cancelled for 'unusual activity' in Karratha. That was Marcus. Reinstated. Done.",done:1,d:0,m:0},
     {l:"Pay on your own card and claim it.",r:"$190. Done. You'll see that money in about eight weeks.",done:1,d:0,c:190,m:0},
     {l:"Send him back to the depot to sort it.",r:"He runs out of fuel on the way back. Day gone.",done:0,d:1,m:-10}]},
 {t:"Yeah I checked the PLB. Pressed the button. Big button. It's flashing now. Is that good?",
  o:[{l:"Ring AMSA. Immediately.",r:"AMSA are understanding. They've spoken to Dazza before. Done, and a strongly worded letter is on its way.",done:1,d:0,m:-5},
     {l:"Ask which button.",r:"The button under the cover that says DO NOT PRESS. AMSA ring you first. Day gone.",done:0,d:1,m:-10},
     {l:"Get him to re-do it with the test button, supervised.",r:"Done. He's quite good at it once someone's watching.",done:1,d:0,m:5}]},
 {t:"Loaded the ute. Slight thing. Backed it into the roller door. The roller door's OK. The ute's got a new shape.",
  o:[{l:"Get it assessed before it goes anywhere.",r:"Cosmetic. Tailgate needs a hammer. $250. Done.",done:1,d:0,c:250,m:0},
     {l:"Swap vehicles.",r:"Done. The other ute has the smell. The team will cope.",done:1,d:0,m:-5},
     {l:"Ask him to write it up in Mango.",r:"He writes 'ute met door' in the description. You rewrite it. Day gone.",done:0,d:1,m:-5}]},
 {t:"Got the PPE. Boots are the wrong size. All of them. I ordered size 9 for everyone because I'm a 9 and that's an average size.",
  o:[{l:"Return them. Get everyone's size.",r:"Priya is a 6. Rusty is 'whatever I've always been'. Done.",done:1,d:1,m:0},
     {l:"Keep them. People can wear thick socks.",r:"Site induction fails on footwear. Task not done.",done:0,d:1,m:-10},
     {l:"Send him to the shop with the whole team.",r:"They go together. It becomes lunch. Done by 2pm.",done:1,d:0,c:80,m:10}]}
);
EVENTS.priya.push(
 {t:"The medical was going fine until the nurse asked about hearing and I asked if that included bird calls and it turned into a longer conversation than expected. I have to go back.",
  o:[{l:"Rebook for tomorrow, early.",r:"She's in and out by 8:15. Done.",done:1,d:1,m:0},
     {l:"Ring the clinic and ask them to finish it today.",r:"They squeeze her in. She passes. She has also identified a Willie Wagtail from inside the building. Done.",done:1,d:0,m:5},
     {l:"Ask what she told the nurse.",r:"It's about a Pied Butcherbird. It takes 30 minutes. Task not done.",done:0,d:1,m:5}]},
 {t:"I packed the eskies. I also packed a small esky inside the big esky, for the interesting samples. And a smaller one inside that. It's eskies all the way down.",
  o:[{l:"Fine. Done.",r:"Done. It is, technically, packed.",done:1,d:0,m:5},
     {l:"Unpack and repack to the standard list.",r:"Done. She keeps the little esky in her bag. You allow it.",done:1,d:0,m:0},
     {l:"Ask why.",r:"There's a good reason. It involves a beetle. Day gone.",done:0,d:1,m:5}]},
 {t:"The JHA is done, but I've added a section on the ethical treatment of invertebrates. It's 3 pages. Some of it is in Latin.",
  o:[{l:"Cut it back to the template.",r:"She saves the 3 pages 'for the journal'. Done.",done:1,d:0,m:-5},
     {l:"Leave it in.",r:"Client reads the Latin, asks for a translation. Day gone.",done:0,d:1,m:0},
     {l:"Move it to an appendix.",r:"Done. Nobody reads appendices. Everyone's happy.",done:1,d:0,m:5}]},
 {t:"I'm at the office. I'm in the car park. I've been here for 20 minutes because there's a Wedge-tailed Eagle on the light pole and I don't want to disturb it.",
  o:[{l:"Wait it out.",r:"Eagle leaves at 9:40. She's inside, task done by 11.",done:1,d:0,m:5},
     {l:"Tell her to walk under it.",r:"She does, slowly. She's upset with you. Done.",done:1,d:0,m:-10},
     {l:"Go out and watch the eagle too.",r:"It's a really good eagle. Nobody does anything. Day gone.",done:0,d:1,m:10}]}
);

// ---------- mid-week interruptions ----------
const INTERRUPTS=[
 {t:"Client just rang. Mob date's moved forward. They want the team on site a day early. They said it very cheerfully.",
  o:[{l:"Accept it.",r:"One less day. Colin says 'we'll manage'.",d:1,m:-5},
     {l:"Push back. Original date stands.",r:"Client sighs, agrees. You've spent capital you'll want later. -$500 in goodwill.",c:500,m:5},
     {l:"Accept, but get the extra day's rate in writing.",r:"They agree. One less day, $800 more budget.",d:1,c:-800,m:0}]},
 {t:"Bureau of Meteorology: tropical low forming off Broome. Might be a cyclone. Might be nothing. Site says 'monitor'.",
  o:[{l:"Keep going. Monitor.",r:"It fizzles. Nothing lost.",m:0},
     {l:"Pause the mob a day and see.",r:"It fizzles. Day lost.",d:1,m:5},
     {l:"Pre-book a fallback camp in Newman.",r:"$600. It fizzles. Camp is non-refundable.",c:600,m:0}]},
 {t:"Dazza's parking thing has 'escalated'. He needs to attend a hearing on mob day. He assures you it will be 'quick'.",
  o:[{l:"Fly him up a day late.",r:"$450 change fee. He's on the second flight.",c:450,m:5},
     {l:"Swap him for someone from the Seed team.",r:"Seed team lend Craig. Craig is fine. Dazza is wounded.",m:-10},
     {l:"Get the company lawyer to write a letter.",r:"Hearing moved to next month. Lawyer bills $350.",c:350,m:10}]},
 {t:"Head office email: 'All travel bookings now require a Form 7B.' There is no Form 7B. Nobody has heard of Form 7B.",
  o:[{l:"Ask what Form 7B is.",r:"Four replies. None answer the question. Day gone.",d:1,m:0},
     {l:"Make a Form 7B.",r:"You make one. It's accepted. It's now the official Form 7B.",m:5},
     {l:"Ignore it.",r:"Nothing happens. Nothing ever happens.",m:0}]},
 {t:"Rusty has invited the whole team to a 'planning barbecue' at his place tonight. It is Tuesday.",
  o:[{l:"Go.",r:"Good night. Everyone's in at 10am. Half a day gone, but they like you now.",d:1,m:15},
     {l:"Skip it.",r:"They go without you. There is a group chat you are not in.",m:-5},
     {l:"Bring the JHA and make it a working session.",r:"Half of it gets done over sausages. No day lost, and morale's up.",m:10}]},
 {t:"Camp emails: 'Your rooms have been reallocated to a drilling crew. We can offer dongas near the sewage plant.'",
  o:[{l:"Take the dongas.",r:"Team will smell it before they see it.",m:-15},
     {l:"Ring the camp manager and negotiate.",r:"Rooms restored. You now owe the camp manager a favour.",m:0},
     {l:"Book a motel in town, drive in daily.",r:"$1,100 extra and 40 minutes each way.",c:1100,m:-5}]},
];

// ---------- state ----------
const START={days:7,budget:6000,morale:70,done:{},log:[],used:{},screen:'title'};
let S=null;
const $=(s)=>document.querySelector(s);
const screen=$('#screen');
function save(){try{localStorage.setItem('mob95',JSON.stringify(S))}catch(e){}}
function status(t){$('#st1').textContent=t}
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}

function readiness(){return Math.round(Object.keys(S.done).length/TASKS.length*100)}
function hud(){return `<div class="hud">
 <div><b>Days to mob</b>${S.days} ${S.days<=2?'<span class="blink" style="color:var(--red)">!</span>':''}</div>
 <div><b>Budget</b>$${S.budget.toLocaleString()}</div>
 <div><b>Crew morale</b>${S.morale}%<div class="bar"><i style="width:${Math.max(0,Math.min(100,S.morale))}%"></i></div></div>
</div>`}

// ---------- screens ----------
function title(){S.screen='title';screen.innerHTML=`
 <div class="cd">CD-ROM<br>WIN 3.1 / 95</div>
 <h1>MOBILISE! '95</h1>
 <h2>The Field Team Deployment Simulator</h2>
 <div class="talk"><div><canvas id="hostcv"></canvas><div class="who">${HOST.name}<br>${HOST.role}</div></div>
  <div class="bub">G'day. You're the new Mobilisation Coordinator. Five field staff, eight things to get done, seven days till they fly out. Simple. <br><br>They will not make it simple.</div></div>
 <p class="fine" style="margin-top:14px">Pick a task, pick a person. They'll have an excuse. You choose how to deal with it. Every choice costs days, dollars or goodwill. Get everything done before the plane leaves.</p>
 <div class="row"><button class="btn big" id="start">▶ NEW GAME</button>${loadable()?'<button class="btn big" id="cont">CONTINUE</button>':''}<button class="btn" id="mute">Sound: ${muted?'OFF':'ON'}</button></div>`;
 portrait($('#hostcv'),HOST.face);
 $('#start').onclick=()=>{sfx.click();S={...JSON.parse(JSON.stringify(START))};S.screen='intro';intro()};
 const c=$('#cont');if(c)c.onclick=()=>{sfx.click();try{S=JSON.parse(localStorage.getItem('mob95'))}catch(e){}plan()};
 $('#mute').onclick=(e)=>{muted=!muted;e.target.textContent='Sound: '+(muted?'OFF':'ON')};
 status('Insert disc and click NEW GAME.')}
function loadable(){try{const s=JSON.parse(localStorage.getItem('mob95'));return s&&s.screen&&s.screen!=='title'&&s.screen!=='end'}catch(e){return false}}

function plan(){S.screen='plan';save();
 if(S.days<=0||readiness()===100)return end();
 if(interrupt())return;
 screen.innerHTML=`${hud()}<h2>Day ${8-S.days} of 7 — Readiness ${readiness()}%</h2>
 <p>Pick a task to assign.</p>
 <div class="tasks">${TASKS.map(t=>`<button class="btn ${S.done[t.id]?'done':''}" data-t="${t.id}" ${S.done[t.id]?'disabled':''}>${S.done[t.id]?'✔ ':'▢ '}${t.name}<br><span class="fine">$${t.cost}</span></button>`).join('')}</div>
 <div class="log">${S.log.slice(-4).map(l=>`<div>${esc(l)}</div>`).join('')}</div>`;
 screen.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{sfx.click();pick(b.dataset.t)});
 status(`${S.days} day${S.days===1?'':'s'} left. ${TASKS.length-Object.keys(S.done).length} tasks open.`)}

// ---------- intro: publisher, loading, disc 2 ----------
function intro(){S.screen='intro';
 const files=['MOB95.EXE','CREW.DAT','EXCUSES.DAT','GOANNA.WAV','SATPHONE.WAV','LAMINATR.DLL','FORM7B.TXT','KARRATHA.MAP','SMELL.OGG'];
 screen.innerHTML=`<div id="intro" style="display:grid;place-items:center;min-height:390px;text-align:center">
  <div><div style="font-family:var(--font-head);font-size:14px;color:var(--sky);line-height:2">SUNDOWNER SOFTWORKS</div>
  <div class="fine">presents · in association with Biologic Interactive</div>
  <div style="font-family:var(--font-head);font-size:8px;color:var(--amber);margin-top:16px">© 1995 · MADE IN PERTH, W.A.</div></div></div>`;
 sfx.ring();
 setTimeout(()=>{if(S.screen!=='intro')return;
  screen.innerHTML=`<div style="display:grid;place-items:center;min-height:390px"><div style="width:min(420px,100%)">
   <h2>LOADING MOBILISE! '95</h2><div class="bar" style="height:20px"><i id="ld" style="width:0"></i></div>
   <div class="fine" id="ldf" style="margin-top:8px;font-family:var(--font-body)">&nbsp;</div>
   <div class="fine" style="margin-top:20px">Please do not remove the disc. Or the ute.</div></div></div>`;
  let i=0;const tick=()=>{if(S.screen!=='intro')return;const pct=Math.min(100,Math.round((i+1)/files.length*100));$('#ld').style.width=pct+'%';$('#ldf').textContent='Reading '+files[i]+' …';beep(300+i*60,.04,'square',.02);i++;
   if(i<files.length)setTimeout(tick,220+Math.random()*350);else setTimeout(disc2,500)};tick()},1600);
 status('Loading…')}
function disc2(){if(S.screen!=='intro')return;sfx.bad();
 screen.innerHTML=`<div style="display:grid;place-items:center;min-height:390px;text-align:center"><div>
  <h1 style="font-size:16px">PLEASE INSERT DISC 2</h1><p class="fine">MOBILISE! '95 was shipped on one disc.</p>
  <div class="row" style="justify-content:center;margin-top:16px"><button class="btn" id="nodisc">There is no Disc 2</button><button class="btn" id="retry">Retry</button></div></div></div>`;
 $('#nodisc').onclick=()=>{sfx.good();S.screen='plan';plan()};
 $('#retry').onclick=(e)=>{sfx.bad();e.target.textContent='Still no Disc 2'};
 status('Disc error.')}

// ---------- interruptions: one chance per day, days 2-5 ----------
function interrupt(){const day=8-S.days;S.intDays=S.intDays||[];S.usedInt=S.usedInt||[];
 if(day<2||day>6||S.intDays.includes(day))return false;S.intDays.push(day);
 if(Math.random()>0.45)return false;
 let avail=INTERRUPTS.map((e,i)=>i).filter(i=>!S.usedInt.includes(i));if(!avail.length)return false;
 const ei=avail[Math.floor(Math.random()*avail.length)];S.usedInt.push(ei);const ev=INTERRUPTS[ei];S.screen='interrupt';S.curI=ei;save();sfx.ring();
 screen.innerHTML=`${hud()}<h2 style="color:var(--red)">INCOMING — Day ${day}</h2>
 <div class="talk"><div><canvas id="hostcv"></canvas><div class="who">${HOST.name}<br>${HOST.role}</div></div><div class="bub">${esc(ev.t)}</div></div>
 <div class="opts">${ev.o.map((o,i)=>`<button class="btn" data-o="${i}">${i+1}. ${esc(o.l)}</button>`).join('')}</div>`;
 portrait($('#hostcv'),HOST.face);
 screen.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{const o=ev.o[b.dataset.o];sfx.click();
  S.days-=(o.d||0);S.budget-=(o.c||0);S.morale=Math.max(0,Math.min(100,S.morale+(o.m||0)));
  const line=`Interruption: ${o.l}${o.d?` (+${o.d}d)`:''}${o.c?` (${o.c<0?'+':'-'}$${Math.abs(o.c)})`:''}`;S.log.push(line);
  ((o.d||o.c>0||o.m<0)?sfx.meh:sfx.good)();
  screen.querySelector('.opts').innerHTML=`<div class="res ${o.m<0||o.d?'bad':'good'}">${esc(o.r)}</div><div class="row" style="margin-top:10px"><button class="btn" id="next">Next ▶</button></div>`;
  $('#next').onclick=()=>{sfx.click();S.screen='plan';plan()}});
 return true}

function pick(tid){const t=TASKS.find(x=>x.id===tid);S.screen='pick';S.cur=tid;save();
 screen.innerHTML=`${hud()}<h2>${t.name}</h2><p>Who's doing it?</p>
 <div class="crew">${CREW.map(c=>`<button class="btn card" data-c="${c.id}"><canvas id="cv-${c.id}"></canvas><span>${c.name}</span><span class="fine">${c.role}</span></button>`).join('')}</div>
 <div class="row" style="margin-top:12px"><button class="btn" id="back">◀ Back</button></div>`;
 CREW.forEach(c=>{portrait($('#cv-'+c.id),c.face);$(`[data-c=${c.id}]`).onclick=()=>{sfx.click();assign(tid,c.id)}});
 $('#back').onclick=()=>{sfx.click();plan()};
 status('Choose a team member.')}

function assign(tid,cid){const c=CREW.find(x=>x.id===cid),t=TASKS.find(x=>x.id===tid);
 const pool=EVENTS[cid];S.used[cid]=S.used[cid]||[];
 let avail=pool.map((e,i)=>i).filter(i=>!S.used[cid].includes(i));if(!avail.length){S.used[cid]=[];avail=pool.map((e,i)=>i)}
 const ei=avail[Math.floor(Math.random()*avail.length)];S.used[cid].push(ei);const ev=pool[ei];
 S.screen='event';S.cur=tid;S.curC=cid;S.curE=ei;save();sfx.ring();
 screen.innerHTML=`${hud()}<h2>${t.name} → ${c.name}</h2>
 <div class="talk"><div><canvas id="evcv"></canvas><div class="who">${c.name}<br>${c.role}</div></div><div class="bub">${esc(ev.t)}</div></div>
 <div class="opts">${ev.o.map((o,i)=>`<button class="btn" data-o="${i}">${i+1}. ${esc(o.l)}</button>`).join('')}</div>`;
 portrait($('#evcv'),c.face);
 screen.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>resolve(tid,cid,ev,ev.o[b.dataset.o]))}

function resolve(tid,cid,ev,o){const t=TASKS.find(x=>x.id===tid),c=CREW.find(x=>x.id===cid);
 S.days-=1+(o.d||0);S.budget-=(o.c||0)+(o.done?t.cost:0);S.morale=Math.max(0,Math.min(100,S.morale+(o.m||0)));
 if(o.done)S.done[tid]=cid;
 const line=`${t.name} / ${c.name}: ${o.done?'DONE':'not done'}${o.d?` (+${o.d}d)`:''}${o.c?` (-$${o.c})`:''}`;S.log.push(line);
 const cls=o.done?(o.m<0||o.c>300?'':'good'):'bad';(o.done?(cls==='good'?sfx.good:sfx.meh):sfx.bad)();
 S.screen='result';save();
 const opts=screen.querySelector('.opts');opts.innerHTML=`<div class="res ${cls}">${esc(o.r)}<div class="fine" style="margin-top:6px">${esc(line)}${o.m?` · morale ${o.m>0?'+':''}${o.m}`:''}</div></div><div class="row" style="margin-top:10px"><button class="btn" id="next">Next ▶</button></div>`;
 $('#next').onclick=()=>{sfx.click();plan()}}

function end(){S.screen='end';save();const r=readiness(),bust=S.budget<0;
 let title,body,stars;
 if(r===100&&!bust){title='WHEELS UP';body='Everything done, on budget, on time. Nobody at head office will notice. That is the job.';stars=5}
 else if(r===100){title='WHEELS UP (SORT OF)';body=`Everything done, but you're $${(-S.budget).toLocaleString()} over. Finance have booked a "quick chat".`;stars=4}
 else if(r>=75){title='THEY FLEW ANYWAY';body='Most of it done. The gaps will be discovered on site, probably by the client, probably at a prestart.';stars=3}
 else if(r>=50){title='DELAYED 48 HOURS';body='Half a team, half the gear. Rusty is already telling people this never used to happen.';stars=2}
 else{title='TRIP CANCELLED';body='The client rang. Then the client\'s manager rang. Marcus is on a boat and unbothered.';stars=1}
 if(S.morale<25){body+=' Also, the crew have stopped replying to your messages.'}
 screen.innerHTML=`<h1>${title}</h1><h2>Readiness ${r}% · Budget $${S.budget.toLocaleString()} · Morale ${S.morale}%</h2>
 <div class="stars">${'★'.repeat(stars)}${'☆'.repeat(5-stars)}</div>
 <div class="talk" style="margin-top:12px"><div><canvas id="hostcv"></canvas><div class="who">${HOST.name}</div></div><div class="bub">${esc(body)}</div></div>
 <div class="cert"><span style="font-size:14px;letter-spacing:3px">CERTIFICATE OF MOBILISATION</span><b>${title}</b><span>awarded to the Mobilisation Coordinator · ${new Date().toLocaleDateString('en-AU')}</span></div>
 <div class="log">${S.log.map(l=>`<div>${esc(l)}</div>`).join('')}</div>
 <div class="row" style="margin-top:12px"><button class="btn big" id="again">▶ PLAY AGAIN</button></div>`;
 portrait($('#hostcv'),HOST.face);
 (stars>=4?sfx.good:sfx.bad)();
 $('#again').onclick=()=>{sfx.click();S=JSON.parse(JSON.stringify(START));S.screen='plan';plan()};
 status('Game over.')}

// ---------- boot ----------
function boot(){S=JSON.parse(JSON.stringify(START));title()}
if(window.claude?.hot?.snapshot)window.claude.hot.snapshot(()=>S);
window.claude?.hot?.ready?window.claude.hot.ready(d=>{if(d&&d.screen&&d.screen!=='title'){S=d;plan()}else boot()}):boot();
</script>

</body>
