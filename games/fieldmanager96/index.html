<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Field Manager '96</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>
[hidden]{display:none!important}

/* Layout: Win95 MDI window. Left nav rail, main panel, status bar. Single deliberate 1996 look. */
:root{
  --desk:#008080; --win:#c0c0c0; --win-dark:#808080; --win-light:#ffffff; --win-black:#000000;
  --title:#000080; --title-fg:#ffffff;
  --screen:#1a1420; --screen-fg:#f2e9c9; --amber:#ffb000; --lime:#7fff2a; --red:#ff3c3c; --sky:#4fb7ff; --dim:rgba(242,233,201,.55);
  --font-head:'Press Start 2P',monospace; --font-body:'VT323',monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--desk);color:var(--win-black);font-family:var(--font-body);font-size:21px;line-height:1.15;padding-block:12px;padding-inline:16px;box-sizing:border-box;
  background-image:linear-gradient(90deg,rgba(0,0,0,.08) 1px,transparent 1px),linear-gradient(rgba(0,0,0,.08) 1px,transparent 1px);background-size:4px 4px}
*{box-sizing:border-box}
.win{max-width:860px;margin:0 auto;background:var(--win);border:2px solid;border-color:var(--win-light) var(--win-black) var(--win-black) var(--win-light);box-shadow:inset 1px 1px 0 var(--win),inset -1px -1px 0 var(--win-dark),6px 6px 0 rgba(0,0,0,.35);padding:3px}
.tb{background:var(--title);color:var(--title-fg);display:flex;align-items:center;gap:8px;padding:3px 6px;font-family:var(--font-head);font-size:10px;letter-spacing:.5px}
.tb .sp{flex:1}
.tb b{display:inline-block;width:16px;height:14px;background:var(--win);color:var(--win-black);border:1px solid;border-color:var(--win-light) var(--win-black) var(--win-black) var(--win-light);font:bold 10px/12px sans-serif;text-align:center}
.body{display:grid;grid-template-columns:150px 1fr;gap:3px;margin:2px}
.nav{display:grid;align-content:start;gap:3px}
.nav .btn{width:100%;font-size:19px;padding:4px 8px}
.nav .btn.on{border-color:var(--win-black) var(--win-light) var(--win-light) var(--win-black);background:#d8d8d8}
.nav .btn .n{float:right;background:var(--red);color:#fff;font-size:14px;padding:0 5px;border-radius:2px}
.screen{background:var(--screen);color:var(--screen-fg);border:2px solid;border-color:var(--win-dark) var(--win-light) var(--win-light) var(--win-dark);padding:12px;min-height:460px;position:relative;overflow:hidden;min-width:0}
.screen.scan::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(transparent 0 2px,rgba(0,0,0,.18) 2px 4px);mix-blend-mode:multiply}
.status{display:flex;gap:4px;padding:2px;font-size:17px}
.status span{flex:1;border:1px solid;border-color:var(--win-dark) var(--win-light) var(--win-light) var(--win-dark);padding:1px 6px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
h1,h2,h3{font-family:var(--font-head);text-wrap:balance;line-height:1.5;margin:0}
h1{font-size:20px;color:var(--amber);margin-bottom:6px;text-shadow:3px 3px 0 #7a3b00}
h2{font-size:11px;color:var(--lime);margin-bottom:10px}
h3{font-size:9px;color:var(--sky);margin:10px 0 6px}
p{margin:0 0 10px;max-width:62ch}
.btn{font-family:var(--font-body);font-size:20px;background:var(--win);color:var(--win-black);border:2px solid;border-color:var(--win-light) var(--win-black) var(--win-black) var(--win-light);padding:3px 12px;cursor:pointer;text-align:left}
.btn:active{border-color:var(--win-black) var(--win-light) var(--win-light) var(--win-black)}
.btn:focus-visible{outline:2px dotted var(--win-black);outline-offset:-5px}
.btn:disabled{color:var(--win-dark);text-shadow:1px 1px 0 var(--win-light);cursor:default}
.btn.big{font-family:var(--font-head);font-size:11px;padding:12px 18px}
.btn.sm{font-size:17px;padding:1px 8px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.hud{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-bottom:12px;font-size:19px}
.hud>div{border:1px dashed rgba(255,255,255,.35);padding:4px 8px;font-variant-numeric:tabular-nums}
.hud b{display:block;font-family:var(--font-head);font-size:8px;color:var(--sky);margin-bottom:4px}
.bar{height:10px;background:#000;border:1px solid var(--screen-fg);margin-top:4px}
.bar i{display:block;height:100%;background:var(--lime);transition:width .3s}
.bar i.warn{background:var(--amber)}.bar i.bad{background:var(--red)}
table{border-collapse:collapse;width:100%;font-size:19px;font-variant-numeric:tabular-nums}
th{font-family:var(--font-head);font-size:8px;color:var(--sky);text-align:left;padding:4px 6px;border-bottom:1px solid rgba(255,255,255,.3)}
td{padding:3px 6px;border-bottom:1px dotted rgba(255,255,255,.15);vertical-align:middle}
tr.pick{cursor:pointer}tr.pick:hover td{background:rgba(255,255,255,.06)}
tr.sel td{background:rgba(127,255,42,.12)}
tr.out td{opacity:.45}
.twrap{overflow-x:auto}
canvas{width:48px;height:48px;image-rendering:pixelated;max-width:100%;vertical-align:middle}
.talk{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:start}
.talk canvas{width:96px;height:96px}
.talk .bub{background:var(--screen-fg);color:var(--screen);padding:10px 12px;position:relative;font-size:21px;min-width:0}
.talk .bub::before{content:"";position:absolute;left:-12px;top:20px;border:6px solid transparent;border-right-color:var(--screen-fg)}
.who{font-family:var(--font-head);font-size:8px;color:var(--amber);text-align:center;margin-top:4px;line-height:1.4}
.opts{display:grid;gap:6px;margin-top:12px}.opts .btn{white-space:normal}
.res{margin-top:12px;padding:10px 12px;border:2px solid var(--amber);background:rgba(255,176,0,.08)}
.res.bad{border-color:var(--red);background:rgba(255,60,60,.1)}.res.good{border-color:var(--lime);background:rgba(127,255,42,.08)}
.log{font-size:17px;opacity:.85;max-height:220px;overflow:auto;border-top:1px dotted rgba(255,255,255,.3);margin-top:10px;padding-top:6px}
.log div::before{content:"> "}
.fine{font-size:16px;opacity:.7}
.stat{display:inline-block;min-width:22px;text-align:right}
.stat.hi{color:var(--lime)}.stat.lo{color:var(--red)}
.mail{border:1px solid rgba(255,255,255,.25);padding:8px 10px;margin-bottom:8px}
.mail.unread{border-color:var(--amber)}
.mail .from{font-family:var(--font-head);font-size:8px;color:var(--amber)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cols>*{min-width:0}
.blink{animation:bl 1s steps(1) infinite}@keyframes bl{50%{opacity:0}}
.tag{font-family:var(--font-head);font-size:7px;padding:2px 5px;border:1px solid currentColor;margin-left:6px;vertical-align:middle}
@media (prefers-reduced-motion:reduce){.blink{animation:none}.bar i{transition:none}}
@media (max-width:640px){body{font-size:18px}.body{grid-template-columns:1fr}.nav{grid-template-columns:repeat(3,1fr)}.nav .btn{font-size:16px;padding:3px 6px}.cols{grid-template-columns:1fr}.talk{grid-template-columns:72px 1fr}.talk canvas{width:72px;height:72px}}
.tasks{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.tasks .btn{white-space:normal;line-height:1.1}
.tasks .btn.done{color:var(--win-dark);text-decoration:line-through}
.tasks .btn.skip{color:var(--red);text-decoration:line-through}
.crew{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}
.card{display:grid;justify-items:center;gap:2px;padding:6px 4px;text-align:center;line-height:1.05}
.card canvas{width:56px;height:56px}
.cbar{display:inline-block;width:46px;height:8px;background:#000;border:1px solid var(--dim);vertical-align:middle}
.cbar i{display:block;height:100%;background:var(--lime)}.cbar i.warn{background:var(--amber)}.cbar i.bad{background:var(--red)}
.inj{color:var(--red);font-family:var(--font-head);font-size:7px}
.claim{color:var(--amber)}
.qa{border-left:3px solid var(--sky);padding:4px 10px;margin:6px 0}
.qa b{color:var(--sky)}
.tbar{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
select{font-family:var(--font-body);font-size:18px}
</style>
</head>

let AC=null,muted=false;

function genFace(){
 const pick=a=>a[Math.floor(Math.random()*a.length)];
 const H=pick(['h','k','y','o','n','e']),K=pick(['s','t','d']),W=pick(['b','g','o','c','m','r','p','q','y']),M=pick(['w','r']);

 const tops=[['............','...HHHHHH...','..HSSSSSSH..'],['...HHHHHH...','..HHHHHHHH..','..HSSSSSSH..'],['....HHHH....','...HHHHHH...','..HSSSSSSH..'],['............','............','..SSSSSSSS..'],['..HHHHHHHH..','.HHHHHHHHHH.','.HHSSSSSSHH.']];
 const long=style===4;

 const low=['..WWWWWWWW..','.WWWWWWWWWW.','.WWW.WW.WWW.'];
 return [...tops[style],...mid,...low].map(r=>r.replace(/H/g,H).replace(/S/g,K).replace(/W/g,W).replace(/M/g,M));
}

// ---------- mob tasks ----------
const MOB_TASKS=[{id:'ind',n:'Site inductions',c:400},{id:'med',n:'Pre-mob medicals',c:900},{id:'veh',n:'Vehicle pre-start & load',c:300},{id:'sat',n:'Sat phone & PLB check',c:150},{id:'jha',n:'JHA submitted',c:0},{id:'ppe',n:'PPE issued',c:600}];

// ---------- excuses: mobilisation ----------
// Option fields: l label, r result, done 1/0, d extra days lost, c cost, m morale (this person), cond, data, rep.

// =====================================================================
// ENGINE — pure game logic. No DOM in here, so the balance harness can
// drive a whole season headlessly.
// =====================================================================
const SEASON_WEEKS=46, COST_PD=420, VAL_PD=3400, REV_TARGET=900000, SAFETY_LIMIT=2, CLIENT_MIN=4;
const R=Math.random, rint=(a,b)=>a+Math.floor(R()*(b-a+1)), pick=a=>a[Math.floor(R()*a.length)];
const clamp=(v,a=0,b=100)=>Math.max(a,Math.min(b,v));
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
const money=n=>(n<0?'-$':'$')+Math.abs(Math.round(n)).toLocaleString();
const PR={he:{he:'he',him:'him',his:'his',He:'He',His:'His'},she:{he:'she',him:'her',his:'her',He:'She',His:'Her'}};
const P=s=>PR[s&&s.p]||PR.he;
let S=null;

function START(){const s={season:1,week:1,cash:60000,revenue:0,desk:0,recordables:0,board:50,
 staff:JSON.parse(JSON.stringify(STAFF0)).map(x=>({...x,cond:100,inj:0,apps:0,recs:0,since:1,known:true})),
 market:[],trips:[],clientRep:{newm:60,s32:60,rio:60,dept:60,lith:60},
 inbox:[],log:[],cd:{},seen:{},flags:{},busy:[],training:{},att:3,camps:{},promise:null,
 trip:null,pick:[],screen:'title',view:'office',tripSeq:0,apSeq:0,history:[],rustyOneMore:0,fac:{},building:[],pending:[],hires:{},redundant:{},rank:0,rankStart:1,me:{write:9},branch:null,dept:null,stats:{trips:0,rec:0,hired:0,fired:0},budget:0,lastRevenue:0,rankTrips:0,career:[],strat:{}};
 S=s;s.trips=TRIPS0.map(t=>mkTrip(t));s.target=targetFor(1);for(let i=0;i<4;i++)s.market.push(genApplicant());return s}
function targetFor(season){return {rev:Math.round(REV_TARGET*(1+.08*(season-1))/5000)*5000,safety:SAFETY_LIMIT,clients:CLIENT_MIN}}
function mkTrip(t){const n=t.need.field+t.need.admin;return {...t,id:'t'+(++S.tripSeq),val:Math.round(t.days*n*VAL_PD*(1+.06*(S.season-1))/1000)*1000,result:null}}

// ---------- helpers ----------
const staff=id=>S.staff.find(s=>s.id===id);
function rs(f){const a=S.staff.filter(s=>!s.temp&&(!f||f(s)));return a.length?pick(a):null}
function rc(){return pick(Object.keys(CLIENTS))}
function tpl(str,x={}){const p=x.p||null,pp=P(p);return String(str)
 .replace(/\{n\}|\{a\}/g,p?p.name:'').replace(/\{b\}/g,x.b||'').replace(/\{o\}/g,x.o||'someone').replace(/\{c\}/g,x.c||'')
 .replace(/\{best\}/g,x.best||'the team').replace(/\{miss\}/g,x.miss||'')
 .replace(/\{he\}/g,pp.he).replace(/\{him\}/g,pp.him).replace(/\{his\}/g,pp.his).replace(/\{He\}/g,pp.He).replace(/\{His\}/g,pp.His)}
function otherName(excl,pool){const a=(pool||S.staff).filter(s=>s.id!==excl&&!s.temp);return a.length?pick(a).name:'someone'}
function avail(s){return s&&!s.inj&&!(s.away>0)&&!S.busy.includes(s.id)}
function nextTrip(){return S.trips.filter(t=>!t.result).sort((a,b)=>a.wk-b.wk)[0]}
function tripById(id){return S.trips.find(t=>t.id===id)}
function log(t){S.log.push(`W${S.week}: ${t}`);if(S.log.length>120)S.log.shift()}
function mail(m){S.inbox.unshift({...m,read:false,wk:S.week,done:null});if(S.inbox.length>60)S.inbox.pop()}
function unread(){return S.inbox.filter(m=>!m.read).length}
function removeStaff(id,why){const s=staff(id);if(!s)return;S.staff=S.staff.filter(x=>x.id!==id);delete S.training[id];if(why)log(`${s.name} ${why}`);
 S.history.push({name:s.name,role:s.role,apps:s.apps,left:`S${S.season} W${S.week}`});
 if(S.promise&&S.promise.id===id)S.promise.gone=true}
function bumpStat(s,k,d){if(['field','admin','rel','fit'].includes(k))s[k]=clamp(s[k]+d,1,20);else s[k]=clamp(s[k]+d)}

// ---------- declarative effects (inbox, debrief, camps) ----------
function applyE(e){if(!e)return '';let out=e.out||'';
 if(e.cash)S.cash+=e.cash;
 if(e.board)S.board=clamp(S.board+e.board);
 if(e.rep&&S.clientRep[e.rep[0]]!=null)S.clientRep[e.rep[0]]=clamp(S.clientRep[e.rep[0]]+e.rep[1]);
 if(e.s){const s=staff(e.s.id);if(s){for(const k of ['morale','cond','field','admin','rel','fit'])if(e.s[k])bumpStat(s,k,e.s[k]);
  if(e.s.wage)s.wage+=e.s.wage;if(e.s.contract)s.contract+=e.s.contract;if(e.s.inj!=null)s.inj=Math.max(s.inj,e.s.inj);
  if(e.s.promo&&!/^Senior/.test(s.role))s.role='Senior '+s.role;if(e.s.trait&&!s.traits.includes(e.s.trait))s.traits.push(e.s.trait)}}
 if(e.all)S.staff.forEach(s=>{if(e.all.morale)bumpStat(s,'morale',e.all.morale);if(e.all.cond)bumpStat(s,'cond',e.all.cond)});
 if(e.leave)removeStaff(e.leave,'has left.');
 if(e.flag)S.flags[e.flag]=true;
 if(e.unflag)delete S.flags[e.unflag];
 if(e.addTrip)addTrip(e.addTrip);
 if(e.tripVal){const t=S.trips.find(x=>!x.result&&x.client===e.tripVal[0]);if(t)t.val=Math.round(t.val*(1+e.tripVal[1])/100)*100}
 if(e.promise)S.promise={...e.promise};
 if(e.recruit)S.market.unshift(genApplicant(e.recruit));
 if(e.temp){const f=genFace();const p=pick(['he','she']);S.staff.push({id:'tmp'+(++S.apSeq),name:pick(NAMES[p]),p,role:e.temp.role,face:f,age:20,field:4,admin:7,rel:10,fit:16,morale:95,cond:100,inj:0,wage:0,contract:e.temp.weeks,traits:['keen','no-licence'],apps:0,recs:0,since:S.season,temp:true,known:true})}
 if(e.goto){S.view='proposal';S.goto=e.goto}
 if(e.rpt){const o2=reportAction(e.rpt);out=[out,o2].filter(Boolean).join(' ')}
 if(e.note){const s=staff(e.note.id);if(s)fileNote(s,e.note.k,e.note.t)}
 if(e.chance){const w=R()<e.chance.p;const o2=applyE(w?e.chance.win:e.chance.lose);out=[out,o2].filter(Boolean).join(' ')}
 return out}
function addTrip(a){const k=TRIP_GEN.kinds.find(x=>x.type===(a.type||'flora'))||TRIP_GEN.kinds[1];
 const place=(TRIP_GEN.places.find(p=>p[1]===a.client)||TRIP_GEN.places[0]);
 let wk=S.week+(a.inWeeks||3);while(S.trips.some(t=>!t.result&&Math.abs(t.wk-wk)<1))wk++;
 if(wk>SEASON_WEEKS-1)return;
 const t=mkTrip({wk,client:a.client,name:`${pick(k.names)}, ${place[0]}`,type:k.type,days:a.days||3,need:{field:2,admin:a.days>4?1:0},hazard:place[2]});
 S.trips.push(t);S.trips.sort((x,y)=>x.wk-y.wk);log(`New job: ${t.name} (wk ${t.wk}).`)}

// ---------- inbox trigger ----------
function maybeInbox(force){if(!force&&R()>.55)return;
 const pool=INBOX.filter(x=>(S.cd[x.id]||0)<=S.week&&(x.r??3)<=S.rank&&(x.rmax??9)>=S.rank&&!blockedInbox(x.id));
 for(let tries=0;tries<8&&pool.length;tries++){const i=Math.floor(R()*pool.length),x=pool[i];pool.splice(i,1);
  const m=x.fn();if(m){S.cd[x.id]=S.week+x.cd;mail(m);return}}}
function answerMail(i,j){const m=S.inbox[i];if(!m||m.done||!m.opts)return;const o=m.opts[j];const out=applyE(o.e);m.done=out||o.l;log(`${m.subj}: ${o.l}.`)}

// ---------- weekly tick ----------
function deskValue(s){if(s.temp)return 0;return Math.round((s.admin*28+s.field*9)*(.55+s.cond/220)*(1+.1*F('office')))}
function weekTick(o={}){const team=o.team||[];
 for(const id in S.training){const k=S.training[id],s=staff(id);if(!s||!k||team.includes(id)||!avail(s))continue;S.cash-=500;s.cond=clamp(s.cond-8);
  if(k==='rel'){if(R()<.45){s.rel=clamp(s.rel+1,1,20);log(`${s.name} reliability +1.`)}else log(`${s.name} did the reliability course. Nothing changed.`)}
  else{const cap=s.age>=50?16:20;if(s[k]<cap)s[k]=clamp(s[k]+1,1,20)}}
 S.training={};
 const rshare=(S.rank>=3||isDept())?reportWeekly(team):0;let desk=0;
 S.staff.slice().forEach(s=>{S.cash-=s.wage;
  if(!team.includes(s.id)){if(avail(s))desk+=deskValue(s);s.cond=clamp(s.cond+20)}
  if(s.inj>0)s.inj--;
  s.contract--;
  const mt=55+5*F('office')+(F('coffee')?2:0)+(F('bonus')?3:0);s.morale=clamp(s.morale+(s.morale<mt?1:s.morale>mt+25?-1:0)+(R()<.5?-1:1));
  if(s.morale<25&&!s.temp&&R()<.08){mail({from:s.name,face:s.face,subj:'Resignation',body:`${s.name} has resigned. ${P(s).He} says it's "not you". It's partly you.`});removeStaff(s.id,'resigned.');return}
  if(s.contract===4&&!s.temp){const nw=Math.round(s.wage*(1.06-(F('bonus')?.04:0)+(s.morale<50?.08:0)+(Math.max(s.field,s.admin)>=16?.05:0))/10)*10;
   mail({from:s.name,face:s.face,subj:'Quick chat when you have a sec?',body:`${s.name}'s contract ends in 4 weeks. ${P(s).He}'d want ${money(nw)}/wk to stay.`,
    opts:[{l:`Renew at ${money(nw)} (+52 wk)`,e:{s:{id:s.id,contract:52,wage:nw-s.wage,morale:8},out:'Renewed.'}},{l:'Let it run out',e:{s:{id:s.id,morale:-10},out:'Noted. So did they.'}}]})}
  if(s.contract<=0){if(s.temp){log(`${s.name}'s work experience ended. They left a thank-you card.`);S.staff=S.staff.filter(x=>x.id!==s.id)}
   else{removeStaff(s.id,'finished up. Contract ended.');mail({from:'Head Office',face:'colin',subj:`${s.name} has left`,body:`${s.name}'s contract ended. Their laptop has not.`})}}});
 desk=Math.round(desk*(1-rshare));S.cash+=desk;S.revenue+=desk;S.desk+=desk;
 facWeekly();hrWeekly();careerWeekly();tenderWeekly();S.busy=[];S.att=3+(F('recruiter')?1:0);
 if(S.week%4===0)refreshMarket();
 S.week++;
 boardUpdate();
 maybeInbox()}

// ---------- board ----------
function boardConf(){const tv=S.trips.reduce((a,t)=>a+t.val,0)||1,dv=S.trips.filter(t=>t.result).reduce((a,t)=>a+t.val,0);
 const frac=Math.max(.12,(dv/tv)*.8+(Math.min(S.week,SEASON_WEEKS)/SEASON_WEEKS)*.2);
 const r1=S.revenue/(S.target.rev*frac);
 let c=55+clamp((r1-1)*90,-35,18);
 c+=clamp((S.target.safety-S.recordables)*8,-48,8);
 c+=(avg(Object.values(S.clientRep))-60)*.6;
 if(S.cash<0)c-=Math.min(30,6+(-S.cash/10000)*3);
 c+=(avg(S.staff.map(s=>s.morale))-60)*.15;
 return clamp(c)}
function boardUpdate(){if(S.rank<3)return;S.board=Math.round(clamp(S.board*.75+boardConf()*.25))}

// ---------- recruitment ----------
function genApplicant(role){const a=role?(ARCH.find(x=>x.role===role)||ARCH[0]):(()=>{const tot=ARCH.reduce((x,y)=>x+y.w,0);let r=R()*tot;for(const x of ARCH){if((r-=x.w)<0)return x}return ARCH[0]})();
 const p=pick(['he','she']);const used=new Set(S.staff.map(s=>s.name).concat(S.market.map(s=>s.name)));
 const name=pick(NAMES[p].filter(n=>!used.has(n)))||pick(NAMES[p]);
 const st={field:rint(...a.field),admin:rint(...a.admin),rel:rint(...a.rel),fit:rint(...a.fit)};
 if(F('office')+F('brand')){const k=pick(['field','admin','rel','fit']);st[k]=clamp(st[k]+F('office')+F('brand'),1,20)}
 const honest=R()<.35,bl=honest?0:rint(1,4);
 const cv={field:clamp(st.field+rint(0,bl),1,20),admin:clamp(st.admin+rint(0,bl),1,20),rel:clamp(st.rel+rint(0,bl),1,20)};
 const tr=[...a.traits].sort(()=>R()-.5).slice(0,R()<.3?1:2);
 const quality=(cv.field+cv.admin+cv.rel)/60;
 const wage=Math.round((a.wage[0]+(a.wage[1]-a.wage[0])*quality)/10)*10;
 const lo=clamp(st.rel-rint(0,3),1,20);
 return {id:'ap'+(++S.apSeq),name,p,role:a.role,face:genFace(),age:rint(...a.age),...st,morale:70,cond:100,inj:0,wage,contract:52,traits:tr,apps:0,recs:0,
  cv,known:F('recruiter')?{fit:true}:{},relRange:[lo,clamp(lo+4,1,20)],dodgy:R()<(F('recruiter')?.15:.3),cvText:pick(CV_LINES),listed:S.week,qa:[]}}
function refreshMarket(){S.market=S.market.filter(a=>S.week-a.listed<8);while(S.market.length<4+F('office'))S.market.push(genApplicant())}

const BOOK=[
 {id:'fly',n:'Flights',o:[
  {id:'cheap',l:'Cheapest fare, via Kalgoorlie',pp:180,risk:.15,d:'Six hours in Kalgoorlie. Team arrives tired.'},
  {id:'direct',l:'Direct commercial',pp:420,risk:.08,d:'Standard. Occasionally cancelled.'},
  {id:'charter',l:"Client's FIFO charter seats",pp:260,risk:.04,d:'Reliable. Needs inductions done or you get bumped.'}]},
 {id:'bed',n:'Accommodation',o:[
  {id:'swag',l:'Swags on site',pn:0,risk:.05,d:'Free. Condition drains faster.'},
  {id:'camp',l:'Mine camp rooms',pn:160,risk:.12,d:'Standard. Camps lose bookings.'},
  {id:'motel',l:'Motel in town',pn:190,risk:.04,d:'Comfortable. The drive in costs field time.'}]},
 {id:'car',n:'Vehicles',o:[
  {id:'fleet',l:'Company utes',vd:0,risk:.22,d:'Free. Only as good as your fleet.'},
  {id:'hire4',l:'Hire 4WDs',vd:220,risk:.06,d:'Reliable, site-compliant.'},
  {id:'hire2',l:'Hire 2WD sedans',vd:90,risk:.04,d:"Cheap. Can't get down the tracks."}]},
 {id:'frt',n:'Freight',o:[
  {id:'ute',l:'Carry it in the vehicles',flat:0,risk:.2,d:'Free. Overloaded utes and missing eskies.'},
  {id:'road',l:'Road freight',flat:900,risk:.1,d:'Usually on time.'},
  {id:'air',l:'Air freight',flat:2600,risk:.02,d:'Expensive. Always there.'}]},
];
const CLIENT_REQ={
 newm:{note:'FIFO charter flights and camp rooms only.',must:{fly:['charter'],bed:['camp']}},
 s32:{note:'Village accommodation is mandatory. No 2WDs on site.',must:{bed:['camp'],car:['fleet','hire4']}},
 rio:{note:'Charter flights. Site-compliant 4WDs only: a serviced fleet or hire 4WDs.',must:{fly:['charter'],car:['hire4','fleet*']}},
 dept:{note:'Public money. Keep bookings under $6,000. Swags are fine.',lean:6000},
 lith:{note:'They want results fast. Air freight preferred.',pref:{frt:['air']}},
};
function bookOpt(b,id){return BOOK.find(x=>x.id===b).o.find(o=>o.id===id)}
function bookCost(bid,oid,t,n){const o=bookOpt(bid,oid),v=Math.ceil(n/2);return (o.pp||0)*n+(o.pn||0)*n*t.days+(o.vd||0)*v*t.days+(o.flat||0)}
function bookingTotal(T,t){return BOOK.reduce((a,b)=>a+(T.book&&T.book[b.id]?bookCost(b.id,T.book[b.id],t,T.team.length):0),0)}
function bookingsDone(T){return BOOK.every(b=>T.book&&T.book[b.id])}
function bookOK(client,bid,oid){const r=CLIENT_REQ[client];if(!r||!r.must||!r.must[bid])return true;const m=r.must[bid];
 if(m.includes(oid))return true;if(oid==='fleet'&&m.includes('fleet*')&&F('fleet')>=1)return true;return false}
function book(bid,oid){const T=S.trip;T.book=T.book||{};T.book[bid]=oid}
// The office admin books it: gets the client rules right in proportion to their admin skill.
function autoBook(q){const T=S.trip,t=tripById(T.id);T.book=T.book||{};
 const adm=q??(Math.max(...S.staff.filter(s=>!s.temp).map(s=>s.admin),8)/20);
 BOOK.forEach(b=>{if(T.book[b.id])return;let o;
  if(R()<adm){const ok=b.o.filter(x=>bookOK(t.client,b.id,x.id));const pref=CLIENT_REQ[t.client].pref&&CLIENT_REQ[t.client].pref[b.id];
   o=(pref&&ok.find(x=>pref.includes(x.id)))||ok.find(x=>x.id===(b.id==='fly'?'direct':b.id==='bed'?'camp':b.id==='car'?(F('fleet')?'fleet':'hire4'):'road'))||ok[0]||b.o[1]}
  else o=pick(b.o);T.book[b.id]=o.id})}
// Applied when the team flies: costs, client rules, and whatever goes wrong in transit.
function applyBookings(T,t){if(!bookingsDone(T))autoBook(.5);const n=T.team.length,out=[];let breaches=0,repD=0;
 const flyCost=bookCost('fly',T.book.fly,t,n);T.cost+=bookingTotal(T,t);
 if(bookOK(t.client,'fly',T.book.fly)){T.cost-=flyCost;T.recharged=flyCost;out.push(`Flights recharged to ${CLIENTS[t.client]}: ${money(flyCost)}.`)}else out.push(`${CLIENTS[t.client]} won't pay for flights outside their rules. We wear the ${money(flyCost)}.`);
 const r=CLIENT_REQ[t.client]||{};
 BOOK.forEach(b=>{const oid=T.book[b.id];if(!bookOK(t.client,b.id,oid)){breaches++;out.push(`${CLIENTS[t.client]} rules broken: ${bookOpt(b.id,oid).l.toLowerCase()}.`)}});
 if(r.lean){const tot=bookingTotal(T,t);if(tot<=r.lean){repD+=4;out.push(`Bookings came in at ${money(tot)}. The Department noticed.`)}else{repD-=4;out.push(`Bookings came in at ${money(tot)}, over their ${money(r.lean)} guide.`)}}
 if(r.pref){Object.entries(r.pref).forEach(([k,v])=>{if(v.includes(T.book[k])){repD+=3;out.push('Client got the air freight they wanted.')}})}
 if(breaches){repD-=8*breaches;if(t.client==='rio'&&T.book.car==='hire2'){T.data-=15;out.push("Security won't let 2WD sedans past the gate. Everyone's in one ute.")}
  if(t.client==='newm'&&T.book.fly!=='charter'){T.data-=6;out.push('Commercial flight means a 3-hour drive to site. Half a morning gone.')}}
 else if(r.must){repD+=3;out.push(`Bookings met all of ${CLIENTS[t.client]}'s site rules.`)}
 T.breaches=breaches;S.clientRep[t.client]=clamp(S.clientRep[t.client]+repD);
 const tm=team();
 if(T.book.fly==='cheap')tm.forEach(s=>bumpStat(s,'cond',-12));
 // things going wrong
 const roll=(bid,extra=0)=>R()<bookOpt(bid,T.book[bid]).risk+extra;
 if(T.book.fly==='charter'&&!T.done.ind){T.late=true;out.push("Bumped off the charter: inductions weren't in the system. Day one lost.")}
 else if(roll('fly')){T.late=true;out.push('Flight cancelled. The team lands a day late. Day one lost.')}
 if(roll('bed')){T.cost+=800;tm.forEach(s=>bumpStat(s,'cond',-15));out.push(T.book.bed==='camp'?'The camp has no record of the booking. Motel in town for $800 and a bad night.':'Accommodation fell through. Bad night.')}
 if(roll('car',T.book.car==='fleet'?-.07*F('fleet'):0)){T.cost+=600;T.data-=6;out.push(T.book.car==='fleet'?'A ute broke down on the way in. $600 and half a morning.':'Hire company swapped the booking for a Corolla. Half a morning sorting it.')}
 if(T.book.car==='hire2'&&t.client!=='rio'){T.data-=6;out.push("2WDs can't reach the far sites.")}
 if(roll('frt')){T.data-=8;out.push(T.book.frt==='ute'?'Overloaded ute, and one esky left on the depot floor.':'Freight arrived a day late. Day one without traps.')}
 T.travel=out;out.forEach(x=>T.log.push(x))}

function propDays(td,p){return Math.max(2,td.trip.days+METHODS.find(m=>m.id===p.method).dd)}
function propPrice(td,p){const t=td.trip,n=t.need.field+t.need.admin;return Math.round(propDays(td,p)*n*VAL_PD*(1+.06*(S.season-1))*PRICES.find(x=>x.id===p.price).m/100)*100}
function propScores(td,p){const t=td.trip,c=t.client,tm=p.team.map(staff).filter(Boolean),lead=staff(p.lead),rq=td.req;
 let team=tm.length?avg(tm.map(s=>s.field))*4+avg(tm.map(s=>s.rel))*1.2:0;if(lead&&lead.field>=15)team+=12;const fam=tm.some(s=>(s.clients||{})[c]);if(fam)team+=8;
 if(tm.length<t.need.field+t.need.admin)team*=tm.length/(t.need.field+t.need.admin);
 if(rq==='senior'&&!(lead&&lead.field>=15))team=Math.min(team,40);if(rq==='local'&&!fam)team=Math.min(team,45);
 const wa=td.q??10;let method=METHODS.find(m=>m.id===p.method).base*(.6+wa/50)+(p.fast?10:0);if(rq==='fast'&&!p.fast)method=Math.min(method,45);
 let safety=62-S.recordables*12+(F('iso')?15:0)+(p.plan?15:0)+(F('hse')?5:0);if(rq==='iso'&&!F('iso'))safety-=25;if(rq==='recs'&&S.recordables>0)safety-=20;

 return {team:Math.round(clamp(team)),method:Math.round(clamp(method)),safety:Math.round(clamp(safety)),price:Math.round(clamp(price))}}
function propTotal(td,p){const s=propScores(td,p),wt=WEIGHTS[td.trip.client];let tot=(s.price*wt.price+s.method*wt.method+s.team*wt.team+s.safety*wt.safety)/100;
 tot+=(S.clientRep[td.trip.client]-60)/5+(p.lunch?2:0)+(p.call?1:0);return Math.round(tot*10)/10}
function submitProp(tid){const td=S.tenders.find(x=>x.id===tid);if(!td||td.sent||!td.prop)return '';const p=td.prop;if(!p.team.length)return 'Name a team first.';
 td.sent=true;if(p.lunch){S.cash-=400;S.clientRep[td.trip.client]=clamp(S.clientRep[td.trip.client]+1)}if(p.plan)S.cash-=1500;

 log(`Proposal submitted: ${td.trip.name}${w?` (drafted by ${w.name})`:td.writer==='me'?' (written by you)':''}.`);return 'Submitted. Result the week it closes.'}

function assignWriter(tid,wid){const td=S.tenders.find(x=>x.id===tid);if(!td||td.sent||td.writer)return;const t=td.trip,need=t.need.field+t.need.admin;
 if(wid==='me'){td.writer='me';td.q=S.me.write;td.draftWk=S.week;td.prop=newProp(td);return}
 const w=staff(wid);if(!w)return;td.writer=wid;td.q=w.admin;td.draftWk=S.week+1;if(!S.busy.includes(wid))S.busy.push(wid);bumpStat(w,'cond',-8);
 const p=newProp(td),av=S.staff.filter(x=>!x.temp),tr=x=>w.traits.includes(x);
 let team=av.slice().sort((a,b)=>b.field-a.field);if(w.admin<9&&R()<.4)team=team.sort(()=>R()-.5);p.team=team.slice(0,need).map(x=>x.id);
 p.lead=(tr('wants-promotion')&&p.team.includes(w.id))?w.id:(p.team.map(staff).sort((a,b)=>b.field-a.field)[0]||{}).id||'';
 p.method=tr('over-prepares')||tr('sharp')?'extended':tr('cuts-corners')?'rapid':'standard';p.plan=tr('over-prepares')||(w.admin>=14&&WEIGHTS[t.client].safety>=25);
 p.price=tr('veteran')||tr('allergic-to-forms')?'premium':tr('keen')?'sharp':'market';
 const gets=w.admin>=12||R()<.5;p.fast=td.req==='fast'&&gets;if(td.req==='senior'&&!gets)p.lead='';
 td.prop=p;log(`${w.name} is drafting the ${t.name} proposal.`)}
function rewrite(tid){const td=S.tenders.find(x=>x.id===tid);if(!td||td.rewritten||td.writer==='me'||td.closes<=S.week+1)return '';const w=staff(td.writer);if(w&&!S.busy.includes(w.id))S.busy.push(w.id);
 td.rewritten=true;td.q+=3;td.draftWk=S.week+1;td.readyMailed=false;return `Sent back. ${w?w.name:'The writer'} will have a better draft next week.`}
function propIssues(td,p){const t=td.trip,wt=WEIGHTS[t.client],lead=staff(p.lead),out=[];const need=t.need.field+t.need.admin;
 if(p.team.length<need)out.push(`Team is ${need-p.team.length} short.`);if(!p.lead)out.push('No lead named.');
 if(td.req==='senior'&&!(lead&&lead.field>=15))out.push("Requirement not met: the lead needs Fieldcraft 15+.");
 if(td.req==='fast'&&!p.fast)out.push("Requirement not met: they asked for the report within two weeks.");

 if(td.req==='local'&&!p.team.some(id=>(staff(id)?.clients||{})[t.client]))out.push("Requirement not met: nobody on the team has worked for them before.");
 if(wt.price>=40&&p.price==='premium')out.push(`${CLIENTS[t.client]} weight price at ${wt.price}%. Premium is a big ask.`);
 if(wt.method>=35&&p.method==='rapid')out.push(`They weight methodology at ${wt.method}%. Rapid will score poorly.`);
 if(wt.safety>=25&&!p.plan)out.push(`Safety is ${wt.safety}% for them and there's no site-specific plan.`);
 return out}

 S.tenders.filter(td=>td.writer&&td.writer!=='me'&&!td.sent&&!td.readyMailed&&S.week>=td.draftWk&&!td.done).forEach(td=>{td.readyMailed=true;const ws=staff(td.writer);

  const p=td.prop,mine=propTotal(td,p),s=propScores(td,p),best=td.rivals.slice().sort((a,b)=>b.score-a.score)[0];
  const rivalBoost=S.clientRep[t.client]<50?5:0;const win=mine>best.score+rivalBoost;
  const card=`Your score ${mine} (price ${s.price}, methodology ${s.method}, team ${s.team}, safety ${s.safety}). ${win?`Next best: ${best.name} on ${best.score+rivalBoost}.`:`Winner: ${best.name} on ${best.score+rivalBoost}.`}`;
  if(win){const wk=freeWeek(t.wk);if(wk==null){mail({from:c,face:'client',subj:`Won, but: ${t.name}`,body:`${card} But your calendar is full and you had to hand it back.`});S.clientRep[t.client]=clamp(S.clientRep[t.client]-5);return}
   t.wk=wk;t.days=propDays(td,p);t.val=propPrice(td,p);t.won=true;t.prop={team:p.team.slice(),lead:p.lead};t.fast=p.fast;S.trips.push(t);if(isDept()){S.deptWins=(S.deptWins||0)+1;S.board=clamp(S.board+4)}S.trips.sort((a,b)=>a.wk-b.wk);
   mail({from:c,face:'client',subj:`Successful: ${t.name}`,body:`${card} PO for ${money(t.val)}. Mobilise week ${wk}, ${t.days} days. Cost budget ${money(estCost(t))}.${p.lead?` They expect ${staff(p.lead)?staff(p.lead).name:'your named lead'} to lead it.`:''}`});log(`Won: ${t.name} (${money(t.val)}).`)}
  else{if(isDept())S.board=clamp(S.board-1);mail({from:c,face:'client',subj:`Unsuccessful: ${t.name}`,body:card});log(`Lost: ${t.name} to ${best.name}.`)}})}

// Client-side causes make a variation easier to land.
const CLIENT_CAUSE=['lostrep','fireban','threat','dust','nojha'];
function overrun(t,T){return Math.round(T.cost-estCost(t))}
function variationDue(t,T){return (S.rank>=3||isDept())&&overrun(t,T)>estCost(t)*.05}
function variation(i){const T=S.trip,t=tripById(T.id),over=overrun(t,T);if(T.varRes!=null)return;T.varRes=i;
 const cc=T.incUsed.some(k=>CLIENT_CAUSE.includes(INCIDENTS[k].id))||(T.travel||[]).some(x=>/camp has no record|Bumped/.test(x));
 const p=clamp(.3+(S.clientRep[t.client]-60)/100+(cc?.25:0)+(i===2?.2:0),.05,.9);
 if(i===0){T.varOut=`Wore the ${money(over)}.`;return}
 if(i===2){S.cash-=400;S.clientRep[t.client]=clamp(S.clientRep[t.client]+2)}
 if(R()<p){S.cash+=over;S.revenue+=over;t.result.pay+=over;T.varOut=`Variation approved: ${money(over)}.${cc?' It helped that it was their problem.':''}`;log(`Variation approved on ${t.name}: ${money(over)}.`)}
 else{S.clientRep[t.client]=clamp(S.clientRep[t.client]-5);T.varOut=`Variation rejected. "The PO is the PO." ${CLIENTS[t.client]} are a bit cooler on you.`}}

function officeCapacity(onTrip=[]){return S.staff.filter(s=>avail(s)&&!onTrip.includes(s.id)&&!s.temp).reduce((a,s)=>a+s.admin+s.field*.3,0)}
function addReport(t,T){if(S.rank<3&&!isDept())return;const ret=Math.round(t.result.pay*RETENTION/100)*100;t.result.pay-=ret;S.revenue-=ret;S.cash-=ret;
 S.reports=S.reports||[];S.reports.push({tid:t.id,name:t.name,client:t.client,due:S.week+(t.fast?2:t.days>6?4:3),work:t.days*14,done:0,ret,asked:false,late:0})}
// Returns the share of office capacity spent on reports, so desk billables shrink by that much.
function reportWeekly(onTrip){const open=(S.reports||[]).filter(r=>!r.delivered);if(!open.length)return 0;
 let cap=S.crunch?officeCapacity(onTrip)*2:officeCapacity(onTrip);const total=cap;
 open.sort((a,b)=>a.due-b.due).forEach(r=>{const use=Math.min(cap,r.work-r.done);r.done+=use;cap-=use;
  if(r.done>=r.work)deliverReport(r,false);
  else if(S.week>r.due){r.late++;S.clientRep[r.client]=clamp(S.clientRep[r.client]-3);
   if(r.late===1)mail({from:CLIENTS[r.client],face:'client',subj:`Where's our report? (${r.name})`,body:`It was due week ${r.due}. They'd like it.`,
    opts:[{l:'Ask for a two-week extension',e:{rpt:{tid:r.tid,act:'ext'}}},{l:'Lunch, then ask ($300)',e:{cash:-300,rpt:{tid:r.tid,act:'schmooze'}}},{l:'Crunch: office on it this week',e:{rpt:{tid:r.tid,act:'crunch'}}},{l:'Send the draft as is',e:{rpt:{tid:r.tid,act:'draft'}}}]});
   if(r.late>=5){r.ret=0;S.clientRep[r.client]=clamp(S.clientRep[r.client]-8);deliverReport(r,true);mail({from:CLIENTS[r.client],face:'client',subj:`${r.name}: retention withheld`,body:"Five weeks late. We're keeping the retention."})}}});
 S.crunch=false;return total?Math.min(1,(total-cap)/total):0}
function deliverReport(r,forced){if(r.delivered)return;r.delivered=true;S.cash+=r.ret;S.revenue+=r.ret;
 if(!forced&&S.week<=r.due)S.clientRep[r.client]=clamp(S.clientRep[r.client]+3);log(`Report delivered: ${r.name}${S.week>r.due?` (${S.week-r.due} wk late)`:' on time'}. Retention ${money(r.ret)}.`)}
function reportAction(a){const r=(S.reports||[]).find(x=>x.tid===a.tid);if(!r||r.delivered)return 'Already delivered.';
 if(a.act==='ext'||a.act==='schmooze'){const p=clamp(.4+(S.clientRep[r.client]-60)/80+(r.asked?-.2:.1)+(a.act==='schmooze'?.25:0),.05,.95);r.asked=true;
  if(R()<p){r.due=S.week+2;r.late=0;return 'Extension granted. Two weeks.'}S.clientRep[r.client]=clamp(S.clientRep[r.client]-5);return '"No." They want it this week.'}
 if(a.act==='crunch'){S.crunch=true;S.staff.forEach(s=>bumpStat(s,'morale',-6));r.done=r.work;deliverReport(r,false);return 'Everyone stayed late. Delivered. Nobody is happy.'}
 if(a.act==='draft'){r.ret=Math.round(r.ret/2/100)*100;S.clientRep[r.client]=clamp(S.clientRep[r.client]-4);deliverReport(r,true);return 'Draft sent. They paid half the retention and a lot of comments.'}
 return ''}

 $('#rv').onclick=()=>{if(o==='promote'){if(S.rank===1){S.screen='branch';return render()}if(S.rank===2)S.cash=80000;promote();S.screen='game';S.view='inbox'}else if(o==='sack'){S.final='sacked';S.screen='final'}else{S.retries=(S.retries||0)+1;S.rankTrips=Math.max(0,rk.review-2);if(isHSE())S.rankRec=0;S.screen='game'}render()};status('Review.')}

// ---------- career ending ----------
function finalView(){$('#nav').innerHTML='';S.over=true;save();const kind=S.final;const v=companyValue();
 let title,body;
 if(kind==='retire'){title=v>=1500000?'CHAIR OF THE BOARD':v>=900000?'RETIRED WITH A BOAT':'RETIRED TO CONSULTING';
  body=v>=1500000?`You handed over a company worth ${money(v)}. The board has asked you to chair it. Colin sends a card with a goanna on it.`:v>=900000?`${money(v)} on handover. The boat is called Mobilisation. It has never left on time.`:`${money(v)} on handover. You now consult to the company you ran, at a higher day rate.`}
 else{title='CAREER OVER';body=`${rank().n}, season ${S.season}. It ended here. Rusty says it used to be worse.`}
 const rusty=staff('rusty')?'Rusty is still here, still telling the goanna story.':S.rustyRetired?'Rusty retired. Trap line 3 still has his name on it, somewhere.':'Rusty left along the way. He took the goanna story with him.';
 screen.innerHTML=`<h1>${title}</h1>${talk(kind==='retire'?'chair':'deb',kind==='retire'?'The Chair':'Deb, HR',esc(body))}
 <h3>Career</h3><div class="log" style="max-height:none"><div>S1 W1: Office Admin, desk by the printer.</div>${S.career.map(c=>`<div>${esc(c.at)}: ${RANKS[c.rank].n}.</div>`).join('')}</div>
 <div class="hud"><div><b>Trips</b>${S.stats.trips}</div><div><b>Recordables</b>${S.stats.rec}</div><div><b>Hired</b>${S.stats.hired}</div><div><b>Dismissed</b>${S.stats.fired}</div>${S.rank>=3?`<div><b>Company value</b>${money(v)}</div>`:''}</div>
 <p>${rusty}</p><div class="tbar"><button class="btn big" id="again">▶ NEW CAREER</button></div>`;faces();(kind==='retire'?sfx.good:sfx.bad)();
 $('#again').onclick=()=>{START();seedInbox();S.screen='game';render()};status('The end.')}

// =====================================================================
// UI — tenders, variations, reports
// =====================================================================
function tenders(){const open=(S.tenders||[]).filter(td=>td.announced&&!td.done),soon=(S.tenders||[]).filter(td=>!td.announced&&!td.done),past=(S.tenders||[]).filter(td=>td.done&&td.sent).slice(-6).reverse();
 const wline=c=>{const w=WEIGHTS[c];return `Price ${w.price}% · Method ${w.method}% · Team ${w.team}% · Safety ${w.safety}%`};
 screen.innerHTML=`${hud()}<h2>Tenders</h2><p class="fine">Clients send a request for quote. You put a proposal together: team, methodology, safety, price. They score it against the other bidders using their own weightings.</p>
 ${open.length?open.map(td=>{const t=td.trip;const ws=staff(td.writer),drafting=td.writer&&td.writer!=='me'&&S.week<td.draftWk;
  const st=td.sent?'<span class="claim">Submitted</span>':drafting?`${ws?ws.name:'Writer'} drafting, ready week ${td.draftWk}`:td.writer?(td.writer==='me'?'You are writing it':'<span class="claim">Draft ready for review</span>'):'No writer assigned';
  return `<div class="mail"><div class="from">${CLIENTS[t.client]} · closes week ${td.closes} · ${st}</div><b>${esc(t.name)}</b>
  <div class="fine">${t.days} days · ${t.need.field} field + ${t.need.admin} admin · requirement: ${REQS[td.req]}</div><div class="fine">${wline(t.client)}</div>
  <div class="row" style="margin-top:6px">${!td.writer&&!td.sent?`<label class="fine">Writer: <select id="wr-${td.id}">${S.staff.filter(s=>avail(s)&&!s.temp).sort((a,b)=>b.admin-a.admin).map(s=>`<option value="${s.id}">${s.name} · Admin ${s.admin}${s.traits[0]?' · '+s.traits[0]:''}</option>`).join('')}</select></label><button class="btn sm" data-assign="${td.id}">Assign (out for a week)</button>${isDept()?`<button class="btn sm" data-self="${td.id}">Write it yourself (writing ${S.me.write})</button>`:''}`:drafting?'':`<button class="btn sm" data-prop="${td.id}">${td.sent?'View proposal':td.writer==='me'?'Work on it':'Review the draft'}</button>`}</div></div>`}).join(''):'<p class="fine">No open requests for quote.</p>'}
 ${soon.length?`<h3>Expected soon</h3>${soon.slice(0,5).map(td=>`<p class="fine">Around week ${td.opens}: ${esc(td.trip.name)} (${CLIENTS[td.trip.client]})</p>`).join('')}`:''}
 ${past.length?`<h3>Results</h3>${past.map(td=>`<p class="fine">${td.trip.won?'<span class="stat hi">Won</span>':'<span class="stat lo">Lost</span>'} · ${esc(td.trip.name)} · you scored ${propTotal(td,td.prop)}</p>`).join('')}`:''}
 ${!(S.tenders||[]).length?"<p class=\"fine\">Tendering starts with the next season. This season's jobs were already won.</p>":''}`;
 screen.querySelectorAll('[data-prop]').forEach(x=>x.onclick=()=>{sfx.click();S.goto=x.dataset.prop;S.view='proposal';render()});
 screen.querySelectorAll('[data-assign]').forEach(x=>x.onclick=()=>{const id=x.dataset.assign,sel=$('#wr-'+id);if(!sel||!sel.value)return;sfx.good();assignWriter(id,sel.value);render()});
 screen.querySelectorAll('[data-self]').forEach(x=>x.onclick=()=>{sfx.click();assignWriter(x.dataset.self,'me');S.goto=x.dataset.self;S.view='proposal';render()});status('Tenders.')}
function proposal(){const td=(S.tenders||[]).find(x=>x.id===S.goto);if(!td||!td.writer||(td.writer!=='me'&&S.week<td.draftWk&&!td.sent)){S.view='tenders';return render()}
 td.prop=td.prop||newProp(td);const p=td.prop,t=td.trip,wt=WEIGHTS[t.client],need=t.need.field+t.need.admin,ro=td.sent||td.done,sc=propScores(td,p);
 const days=propDays(td,p),price=propPrice(td,p),cost=estCost({...t,days});const dis=ro?'disabled':'';
 const staffCards=S.staff.filter(s=>!s.temp).map(s=>{const on=p.team.includes(s.id),fam=(s.clients||{})[t.client];return `<button class="btn card" data-tm="${s.id}" ${dis} style="${on?pressed:''}">${scv(s)}<span>${on?'● ':''}${s.name}${p.lead===s.id?' (lead)':''}</span><span class="fine">Fld ${s.field} · Rel ${s.rel}</span>${fam?`<span class="fine">worked for ${CLIENTS[t.client].split(' ')[0]}</span>`:''}</button>`}).join('');
 screen.innerHTML=`${hud()}<h2>Proposal: ${esc(t.name)}</h2><p class="fine">${td.writer==='me'?`Written by you (writing ${td.q}).`:`Draft by ${staff(td.writer)?staff(td.writer).name:'your writer'} (writing ${td.q}${td.rewritten?', rewritten':''}). You're reviewing it: change what you like.`}</p>
 ${talk('client',CLIENTS[t.client],`Request for quote. ${t.days} days, ${t.need.field} field and ${t.need.admin} admin. Proposals close week ${td.closes}.<br><br><b>Requirement:</b> ${REQS[td.req]}.<br><b>We score on:</b> price ${wt.price}%, methodology ${wt.method}%, team ${wt.team}%, safety ${wt.safety}%.`)}
 ${UI.msg?`<div class="res">${esc(UI.msg)}</div>`:''}${!ro&&propIssues(td,p).length?`<div class="res bad"><b>Review notes</b><br>${propIssues(td,p).map(esc).join('<br>')}</div>`:!ro?'<div class="res good">Nothing obviously wrong.</div>':''}
 <h3>1. Team (pick ${need}, then a lead)</h3><div class="crew">${staffCards}</div>
 ${p.team.length?`<div class="row" style="margin-top:6px"><label class="fine">Lead: <select id="lead" ${dis}><option value="">none named</option>${p.team.map(id=>staff(id)).filter(Boolean).map(s=>`<option value="${s.id}" ${p.lead===s.id?'selected':''}>${s.name} (Fld ${s.field})</option>`).join('')}</select></label></div>`:''}
 <h3>2. Methodology</h3><div class="row">${METHODS.map(m=>`<button class="btn sm" data-me="${m.id}" ${dis} style="${p.method===m.id?pressed:''}">${m.l}</button>`).join('')}</div><div class="fine">${METHODS.find(m=>m.id===p.method).d} Job becomes ${days} days.</div>
 <div class="row" style="margin-top:6px">
 <label class="fine"><input type="checkbox" id="fast" ${p.fast?'checked':''} ${dis}> Commit to the report within two weeks</label></div>
 <h3>3. Safety & quality</h3><p class="fine">Recordables this season: ${S.recordables}. ISO 45001: ${F('iso')?'yes':'no'}. HSE advisor: ${F('hse')?'yes':'no'}.</p>
 <label class="fine"><input type="checkbox" id="plan" ${p.plan?'checked':''} ${dis}> Site-specific safety plan ($1,500)</label>
 <h3>4. Price</h3><div class="row">${PRICES.map(x=>`<button class="btn sm" data-pr="${x.id}" ${dis} style="${p.price===x.id?pressed:''}">${x.l} · ${money(propPrice(td,{...p,price:x.id}))}</button>`).join('')}</div>
 <p class="fine">Cost budget at ${days} days: ${money(cost)}. Margin before wages at this price: ${money(price-cost)}.</p>
 <h3>Relationship</h3><div class="row"><label class="fine"><input type="checkbox" id="call" ${p.call?'checked':''} ${dis}> Ring them to talk through the scope</label><label class="fine"><input type="checkbox" id="lunch" ${p.lunch?'checked':''} ${dis}> Lunch before it closes ($400)</label></div>
 <h3>How it reads</h3><div class="hud"><div><b>Team (${wt.team}%)</b>${sc.team}${bar(sc.team)}</div><div><b>Method (${wt.method}%)</b>${sc.method}${bar(sc.method)}</div><div><b>Safety (${wt.safety}%)</b>${sc.safety}${bar(sc.safety)}</div><div><b>Price (${wt.price}%)</b>${ro?sc.price:'?'}<div class="fine">${ro?'':'depends on the other bids'}</div></div></div>
 <div class="tbar">${ro?'':`<button class="btn big" id="submit" ${p.team.length?'':'disabled'}>▶ SUBMIT PROPOSAL</button>${td.writer!=='me'&&!td.rewritten&&td.closes>S.week+1?'<button class="btn" id="rewrite">Send back for a rewrite</button>':''}`}<button class="btn" id="pback">◀ Tenders</button></div>`;faces();UI.msg=null;
 const sv=()=>{save();render()};
 screen.querySelectorAll('[data-tm]').forEach(b=>b.onclick=()=>{const id=b.dataset.tm;if(p.team.includes(id)){p.team=p.team.filter(x=>x!==id);if(p.lead===id)p.lead=''}else if(p.team.length<need)p.team.push(id);sfx.click();sv()});
 screen.querySelectorAll('[data-me]').forEach(b=>b.onclick=()=>{p.method=b.dataset.me;sfx.click();sv()});
 screen.querySelectorAll('[data-pr]').forEach(b=>b.onclick=()=>{p.price=b.dataset.pr;sfx.click();sv()});
 const bind=(id,k,chk)=>{const el=$('#'+id);if(el)el.onchange=()=>{p[k]=chk?el.checked:el.value;sv()}};
 bind('lead','lead');bind('fast','fast',1);bind('plan','plan',1);bind('call','call',1);bind('lunch','lunch',1);
 const rw=$('#rewrite');if(rw)rw.onclick=()=>{UI.msg=rewrite(td.id);sfx.meh();S.view='tenders';save();render()};
 const sb=$('#submit');if(sb)sb.onclick=()=>{UI.msg=submitProp(td.id);sfx.good();sv()};
 $('#pback').onclick=()=>{S.view='tenders';render()};status('Proposal.')}
function variationView(){const T=S.trip,t=tripById(T.id),over=overrun(t,T);
 let foot;if(T.varRes==null)foot=`<div class="opts">${['Wear it. Stay friends.','Submit a variation','Take them to lunch, then submit ($400)'].map((l,i)=>`<button class="btn" data-v2="${i}">${i+1}. ${l}</button>`).join('')}</div>`;
 else foot=`<div class="res">${esc(T.varOut)}</div><div class="tbar"><button class="btn big" id="vnext">▶ ${needsDebrief(t)?'CLIENT DEBRIEF':'BACK TO THE OFFICE'}</button></div>`;
 screen.innerHTML=`${hud()}<h2>Over budget: ${esc(t.name)}</h2>${talk('colin','Colin',`Cost came in at ${money(T.cost)} against a ${money(estCost(t))} budget. That's ${money(over)} over, on a fixed PO of ${money(t.val)}. Do we wear it, or ask ${CLIENTS[t.client]} for a variation?`)}${foot}`;faces();
 screen.querySelectorAll('[data-v2]').forEach(b=>b.onclick=()=>{variation(+b.dataset.v2);(/approved/.test(S.trip.varOut)?sfx.good:sfx.meh)();render()});
 const n=$('#vnext');if(n)n.onclick=()=>{sfx.click();if(needsDebrief(t))debriefPick();else endTrip();render()};status('Variation.')}
function reportsPanel(){const rs=(S.reports||[]).filter(r=>!r.delivered);if(S.rank<3)return '';
 return `<h3>Reports due</h3>${rs.length?`<div class="twrap"><table><tr><th>Report</th><th>Client</th><th>Due</th><th>Progress</th><th>Retention</th></tr>${rs.map(r=>`<tr><td>${esc(r.name)}</td><td class="fine">${CLIENTS[r.client]}</td><td style="color:${S.week>r.due?'var(--red)':'inherit'}">wk ${r.due}${S.week>r.due?` (${S.week-r.due} late)`:''}</td><td>${Math.round(r.done/r.work*100)}%</td><td>${money(r.ret)}</td></tr>`).join('')}</table></div>`:'<p class="fine">Nothing outstanding.</p>'}
 <p class="fine">Office staff write reports between trips: Admin counts most. Time spent on reports comes out of desk billables. Clients hold ${Math.round(RETENTION*100)}% until the report lands.</p>`}

function branchView(){$('#nav').innerHTML='';
 screen.innerHTML=`<h1>WHICH WAY?</h1><h2>Mobilisation Coordinator · S${S.season} W${S.week}</h2>
 ${talk('colin','Colin<br>General Manager',"You've earned a step up. Two roads. Safety: every incident comes to you, and you hold the safety budget. Or run a field department: win the work with proposals, then deliver it inside the PO. Either road leads to my chair eventually.")}
 <div class="opts"><button class="btn" data-br="hse"><b>HSE Manager</b><br><span class="fine">Operations path. Incidents, training, safety gear, audits, misconduct investigations.</span></button>
 ${Object.entries(DEPTS).map(([k,d])=>`<button class="btn" data-br="dept" data-dp="${k}"><b>${d.n} Manager</b><br><span class="fine">Field department. ${d.d} RFQs, proposals, budgets, reports.</span></button>`).join('')}</div>`;faces();sfx.ring();
 screen.querySelectorAll('[data-br]').forEach(b=>b.onclick=()=>{sfx.good();promote(b.dataset.br,b.dataset.dp);S.screen='game';S.view='inbox';render()});status('Your call.')}
</script>
