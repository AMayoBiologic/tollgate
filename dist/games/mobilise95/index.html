<style>
[hidden]{display:none!important}

/* Layout: a fake 640x480 CD-ROM window centred on a teal Win95 desktop; single deliberate 1995 look */
:root{
  --desk:#008080; --win:#c0c0c0; --win-dark:#808080; --win-light:#ffffff; --win-black:#000000;
  --title:#000080; --title-fg:#ffffff;
  --screen:#1a1420; --screen-fg:#f2e9c9; --amber:#ffb000; --lime:#7fff2a; --red:#ff3c3c; --sky:#4fb7ff;
  --font-head:'Press Start 2P',monospace; --font-body:'VT323',monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--desk);color:var(--win-black);font-family:var(--font-body);font-size:22px;line-height:1.15;padding-block:12px;padding-inline:16px;box-sizing:border-box;
  background-image:linear-gradient(90deg,rgba(0,0,0,.08) 1px,transparent 1px),linear-gradient(rgba(0,0,0,.08) 1px,transparent 1px);background-size:4px 4px}
*{box-sizing:border-box}
.win{max-width:720px;margin:0 auto;background:var(--win);border:2px solid;border-color:var(--win-light) var(--win-black) var(--win-black) var(--win-light);box-shadow:inset 1px 1px 0 var(--win),inset -1px -1px 0 var(--win-dark),6px 6px 0 rgba(0,0,0,.35);padding:3px}
.tb{background:var(--title);color:var(--title-fg);display:flex;align-items:center;gap:8px;padding:3px 6px;font-family:var(--font-head);font-size:10px;letter-spacing:.5px}
.tb .sp{flex:1}
.tb b{display:inline-block;width:16px;height:14px;background:var(--win);color:var(--win-black);border:1px solid;border-color:var(--win-light) var(--win-black) var(--win-black) var(--win-light);font:bold 10px/12px sans-serif;text-align:center}
.menu{display:flex;gap:14px;padding:3px 8px;font-size:18px}
.menu span:first-letter{text-decoration:underline}
.screen{background:var(--screen);color:var(--screen-fg);border:2px solid;border-color:var(--win-dark) var(--win-light) var(--win-light) var(--win-dark);margin:2px;padding:14px;min-height:420px;position:relative;overflow:hidden;image-rendering:pixelated}
.screen.scan::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(transparent 0 2px,rgba(0,0,0,.18) 2px 4px);mix-blend-mode:multiply}
.status{display:flex;gap:4px;padding:2px;font-size:18px}
.status span{flex:1;border:1px solid;border-color:var(--win-dark) var(--win-light) var(--win-light) var(--win-dark);padding:1px 6px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
h1,h2{font-family:var(--font-head);text-wrap:balance;line-height:1.5}
h1{font-size:22px;color:var(--amber);margin:0 0 6px;text-shadow:3px 3px 0 #7a3b00}
h2{font-size:12px;color:var(--lime);margin:0 0 10px;letter-spacing:.5px}
p{margin:0 0 10px;max-width:60ch}
.btn{font-family:var(--font-body);font-size:22px;background:var(--win);color:var(--win-black);border:2px solid;border-color:var(--win-light) var(--win-black) var(--win-black) var(--win-light);padding:4px 14px;cursor:pointer;text-align:left}
.btn:active{border-color:var(--win-black) var(--win-light) var(--win-light) var(--win-black)}
.btn:focus-visible{outline:2px dotted var(--win-black);outline-offset:-5px}
.btn:disabled{color:var(--win-dark);text-shadow:1px 1px 0 var(--win-light);cursor:default}
.btn.big{font-family:var(--font-head);font-size:12px;padding:12px 18px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stack{display:grid;gap:8px}
.hud{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-bottom:12px;font-size:20px}
.hud div{border:1px dashed rgba(255,255,255,.35);padding:4px 8px;font-variant-numeric:tabular-nums}
.hud b{display:block;font-family:var(--font-head);font-size:9px;color:var(--sky);margin-bottom:4px}
.bar{height:12px;background:#000;border:1px solid var(--screen-fg);margin-top:4px}
.bar i{display:block;height:100%;background:var(--lime);transition:width .3s}
.tasks{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.tasks .btn{white-space:normal;line-height:1.1}
.tasks .btn.done{color:var(--win-dark);text-decoration:line-through}
.tasks .btn.skip{color:var(--red);text-decoration:line-through}
.crew{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.card{display:grid;justify-items:center;gap:4px;padding:8px 4px;text-align:center}
canvas{width:96px;height:96px;image-rendering:pixelated;max-width:100%}
.talk{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:start}
.talk .bub{background:var(--screen-fg);color:var(--screen);padding:10px 12px;position:relative;font-size:22px;min-width:0}
.talk .bub::before{content:"";position:absolute;left:-12px;top:20px;border:6px solid transparent;border-right-color:var(--screen-fg)}
.who{font-family:var(--font-head);font-size:9px;color:var(--amber);text-align:center;margin-top:4px;line-height:1.4}
.opts{display:grid;gap:6px;margin-top:12px}
.opts .btn{white-space:normal}
.res{margin-top:12px;padding:10px 12px;border:2px solid var(--amber);background:rgba(255,176,0,.08)}
.res.bad{border-color:var(--red);background:rgba(255,60,60,.1)}
.res.good{border-color:var(--lime);background:rgba(127,255,42,.08)}
.log{font-size:18px;opacity:.8;max-height:110px;overflow:auto;border-top:1px dotted rgba(255,255,255,.3);margin-top:12px;padding-top:6px}
.log div::before{content:"> "}
.blink{animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.cd{position:absolute;right:14px;top:14px;font-family:var(--font-head);font-size:8px;color:var(--sky);border:1px solid var(--sky);padding:4px 6px;transform:rotate(6deg)}
.fine{font-size:16px;opacity:.7}
.stars{font-size:32px;color:var(--amber);letter-spacing:4px}
.cert{background:#fffdf0;color:#222;padding:16px;border:6px double #8a6d1f;font-family:Georgia,serif;text-align:center;margin-top:12px}
.cert b{font-size:26px;display:block}
@media (prefers-reduced-motion:reduce){.blink{animation:none}.bar i{transition:none}}
@media (max-width:480px){body{font-size:19px}.hud{grid-template-columns:1fr 1fr}.talk{grid-template-columns:72px 1fr}canvas{width:72px;height:72px}}
</style>
</head>

// ---------- interruptions: one chance per day, days 2-5 ----------
function interrupt(){const day=11-S.days;S.intDays=S.intDays||[];S.usedInt=S.usedInt||[];
 if(day<2||day>8||S.intDays.includes(day))return false;S.intDays.push(day);
 if(Math.random()>0.45)return false;
 let avail=INTERRUPTS.map((e,i)=>i).filter(i=>!S.usedInt.includes(i));if(!avail.length)return false;
 const ei=avail[Math.floor(Math.random()*avail.length)];S.usedInt.push(ei);const ev=INTERRUPTS[ei];S.screen='interrupt';S.curI=ei;save();sfx.ring();
 screen.innerHTML=`${hud()}<h2 style="color:var(--red)">INCOMING — Day ${day}</h2>
 <div class="talk"><div><canvas id="hostcv"></canvas><div class="who">${HOST.name}<br>${HOST.role}</div></div><div class="bub">${esc(ev.t)}</div></div>
 <div class="opts">${ev.o.map((o,i)=>`<button class="btn" data-o="${i}">${i+1}. ${esc(o.l)}</button>`).join('')}</div>`;
 portrait($('#hostcv'),HOST.face);
 screen.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{const o=ev.o[b.dataset.o];sfx.click();
  S.days-=(o.d||0);S.budget-=(o.c||0);S.morale=Math.max(0,Math.min(100,S.morale+(o.m||0)));
  const line=`Interruption: ${o.l}${o.d?` (+${o.d}d)`:''}${o.c?` (${o.c<0?'+':'-'}$${Math.abs(o.c)})`:''}`;S.log.push(line);
  ((o.d||o.c>0||o.m<0)?sfx.meh:sfx.good)();
  screen.querySelector('.opts').innerHTML=`<div class="res ${o.m<0||o.d?'bad':'good'}">${esc(o.r)}</div><div class="row" style="margin-top:10px"><button class="btn" id="next">Next ▶</button></div>`;
  $('#next').onclick=()=>{sfx.click();S.screen='plan';plan()}});
 return true}

function pick(tid){const t=TASKS.find(x=>x.id===tid);S.screen='pick';S.cur=tid;save();
 screen.innerHTML=`${hud()}<h2>${t.name}</h2><p>Who's doing it?</p>
 <div class="crew">${CREW.map(c=>`<button class="btn card" data-c="${c.id}"><canvas id="cv-${c.id}"></canvas><span>${c.name}</span><span class="fine">${c.role}</span></button>`).join('')}</div>

 CREW.forEach(c=>{portrait($('#cv-'+c.id),c.face);$(`[data-c=${c.id}]`).onclick=()=>{sfx.click();assign(tid,c.id)}});
 $('#back').onclick=()=>{sfx.click();plan()};
 status('Choose a team member.')}

function assign(tid,cid){const c=CREW.find(x=>x.id===cid),t=TASKS.find(x=>x.id===tid);
 const pool=EVENTS[cid];S.used[cid]=S.used[cid]||[];
 let avail=pool.map((e,i)=>i).filter(i=>!S.used[cid].includes(i));if(!avail.length){S.used[cid]=[];avail=pool.map((e,i)=>i)}
 const ei=avail[Math.floor(Math.random()*avail.length)];S.used[cid].push(ei);const ev=pool[ei];
 S.screen='event';S.cur=tid;S.curC=cid;S.curE=ei;save();sfx.ring();
 screen.innerHTML=`${hud()}<h2>${t.name} → ${c.name}</h2>
 <div class="talk"><div><canvas id="evcv"></canvas><div class="who">${c.name}<br>${c.role}</div></div><div class="bub">${esc(ev.t)}</div></div>
 <div class="opts">${ev.o.map((o,i)=>`<button class="btn" data-o="${i}">${i+1}. ${esc(o.l)}</button>`).join('')}</div>`;
 portrait($('#evcv'),c.face);
 screen.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>resolve(tid,cid,ev,ev.o[b.dataset.o]))}

function resolve(tid,cid,ev,o){const t=TASKS.find(x=>x.id===tid),c=CREW.find(x=>x.id===cid);
 S.days-=1+(o.d||0);S.budget-=(o.c||0)+(o.done?t.cost:0);S.morale=Math.max(0,Math.min(100,S.morale+(o.m||0)));
 if(o.done)S.done[tid]=cid;
 const line=`${t.name} / ${c.name}: ${o.done?'DONE':'not done'}${o.d?` (+${o.d}d)`:''}${o.c?` (-$${o.c})`:''}`;S.log.push(line);
 const cls=o.done?(o.m<0||o.c>300?'':'good'):'bad';(o.done?(cls==='good'?sfx.good:sfx.meh):sfx.bad)();
 S.screen='result';save();
 const opts=screen.querySelector('.opts');opts.innerHTML=`<div class="res ${cls}">${esc(o.r)}<div class="fine" style="margin-top:6px">${esc(line)}${o.m?` · morale ${o.m>0?'+':''}${o.m}`:''}</div></div><div class="row" style="margin-top:10px"><button class="btn" id="next">Next ▶</button></div>`;
 $('#next').onclick=()=>{sfx.click();plan()}}

function end(){S.screen='end';save();const r=readiness(),bust=S.budget<0;
 if(S.phase!=='field'&&r>=75)return fieldBrief();
 let title,body,stars;
 if(r===100&&!bust){title='WHEELS UP';body='Everything done, on budget, on time. Nobody at head office will notice. That is the job.';stars=5}
 else if(r===100){title='WHEELS UP (SORT OF)';body=`Everything done, but you're $${(-S.budget).toLocaleString()} over. Finance have booked a "quick chat".`;stars=4}
 else if(r>=75){title='THEY FLEW ANYWAY';body='Most of it done. The gaps will be discovered on site, probably by the client, probably at a prestart.';stars=3}
 else if(r>=50){title='DELAYED 48 HOURS';body='Half a team, half the gear. Rusty is already telling people this never used to happen.';stars=2}
 else{title='TRIP CANCELLED';body='The client rang. Then the client\'s manager rang. Marcus is on a boat and unbothered.';stars=1}
 if(S.morale<25){body+=' Also, the crew have stopped replying to your messages.'}
 screen.innerHTML=`<h1>${title}</h1><h2>Readiness ${r}% · Budget $${S.budget.toLocaleString()} · Morale ${S.morale}%</h2>
 <div class="stars">${'★'.repeat(stars)}${'☆'.repeat(5-stars)}</div>
 <div class="talk" style="margin-top:12px"><div><canvas id="hostcv"></canvas><div class="who">${HOST.name}</div></div><div class="bub">${esc(body)}</div></div>
 <div class="cert"><span style="font-size:14px;letter-spacing:3px">CERTIFICATE OF MOBILISATION</span><b>${title}</b><span>awarded to the Mobilisation Coordinator · ${new Date().toLocaleDateString('en-AU')}</span></div>
 <div class="log">${S.log.map(l=>`<div>${esc(l)}</div>`).join('')}</div>
 <div class="row" style="margin-top:12px"><button class="btn big" id="again">▶ PLAY AGAIN</button></div>`;
 portrait($('#hostcv'),HOST.face);
 (stars>=4?sfx.good:sfx.bad)();
 $('#again').onclick=()=>{sfx.click();S=JSON.parse(JSON.stringify(START));S.screen='plan';plan()};

function fieldBrief(){S.phase='field';S.fday=1;S.fdone={};S.data=0;S.inc=0;S.fused={};S.usedInc=[];S.mobReady=readiness();S.screen='fbrief';save();sfx.good();
 const missed=TASKS.filter(t=>!S.done[t.id]).map(t=>t.name);
 screen.innerHTML=`<h1 style="font-size:16px">WHEELS UP</h1><h2>Readiness ${S.mobReady}% · Budget $${S.budget.toLocaleString()} · Morale ${S.morale}%</h2>
 <div class="talk"><div><canvas id="hostcv"></canvas><div class="who">${HOST.name}</div></div><div class="bub">The plane left. That's the easy part done.<br><br>Five days on site. Two jobs a day. Same crew, same excuses, worse weather.${missed.length?`<br><br>You flew without: <b>${esc(missed.join(', '))}</b>. That will come up.`:'<br><br>You flew with everything. That has never happened before.'}</div></div>
 <div class="row" style="margin-top:14px"><button class="btn big" id="go">▶ DAY 1</button></div>`;
 portrait($('#hostcv'),HOST.face);$('#go').onclick=()=>{sfx.click();fplan()};status('In the field.')}

function fhud(){return `<div class="hud">
 <div><b>Field day</b>${S.fday} / 5</div>
 <div><b>Data</b>${S.data}%<div class="bar"><i style="width:${Math.max(0,Math.min(100,S.data))}%"></i></div></div>
 <div><b>Incidents</b>${S.inc} ${S.inc>=3?'<span class="blink" style="color:var(--red)">!</span>':''}</div>
 <div><b>Budget</b>$${S.budget.toLocaleString()}</div>
 <div><b>Morale</b>${S.morale}%<div class="bar"><i style="width:${Math.max(0,Math.min(100,S.morale))}%"></i></div></div>
</div>`}

function fplan(){S.screen='fplan';save();
 if(S.fday>5)return fend();
 const day=FDAYS[S.fday-1];const open=day.tasks.filter(t=>!S.fdone[S.fday+t.id]&&!S.fskip?.[S.fday+t.id]);
 if(!open.length){if(!S.incDay?.[S.fday]&&fincident())return; S.fday++;return fplan()}
 screen.innerHTML=`${fhud()}<h2>Field day ${S.fday} — pick a job</h2>
 <div class="tasks">${day.tasks.map(t=>{const k=S.fday+t.id;const st=S.fdone[k]?'done':(S.fskip?.[k]?'skip':'');return `<button class="btn ${st}" data-t="${t.id}" ${st?'disabled':''}>${S.fdone[k]?'✔ ':S.fskip?.[k]?'✘ ':'▢ '}${t.n}<br><span class="fine">10% data</span></button>`}).join('')}</div>
 <div class="log">${S.log.slice(-4).map(l=>`<div>${esc(l)}</div>`).join('')}</div>`;
 screen.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{sfx.click();fpick(b.dataset.t)});
 status(`Day ${S.fday}. ${open.length} job${open.length===1?'':'s'} left today.`)}

function fpick(tid){const t=FDAYS[S.fday-1].tasks.find(x=>x.id===tid);S.screen='fpick';S.cur=tid;save();
 screen.innerHTML=`${fhud()}<h2>${t.n}</h2><p>Who's on it?</p>
 <div class="crew">${CREW.map(c=>`<button class="btn card" data-c="${c.id}"><canvas id="cv-${c.id}"></canvas><span>${c.name}</span><span class="fine">${c.role}</span></button>`).join('')}</div>
 <div class="row" style="margin-top:12px"><button class="btn" id="back">◀ Back</button></div>`;
 CREW.forEach(c=>{portrait($('#cv-'+c.id),c.face);$(`[data-c=${c.id}]`).onclick=()=>{sfx.click();fassign(tid,c.id)}});
 $('#back').onclick=()=>{sfx.click();fplan()}}

function fassign(tid,cid){const c=CREW.find(x=>x.id===cid),t=FDAYS[S.fday-1].tasks.find(x=>x.id===tid);
 const pool=FIELD_EVENTS[cid];S.fused[cid]=S.fused[cid]||[];
 let avail=pool.map((e,i)=>i).filter(i=>!S.fused[cid].includes(i));if(!avail.length){S.fused[cid]=[];avail=pool.map((e,i)=>i)}
 const ei=avail[Math.floor(Math.random()*avail.length)];S.fused[cid].push(ei);const ev=pool[ei];S.screen='fevent';save();sfx.ring();
 screen.innerHTML=`${fhud()}<h2>${t.n} → ${c.name}</h2>
 <div class="talk"><div><canvas id="evcv"></canvas><div class="who">${c.name}<br>${c.role}</div></div><div class="bub">${esc(ev.t)}</div></div>
 <div class="opts">${ev.o.map((o,i)=>`<button class="btn" data-o="${i}">${i+1}. ${esc(o.l)}</button>`).join('')}</div>`;
 portrait($('#evcv'),c.face);
 screen.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{const o=ev.o[b.dataset.o];const k=S.fday+tid;
  if(o.done){S.fdone[k]=cid;S.data+=10}else{S.fskip=S.fskip||{};S.fskip[k]=1}
  S.data=Math.max(0,Math.min(100,S.data+(o.data||0)));S.budget-=(o.c||0);S.morale=Math.max(0,Math.min(100,S.morale+(o.m||0)));
  const line=`D${S.fday} ${t.n} / ${c.name}: ${o.done?'DONE':'not done'}${o.data?` (data ${o.data>0?'+':''}${o.data})`:''}`;S.log.push(line);
  (o.done?(o.m<0?sfx.meh:sfx.good):sfx.bad)();save();
  screen.querySelector('.opts').innerHTML=`<div class="res ${o.done?(o.m<0?'':'good'):'bad'}">${esc(o.r)}<div class="fine" style="margin-top:6px">${esc(line)}${o.m?` · morale ${o.m>0?'+':''}${o.m}`:''}</div></div><div class="row" style="margin-top:10px"><button class="btn" id="next">Next ▶</button></div>`;
  $('#next').onclick=()=>{sfx.click();fplan()}})}

function fincident(){S.incDay=S.incDay||{};S.incDay[S.fday]=1;
 // guaranteed if a required mob task was skipped and that incident hasn't fired; otherwise 60%
 let forced=INCIDENTS.map((e,i)=>i).filter(i=>INCIDENTS[i].req&&!S.done[INCIDENTS[i].req]&&!S.usedInc.includes(i));
 let avail=INCIDENTS.map((e,i)=>i).filter(i=>!S.usedInc.includes(i)&&!(INCIDENTS[i].req&&!S.done[INCIDENTS[i].req]));
 let ei;if(forced.length)ei=forced[0];else{if(Math.random()>0.6||!avail.length)return false;ei=avail[Math.floor(Math.random()*avail.length)]}
 S.usedInc.push(ei);const ev=INCIDENTS[ei];S.screen='fincident';S.curI=ei;save();sfx.bad();
 screen.innerHTML=`${fhud()}<h2 style="color:var(--red)">INCIDENT — Day ${S.fday}, late arvo</h2>
 <div class="talk"><div><canvas id="hostcv"></canvas><div class="who">Radio<br>UHF 40</div></div><div class="bub">${esc(ev.t)}</div></div>
 <div class="opts">${ev.o.map((o,i)=>`<button class="btn" data-o="${i}">${i+1}. ${esc(o.l)}</button>`).join('')}</div>`;
 portrait($('#hostcv'),HOST.face);
 screen.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{const o=ev.o[b.dataset.o];
  S.data=Math.max(0,Math.min(100,S.data+(o.data||0)));S.budget-=(o.c||0);S.morale=Math.max(0,Math.min(100,S.morale+(o.m||0)));if(o.inc)S.inc++;
  const line=`D${S.fday} incident: ${o.l}${o.inc?' (recordable)':''}${o.c?` (-$${o.c})`:''}`;S.log.push(line);(o.inc?sfx.bad:sfx.meh)();
  screen.querySelector('.opts').innerHTML=`<div class="res ${o.inc||o.m<0?'bad':'good'}">${esc(o.r)}</div><div class="row" style="margin-top:10px"><button class="btn" id="next">End of day ▶</button></div>`;
  $('#next').onclick=()=>{sfx.click();S.fday++;fplan()}});
 return true}

function fend(){S.screen='end';save();const bust=S.budget<0;
 let title,body,stars=0;
 stars+=S.data>=90?2:S.data>=70?1:0;stars+=S.inc===0?2:S.inc<=1?1:0;stars+=(!bust&&S.morale>=50)?1:0;
 if(stars>=5){title='TRIP OF THE YEAR';body='Full data, no recordables, crew still talking to you. Colin will take credit for this.'}
 else if(stars>=4){title='GOOD TRIP';body='Client\'s happy, data\'s in, one thing went in Mango. That is a normal trip.'}
 else if(stars>=2){title='A TRIP HAPPENED';body='Some data. Some incidents. Some invoices. Rusty says it used to be worse.'}
 else{title='NEVER AGAIN';body='The client rang Colin. Colin rang you. Marcus is fishing.'}
 if(S.inc>=3)body+=' The safety manager wants a word on Monday.';
 screen.innerHTML=`<h1>${title}</h1><h2>Data ${S.data}% · Recordables ${S.inc} · Budget $${S.budget.toLocaleString()} · Morale ${S.morale}%</h2>
 <div class="stars">${'★'.repeat(stars)}${'☆'.repeat(5-stars)}</div>
 <div class="talk" style="margin-top:12px"><div><canvas id="hostcv"></canvas><div class="who">${HOST.name}</div></div><div class="bub">${esc(body)}</div></div>
 <div class="cert"><span style="font-size:14px;letter-spacing:3px">CERTIFICATE OF DEMOBILISATION</span><b>${title}</b><span>Mobilised at ${S.mobReady}% · ${new Date().toLocaleDateString('en-AU')}</span></div>
 <div class="log">${S.log.map(l=>`<div>${esc(l)}</div>`).join('')}</div>
 <div class="row" style="margin-top:12px"><button class="btn big" id="again">▶ PLAY AGAIN</button></div>`;
 portrait($('#hostcv'),HOST.face);(stars>=4?sfx.good:sfx.bad)();
 $('#again').onclick=()=>{sfx.click();S=JSON.parse(JSON.stringify(START));S.screen='plan';plan()};status('Demobbed.')}

function resume(){if(S.phase==='field')fplan();else plan()}

// ---------- boot ----------
function boot(){S=JSON.parse(JSON.stringify(START));title()}
if(window.claude?.hot?.snapshot)window.claude.hot.snapshot(()=>S);
window.claude?.hot?.ready?window.claude.hot.ready(d=>{if(d&&d.screen&&d.screen!=='title'){S=d;resume()}else boot()}):boot();
</script>
