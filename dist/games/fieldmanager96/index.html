<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Field Manager '96</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>
[hidden]{display:none!important}

/* Layout: Win95 MDI window. Left nav rail, main panel, status bar. Single deliberate 1996 look. */
:root{
  --desk:#008080; --win:#c0c0c0; --win-dark:#808080; --win-light:#ffffff; --win-black:#000000;
  --title:#000080; --title-fg:#ffffff;
  --screen:#1a1420; --screen-fg:#f2e9c9; --amber:#ffb000; --lime:#7fff2a; --red:#ff3c3c; --sky:#4fb7ff; --dim:rgba(242,233,201,.55);
  --font-head:'Press Start 2P',monospace; --font-body:'VT323',monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--desk);color:var(--win-black);font-family:var(--font-body);font-size:21px;line-height:1.15;padding-block:12px;padding-inline:16px;box-sizing:border-box;
  background-image:linear-gradient(90deg,rgba(0,0,0,.08) 1px,transparent 1px),linear-gradient(rgba(0,0,0,.08) 1px,transparent 1px);background-size:4px 4px}
*{box-sizing:border-box}
.win{max-width:860px;margin:0 auto;background:var(--win);border:2px solid;border-color:var(--win-light) var(--win-black) var(--win-black) var(--win-light);box-shadow:inset 1px 1px 0 var(--win),inset -1px -1px 0 var(--win-dark),6px 6px 0 rgba(0,0,0,.35);padding:3px}
.tb{background:var(--title);color:var(--title-fg);display:flex;align-items:center;gap:8px;padding:3px 6px;font-family:var(--font-head);font-size:10px;letter-spacing:.5px}
.tb .sp{flex:1}
.tb b{display:inline-block;width:16px;height:14px;background:var(--win);color:var(--win-black);border:1px solid;border-color:var(--win-light) var(--win-black) var(--win-black) var(--win-light);font:bold 10px/12px sans-serif;text-align:center}
.body{display:grid;grid-template-columns:150px 1fr;gap:3px;margin:2px}
.nav{display:grid;align-content:start;gap:3px}
.nav .btn{width:100%;font-size:19px;padding:4px 8px}
.nav .btn.on{border-color:var(--win-black) var(--win-light) var(--win-light) var(--win-black);background:#d8d8d8}
.nav .btn .n{float:right;background:var(--red);color:#fff;font-size:14px;padding:0 5px;border-radius:2px}
.screen{background:var(--screen);color:var(--screen-fg);border:2px solid;border-color:var(--win-dark) var(--win-light) var(--win-light) var(--win-dark);padding:12px;min-height:460px;position:relative;overflow:hidden;min-width:0}
.screen.scan::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(transparent 0 2px,rgba(0,0,0,.18) 2px 4px);mix-blend-mode:multiply}
.status{display:flex;gap:4px;padding:2px;font-size:17px}
.status span{flex:1;border:1px solid;border-color:var(--win-dark) var(--win-light) var(--win-light) var(--win-dark);padding:1px 6px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
h1,h2,h3{font-family:var(--font-head);text-wrap:balance;line-height:1.5;margin:0}
h1{font-size:20px;color:var(--amber);margin-bottom:6px;text-shadow:3px 3px 0 #7a3b00}
h2{font-size:11px;color:var(--lime);margin-bottom:10px}
h3{font-size:9px;color:var(--sky);margin:10px 0 6px}
p{margin:0 0 10px;max-width:62ch}
.btn{font-family:var(--font-body);font-size:20px;background:var(--win);color:var(--win-black);border:2px solid;border-color:var(--win-light) var(--win-black) var(--win-black) var(--win-light);padding:3px 12px;cursor:pointer;text-align:left}
.btn:active{border-color:var(--win-black) var(--win-light) var(--win-light) var(--win-black)}
.btn:focus-visible{outline:2px dotted var(--win-black);outline-offset:-5px}
.btn:disabled{color:var(--win-dark);text-shadow:1px 1px 0 var(--win-light);cursor:default}
.btn.big{font-family:var(--font-head);font-size:11px;padding:12px 18px}
.btn.sm{font-size:17px;padding:1px 8px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.hud{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-bottom:12px;font-size:19px}
.hud>div{border:1px dashed rgba(255,255,255,.35);padding:4px 8px;font-variant-numeric:tabular-nums}
.hud b{display:block;font-family:var(--font-head);font-size:8px;color:var(--sky);margin-bottom:4px}
.bar{height:10px;background:#000;border:1px solid var(--screen-fg);margin-top:4px}
.bar i{display:block;height:100%;background:var(--lime);transition:width .3s}
.bar i.warn{background:var(--amber)}.bar i.bad{background:var(--red)}
table{border-collapse:collapse;width:100%;font-size:19px;font-variant-numeric:tabular-nums}
th{font-family:var(--font-head);font-size:8px;color:var(--sky);text-align:left;padding:4px 6px;border-bottom:1px solid rgba(255,255,255,.3)}
td{padding:3px 6px;border-bottom:1px dotted rgba(255,255,255,.15);vertical-align:middle}
tr.pick{cursor:pointer}tr.pick:hover td{background:rgba(255,255,255,.06)}
tr.sel td{background:rgba(127,255,42,.12)}
tr.out td{opacity:.45}
.twrap{overflow-x:auto}
canvas{width:48px;height:48px;image-rendering:pixelated;max-width:100%;vertical-align:middle}
.talk{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:start}
.talk canvas{width:96px;height:96px}
.talk .bub{background:var(--screen-fg);color:var(--screen);padding:10px 12px;position:relative;font-size:21px;min-width:0}
.talk .bub::before{content:"";position:absolute;left:-12px;top:20px;border:6px solid transparent;border-right-color:var(--screen-fg)}
.who{font-family:var(--font-head);font-size:8px;color:var(--amber);text-align:center;margin-top:4px;line-height:1.4}
.opts{display:grid;gap:6px;margin-top:12px}.opts .btn{white-space:normal}
.res{margin-top:12px;padding:10px 12px;border:2px solid var(--amber);background:rgba(255,176,0,.08)}
.res.bad{border-color:var(--red);background:rgba(255,60,60,.1)}.res.good{border-color:var(--lime);background:rgba(127,255,42,.08)}
.log{font-size:17px;opacity:.85;max-height:220px;overflow:auto;border-top:1px dotted rgba(255,255,255,.3);margin-top:10px;padding-top:6px}
.log div::before{content:"> "}
.fine{font-size:16px;opacity:.7}
.stat{display:inline-block;min-width:22px;text-align:right}
.stat.hi{color:var(--lime)}.stat.lo{color:var(--red)}
.mail{border:1px solid rgba(255,255,255,.25);padding:8px 10px;margin-bottom:8px}
.mail.unread{border-color:var(--amber)}
.mail .from{font-family:var(--font-head);font-size:8px;color:var(--amber)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cols>*{min-width:0}
.blink{animation:bl 1s steps(1) infinite}@keyframes bl{50%{opacity:0}}
.tag{font-family:var(--font-head);font-size:7px;padding:2px 5px;border:1px solid currentColor;margin-left:6px;vertical-align:middle}
@media (prefers-reduced-motion:reduce){.blink{animation:none}.bar i{transition:none}}
@media (max-width:640px){body{font-size:18px}.body{grid-template-columns:1fr}.nav{grid-template-columns:repeat(3,1fr)}.nav .btn{font-size:16px;padding:3px 6px}.cols{grid-template-columns:1fr}.talk{grid-template-columns:72px 1fr}.talk canvas{width:72px;height:72px}}
.tasks{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.tasks .btn{white-space:normal;line-height:1.1}
.tasks .btn.done{color:var(--win-dark);text-decoration:line-through}
.tasks .btn.skip{color:var(--red);text-decoration:line-through}
.crew{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}
.card{display:grid;justify-items:center;gap:2px;padding:6px 4px;text-align:center;line-height:1.05}
.card canvas{width:56px;height:56px}
.cbar{display:inline-block;width:46px;height:8px;background:#000;border:1px solid var(--dim);vertical-align:middle}
.cbar i{display:block;height:100%;background:var(--lime)}.cbar i.warn{background:var(--amber)}.cbar i.bad{background:var(--red)}
.inj{color:var(--red);font-family:var(--font-head);font-size:7px}
.claim{color:var(--amber)}
.qa{border-left:3px solid var(--sky);padding:4px 10px;margin:6px 0}
.qa b{color:var(--sky)}
.tbar{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
select{font-family:var(--font-body);font-size:18px}
</style>
</head>

let AC=null,muted=false;

function genFace(){
 const pick=a=>a[Math.floor(Math.random()*a.length)];
 const H=pick(['h','k','y','o','n','e']),K=pick(['s','t','d']),W=pick(['b','g','o','c','m','r','p','q','y']),M=pick(['w','r']);

 const tops=[['............','...HHHHHH...','..HSSSSSSH..'],['...HHHHHH...','..HHHHHHHH..','..HSSSSSSH..'],['....HHHH....','...HHHHHH...','..HSSSSSSH..'],['............','............','..SSSSSSSS..'],['..HHHHHHHH..','.HHHHHHHHHH.','.HHSSSSSSHH.']];
 const long=style===4;

 const low=['..WWWWWWWW..','.WWWWWWWWWW.','.WWW.WW.WWW.'];
 return [...tops[style],...mid,...low].map(r=>r.replace(/H/g,H).replace(/S/g,K).replace(/W/g,W).replace(/M/g,M));
}

// ---------- mob tasks ----------
const MOB_TASKS=[{id:'ind',n:'Site inductions',c:400},{id:'med',n:'Pre-mob medicals',c:900},{id:'veh',n:'Vehicle pre-start & load',c:300},{id:'sat',n:'Sat phone & PLB check',c:150},{id:'jha',n:'JHA submitted',c:0},{id:'ppe',n:'PPE issued',c:600}];

// ---------- excuses: mobilisation ----------
// Option fields: l label, r result, done 1/0, d extra days lost, c cost, m morale (this person), cond, data, rep.

 {id:'mhfa',cd:30,fn(){return {from:'HR',face:'colin',subj:'Mental health first aid',body:'A two-day mental health first aid course is available.',

 {id:'kitchen',cd:12,fn(){const s=rs(x=>!x.traits.includes('office-only'));if(!s)return null;return {from:'Camp manager',face:'client',subj:'Your crew',body:`The camp says ${s.name} took twelve sausages at breakfast. There is a limit of three.`,
  opts:[{l:'Apologise',e:{board:1,s:{id:s.id,morale:-5},out:'Apologised.'}},{l:'Defend them',e:{s:{id:s.id,morale:10},board:-2,out:'"They were hungry."'}}]}}},
 {id:'heatwave',cd:30,fn(){if(S.flags.heatPlan)return null;return {from:'BOM',face:'radio',subj:'Heatwave outlook',body:'Heatwave conditions are forecast for the Pilbara and Goldfields for the next month.',
  opts:[{l:'Issue a hydration procedure',e:{flag:'heatPlan',board:3,out:'Issued. Heat illness is less likely to be forced on trips.'}},{l:'Business as usual',e:{out:'Noted.'}}]}}},
 {id:'linkedin',cd:26,fn(){return {from:'LinkedIn',face:'radio',subj:'Former employee',body:'A former employee has posted about your office. It has 300 likes.',

  opts:[{l:'Freight it back',e:{cash:-60,out:'Returned. It will be lost again.'}},{l:'Donate it to the depot',e:{board:1,out:'The depot is grateful.'}}]}}},

  opts:[{l:'Bid',e:{chance:{p:.5,win:{addTrip:{client:c,days:6,inWeeks:5},out:'Won. It is on the Season screen.'},lose:{out:'Lost to the other mob by $400.'}},all:{cond:-5}}},{l:'Skip it',e:{out:'Skipped.'}}]}}},
];

// =====================================================================
// ENGINE — pure game logic. No DOM in here, so the balance harness can
// drive a whole season headlessly.
// =====================================================================
const SEASON_WEEKS=46, COST_PD=420, VAL_PD=3000, REV_TARGET=820000, SAFETY_LIMIT=2, CLIENT_MIN=4;
const R=Math.random, rint=(a,b)=>a+Math.floor(R()*(b-a+1)), pick=a=>a[Math.floor(R()*a.length)];
const clamp=(v,a=0,b=100)=>Math.max(a,Math.min(b,v));
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
const money=n=>(n<0?'-$':'$')+Math.abs(Math.round(n)).toLocaleString();
const PR={he:{he:'he',him:'him',his:'his',He:'He',His:'His'},she:{he:'she',him:'her',his:'her',He:'She',His:'Her'}};
const P=s=>PR[s&&s.p]||PR.he;
let S=null;

function START(){const s={season:1,week:1,cash:60000,revenue:0,desk:0,recordables:0,board:60,
 staff:JSON.parse(JSON.stringify(STAFF0)).map(x=>({...x,cond:100,inj:0,apps:0,recs:0,since:1,known:true})),
 market:[],trips:[],clientRep:{newm:60,s32:60,rio:60,dept:60,lith:60},
 inbox:[],log:[],cd:{},seen:{},flags:{},busy:[],training:{},att:3,camps:{},promise:null,
 trip:null,pick:[],screen:'title',view:'office',tripSeq:0,apSeq:0,history:[],rustyOneMore:0};
 S=s;s.trips=TRIPS0.map(t=>mkTrip(t));s.target=targetFor(1);for(let i=0;i<4;i++)s.market.push(genApplicant());return s}
function targetFor(season){return {rev:Math.round(REV_TARGET*(1+.08*(season-1))/5000)*5000,safety:SAFETY_LIMIT,clients:CLIENT_MIN}}
function mkTrip(t){const n=t.need.field+t.need.admin;return {...t,id:'t'+(++S.tripSeq),val:Math.round(t.days*n*VAL_PD*(1+.06*(S.season-1))/1000)*1000,result:null}}

// ---------- helpers ----------
const staff=id=>S.staff.find(s=>s.id===id);
function rs(f){const a=S.staff.filter(s=>!s.temp&&(!f||f(s)));return a.length?pick(a):null}
function rc(){return pick(Object.keys(CLIENTS))}
function tpl(str,x={}){const p=x.p||null,pp=P(p);return String(str)
 .replace(/\{n\}|\{a\}/g,p?p.name:'').replace(/\{b\}/g,x.b||'').replace(/\{o\}/g,x.o||'someone').replace(/\{c\}/g,x.c||'')
 .replace(/\{best\}/g,x.best||'the team').replace(/\{miss\}/g,x.miss||'')
 .replace(/\{he\}/g,pp.he).replace(/\{him\}/g,pp.him).replace(/\{his\}/g,pp.his).replace(/\{He\}/g,pp.He).replace(/\{His\}/g,pp.His)}
function otherName(excl,pool){const a=(pool||S.staff).filter(s=>s.id!==excl&&!s.temp);return a.length?pick(a).name:'someone'}
function avail(s){return s&&!s.inj&&!S.busy.includes(s.id)}
function nextTrip(){return S.trips.filter(t=>!t.result).sort((a,b)=>a.wk-b.wk)[0]}
function tripById(id){return S.trips.find(t=>t.id===id)}
function log(t){S.log.push(`W${S.week}: ${t}`);if(S.log.length>120)S.log.shift()}
function mail(m){S.inbox.unshift({...m,read:false,wk:S.week,done:null});if(S.inbox.length>60)S.inbox.pop()}
function unread(){return S.inbox.filter(m=>!m.read).length}
function removeStaff(id,why){const s=staff(id);if(!s)return;S.staff=S.staff.filter(x=>x.id!==id);delete S.training[id];if(why)log(`${s.name} ${why}`);
 S.history.push({name:s.name,role:s.role,apps:s.apps,left:`S${S.season} W${S.week}`});
 if(S.promise&&S.promise.id===id)S.promise.gone=true}
function bumpStat(s,k,d){if(['field','admin','rel','fit'].includes(k))s[k]=clamp(s[k]+d,1,20);else s[k]=clamp(s[k]+d)}

// ---------- declarative effects (inbox, debrief, camps) ----------
function applyE(e){if(!e)return '';let out=e.out||'';
 if(e.cash)S.cash+=e.cash;
 if(e.board)S.board=clamp(S.board+e.board);
 if(e.rep&&S.clientRep[e.rep[0]]!=null)S.clientRep[e.rep[0]]=clamp(S.clientRep[e.rep[0]]+e.rep[1]);
 if(e.s){const s=staff(e.s.id);if(s){for(const k of ['morale','cond','field','admin','rel','fit'])if(e.s[k])bumpStat(s,k,e.s[k]);
  if(e.s.wage)s.wage+=e.s.wage;if(e.s.contract)s.contract+=e.s.contract;if(e.s.inj!=null)s.inj=Math.max(s.inj,e.s.inj);
  if(e.s.promo&&!/^Senior/.test(s.role))s.role='Senior '+s.role;if(e.s.trait&&!s.traits.includes(e.s.trait))s.traits.push(e.s.trait)}}
 if(e.all)S.staff.forEach(s=>{if(e.all.morale)bumpStat(s,'morale',e.all.morale);if(e.all.cond)bumpStat(s,'cond',e.all.cond)});
 if(e.leave)removeStaff(e.leave,'has left.');
 if(e.flag)S.flags[e.flag]=true;
 if(e.unflag)delete S.flags[e.unflag];
 if(e.addTrip)addTrip(e.addTrip);
 if(e.tripVal){const t=S.trips.find(x=>!x.result&&x.client===e.tripVal[0]);if(t)t.val=Math.round(t.val*(1+e.tripVal[1])/100)*100}
 if(e.promise)S.promise={...e.promise};
 if(e.recruit)S.market.unshift(genApplicant(e.recruit));
 if(e.temp){const f=genFace();const p=pick(['he','she']);S.staff.push({id:'tmp'+(++S.apSeq),name:pick(NAMES[p]),p,role:e.temp.role,face:f,age:20,field:4,admin:7,rel:10,fit:16,morale:95,cond:100,inj:0,wage:0,contract:e.temp.weeks,traits:['keen','no-licence'],apps:0,recs:0,since:S.season,temp:true,known:true})}
 if(e.chance){const w=R()<e.chance.p;const o2=applyE(w?e.chance.win:e.chance.lose);out=[out,o2].filter(Boolean).join(' ')}
 return out}
function addTrip(a){const k=TRIP_GEN.kinds.find(x=>x.type===(a.type||'flora'))||TRIP_GEN.kinds[1];
 const place=(TRIP_GEN.places.find(p=>p[1]===a.client)||TRIP_GEN.places[0]);
 let wk=S.week+(a.inWeeks||3);while(S.trips.some(t=>!t.result&&Math.abs(t.wk-wk)<1))wk++;
 if(wk>SEASON_WEEKS-1)return;
 const t=mkTrip({wk,client:a.client,name:`${pick(k.names)}, ${place[0]}`,type:k.type,days:a.days||3,need:{field:2,admin:a.days>4?1:0},hazard:place[2]});
 S.trips.push(t);S.trips.sort((x,y)=>x.wk-y.wk);log(`New job: ${t.name} (wk ${t.wk}).`)}

// ---------- inbox trigger ----------
function maybeInbox(force){if(!force&&R()>.55)return;
 const pool=INBOX.filter(x=>(S.cd[x.id]||0)<=S.week);
 for(let tries=0;tries<8&&pool.length;tries++){const i=Math.floor(R()*pool.length),x=pool[i];pool.splice(i,1);
  const m=x.fn();if(m){S.cd[x.id]=S.week+x.cd;mail(m);return}}}
function answerMail(i,j){const m=S.inbox[i];if(!m||m.done||!m.opts)return;const o=m.opts[j];const out=applyE(o.e);m.done=out||o.l;log(`${m.subj}: ${o.l}.`)}

// ---------- weekly tick ----------
function deskValue(s){if(s.temp)return 0;return Math.round((s.admin*28+s.field*9)*(.55+s.cond/220))}
function weekTick(o={}){const team=o.team||[];
 for(const id in S.training){const k=S.training[id],s=staff(id);if(!s||!k||team.includes(id)||!avail(s))continue;S.cash-=500;s.cond=clamp(s.cond-8);
  if(k==='rel'){if(R()<.45){s.rel=clamp(s.rel+1,1,20);log(`${s.name} reliability +1.`)}else log(`${s.name} did the reliability course. Nothing changed.`)}
  else{const cap=s.age>=50?16:20;if(s[k]<cap)s[k]=clamp(s[k]+1,1,20)}}
 S.training={};
 let desk=0;
 S.staff.slice().forEach(s=>{S.cash-=s.wage;
  if(!team.includes(s.id)){if(avail(s))desk+=deskValue(s);s.cond=clamp(s.cond+20)}
  if(s.inj>0)s.inj--;
  s.contract--;
  s.morale=clamp(s.morale+(s.morale<55?1:s.morale>80?-1:0)+(R()<.5?-1:1));
  if(s.morale<25&&!s.temp&&R()<.08){mail({from:s.name,face:s.face,subj:'Resignation',body:`${s.name} has resigned. ${P(s).He} says it's "not you". It's partly you.`});removeStaff(s.id,'resigned.');return}
  if(s.contract===4&&!s.temp){const nw=Math.round(s.wage*(1.06+(s.morale<50?.08:0)+(Math.max(s.field,s.admin)>=16?.05:0))/10)*10;
   mail({from:s.name,face:s.face,subj:'Quick chat when you have a sec?',body:`${s.name}'s contract ends in 4 weeks. ${P(s).He}'d want ${money(nw)}/wk to stay.`,
    opts:[{l:`Renew at ${money(nw)} (+52 wk)`,e:{s:{id:s.id,contract:52,wage:nw-s.wage,morale:8},out:'Renewed.'}},{l:'Let it run out',e:{s:{id:s.id,morale:-10},out:'Noted. So did they.'}}]})}
  if(s.contract<=0){if(s.temp){log(`${s.name}'s work experience ended. They left a thank-you card.`);S.staff=S.staff.filter(x=>x.id!==s.id)}
   else{removeStaff(s.id,'finished up. Contract ended.');mail({from:'Head Office',face:'colin',subj:`${s.name} has left`,body:`${s.name}'s contract ended. Their laptop has not.`})}}});
 S.cash+=desk;S.revenue+=desk;S.desk+=desk;
 S.busy=[];S.att=3;
 if(S.week%4===0)refreshMarket();
 S.week++;
 boardUpdate();
 maybeInbox()}

// ---------- board ----------
function boardConf(){const tv=S.trips.reduce((a,t)=>a+t.val,0)||1,dv=S.trips.filter(t=>t.result).reduce((a,t)=>a+t.val,0);
 const frac=Math.max(.12,(dv/tv)*.8+(Math.min(S.week,SEASON_WEEKS)/SEASON_WEEKS)*.2);
 const r1=S.revenue/(S.target.rev*frac);
 let c=55+clamp((r1-1)*90,-35,18);
 c+=clamp((S.target.safety-S.recordables)*8,-48,8);
 c+=(avg(Object.values(S.clientRep))-60)*.6;
 if(S.cash<0)c-=Math.min(30,6+(-S.cash/10000)*3);
 c+=(avg(S.staff.map(s=>s.morale))-60)*.15;
 return clamp(c)}
function boardUpdate(){S.board=Math.round(clamp(S.board*.75+boardConf()*.25))}

// ---------- recruitment ----------
function genApplicant(role){const a=role?(ARCH.find(x=>x.role===role)||ARCH[0]):(()=>{const tot=ARCH.reduce((x,y)=>x+y.w,0);let r=R()*tot;for(const x of ARCH){if((r-=x.w)<0)return x}return ARCH[0]})();
 const p=pick(['he','she']);const used=new Set(S.staff.map(s=>s.name).concat(S.market.map(s=>s.name)));
 const name=pick(NAMES[p].filter(n=>!used.has(n)))||pick(NAMES[p]);
 const st={field:rint(...a.field),admin:rint(...a.admin),rel:rint(...a.rel),fit:rint(...a.fit)};
 const honest=R()<.35,bl=honest?0:rint(1,4);
 const cv={field:clamp(st.field+rint(0,bl),1,20),admin:clamp(st.admin+rint(0,bl),1,20),rel:clamp(st.rel+rint(0,bl),1,20)};
 const tr=[...a.traits].sort(()=>R()-.5).slice(0,R()<.3?1:2);
 const quality=(cv.field+cv.admin+cv.rel)/60;
 const wage=Math.round((a.wage[0]+(a.wage[1]-a.wage[0])*quality)/10)*10;
 const lo=clamp(st.rel-rint(0,3),1,20);
 return {id:'ap'+(++S.apSeq),name,p,role:a.role,face:genFace(),age:rint(...a.age),...st,morale:70,cond:100,inj:0,wage,contract:52,traits:tr,apps:0,recs:0,
  cv,known:{},relRange:[lo,clamp(lo+4,1,20)],dodgy:R()<.3,cvText:pick(CV_LINES),listed:S.week,qa:[]}}
function refreshMarket(){S.market=S.market.filter(a=>S.week-a.listed<8);while(S.market.length<4)S.market.push(genApplicant())}
function interview(aid,k){const a=S.market.find(x=>x.id===aid);if(!a||S.att<=0)return;S.att--;
 const q=IQ.find(x=>x.k===k);let ans;
 if(k==='trait'){ans=TRAIT_ANS[a.traits[0]]||'Just time for a change.';a.known.trait=true}
 else{const v=a[k];ans=v>=14?q.a.hi:v>=9?q.a.mid:q.a.lo;a.known[k==='rel'?'relRange':k]=true}
 a.qa.push({q:q.q,a:ans})}
function reference(aid){const a=S.market.find(x=>x.id===aid);if(!a||S.att<=0||a.known.ref)return;S.att--;a.known.ref=true;
 if(a.dodgy){a.qa.push({q:'Reference check',a:"The referee says they're the best worker they've ever seen. The referee has the same surname."});a.known.dodgy=true}
 else{a.known.rel=true;a.qa.push({q:'Reference check',a:a.rel>=14?"'Never late. Never once. It was almost annoying.'":a.rel>=9?"'Solid. Needed reminding sometimes.'":"'...Can I call you back?' They don't call back."})}}
function hire(aid){const a=S.market.find(x=>x.id===aid);if(!a)return;S.cash-=a.wage*2;S.market=S.market.filter(x=>x.id!==aid);
 const {cv,known,relRange,dodgy,cvText,listed,qa,...s}=a;S.staff.push({...s,since:S.season,known:true});log(`Hired ${a.name} (${a.role}).`)}

// ---------- training camps ----------
function campReady(c){return (S.camps[c.id]||-99)+c.cd<=S.week+(S.season-1)*SEASON_WEEKS&&!(nextTrip()&&nextTrip().wk===S.week)}
function runCamp(cid,ids){const c=CAMPS.find(x=>x.id===cid);if(!c||!campReady(c))return '';
 const who=c.pick?ids.map(staff).filter(avail).slice(0,c.pick):S.staff.filter(avail);if(!who.length)return '';
 S.cash-=c.cost;S.camps[c.id]=S.week+(S.season-1)*SEASON_WEEKS;const fx=c.fx;let out=`${c.n}: ${who.map(s=>s.name).join(', ')}.`;
 who.forEach(s=>{S.busy.push(s.id);s.cond=clamp(s.cond-10);if(fx.field)bumpStat(s,'field',fx.field);if(fx.admin)bumpStat(s,'admin',fx.admin);if(fx.morale)bumpStat(s,'morale',fx.morale);if(fx.trait&&!s.traits.includes(fx.trait))s.traits.push(fx.trait)});
 if(fx.flag)S.flags[fx.flag]=true;
 if(fx.risk&&R()<fx.risk){const s=pick(who);s.inj=Math.max(s.inj,2);out+=` ${s.name} came off a bike avoiding a quokka. Two weeks out.`}
 log(out);return out}

// ---------- trip engine ----------
// S.trip holds the whole trip as plain data, so a trip survives a reload mid-way.
function startTrip(t,ids){const need=t.need.field+t.need.admin;
 S.trip={id:t.id,team:ids.slice(),short:Math.max(0,need-ids.length),cover:Math.min(1,ids.length/need),phase:'mob',mobDays:MOB_DAYS,done:{},cost:0,log:[],data:0,rec:0,day:0,jobs:[],jobSt:{},dayUsed:[],ev:null,forced:{},incUsed:[],perf:{},last:null};
 S.pick=[];S.screen='trip';if(S.trip.short)S.trip.log.push(`Going ${S.trip.short} short. Everyone doing two jobs.`)}
function team(){return S.trip.team.map(staff).filter(Boolean)}
function mobChance(s){return Math.max(.05,Math.min(.9,(s.admin*.45+s.rel*.55)/20*(.75+s.cond/400)*(.85+s.morale/670)+(S.flags.process?.06:0)))}
function fieldChance(s){return Math.max(.05,Math.min(.92,(s.field*.5+s.rel*.3+s.fit*.2)/20*(.7+s.cond/333)*(.85+s.morale/670)-S.trip.short*.07))}
function pickExcuse(pool,s){let keys=[];s.traits.forEach(tr=>(pool[tr]||[]).forEach((e,i)=>keys.push(tr+':'+i)));
 const gen=(pool.generic||[]).map((e,i)=>'generic:'+i);if(!keys.length||R()<.2)keys=keys.concat(gen);
 const min=Math.min(...keys.map(k=>S.seen[k]||0));keys=keys.filter(k=>(S.seen[k]||0)===min);const k=pick(keys);S.seen[k]=(S.seen[k]||0)+1;return k}
function getExc(pool,k){const i=k.lastIndexOf(':');return pool[k.slice(0,i)][+k.slice(i+1)]}
function evData(ev){if(ev.kind==='mob')return getExc(EXC_MOB,ev.k);if(ev.kind==='field')return getExc(EXC_FIELD,ev.k);return INCIDENTS[ev.k]}
function evCtx(ev){if(ev.kind==='inc')return {p:staff(ev.a)||{name:ev.aName,p:'he'},b:ev.bName};return {p:staff(ev.who)||{name:'?',p:'he'},o:ev.o}}
function mobAssign(tid,sid){const T=S.trip,s=staff(sid),task=MOB_TASKS.find(m=>m.id===tid);if(!s||!task||T.done[tid]||T.ev)return;
 T.mobDays--;s.cond=clamp(s.cond-3);
 if(R()<mobChance(s)){T.done[tid]=sid;T.cost+=task.c;T.last={clean:true,t:`${task.n}: ${s.name}. Done, no drama.`};T.log.push(T.last.t);return}
 T.ev={kind:'mob',k:pickExcuse(EXC_MOB,s),who:sid,task:tid,o:otherName(sid)};T.last=null}
function fly(){const T=S.trip,t=tripById(T.id);T.phase='field';T.day=1;T.dayUsed=[];T.ev=null;T.last=null;
 const pool=[...JOBS[t.type]||JOBS.fauna];let pi=0;
 for(let d=1;d<=t.days;d++){const j=[];for(let k=0;k<2;k++){if(d===1&&k===0)j.push(OPEN_JOB);else if(d===t.days&&k===1)j.push(CLOSE_JOB);else{j.push(pool[pi%pool.length]);pi++}}T.jobs.push(j)}
 const missed=MOB_TASKS.filter(m=>!T.done[m.id]);
 T.log.push(missed.length?`Flew without: ${missed.map(m=>m.n).join(', ')}.`:'Flew with everything done.');
 missed.forEach(m=>{const i=INCIDENTS.findIndex(x=>x.req===m.id);if(i<0||(INCIDENTS[i].supp&&S.flags[INCIDENTS[i].supp])||R()>.75)return;
  let d=rint(Math.min(2,t.days),t.days),tries=0;while(T.forced[d]!=null&&tries++<10)d=rint(1,t.days);T.forced[d]=i});
 T.cost+=T.team.length*t.days*COST_PD}
function jobVal(){return 100/(tripById(S.trip.id).days*2)*(S.trip.cover??1)}
function dayJobsOpen(){const T=S.trip;return (T.jobs[T.day-1]||[]).map((n,j)=>({n,j,st:T.jobSt[T.day+':'+j]})).filter(x=>x.st==null)}
function canWork(s){const T=S.trip;if(!s||s.inj)return false;const tm=team().filter(x=>!x.inj);return !T.dayUsed.includes(s.id)||tm.every(x=>T.dayUsed.includes(x.id))}
function fieldAssign(j,sid){const T=S.trip,s=staff(sid),key=T.day+':'+j;if(!s||T.jobSt[key]!=null||T.ev||!canWork(s))return;
 T.dayUsed.push(sid);s.cond=clamp(s.cond-8);const name=T.jobs[T.day-1][j];
 if(R()<fieldChance(s)){T.jobSt[key]=sid;T.data+=jobVal();T.perf[sid]=(T.perf[sid]||0)+1;T.last={clean:true,t:`${name}: ${s.name}. Done.`};T.log.push(`D${T.day} ${T.last.t}`);return}
 T.ev={kind:'field',k:pickExcuse(EXC_FIELD,s),who:sid,job:j,o:otherName(sid,team())};T.last=null}
function resolveEv(i){const T=S.trip,ev=T.ev;if(!ev||ev.res!=null)return;const e=evData(ev),o=e.o[i],cx=evCtx(ev),t=tripById(T.id);ev.res=i;
 if(ev.kind==='inc'){let rec=o.inc||0;const cost=(o.c||0)*(S.flags.cyclone?.5:1);
  if(rec&&S.flags.firstAid&&R()<.35){rec=0;T.log.push('First aid training kicked in. Treated on site, not recordable.');ev.fa=true}
  T.rec+=rec;T.cost+=cost;T.data+=o.data||0;if(o.rep)S.clientRep[t.client]=clamp(S.clientRep[t.client]+o.rep);
  team().forEach(s=>{if(o.m)bumpStat(s,'morale',o.m);if(o.cond)bumpStat(s,'cond',o.cond)});
  if(o.inj){const s=staff(ev.a);if(s){s.inj=Math.max(s.inj,o.inj);T.log.push(`${s.name} injured: ${o.inj} wk.`)}}
  if(rec){const s=staff(ev.a);if(s)s.recs++}
  T.log.push(`D${T.day} incident: ${tpl(o.l,{p:cx.p,b:cx.b})}${rec?' (recordable)':''}`);return}
 const s=staff(ev.who);if(s){if(o.m)bumpStat(s,'morale',o.m);if(o.cond)bumpStat(s,'cond',o.cond)}T.cost+=o.c||0;
 if(ev.kind==='mob'){T.mobDays-=o.d||0;const task=MOB_TASKS.find(m=>m.id===ev.task);if(o.done){T.done[ev.task]=ev.who;T.cost+=task.c}
  T.log.push(`${task.n}: ${cx.p.name}. ${o.done?'Done':'Not done'}${o.d?` (+${o.d}d)`:''}${o.c?` (${money(o.c)})`:''}.`)}
 else{const key=T.day+':'+ev.job;if(o.done){T.jobSt[key]=ev.who;T.data+=jobVal()*.75;T.perf[ev.who]=(T.perf[ev.who]||0)+1}else T.jobSt[key]='x';
  T.data+=o.data||0;if(o.rep)S.clientRep[t.client]=clamp(S.clientRep[t.client]+o.rep);
  T.log.push(`D${T.day} ${T.jobs[T.day-1][ev.job]}: ${cx.p.name}. ${o.done?'Done':'Not done'}.`)}}
function closeEv(){const T=S.trip;if(T.ev&&T.ev.res!=null){const inc=T.ev.kind==='inc';T.ev=null;if(inc)nextDay()}}
function endDay(){const T=S.trip,t=tripById(T.id);if(T.ev)return;
 dayJobsOpen().forEach(x=>{T.jobSt[T.day+':'+x.j]='x'});
 team().forEach(s=>{s.cond=clamp(s.cond-6)});
 const tm=team();let idx=T.forced[T.day];
 if(idx==null){const miss=MOB_TASKS.filter(m=>!T.done[m.id]).length;
  let p=.07+t.hazard*.035+(S.flags.ute?.04:0)+T.short*.06+(avg(tm.map(s=>s.cond))<55?.08:0)+miss*.02-(tm.some(s=>s.traits.includes('4wd-ticket'))?.02:0);
  if(R()<p){const pool=INCIDENTS.map((x,i)=>i).filter(i=>!INCIDENTS[i].req&&!T.incUsed.includes(i));if(pool.length)idx=pick(pool)}}
 delete T.forced[T.day];
 if(idx!=null&&tm.length){T.incUsed.push(idx);const inc=INCIDENTS[idx];
  let a=(inc.pref&&tm.find(s=>s.traits.includes(inc.pref)&&!s.inj))||pick(tm);const others=tm.filter(s=>s.id!==a.id);const b=others.length?pick(others).name:'the client rep';
  T.ev={kind:'inc',k:idx,a:a.id,aName:a.name,bName:b};return}
 nextDay()}
function nextDay(){const T=S.trip,t=tripById(T.id);T.ev=null;T.last=null;T.day++;T.dayUsed=[];if(T.day>t.days)finishTrip()}

function finishTrip(){const T=S.trip,t=tripById(T.id),tm=team();T.phase='result';
 const bestAdm=Math.max(0,...tm.map(s=>s.admin));
 if(bestAdm<8){T.data-=8;T.log.push('Datasheets entered by someone who hates datasheets.')}else if(bestAdm>=15){T.data+=4;T.log.push('Datasheets clean and backed up.')}
 const data=Math.round(clamp(T.data)),rec=T.rec,missed=MOB_TASKS.filter(m=>!T.done[m.id]).map(m=>m.n);
 let stars=(data>=90?2:data>=70?1:0)+(rec===0?2:rec===1?1:0)+(missed.length===0?1:0);
 const pay=Math.round(t.val*(.2+.8*data/100)/100)*100;
 S.clientRep[t.client]=clamp(S.clientRep[t.client]+(stars-2.5)*5-rec*4);
 if(S.promise&&S.promise.client===t.client){const ps=staff(S.promise.id);if(T.team.includes(S.promise.id)){S.clientRep[t.client]=clamp(S.clientRep[t.client]+5);T.log.push(`Promised ${ps?ps.name:'them'}, sent ${ps?ps.name:'them'}. Client pleased.`)}else{S.clientRep[t.client]=clamp(S.clientRep[t.client]-12);T.log.push(`Promised ${ps?ps.name:'someone'}, didn't send them. Client noticed.`)}S.promise=null}
 tm.forEach(s=>{s.apps++;bumpStat(s,'morale',(stars>=4?6:stars<=1?-8:0)-rec*5)});
 const best=tm.slice().sort((a,b)=>(T.perf[b.id]||0)-(T.perf[a.id]||0)||b.field-a.field)[0];
 t.result={stars,data,rec,cost:Math.round(T.cost),pay,missed,team:tm.map(s=>s.name),best:best?best.id:null,short:T.short};
 S.recordables+=rec;S.revenue+=pay;S.cash+=pay-T.cost;
 log(`${t.name}: ${stars}★, data ${data}%, ${rec} recordable${rec===1?'':'s'}, paid ${money(pay)}.`);
 if(rec>=2)mail({from:'Colin',face:'colin',subj:`We need to talk about ${t.name}`,body:'Two recordables on one trip. The client has rung. I have rung. Ring me.'});
 weekTick({team:T.team})}
function debriefPick(){const T=S.trip,t=tripById(T.id),r=t.result;const ctx=[];
 if(r.rec)ctx.push('inc','inc');if(r.stars>=4)ctx.push('good','good');if(r.stars<=2)ctx.push('bad');if(r.data<70)ctx.push('thin');if(r.short)ctx.push('short');if(r.missed.length)ctx.push('missed');ctx.push('any');
 const c=pick(ctx);const pool=DEBRIEF.map((d,i)=>i).filter(i=>DEBRIEF[i].ctx===c);T.deb=pick(pool);T.phase='debrief';T.debRes=null}
function debriefAnswer(i){const T=S.trip,t=tripById(T.id),r=t.result,d=DEBRIEF[T.deb],a=d.a[i];if(T.debRes!=null)return;T.debRes=i;
 const best=staff(r.best);
 if(a.rep)S.clientRep[t.client]=clamp(S.clientRep[t.client]+a.rep);if(a.board)S.board=clamp(S.board+a.board);if(a.cash)S.cash+=a.cash;
 if(a.m)team().forEach(s=>bumpStat(s,'morale',a.m));if(a.best&&best)bumpStat(best,'morale',a.best);
 if(a.tv){const n=S.trips.find(x=>!x.result&&x.client===t.client);if(n)n.val=Math.round(n.val*(1+a.tv)/100)*100}
 if(a.leave&&best&&R()<a.leave){removeStaff(best.id,`accepted a job with ${CLIENTS[t.client]}.`);T.debOut=`${best.name} took the job.`}}
function endTrip(){S.trip=null;S.screen='game';S.view='office'}

// ---------- auto-resolve ("let them get on with it") ----------
function optScore(o,kind){if(kind==='inc')return -(o.inc||0)*35-(o.inj||0)*12-(o.c||0)/50+(o.m||0)*.5+(o.data||0)*1.5+(o.rep||0)*1.5+(o.cond||0)*.25;
 return (o.done||0)*40-(o.d||0)*14-(o.c||0)/40+(o.m||0)*.4+(o.data||0)*2+(o.rep||0)*1.5+(o.cond||0)*.2}
function autoChoice(q){const T=S.trip,ev=T.ev,e=evData(ev);if(R()<q){let bi=0,bs=-1e9;e.o.forEach((o,i)=>{const sc=optScore(o,ev.kind);if(sc>bs){bs=sc;bi=i}});return bi}return Math.floor(R()*e.o.length)}
function crewJudgement(){return .35+avg(team().map(s=>s.rel))/40}
function autoMob(q){const T=S.trip;q=q??crewJudgement();let guard=0;
 while(T.mobDays>0&&guard++<40){if(T.ev){resolveEv(autoChoice(q));closeEv();continue}
  const open=MOB_TASKS.filter(m=>!T.done[m.id]);if(!open.length)break;
  const load={};Object.values(T.done).forEach(id=>load[id]=(load[id]||0)+1);
  const c=S.staff.filter(s=>avail(s)&&!s.temp).sort((a,b)=>mobChance(b)-.12*(load[b.id]||0)-(mobChance(a)-.12*(load[a.id]||0)))[0];if(!c)break;
  mobAssign(open[0].id,c.id)}
 if(T.ev){resolveEv(autoChoice(q));closeEv()}}
function autoDay(q){const T=S.trip;q=q??crewJudgement();const d=T.day;let guard=0;
 while(T.day===d&&T.phase==='field'&&guard++<20){
  if(T.ev){resolveEv(autoChoice(q));closeEv();continue}
  const open=dayJobsOpen();
  if(open.length){const c=team().filter(canWork).sort((a,b)=>fieldChance(b)-fieldChance(a))[0];if(!c){endDay();continue}fieldAssign(open[0].j,c.id);continue}
  endDay()}}

function seasonVerdict(){const happy=Object.values(S.clientRep).filter(v=>v>=50).length;
 const revOK=S.revenue>=S.target.rev,safeOK=S.recordables<=S.target.safety,cliOK=happy>=S.target.clients;const met=[revOK,safeOK,cliOK].filter(Boolean).length;
 const pass=met===3&&S.cash>=-20000;const title=pass?(S.board>=85?'MANAGER OF THE YEAR':'CONTRACT EXTENDED'):(met>=2&&S.board>=40?'PROBATION':'SACKED');
 return {pass,title,happy,revOK,safeOK,cliOK,sacked:title==='SACKED'}}
function testimonialDue(){const r=staff('rusty');return r&&(r.age>=55||r.apps>=14)}
function testimonial(i){const r=staff('rusty');if(!r)return '';
 if(i===0){r.contract=Math.max(r.contract,52);r.wage=Math.round(r.wage*.8/10)*10;bumpStat(r,'fit',-2);bumpStat(r,'morale',10);S.rustyOneMore++;return 'One more season. He says that every year.'}
 if(i===1){S.cash-=1500;S.staff.forEach(s=>s!==r&&bumpStat(s,'morale',12));S.board=clamp(S.board+4);removeStaff('rusty','retired. Send-off at the depot.');S.rustyRetired=1;return 'Sausages, a speech, and the goanna story one last time. Three people cried. One was the goanna.'}
 S.staff.forEach(s=>s!==r&&bumpStat(s,'morale',8));removeStaff('rusty','retired. Trap line 3 now bears his name.');S.rustyRetired=1;return "There's a sign on trap line 3 now. It says RUSTY'S LINE. Somebody has already moved it."}
function newSeason(){const v=seasonVerdict();S.season++;S.week=1;S.revenue=0;S.desk=0;S.recordables=0;S.board=v.pass?Math.max(S.board,55):40;S.target=targetFor(S.season);
 const keep={ute:S.flags.ute,process:S.flags.process};S.flags={};Object.keys(keep).forEach(k=>{if(keep[k])S.flags[k]=true});
 const notes=[];
 S.staff.slice().forEach(s=>{if(s.temp){S.staff=S.staff.filter(x=>x!==s);return}s.age++;s.cond=100;
  if(s.age>=50)bumpStat(s,'fit',-rint(1,2));if(s.age>=55&&R()<.5)bumpStat(s,'field',-1);
  if(s.age<=27){const k=pick(['field','admin','rel','fit']);bumpStat(s,k,s.traits.includes('keen')?2:1);notes.push(`${s.name} has come on: ${k} up.`)}
  if(s.id!=='rusty'&&((s.age>=58&&R()<.35)||(s.age>=61&&R()<.75))){removeStaff(s.id,'retired.');notes.push(`${s.name} has retired.`)}});
 Object.keys(S.clientRep).forEach(c=>S.clientRep[c]=Math.round(S.clientRep[c]*.7+60*.3));
 S.trips=genSeasonTrips();S.inbox=S.inbox.slice(0,10);refreshMarket();
 mail({from:'Colin',face:'colin',subj:`Season ${S.season}`,body:`New season. The board want ${money(S.target.rev)}, no more than ${S.target.safety} recordables, and ${S.target.clients} clients happy. ${notes.join(' ')}`});
 log(`Season ${S.season} begins.`)}
function genSeasonTrips(){const out=[];let wk=2;
 while(wk<=43){const pl=pick(TRIP_GEN.places),k=pick(TRIP_GEN.kinds);const days=rint(...k.days);
  out.push(mkTrip({wk,client:pl[1],name:`${pick(k.names)}, ${pl[0]}`,type:k.type,days,need:{field:rint(...k.field),admin:rint(...k.admin)},hazard:pl[2]}));
  wk+=rint(3,4)}
 return out}

function tripHead(){const T=S.trip,t=tripById(T.id);const done=Object.keys(T.done).length;

 return `<div class="hud">${cells}<div><b>Trip cost</b>${money(T.cost)}</div><div><b>Worth</b>${money(t.val)}</div></div><h2>${esc(t.name)} · ${CLIENTS[t.client]}</h2>`}

 const head=ev.kind==='inc'?`<h2 style="color:var(--red)">INCIDENT — day ${T.day}, late arvo</h2>`:ev.kind==='mob'?`<h2>${MOB_TASKS.find(m=>m.id===ev.task).n} → ${esc(cx.p.name)}</h2>`:`<h2>${esc(T.jobs[T.day-1][ev.job])} → ${esc(cx.p.name)}</h2>`;
 const txt=s=>esc(tpl(s,{p:cx.p,o:cx.o,b:cx.b}));
 let foot;if(ev.res==null)foot=`<div class="opts">${e.o.map((o,i)=>`<button class="btn" data-o="${i}">${i+1}. ${txt(o.l)}</button>`).join('')}</div>`;
 else{const o=e.o[ev.res];const good=ev.kind==='inc'?!(o.inc&&!ev.fa)&&(o.m||0)>=0:o.done&&(o.m||0)>=0;const bad=ev.kind==='inc'?(o.inc&&!ev.fa):!o.done;
  const fx=[o.d?`+${o.d} day${o.d>1?'s':''}`:'',o.c?money(o.c):'',o.data?`data ${o.data>0?'+':''}${o.data}`:'',o.m?`morale ${o.m>0?'+':''}${o.m}`:'',o.inc?(ev.fa?'first aid only':'RECORDABLE'):'',o.inj?`injured ${o.inj} wk`:''].filter(Boolean).join(' · ');
  foot=`<div class="res ${bad?'bad':good?'good':''}">${txt(o.r)}${ev.fa?' First aid training kicked in: not recordable.':''}${fx?`<div class="fine" style="margin-top:6px">${fx}</div>`:''}</div><div class="tbar"><button class="btn" id="evnext">Next ▶</button></div>`}
 return `${head}<div class="talk"><div>${who}</div><div class="bub">${txt(e.t)}</div></div>${foot}`}

 let body='';

 else if(T.phase==='mob'){

 const x={best:best?best.name:'the team',miss:r.missed.join(', ').toLowerCase()||'a few things'};
 let foot;if(T.debRes==null)foot=`<div class="opts">${d.a.map((a,i)=>`<button class="btn" data-a="${i}">${i+1}. ${esc(tpl(a.l,x))}</button>`).join('')}</div>`;
 else{const a=d.a[T.debRes];foot=`<div class="res">${esc(tpl(a.r,x))} ${esc(T.debOut||'')}</div><div class="tbar"><button class="btn big" id="done">▶ BACK TO THE OFFICE</button></div>`}
 screen.innerHTML=`${hud()}<h2>Debrief with ${CLIENTS[t.client]}</h2>${talk('client',CLIENTS[t.client],esc(tpl(d.q,x)))}${foot}`;faces();
 screen.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{sfx.click();debriefAnswer(+b.dataset.a);render()});
 const dn=$('#done');if(dn)dn.onclick=()=>{sfx.click();endTrip();if(S.board<18&&S.week>10){S.screen='end';S.midSack=true}render()};status('Debrief.')}

// ---------- season end ----------
function endView(){$('#nav').innerHTML='';
 if(S.midSack){S.over=true;save();screen.innerHTML=`<h1>SACKED</h1><h2>Week ${S.week}, season ${S.season}</h2>${talk('colin','Colin',`The board met this morning. Confidence was ${S.board}%. They've asked me to thank you for your service. Security will walk you to the car park. Marcus is in the car park, oddly.`)}
  <div class="log">${S.log.slice(-15).map(l=>`<div>${esc(l)}</div>`).join('')}</div><div class="tbar"><button class="btn big" id="again">▶ NEW GAME</button></div>`;faces();sfx.bad();
  $('#again').onclick=()=>{START();seedInbox();S.screen='game';render()};return status('Sacked.')}
 const v=seasonVerdict();
 const why=[v.revOK?'Revenue: met.':`Revenue: ${money(S.revenue)} of ${money(S.target.rev)}.`,v.safeOK?'Safety: met.':`Safety: ${S.recordables} recordables, limit ${S.target.safety}.`,v.cliOK?'Clients: met.':`Clients: ${v.happy} happy, needed ${S.target.clients}.`,S.cash<-20000?`Cash: ${money(S.cash)}. The bank rang.`:''].filter(Boolean).join('<br>');
 const rusty=staff('rusty');
 screen.innerHTML=`${hud()}<h1>${v.title}</h1>${talk('colin','Colin',`${why}<br><br>${v.sacked?'The board has made its decision.':v.pass?"Targets met. Which means they've already raised next year's.":"You're on probation. One more season to turn it round."}${rusty?' Rusty says it used to be worse.':''}`)}
 <h3>Season log</h3><div class="log">${S.log.slice(-20).map(l=>`<div>${esc(l)}</div>`).join('')}</div>
 <div class="tbar">${v.sacked?'<button class="btn big" id="again">▶ NEW GAME</button>':testimonialDue()&&!S.testSeen?'<button class="btn big" id="test">▶ RUSTY WANTS A WORD</button>':`<button class="btn big" id="next">▶ START SEASON ${S.season+1}</button>`}</div>`;faces();
 (v.pass?sfx.good:sfx.bad)();
 const a=$('#again');if(a)a.onclick=()=>{S.over=true;START();seedInbox();S.screen='game';render()};
 const tb=$('#test');if(tb)tb.onclick=()=>{S.screen='testimonial';render()};
 const nx=$('#next');if(nx)nx.onclick=()=>{sfx.ring();newSeason();S.testSeen=false;S.screen='game';S.view='office';render()};
 if(v.sacked){S.over=true;save()}status('Season over.')}
function testimonialView(){const r=staff('rusty');$('#nav').innerHTML='';
 const opts=[S.rustyOneMore>=2?null:'One more season, then.','Send-off at the depot ($1,500)','Name trap line 3 after him'];
 screen.innerHTML=`<h1>RUSTY'S TESTIMONIAL</h1><h2>${r.age} years old · ${r.apps} trips with you</h2>
 ${talk('rusty','Rusty',`I've been thinking. Knees are gone. The sites have all got gates now. There's an app for the gates.<br><br>${S.rustyOneMore?"I know I said this last year.":"I reckon this might be it."} What do you reckon?`)}
 <div class="opts">${opts.map((o,i)=>o?`<button class="btn" data-r="${i}">${i+1}. ${o}</button>`:'<button class="btn" disabled>1. He won\'t hear of another season.</button>').join('')}</div><div id="tres"></div>`;faces();
 screen.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{const out=testimonial(+b.dataset.r);S.testSeen=true;sfx.good();
  screen.querySelector('.opts').innerHTML='';$('#tres').innerHTML=`<div class="res good">${esc(out)}</div><div class="tbar"><button class="btn big" id="next">▶ START SEASON ${S.season+1}</button></div>`;
  $('#next').onclick=()=>{sfx.ring();newSeason();S.testSeen=false;S.screen='game';S.view='office';render()}});
 status('Testimonial.')}

// ---------- boot ----------
function boot(){S=null;title()}
if(window.claude?.hot?.snapshot)window.claude.hot.snapshot(()=>S);
window.claude?.hot?.ready?window.claude.hot.ready(d=>{if(d&&d.screen&&d.screen!=='title'){S=d;render()}else boot()}):boot();
</script>

</body>
</html>
