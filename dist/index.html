",null,"<p>Both terms apply to any process.</p>","<p>Both can be measured in any time unit.</p>"]},{"id":"D-1.2-015","phase":"Define","section":"1.2","subtopic":"Cost of Poor Quality (COPQ)","type":"concept","difficulty":2,"answer":2,"lesson_day":3,"stem_html":"<p>What is meant by the \"hidden factory\"?</p>","options_html":["<p>The spare capacity a plant keeps for demand peaks</p>","<p>The scrap and warranty costs that appear in the monthly accounts</p>","<p>The rework, checking and workarounds that exist only to fix the output of the official process and rarely appear in the accounts</p>","<p>The prevention activities that a company does not publicise</p>"],"explanation_html":"<p>The hidden factory is the unofficial second process, often large, that reworks and re-checks defective output. Its cost is mostly invisible in normal reporting, which is why cost of poor quality is usually far larger than the visible scrap and warranty figures (Day 3).</p>","distractor_html":["<p>Spare capacity is a planning decision, not the hidden factory.</p>","<p>Scrap and warranty are the visible part of the cost of poor quality, the opposite of hidden.</p>",null,"<p>Prevention is a deliberate, visible category of quality cost.</p>"]},{"id":"D-1.2-016","phase":"Define","section":"1.2","subtopic":"Basic Six Sigma Metrics (DPU, DPMO, FTY, RTY, Cycle Time)","type":"concept","difficulty":2,"check":true,"answer":2,"lesson_day":3,"stem_html":"<p>Why does the standard sigma table equate 3.4 defects per million opportunities with six sigma, when the normal distribution places six standard deviations at about 0.002 defects per million?</p>","options_html":["<p>Because defects per million opportunities and defects per million units are different measures</p>","<p>Because the table was calculated before computers</p>","<p>Because the table builds in a 1.5-sigma shift to allow for long-term drift of the process mean, so 6 sigma short-term is treated as 4.5 sigma long-term</p>","<p>Because the table rounds heavily</p>"],"explanation_html":"<p>Motorola's convention is that a process measured over a short period drifts by about 1.5 standard deviations over the long run. The table adds 1.5 to the value the normal distribution gives, so 4.5 sigma on the normal curve (3.4 DPMO) is reported as 6 sigma (Day 3).</p>","distractor_html":["<p>Both figures are per opportunity; the difference is the shift.</p>","<p>The table is exact given the shift convention.</p>",null,"<p>Rounding does not account for a difference of three orders of magnitude.</p>"]},{"id":"D-1.2-017","phase":"Define","section":"1.2","subtopic":"Cost of Poor Quality (COPQ)","type":"concept","difficulty":2,"answer":2,"lesson_day":3,"stem_html":"<p>A company spends $30,000 training operators in a new set-up procedure and installing fixtures that make wrong assembly impossible. Which cost of poor quality category is this?</p>","options_html":["<p>Internal failure cost</p>","<p>Appraisal cost</p>","<p>Prevention cost</p>","<p>External failure cost</p>"],"explanation_html":"<p>Training and mistake-proofing stop defects being made in the first place, which is prevention. Appraisal would be inspecting the assemblies afterwards; failure costs arise only when defects actually occur (Day 3).</p>","distractor_html":["<p>Internal failure is scrap and rework of actual defects.</p>","<p>Appraisal is inspection and testing, not training or fixtures.</p>",null,"<p>External failure is defects reaching the customer.</p>"]},{"id":"D-1.2-018","phase":"Define","section":"1.2","subtopic":"Pareto Analysis (80:20 rule)","type":"interpretation","difficulty":3,"answer":0,"lesson_day":3,"stem_html":"<p>A Pareto chart of complaint counts shows \"late delivery\" as the tallest bar (48% of complaints) and \"damaged goods\" as a small bar (6%). The finance team points out that a damaged-goods complaint costs about 15 times as much to resolve as a late-delivery complaint. What should the Green Belt do?</p>","options_html":["<p>Build a second Pareto chart weighted by cost and compare the two rankings before choosing</p>","<p>Ignore the cost data, because Pareto charts must use counts</p>","<p>Combine the two categories into one bar</p>","<p>Address damaged goods only, because cost always outranks frequency</p>"],"explanation_html":"<p>Pareto by count and Pareto by cost can rank categories differently. At 15 times the cost, damaged goods (6% × 15 = 90 units of cost) outweighs late delivery (48 units) on a cost basis. The right move is to draw both and choose with the Champion (Day 3).</p>","distractor_html":[null,"<p>Pareto charts can be built on counts, cost, time or any measure of effect.</p>","<p>Combining unrelated categories destroys the information the chart is meant to give.</p>","<p>Neither count nor cost automatically wins; the decision depends on the project's goal.</p>"]},{"id":"D-1.2-019","phase":"Define","section":"1.2","subtopic":"Basic Six Sigma Metrics (DPU, DPMO, FTY, RTY, Cycle Time)","type":"concept","difficulty":3,"answer":0,"lesson_day":3,"stem_html":"<p>A team wants its invoice process to look better and proposes counting every character on the invoice as a separate opportunity for a defect. Why is this wrong?</p>","options_html":["<p>Because inflating the opportunity count lowers DPO and DPMO without any real improvement, and opportunities should be limited to distinct features the customer would see as defects</p>","<p>Because opportunities must always equal the number of process steps</p>","<p>Because DPMO can only be calculated with exactly one opportunity per unit</p>","<p>Because characters cannot be counted reliably</p>"],"explanation_html":"<p>Opportunities are defined in advance as the distinct ways a unit can fail a requirement. Adding opportunities that never fail makes the same 60 defects look like a much smaller proportion. The process has not changed; only the denominator has (Day 3).</p>","distractor_html":[null,"<p>Opportunities are features that can be wrong, not process steps.</p>","<p>DPMO works for any number of opportunities per unit.</p>","<p>Counting is possible; the problem is that the count is padded.</p>"]},{"id":"D-1.2-020","phase":"Define","section":"1.2","subtopic":"Critical to Quality Characteristics (CTQ's)","type":"concept","difficulty":1,"check":true,"answer":2,"lesson_day":4,"stem_html":"<p>Which of the following is a properly stated critical to quality characteristic (CTQ)?</p>","options_html":["<p>Staff should be well trained</p>","<p>The call centre should try harder</p>","<p>Calls must be answered within 30 seconds, with a target of 15 seconds</p>","<p>Customers want friendly service</p>"],"explanation_html":"<p>A CTQ is a customer need translated into a measurable characteristic with a target and a limit. \"Answered within 30 seconds\" can be measured and has a specification; \"friendly service\" is a need that has not yet been translated (Day 4).</p>","distractor_html":["<p>Training is an input, not a characteristic of the output.</p>","<p>That is an instruction with no measure.</p>",null,"<p>That is a need in the customer's words, not yet measurable.</p>"]},{"id":"D-1.2-021","phase":"Define","section":"1.2","subtopic":"Critical to Quality Characteristics (CTQ's)","type":"interpretation","difficulty":2,"answer":1,"lesson_day":4,"stem_html":"<p>A CTQ tree for a courier has these levels: \"Arrive when you said you would\" → \"Parcel loaded on the correct van\" → \"Parcel arrival time relative to the promised window; target inside the window; limit no later than the window closes\". What are the three levels, in order?</p>","options_html":["<p>CTQ, driver, need</p>","<p>Need, driver, CTQ</p>","<p>Requirement, specification, target</p>","<p>Voice of the business, voice of the customer, voice of the employee</p>"],"explanation_html":"<p>A CTQ tree drills from the need in the customer's words, through the drivers that must happen for the need to be met, to the measurable CTQ with its target and limit (Day 4).</p>","distractor_html":["<p>The order is reversed.</p>",null,"<p>Specification and target are parts of the CTQ, not the tree's levels.</p>","<p>The three voices are sources of requirements, not levels of a CTQ tree.</p>"]},{"id":"D-1.2-022","phase":"Define","section":"1.2","subtopic":"Critical to Quality Characteristics (CTQ's)","type":"concept","difficulty":2,"answer":0,"lesson_day":4,"stem_html":"<p>What is the purpose of an operational definition?</p>","options_html":["<p>To describe exactly how a measure is taken so that different people measuring the same thing get the same answer</p>","<p>To list the process steps in a SIPOC</p>","<p>To record the customer's needs in their own words</p>","<p>To state the financial value of a CTQ</p>"],"explanation_html":"<p>An operational definition removes ambiguity from a measure: what counts, which clock or record is used, and how borderline cases are handled. Without one, data collected in Measure means different things to different people (Day 4).</p>","distractor_html":[null,"<p>Process steps are in the SIPOC, a different tool.</p>","<p>Needs in the customer's words are the top of the CTQ tree.</p>","<p>Financial value is the business case, not the operational definition.</p>"]},{"id":"D-1.2-023","phase":"Define","section":"1.2","subtopic":"Defining a Process","type":"concept","difficulty":1,"check":true,"answer":2,"lesson_day":5,"stem_html":"<p>When a team sets out to define a process for a project, what should it agree first?</p>","options_html":["<p>The statistical test to be used</p>","<p>The solution to be piloted</p>","<p>The first step that triggers the process and the last step where the output is handed over</p>","<p>The root cause of the problem</p>"],"explanation_html":"<p>Defining a process starts with its boundaries: where it begins and where it ends. Inputs, outputs, the owner and the high-level steps follow. Causes, tests and solutions belong to later phases (Day 5).</p>","distractor_html":["<p>Tests are chosen in Analyse.</p>","<p>Solutions belong to Improve.</p>",null,"<p>Root causes are found in Analyse, after the process has been defined and measured.</p>"]},{"id":"D-1.2-024","phase":"Define","section":"1.2","subtopic":"Defining a Process","type":"interpretation","difficulty":3,"answer":1,"lesson_day":4,"stem_html":"<p>A project on late customer deliveries defined its process as starting when the parcel is scanned into the local depot. In Analyse the team finds most lateness is caused by parcels arriving late from the interstate hub, which is outside the defined boundary. What does this show?</p>","options_html":["<p>The team should ignore the finding because it is out of scope</p>","<p>The process boundary was set too narrow and the scope should be revisited with the Champion</p>","<p>Analyse was performed incorrectly</p>","<p>The interstate hub should be added to the team without changing the charter</p>"],"explanation_html":"<p>A boundary chosen too narrow can leave the main cause outside the project. The correct response is to go back to the charter and agree a change of scope with the Champion, not to pretend the cause does not exist or to widen the work informally (Day 4).</p>","distractor_html":["<p>Ignoring the main cause guarantees the project fails to move the Y.</p>",null,"<p>Analyse did its job: it found the cause.</p>","<p>Scope changes are made in the charter with the Champion's agreement, not by quietly adding people.</p>"]},{"id":"D-1.2-025","phase":"Define","section":"1.2","subtopic":"Critical to Quality Characteristics (CTQ's)","type":"concept","difficulty":2,"answer":3,"lesson_day":4,"stem_html":"<p>In the Kano model, which kind of customer need causes strong dissatisfaction when it is missing but earns almost no extra satisfaction when it is met?</p>","options_html":["<p>Delighter</p>","<p>Secondary need</p>","<p>Performance need</p>","<p>Basic (must-be) need</p>"],"explanation_html":"<p>Basic needs are expected without being asked, such as brakes that work or a bill that adds up. Meeting them is taken for granted; missing them causes anger. Performance needs work in both directions and delighters please when present but are not missed (Day 4).</p>","distractor_html":["<p>Delighters do the opposite: they please when present and are not missed when absent.</p>","<p>Secondary need is not a Kano category.</p>","<p>Performance needs raise satisfaction as they improve and lower it as they worsen.</p>",null]},{"id":"D-1.2-026","phase":"Define","section":"1.2","subtopic":"Basic Six Sigma Metrics (DPU, DPMO, FTY, RTY, Cycle Time)","type":"calculation","difficulty":2,"generator":"stats:sigma_from_dpmo","answer":0,"lesson_day":3,"stem_html":"<p>A process runs at 6,210 defects per million opportunities. What is its sigma level on the standard sigma table?</p>","options_html":["<p>4.0</p>","<p>2.5</p>","<p>3.0</p>","<p>5.5</p>"],"explanation_html":"<p>6 210 DPMO is the standard-table landmark for 4 sigma (with the 1.5 shift included). The landmarks worth memorising are 3 sigma 66 807, 4 sigma 6 210, 5 sigma 233 and 6 sigma 3.4 (Day 3).</p>","distractor_html":[null,"<p>2.5 would be the long-term value with the shift removed; the table already includes the shift.</p>","<p>3.0 sigma corresponds to 66 807 DPMO.</p>","<p>5.5 adds the shift twice.</p>"]},{"id":"D-1.2-027","phase":"Define","section":"1.2","subtopic":"Defining a Process","type":"concept","difficulty":1,"answer":0,"lesson_day":4,"stem_html":"<p>Which of the following best describes what \"defining a process\" produces in the Define phase?</p>","options_html":["<p>An agreed statement of the process's start and end points, its inputs and suppliers, its outputs and customers, and its owner</p>","<p>A control plan for the process owner</p>","<p>A list of confirmed root causes</p>","<p>A detailed flowchart of every decision and loop</p>"],"explanation_html":"<p>Defining a process fixes what is being studied: boundaries, inputs, outputs, customers and owner, usually written as a SIPOC. Detailed mapping comes in Measure, causes in Analyse and the control plan in Control (Day 4).</p>","distractor_html":[null,"<p>The control plan is a Control deliverable.</p>","<p>Root causes come from Analyse.</p>","<p>Detailed flowcharts are process mapping, a Measure activity.</p>"]},{"id":"D-1.2-028","phase":"Define","section":"1.2","subtopic":"Basic Six Sigma Metrics (DPU, DPMO, FTY, RTY, Cycle Time)","type":"calculation","difficulty":2,"generator":"stats:dpmo_from_sigma","answer":3,"lesson_day":3,"stem_html":"<p>Using the standard sigma table with the 1.5-sigma shift, how many defects per million opportunities does a 4.5 sigma process produce?</p>","options_html":["<p>233</p>","<p>3.4</p>","<p>6,210</p>","<p>1,350</p>"],"explanation_html":"<p>A 4.5 sigma process on the table is 3.0 sigma on the normal distribution after the 1.5 shift is removed, which gives 1 350 DPMO. 3.4 DPMO is 6 sigma, 6 210 is 4 sigma and 233 is 5 sigma (Day 3).</p>","distractor_html":["<p>233 is 5 sigma.</p>","<p>3.4 DPMO is the 6 sigma figure; 4.5 sigma without the shift is where 3.4 comes from on the plain normal curve, but the table reports it as 6.</p>","<p>6,210 is 4 sigma.</p>",null]},{"id":"D-1.2-029","phase":"Define","section":"1.2","subtopic":"Basic Six Sigma Metrics (DPU, DPMO, FTY, RTY, Cycle Time)","type":"calculation","difficulty":1,"generator":"stats:expr","answer":0,"lesson_day":3,"stem_html":"<p>A late-delivery rate fell from 12% to 7% after a trial. By what percentage was the late-delivery rate reduced?</p>","options_html":["<p>41.7%</p>","<p>5.0%</p>","<p>71.4%</p>","<p>58.3%</p>"],"explanation_html":"<p>The reduction is (12 − 7) ÷ 12 × 100 = 41.7%. The 5-percentage-point drop is the absolute change; the percentage reduction is relative to the starting rate (Day 3).</p>","distractor_html":[null,"<p>5.0% is the change in percentage points, not the percentage reduction.</p>","<p>71.4% divides by the new rate (5 ÷ 7) instead of the old.</p>","<p>58.3% is 7 ÷ 12, the share of the original rate that remains.</p>"]},{"id":"D-1.3-001","phase":"Define","section":"1.3","subtopic":"Building a Business Case & Project Charter","type":"concept","difficulty":1,"check":true,"answer":3,"lesson_day":4,"stem_html":"<p>Which of the following must NOT appear in a project charter's problem statement?</p>","options_html":["<p>The measured size of the problem</p>","<p>The impact on the customer or the business</p>","<p>The period over which it was measured</p>","<p>The suspected cause and the proposed solution</p>"],"explanation_html":"<p>A problem statement says what, where, when, how much and with what impact. Naming a cause or a solution commits the team before any data has been analysed, which is exactly what DMAIC is designed to prevent (Day 4).</p>","distractor_html":["<p>The measured Y is essential: it is the \"how much\".</p>","<p>Impact is one of the five required elements.</p>","<p>The period is the \"when\".</p>",null]},{"id":"D-1.3-002","phase":"Define","section":"1.3","subtopic":"Building a Business Case & Project Charter","type":"interpretation","difficulty":2,"answer":1,"lesson_day":4,"stem_html":"<p>Which of these is the best problem statement for a charter?</p>","options_html":["<p>\"We will reduce invoice errors to 3% by November by retraining the data entry team.\"</p>","<p>\"Between January and June, 9% of the 3,000 invoices raised each month at the Perth office contained at least one error, causing an average 21-day payment delay and about $15,400 a month in credit notes and rework.\"</p>","<p>\"Customers are unhappy with our invoices and the team needs to do better.\"</p>","<p>\"Invoicing is inefficient because the pricing system is outdated and must be replaced.\"</p>"],"explanation_html":"<p>The second statement has a place, a period, a measured Y (9% of 3 000 a month) and an impact, and it names no cause or solution. The others contain a cause, have no numbers, or are a goal with a solution built in (Day 4).</p>","distractor_html":["<p>This is a goal statement, and it names a solution.</p>",null,"<p>No place, period, number or impact.</p>","<p>This names a cause (outdated system) and a solution (replace it) and has no measurement.</p>"]},{"id":"D-1.3-003","phase":"Define","section":"1.3","subtopic":"Building a Business Case & Project Charter","type":"concept","difficulty":1,"check":true,"answer":1,"lesson_day":4,"stem_html":"<p>Which element of the project charter states what the primary metric will be, and by what date?</p>","options_html":["<p>Problem statement</p>","<p>Goal statement</p>","<p>Scope</p>","<p>Business case</p>"],"explanation_html":"<p>The goal statement commits to a value of the Y by a date, using the same measure as the problem statement, and is tested against SMART. The business case says why the project matters, the problem statement says what is wrong now, and scope says what is in and out (Day 4).</p>","distractor_html":["<p>The problem statement describes the current situation, not the target.</p>",null,"<p>Scope defines boundaries, not targets.</p>","<p>The business case explains why the organisation should fund the project.</p>"]},{"id":"D-1.3-004","phase":"Define","section":"1.3","subtopic":"Building a Business Case & Project Charter","type":"interpretation","difficulty":2,"answer":0,"lesson_day":4,"stem_html":"<p>The problem statement of a charter describes an invoice error rate of 9%. Which goal statement is consistent with it and passes the SMART test?</p>","options_html":["<p>\"Reduce the invoice error rate from 9% to 3% by 30 November.\"</p>","<p>\"Reduce invoice cycle time from 2.3 days to 1 day by 30 November.\"</p>","<p>\"Improve invoicing accuracy significantly.\"</p>","<p>\"Implement the new pricing module by 30 November.\"</p>"],"explanation_html":"<p>The goal uses the same measure as the problem (error rate), gives a number and a date, and describes an outcome rather than a solution. Cycle time is a different measure, and implementing a module is a solution, not a goal (Day 4).</p>","distractor_html":[null,"<p>The measure does not match the problem statement's Y.</p>","<p>\"Significantly\" is neither specific nor measurable.</p>","<p>A goal must not name the solution, which is unknown in Define.</p>"]},{"id":"D-1.3-005","phase":"Define","section":"1.3","subtopic":"Building a Business Case & Project Charter","type":"concept","difficulty":2,"answer":1,"lesson_day":4,"stem_html":"<p>Who signs the project charter, and what happens to it after Define?</p>","options_html":["<p>The Green Belt signs it and it is filed until the project ends</p>","<p>The Champion signs it and it is revisited at every tollgate, with any change of goal or scope agreed with the Champion</p>","<p>The process owner signs it and it is replaced by the control plan</p>","<p>The Master Black Belt signs it and rewrites it in each phase</p>"],"explanation_html":"<p>The charter is the Champion's authorisation of the project and the reference at every tollgate. Numbers may be refined once Measure produces a baseline, but the goal and scope are not changed without the Champion (Day 4).</p>","distractor_html":["<p>The Green Belt drafts the charter; the Champion authorises it, and it is used throughout.</p>",null,"<p>The control plan is a Control deliverable that supplements, not replaces, the charter.</p>","<p>The Master Black Belt coaches; they do not own the charter.</p>"]},{"id":"D-1.3-006","phase":"Define","section":"1.3","subtopic":"Building a Business Case & Project Charter","type":"concept","difficulty":2,"check":true,"answer":2,"lesson_day":4,"stem_html":"<p>What is the purpose of the business case in a project charter?</p>","options_html":["<p>To describe the statistical tools that will be used</p>","<p>To list the team members and their time commitment</p>","<p>To state why the organisation should fund this project: what the problem costs, what improvement is worth and what happens if nothing is done</p>","<p>To record the customer's requirements in their own words</p>"],"explanation_html":"<p>The business case is the voice of the business written down: the argument the Champion uses to defend the project. It uses cost of poor quality thinking and its numbers must be checkable (Day 4).</p>","distractor_html":["<p>Tools are chosen as the project proceeds; they are not in the business case.</p>","<p>Team membership is the team element of the charter.</p>",null,"<p>Customer requirements are captured in the voice of the customer and the CTQ tree.</p>"]},{"id":"D-1.3-007","phase":"Define","section":"1.3","subtopic":"Developing Project Metrics","type":"concept","difficulty":2,"answer":3,"lesson_day":5,"stem_html":"<p>How many primary metrics should a Lean Six Sigma project have?</p>","options_html":["<p>At least three, to cover cost, quality and time</p>","<p>As many as the Champion requests</p>","<p>One for each team member</p>","<p>One, the measure of the Y used in the problem and goal statements</p>"],"explanation_html":"<p>A project has one primary metric: the Y that is baselined in Measure and tracked through Control, written in the same units as the goal statement. Other measures are secondary metrics (Day 5).</p>","distractor_html":["<p>Cost, quality and time may all be watched, but only one is the primary metric; the others are secondary.</p>","<p>The Champion may want many measures, but the project is defined by one primary metric.</p>","<p>Metrics belong to the project, not to individuals.</p>",null]},{"id":"D-1.3-008","phase":"Define","section":"1.3","subtopic":"Developing Project Metrics","type":"interpretation","difficulty":3,"answer":1,"lesson_day":5,"stem_html":"<p>A project cut invoice errors from 9% to 2%, but the finance director complains that invoices now take four days instead of two to issue because everything is double-checked. What should the project have tracked to catch this earlier?</p>","options_html":["<p>The sigma level of the double-check</p>","<p>A consequential (guard-rail) metric for invoice cycle time</p>","<p>The voice of the employee</p>","<p>A second primary metric</p>"],"explanation_html":"<p>Consequential metrics protect against fixing one thing by breaking another. Cycle time was the obvious side effect of adding checks, so it should have been a consequential metric with a baseline from the start. Secondary metrics are the x's expected to move; they would not have caught this (Day 5).</p>","distractor_html":["<p>The check's sigma level would not reveal the delay it causes.</p>",null,"<p>The voice of the employee is about the workers' experience, not about the process side effect.</p>","<p>A project has one primary metric; side effects are watched with consequential metrics.</p>"]},{"id":"D-1.3-009","phase":"Define","section":"1.3","subtopic":"Developing Project Metrics","type":"concept","difficulty":1,"check":true,"answer":1,"lesson_day":5,"stem_html":"<p>What is a baseline?</p>","options_html":["<p>The target value in the goal statement</p>","<p>The value of a metric before the improvement, measured over enough time to capture normal variation</p>","<p>The lowest value the metric has ever reached</p>","<p>The specification limit set by the customer</p>"],"explanation_html":"<p>The baseline is where the metric stands now, usually from three to twelve months of historical data so that normal variation is included. The gap between baseline and target is the project's benefit (Day 5).</p>","distractor_html":["<p>The target is the goal; the baseline is the starting point.</p>",null,"<p>A single best value is not representative of normal performance.</p>","<p>Specification limits come from the customer and describe acceptability, not current performance.</p>"]},{"id":"D-1.3-010","phase":"Define","section":"1.3","subtopic":"Financial Evaluation & Benefits Capture","type":"calculation","difficulty":2,"generator":"stats:payback_months","answer":3,"lesson_day":5,"stem_html":"<p>A project has one-off costs of $48,000 and is expected to save $6,500 a month. What is the payback period?</p>","options_html":["<p>0.14 months</p>","<p>78.0 months</p>","<p>13.5 months</p>","<p>7.4 months</p>"],"explanation_html":"<p>Payback period is one-off cost divided by the saving per period: 48 000 ÷ 6 500 = 7.4 months. The answer takes the units of the saving period (Day 5).</p>","distractor_html":["<p>0.14 is the saving divided by the cost, the wrong way round.</p>","<p>78.0 treats the monthly saving as an annual figure and multiplies instead of dividing.</p>","<p>13.5 months divides by the saving as if it were $3 550, or confuses payback with 1 ÷ ROI.</p>",null]},{"id":"D-1.3-011","phase":"Define","section":"1.3","subtopic":"Financial Evaluation & Benefits Capture","type":"calculation","difficulty":2,"generator":"stats:roi_pct","answer":1,"lesson_day":5,"stem_html":"<p>A project delivers $78,000 of hard benefit in its first year and cost $48,000. What is the first-year return on investment?</p>","options_html":["<p>30.0%</p>","<p>62.5%</p>","<p>38.5%</p>","<p>162.5%</p>"],"explanation_html":"<p>Return on investment is (benefit − cost) ÷ cost × 100 = (78 000 − 48 000) ÷ 48 000 × 100 = 62.5% (Day 5).</p>","distractor_html":["<p>30.0% is the net benefit in thousands read as a percentage.</p>",null,"<p>38.5% divides the net benefit by the benefit instead of the cost.</p>","<p>162.5% is benefit ÷ cost, without subtracting the cost.</p>"]},{"id":"D-1.3-012","phase":"Define","section":"1.3","subtopic":"Financial Evaluation & Benefits Capture","type":"concept","difficulty":1,"check":true,"answer":3,"lesson_day":5,"stem_html":"<p>Which of the following is a hard benefit?</p>","options_html":["<p>Two hours a week of a supervisor's time freed up, which they now spend on other duties</p>","<p>The risk of a regulatory penalty is lower</p>","<p>Staff morale improves because there is less rework</p>","<p>A monthly $4,000 reduction in credit notes issued to customers</p>"],"explanation_html":"<p>A hard benefit appears in the profit and loss account and can be audited. Fewer credit notes is money not paid out. Morale, lower risk and freed time that is not removed from the payroll are soft benefits (Day 5).</p>","distractor_html":["<p>Freed time is soft unless the position or paid hours are actually removed.</p>","<p>Lower risk is a soft benefit; only an avoided budgeted cost would count as hard in some organisations.</p>","<p>Morale is real but not money in the accounts.</p>",null]},{"id":"D-1.3-013","phase":"Define","section":"1.3","subtopic":"Financial Evaluation & Benefits Capture","type":"concept","difficulty":3,"answer":2,"lesson_day":5,"stem_html":"<p>Who validates the savings claimed by a Lean Six Sigma project, and on what basis?</p>","options_html":["<p>The Green Belt, using the estimate in the charter</p>","<p>The Champion, using the goal statement</p>","<p>The financial representative, using measured results after the improvement is implemented, net of costs</p>","<p>The Master Black Belt, using the sigma level</p>"],"explanation_html":"<p>Benefits capture requires a member of the finance team to agree the calculation method in Define and to sign off the realised saving, measured against the baseline for an agreed period (usually twelve months) after handover, with project costs subtracted (Day 5).</p>","distractor_html":["<p>The belt calculates but does not validate; the charter figure is a forecast.</p>","<p>The Champion sponsors the project but does not audit its financial result.</p>",null,"<p>Sigma level is a defect measure, not a financial validation.</p>"]},{"id":"D-1.3-014","phase":"Define","section":"1.3","subtopic":"Financial Evaluation & Benefits Capture","type":"calculation","difficulty":3,"generator":"stats:expr","answer":1,"lesson_day":5,"stem_html":"<p>A project will reduce defective invoices by 180 a month. Each defective invoice costs $18 to rework and, for 60% of them, a further $65 credit note, giving an average cost of $57 per defective invoice. What is the annual hard saving?</p>","options_html":["<p>$38,880</p>","<p>$123,120</p>","<p>$10,260</p>","<p>$179,280</p>"],"explanation_html":"<p>Monthly saving = 180 × $57 = $10 260. Annual saving = $10 260 × 12 = $123 120. The cost per defective was given already averaged; it is not recomputed (Day 5).</p>","distractor_html":["<p>$38,880 uses only the $18 rework cost (180 × 18 × 12).</p>",null,"<p>$10,260 is the monthly saving, not the annual figure.</p>","<p>$179,280 uses $18 + $65 = $83 per invoice, ignoring that only 60% incur the credit note.</p>"]},{"id":"D-1.3-015","phase":"Define","section":"1.3","subtopic":"Building a Business Case & Project Charter","type":"concept","difficulty":2,"answer":3,"lesson_day":5,"stem_html":"<p>A manager proposes a Green Belt project to \"install the new scheduling software, which we already know will fix the roster clashes\". Why is this a poor candidate for a Lean Six Sigma project?</p>","options_html":["<p>Because roster clashes are not measurable</p>","<p>Because a project cannot start until the software vendor has been selected</p>","<p>Because software projects cannot use DMAIC</p>","<p>Because the solution is already decided, so there is nothing for Measure and Analyse to find; it is a task, not an improvement project</p>"],"explanation_html":"<p>Project selection favours problems with a clear Y, available data and causes that are not yet known. A problem with a known solution should be handled as an implementation task; forcing it through DMAIC wastes the method (Day 5).</p>","distractor_html":["<p>Roster clashes per week is a perfectly measurable Y.</p>","<p>Vendor selection is part of implementing the known solution; it is not what disqualifies the candidate.</p>","<p>DMAIC applies to any process, including software-supported ones.</p>",null]},{"id":"D-1.3-016","phase":"Define","section":"1.3","subtopic":"Financial Evaluation & Benefits Capture","type":"interpretation","difficulty":3,"answer":2,"lesson_day":5,"stem_html":"<p>Finance reports that a proposed project has a net present value of +$41,000 at the company's 10% discount rate. What does this tell the Green Belt?</p>","options_html":["<p>The project's return on investment is 41%</p>","<p>The project will save exactly $41,000 in its first year</p>","<p>After discounting future savings for the time value of money and subtracting the up-front cost, the project earns more than the company's required 10% rate</p>","<p>The project's payback period is 4.1 years</p>"],"explanation_html":"<p>Net present value adds the discounted future cash flows and subtracts the initial cost. A positive value means the project beats the discount rate. It is not the first-year saving, the payback period or the ROI (Day 5).</p>","distractor_html":["<p>ROI is (benefit − cost) ÷ cost, a percentage, not a discounted dollar figure.</p>","<p>NPV sums discounted flows over the whole evaluation period; it is not a single year's saving.</p>",null,"<p>Payback period is cost ÷ saving per period, a different calculation.</p>"]},{"id":"D-1.3-017","phase":"Define","section":"1.3","subtopic":"Developing Project Metrics","type":"concept","difficulty":3,"answer":1,"lesson_day":5,"stem_html":"<p>A project's primary metric is the percentage of invoices with errors. The team also tracks the percentage of orders that arrive with a valid purchase order number, because it expects that to be a cause of errors. What kind of metric is the second one?</p>","options_html":["<p>A consequential metric: a guard-rail against side effects</p>","<p>A secondary metric: a process x expected to move and to explain the primary metric</p>","<p>A primary metric</p>","<p>A financial metric</p>"],"explanation_html":"<p>Secondary metrics are the process measures (x's) the team expects to change and which explain why the Y moved. Consequential metrics guard against unintended harm to other outputs; this one is a suspected cause, so it is secondary (Day 5).</p>","distractor_html":["<p>A guard-rail metric would be a different output that might worsen, such as cycle time.</p>",null,"<p>There is one primary metric, the Y.</p>","<p>It is a process measure, not a dollar figure.</p>"]},{"id":"D-1.1-021","phase":"Define","section":"1.1","subtopic":"Voice of the Customer, Business and Employee","type":"concept","difficulty":1,"check":true,"answer":2,"lesson_day":4,"stem_html":"<p>Which of the following is a proactive source of the voice of the customer?</p>","options_html":["<p>Product returns</p>","<p>Warranty claims</p>","<p>Structured customer interviews</p>","<p>Complaint letters</p>"],"explanation_html":"<p>Proactive sources are collected on purpose: interviews, surveys, focus groups and observation. Complaints, claims and returns arrive without being asked and are reactive; they under-count problems because most unhappy customers do not speak up (Day 4).</p>","distractor_html":["<p>Returns are reactive.</p>","<p>Warranty claims arrive unprompted: reactive.</p>",null,"<p>Complaints are reactive.</p>"]},{"id":"D-1.1-022","phase":"Define","section":"1.1","subtopic":"Voice of the Customer, Business and Employee","type":"interpretation","difficulty":2,"answer":3,"lesson_day":4,"stem_html":"<p>The payroll team complains that 15% of timesheets from the workshop arrive with missing cost codes and have to be sent back. In Six Sigma terms, what is the payroll team?</p>","options_html":["<p>A supplier to the timesheet process</p>","<p>The process owner of the workshop</p>","<p>The voice of the business</p>","<p>The internal customer of the timesheet process, whose requirements define what a defective timesheet is</p>"],"explanation_html":"<p>Payroll receives the output of the timesheet process, so it is that process's internal customer. Its requirement (a valid cost code) defines the defect, exactly as an external customer's requirement would (Day 4).</p>","distractor_html":["<p>Suppliers provide inputs; payroll receives the output.</p>","<p>The process owner is the manager accountable for the process, not the department that receives its output.</p>","<p>The voice of the business is about cost and strategy, not about who receives the timesheets.</p>",null]},{"id":"M-2.4-001","phase":"Measure","section":"2.4","subtopic":"Capability Analysis","type":"calculation","difficulty":2,"generator":"stats:cpk","answer":3,"lesson_day":11,"stem_html":"<p>A filling process has an upper specification limit of 10.4 g, a lower specification limit of 9.6 g, a mean of 10.1 g and a short-term standard deviation of 0.1 g. What is Cpk?</p>","options_html":["<p>1.67</p>","<p>1.33</p>","<p>0.67</p>","<p>1.00</p>"],"explanation_html":"<p>Cpk uses the nearer specification limit. USL − mean = 0.3 and mean − LSL = 0.5, so the nearer distance is 0.3. Cpk = 0.3 ÷ (3 × 0.1) = 1.00 (Day 11).</p>","distractor_html":["<p>1.67 uses the farther limit (0.5 ÷ 0.3).</p>","<p>1.33 is Cp: (10.4 − 9.6) ÷ (6 × 0.1). Cp ignores centring.</p>","<p>0.67 divides 0.3 by 4.5 standard deviations; the divisor is 3σ.</p>",null]},{"id":"M-2.4-002","phase":"Measure","section":"2.4","subtopic":"Capability Analysis","type":"calculation","difficulty":1,"generator":"stats:cp","answer":0,"lesson_day":11,"stem_html":"<p>Using the same filling process (USL 10.4 g, LSL 9.6 g, short-term standard deviation 0.1 g), what is Cp?</p>","options_html":["<p>1.33</p>","<p>1.00</p>","<p>2.67</p>","<p>0.80</p>"],"explanation_html":"<p>Cp compares the specification width with six standard deviations: (10.4 − 9.6) ÷ (6 × 0.1) = 0.8 ÷ 0.6 = 1.33. It does not depend on the mean (Day 11).</p>","distractor_html":[null,"<p>1.00 is Cpk for this process, which accounts for centring.</p>","<p>2.67 divides by 3σ instead of 6σ.</p>","<p>0.80 is the specification width itself, not divided by 6σ.</p>"]},{"id":"M-2.4-003","phase":"Measure","section":"2.4","subtopic":"Capability Analysis","type":"concept","difficulty":2,"answer":3,"lesson_day":11,"stem_html":"<p>A process has Cp = 1.8 and Cpk = 0.9. What is the most likely explanation?</p>","options_html":["<p>The specification limits are too wide</p>","<p>The data were collected over too short a period</p>","<p>The process has too much variation to meet the specification</p>","<p>The process variation is small enough, but the process is not centred between the limits</p>"],"explanation_html":"<p>Cp measures potential capability from spread alone, and 1.8 says the spread would fit comfortably. Cpk is lower because it also accounts for centring. A large gap between them means the mean sits close to one limit. Centring the process would raise Cpk towards Cp (Day 11).</p>","distractor_html":["<p>Wide limits would raise both indices, not separate them.</p>","<p>Data period affects Pp/Ppk versus Cp/Cpk, not the Cp–Cpk gap.</p>","<p>Cp = 1.8 shows the variation is small relative to the specification.</p>",null]},{"id":"M-2.1-001","phase":"Measure","section":"2.1","subtopic":"Process Mapping, SIPOC, Value Stream Map","type":"concept","difficulty":1,"check":true,"answer":3,"lesson_day":5,"stem_html":"<p>What do the letters in SIPOC stand for?</p>","options_html":["<p>Scope, Issues, Process, Objectives, Constraints</p>","<p>Sponsor, Improvement, Priority, Owner, Charter</p>","<p>Sort, Inspect, Plan, Organise, Control</p>","<p>Suppliers, Inputs, Process, Outputs, Customers</p>"],"explanation_html":"<p>SIPOC is a five-column high-level view of a process: who supplies the inputs, what the inputs are, the main process steps, what the outputs are and who receives them. It is used in Define to agree the process and its boundaries (Day 5).</p>","distractor_html":["<p>These are charter-like words but not the SIPOC columns.</p>","<p>These are project roles, not SIPOC columns.</p>","<p>These are not the SIPOC columns; Sort is a 5S step.</p>",null]},{"id":"M-2.1-002","phase":"Measure","section":"2.1","subtopic":"Process Mapping, SIPOC, Value Stream Map","type":"concept","difficulty":3,"answer":3,"lesson_day":5,"stem_html":"<p>In what order is a SIPOC diagram normally built?</p>","options_html":["<p>Inputs first, because they are the x's</p>","<p>Customers first, then working backwards to suppliers</p>","<p>Suppliers first, then inputs, process, outputs and customers, left to right</p>","<p>Process steps and boundaries first, then outputs and customers, then inputs and suppliers</p>"],"explanation_html":"<p>Agreeing the first and last step and the five to seven high-level steps between them fixes the altitude of the diagram. Outputs and their customers follow, then the inputs each step needs and who supplies them (Day 5).</p>","distractor_html":["<p>Inputs are listed after the process steps that need them are known.</p>","<p>Customers are identified after the outputs, which come after the process.</p>","<p>Left to right is how it is read, not how it is built.</p>",null]},{"id":"M-2.1-003","phase":"Measure","section":"2.1","subtopic":"Process Mapping, SIPOC, Value Stream Map","type":"interpretation","difficulty":2,"check":true,"answer":2,"lesson_day":5,"stem_html":"<p>In a SIPOC for an invoicing process, the finance department receives a ledger entry each time an invoice is issued. In which column does the finance department appear?</p>","options_html":["<p>Suppliers</p>","<p>Inputs</p>","<p>Customers</p>","<p>Outputs</p>"],"explanation_html":"<p>Finance receives an output of the process, so it is a customer, in this case an internal one. The ledger entry itself is in the Outputs column. Suppliers provide inputs; here finance is receiving, not providing (Day 5).</p>","distractor_html":["<p>A supplier provides an input; finance is receiving an output here.</p>","<p>Inputs are things the process consumes, not departments that receive results.</p>",null,"<p>The ledger entry is the output; finance is the customer who receives it.</p>"]},{"id":"M-2.1-004","phase":"Measure","section":"2.1","subtopic":"Process Mapping, SIPOC, Value Stream Map","type":"concept","difficulty":2,"answer":1,"lesson_day":5,"stem_html":"<p>How detailed should the Process column of a SIPOC be?</p>","options_html":["<p>Every step, decision and rework loop</p>","<p>Five to seven high-level steps between the start and end boundaries</p>","<p>One step per team member</p>","<p>A single step describing the whole process</p>"],"explanation_html":"<p>SIPOC is deliberately high level. Five to seven steps show what the process is without drowning the team in detail. Decisions, loops and roles belong to the detailed process map drawn in Measure (Day 5).</p>","distractor_html":["<p>Decisions and loops belong to the detailed process map, not the SIPOC.</p>",null,"<p>Steps describe the work, not the people.</p>","<p>One step gives no view of where inputs enter or outputs leave.</p>"]},{"id":"M-2.1-005","phase":"Measure","section":"2.1","subtopic":"Process Mapping, SIPOC, Value Stream Map","type":"concept","difficulty":2,"answer":1,"lesson_day":5,"stem_html":"<p>Which of the following is a main purpose of building a SIPOC in the Define phase?</p>","options_html":["<p>To design the control plan</p>","<p>To get the team and the Champion agreeing on the same process, its boundaries, its inputs and every customer whose requirements matter</p>","<p>To calculate the process sigma level</p>","<p>To identify the root causes of variation</p>"],"explanation_html":"<p>SIPOC aligns everyone on what is being studied, shows where inputs and their suppliers sit (often where the x's live) and lists all customers so that no requirement is missed. It also frames the data collection plan (Day 5).</p>","distractor_html":["<p>The control plan is built in Control.</p>",null,"<p>Sigma level is computed from defect data in Measure.</p>","<p>Root causes are found in Analyse with data.</p>"]}],"glossary":[{"term":"Lean Six Sigma","definition":"A structured method for improving how work is done. It combines Lean (removing waste and delay) with Six Sigma (reducing variation and defects), and follows the DMAIC phases.","lesson_day":1,"aliases":["LSS"],"definition_html":"<p>A structured method for improving how work is done. It combines Lean (removing waste and delay) with Six Sigma (reducing variation and defects), and follows the DMAIC phases.</p>"},{"term":"process","definition":"A repeatable sequence of steps that turns inputs (information, materials, requests) into an output someone uses.","lesson_day":1,"definition_html":"<p>A repeatable sequence of steps that turns inputs (information, materials, requests) into an output someone uses.</p>"},{"term":"defect","definition":"Any output that fails a customer requirement. A single unit can have several defects. Compare defective: a unit with at least one defect.","lesson_day":1,"aliases":["defects"],"definition_html":"<p>Any output that fails a customer requirement. A single unit can have several defects. Compare defective: a unit with at least one defect.</p>"},{"term":"variation","definition":"The fact that repeated outputs of a process are not identical. Measured with the range or the standard deviation. Six Sigma exists to understand and reduce it.","lesson_day":1,"definition_html":"<p>The fact that repeated outputs of a process are not identical. Measured with the range or the standard deviation. Six Sigma exists to understand and reduce it.</p>"},{"term":"Six Sigma","definition":"A data-driven method for reducing variation and defects, created at Motorola in the 1980s. Named after the statistical symbol for standard deviation.","lesson_day":1,"definition_html":"<p>A data-driven method for reducing variation and defects, created at Motorola in the 1980s. Named after the statistical symbol for standard deviation.</p>"},{"term":"Lean","definition":"A method for removing waste and delay from a process so that value flows to the customer faster. Developed from the Toyota Production System.","lesson_day":1,"definition_html":"<p>A method for removing waste and delay from a process so that value flows to the customer faster. Developed from the Toyota Production System.</p>"},{"term":"DMAIC","definition":"The five phases of a Lean Six Sigma project: Define, Measure, Analyse, Improve, Control. Each ends with a tollgate review before the next begins.","lesson_day":1,"definition_html":"<p>The five phases of a Lean Six Sigma project: Define, Measure, Analyse, Improve, Control. Each ends with a tollgate review before the next begins.</p>"},{"term":"Y = f(x)","definition":"Read \"Y is a function of x.\" The result you care about (Y) is caused by the inputs and process factors (x). To change a result, find and change its causes.","lesson_day":1,"aliases":["Y is a function of x"],"definition_html":"<p>Read \"Y is a function of x.\" The result you care about (Y) is caused by the inputs and process factors (x). To change a result, find and change its causes.</p>"},{"term":"Green Belt","definition":"A person trained to lead smaller improvement projects in their own area, usually part-time alongside a normal job.","lesson_day":1,"definition_html":"<p>A person trained to lead smaller improvement projects in their own area, usually part-time alongside a normal job.</p>"},{"term":"Black Belt","definition":"A full-time improvement specialist who leads complex, cross-functional projects and mentors Green Belts.","lesson_day":1,"definition_html":"<p>A full-time improvement specialist who leads complex, cross-functional projects and mentors Green Belts.</p>"},{"term":"Master Black Belt","definition":"An expert who trains and coaches Black and Green Belts and manages the improvement programme across an organisation.","lesson_day":1,"aliases":["MBB"],"definition_html":"<p>An expert who trains and coaches Black and Green Belts and manages the improvement programme across an organisation.</p>"},{"term":"Champion","definition":"The senior manager who sponsors a project: owns the business problem, selects the project, removes obstacles and approves tollgates. Also called the sponsor.","lesson_day":1,"aliases":["sponsor","project sponsor"],"definition_html":"<p>The senior manager who sponsors a project: owns the business problem, selects the project, removes obstacles and approves tollgates. Also called the sponsor.</p>"},{"term":"Yellow Belt","definition":"Basic awareness level. Team members who help collect data and take part in improvement events.","lesson_day":1,"definition_html":"<p>Basic awareness level. Team members who help collect data and take part in improvement events.</p>"},{"term":"voice of the customer","definition":"What the people who receive a process output need, expect and complain about. The source of requirements and defect definitions.","lesson_day":1,"aliases":["VOC"],"definition_html":"<p>What the people who receive a process output need, expect and complain about. The source of requirements and defect definitions.</p>"},{"term":"voice of the business","definition":"What the organisation needs from a process: cost, margin, compliance, growth. Sets why a project is worth doing.","lesson_day":1,"aliases":["VOB"],"definition_html":"<p>What the organisation needs from a process: cost, margin, compliance, growth. Sets why a project is worth doing.</p>"},{"term":"voice of the employee","definition":"What the people doing the work know about frustrations, workarounds and obstacles. Often the quickest route to real causes.","lesson_day":1,"aliases":["VOE"],"definition_html":"<p>What the people doing the work know about frustrations, workarounds and obstacles. Often the quickest route to real causes.</p>"},{"term":"continuous improvement","definition":"The habit of treating every process as something that can always be made better, in small steps, using data. Lean and Six Sigma are both forms of it.","lesson_day":1,"aliases":["kaizen mindset"],"definition_html":"<p>The habit of treating every process as something that can always be made better, in small steps, using data. Lean and Six Sigma are both forms of it.</p>"},{"term":"sigma","definition":"The Greek letter σ, used in statistics for the standard deviation of a population. A \"sigma level\" describes how many standard deviations fit between the process average and the nearest customer limit.","lesson_day":1,"aliases":["σ"],"definition_html":"<p>The Greek letter σ, used in statistics for the standard deviation of a population. A \"sigma level\" describes how many standard deviations fit between the process average and the nearest customer limit.</p>"},{"term":"standard deviation","definition":"A number describing how spread out a set of values is. Small means the values sit close together; large means they are scattered. Calculated on Day 7.","lesson_day":1,"aliases":["SD"],"definition_html":"<p>A number describing how spread out a set of values is. Small means the values sit close together; large means they are scattered. Calculated on Day 7.</p>"},{"term":"deliverable","definition":"A concrete output a DMAIC phase must produce before its tollgate, such as a charter (Define) or a control plan (Control).","lesson_day":1,"aliases":["deliverables"],"definition_html":"<p>A concrete output a DMAIC phase must produce before its tollgate, such as a charter (Define) or a control plan (Control).</p>"},{"term":"tollgate","definition":"The review meeting at the end of each DMAIC phase where the sponsor checks the deliverables and approves moving to the next phase.","lesson_day":1,"aliases":["tollgate review","gate review"],"definition_html":"<p>The review meeting at the end of each DMAIC phase where the sponsor checks the deliverables and approves moving to the next phase.</p>"},{"term":"process owner","definition":"The manager responsible for a process day to day. Receives the improved process at the end of Control and keeps it running.","lesson_day":1,"definition_html":"<p>The manager responsible for a process day to day. Receives the improved process at the end of Control and keeps it running.</p>"},{"term":"output","definition":"What a process produces for its customer. The output measure is the Y in Y = f(x).","lesson_day":1,"definition_html":"<p>What a process produces for its customer. The output measure is the Y in Y = f(x).</p>"},{"term":"input","definition":"Anything a process consumes or acts on: materials, information, requests, people's time. Inputs are among the x's in Y = f(x).","lesson_day":1,"aliases":["inputs"],"definition_html":"<p>Anything a process consumes or acts on: materials, information, requests, people's time. Inputs are among the x's in Y = f(x).</p>"},{"term":"defective","definition":"A unit of output that has one or more defects. A unit with three defects is one defective.","lesson_day":1,"definition_html":"<p>A unit of output that has one or more defects. A unit with three defects is one defective.</p>"},{"term":"Cpk","definition":"A capability index that compares the distance from the process mean to the nearest specification limit with three standard deviations. Falls when the process is off-centre.","lesson_day":11,"aliases":["process capability index"],"definition_html":"<p>A capability index that compares the distance from the process mean to the nearest specification limit with three standard deviations. Falls when the process is off-centre.</p>"},{"term":"Cp","definition":"Potential capability: the specification width divided by six standard deviations. Ignores where the process is centred.","lesson_day":11,"definition_html":"<p>Potential capability: the specification width divided by six standard deviations. Ignores where the process is centred.</p>"},{"term":"specification limit","definition":"The customer's boundary for acceptable output. The upper specification limit (USL) and lower specification limit (LSL) define the tolerance.","lesson_day":11,"aliases":["spec limit","USL","LSL"],"definition_html":"<p>The customer's boundary for acceptable output. The upper specification limit (USL) and lower specification limit (LSL) define the tolerance.</p>"},{"term":"value","definition":"The parts of the work that change the product or service into something the customer wants and would pay for. Lean defines value from the customer's point of view, never the organisation's.","lesson_day":2,"definition_html":"<p>The parts of the work that change the product or service into something the customer wants and would pay for. Lean defines value from the customer's point of view, never the organisation's.</p>"},{"term":"value-added","definition":"An activity that the customer would pay for, that transforms the item or moves the service forward, and that is done right first time. All three tests must be met.","lesson_day":2,"aliases":["value added","VA"],"definition_html":"<p>An activity that the customer would pay for, that transforms the item or moves the service forward, and that is done right first time. All three tests must be met.</p>"},{"term":"non-value-added","definition":"Any activity that fails the value-added test. Some non-value-added work is still required (a legal check, a safety inspection); this is called business non-value-added and is minimised rather than removed.","lesson_day":2,"aliases":["non value added","NVA","business non-value-added"],"definition_html":"<p>Any activity that fails the value-added test. Some non-value-added work is still required (a legal check, a safety inspection); this is called business non-value-added and is minimised rather than removed.</p>"},{"term":"value stream","definition":"The full sequence of steps, across departments, that delivers a product or service to a customer. Mapping it shows where value is added and where waste sits.","lesson_day":2,"definition_html":"<p>The full sequence of steps, across departments, that delivers a product or service to a customer. Mapping it shows where value is added and where waste sits.</p>"},{"term":"flow","definition":"Arranging process steps so that an item moves through them without stopping, waiting or going backwards. The opposite of piling work up between steps.","lesson_day":2,"definition_html":"<p>Arranging process steps so that an item moves through them without stopping, waiting or going backwards. The opposite of piling work up between steps.</p>"},{"term":"pull","definition":"Doing work only when the next step, and ultimately the customer, asks for it, so that production matches actual demand. Just-in-time is pull in practice.","lesson_day":2,"aliases":["pull system"],"definition_html":"<p>Doing work only when the next step, and ultimately the customer, asks for it, so that production matches actual demand. Just-in-time is pull in practice.</p>"},{"term":"push","definition":"Producing to a forecast or schedule and sending work on whether or not the next step is ready. Push creates piles of inventory between steps.","lesson_day":2,"aliases":["push system"],"definition_html":"<p>Producing to a forecast or schedule and sending work on whether or not the next step is ready. Push creates piles of inventory between steps.</p>"},{"term":"waste","definition":"Any activity that consumes time, money or effort without adding value for the customer. The Japanese word is muda. Lean groups waste into seven kinds.","lesson_day":2,"aliases":["muda"],"definition_html":"<p>Any activity that consumes time, money or effort without adding value for the customer. The Japanese word is muda. Lean groups waste into seven kinds.</p>"},{"term":"Toyota Production System","definition":"The manufacturing approach developed at Toyota from the 1950s by Taiichi Ohno and Shigeo Shingo, built on just-in-time and jidoka. Lean is the Western name for it.","lesson_day":2,"aliases":["TPS"],"definition_html":"<p>The manufacturing approach developed at Toyota from the 1950s by Taiichi Ohno and Shigeo Shingo, built on just-in-time and jidoka. Lean is the Western name for it.</p>"},{"term":"just-in-time","definition":"Making and delivering only what is needed, when it is needed, in the amount needed. One of the two pillars of the Toyota Production System.","lesson_day":2,"aliases":["JIT","just in time"],"definition_html":"<p>Making and delivering only what is needed, when it is needed, in the amount needed. One of the two pillars of the Toyota Production System.</p>"},{"term":"jidoka","definition":"Building quality in by giving machines and people the ability to stop the process the moment a defect appears, so the problem is fixed at its source. The second pillar of the Toyota Production System, sometimes translated as automation with a human touch.","lesson_day":2,"aliases":["autonomation"],"definition_html":"<p>Building quality in by giving machines and people the ability to stop the process the moment a defect appears, so the problem is fixed at its source. The second pillar of the Toyota Production System, sometimes translated as automation with a human touch.</p>"},{"term":"kaizen","definition":"Continuous small improvements made by the people who do the work. A kaizen event is a short focused workshop, usually a few days, that improves one process area.","lesson_day":2,"aliases":["kaizen event"],"definition_html":"<p>Continuous small improvements made by the people who do the work. A kaizen event is a short focused workshop, usually a few days, that improves one process area.</p>"},{"term":"seven wastes","definition":"The seven kinds of waste identified by Taiichi Ohno: transport, inventory, motion, waiting, overproduction, over-processing and defects. Remembered with the mnemonic TIMWOOD.","lesson_day":2,"aliases":["TIMWOOD","7 wastes","seven elements of waste"],"definition_html":"<p>The seven kinds of waste identified by Taiichi Ohno: transport, inventory, motion, waiting, overproduction, over-processing and defects. Remembered with the mnemonic TIMWOOD.</p>"},{"term":"transport","definition":"The waste of moving the product, materials or documents between locations. It is movement of the thing being worked on; movement of people is motion.","lesson_day":2,"aliases":["transportation waste"],"definition_html":"<p>The waste of moving the product, materials or documents between locations. It is movement of the thing being worked on; movement of people is motion.</p>"},{"term":"inventory","definition":"The waste of anything held that is not being worked on right now: raw material, finished goods, work in process, or a backlog of unprocessed information such as unread emails.","lesson_day":2,"aliases":["inventory waste"],"definition_html":"<p>The waste of anything held that is not being worked on right now: raw material, finished goods, work in process, or a backlog of unprocessed information such as unread emails.</p>"},{"term":"motion","definition":"The waste of people moving without adding value: walking, reaching, searching, switching between screens. Movement of the item itself is transport.","lesson_day":2,"aliases":["motion waste"],"definition_html":"<p>The waste of people moving without adding value: walking, reaching, searching, switching between screens. Movement of the item itself is transport.</p>"},{"term":"waiting","definition":"The waste of idle time when an item or a person waits for the next step, an approval, a machine or information.","lesson_day":2,"aliases":["waiting waste"],"definition_html":"<p>The waste of idle time when an item or a person waits for the next step, an approval, a machine or information.</p>"},{"term":"overproduction","definition":"The waste of making more than is needed or making it earlier than needed. Ohno called it the worst waste because it creates the other six.","lesson_day":2,"definition_html":"<p>The waste of making more than is needed or making it earlier than needed. Ohno called it the worst waste because it creates the other six.</p>"},{"term":"over-processing","definition":"The waste of doing more work on an item than the customer requires: extra approvals, unnecessary precision, re-entering the same data, adding features nobody asked for.","lesson_day":2,"aliases":["overprocessing","extra processing"],"definition_html":"<p>The waste of doing more work on an item than the customer requires: extra approvals, unnecessary precision, re-entering the same data, adding features nobody asked for.</p>"},{"term":"5S","definition":"A Lean method for organising a workplace in five steps: Sort, Straighten, Shine, Standardise, Self-discipline. It makes waste visible and stops it recurring. Straighten is also called Set in Order and Self-discipline is also called Sustain.","lesson_day":2,"aliases":["five S","sort straighten shine standardise self-discipline"],"definition_html":"<p>A Lean method for organising a workplace in five steps: Sort, Straighten, Shine, Standardise, Self-discipline. It makes waste visible and stops it recurring. Straighten is also called Set in Order and Self-discipline is also called Sustain.</p>"},{"term":"work in process","definition":"Items that have entered a process but not yet left it: partly finished work waiting between steps. A form of inventory.","lesson_day":2,"aliases":["WIP","work in progress"],"definition_html":"<p>Items that have entered a process but not yet left it: partly finished work waiting between steps. A form of inventory.</p>"},{"term":"batch","definition":"A group of items collected and processed together at each step. Batching makes every item wait for the whole group; reducing batch size shortens lead time without extra cost.","lesson_day":2,"aliases":["batching","batch processing"],"definition_html":"<p>A group of items collected and processed together at each step. Batching makes every item wait for the whole group; reducing batch size shortens lead time without extra cost.</p>"},{"term":"visual management","definition":"Arranging the workplace so that anyone can see at a glance whether things are normal or abnormal: marked shelves, colour codes, boards showing status. 5S is its foundation.","lesson_day":2,"aliases":["visual control","visual controls"],"definition_html":"<p>Arranging the workplace so that anyone can see at a glance whether things are normal or abnormal: marked shelves, colour codes, boards showing status. 5S is its foundation.</p>"},{"term":"gemba","definition":"The actual place where the work happens. Going to gemba means observing a process first hand instead of reading about it in a report.","lesson_day":2,"aliases":["gemba walk"],"definition_html":"<p>The actual place where the work happens. Going to gemba means observing a process first hand instead of reading about it in a report.</p>"},{"term":"common cause variation","definition":"The ordinary, ever-present scatter built into a process from many small sources. It is predictable within a stable band and can only be reduced by changing the process itself.","lesson_day":3,"aliases":["common cause","natural variation"],"definition_html":"<p>The ordinary, ever-present scatter built into a process from many small sources. It is predictable within a stable band and can only be reduced by changing the process itself.</p>"},{"term":"special cause variation","definition":"Variation from something unusual that is not normally part of the process, such as a machine fault or an untrained operator. It shows up as an unexpected result or pattern and is removed by finding the specific cause.","lesson_day":3,"aliases":["special cause","assignable cause"],"definition_html":"<p>Variation from something unusual that is not normally part of the process, such as a machine fault or an untrained operator. It shows up as an unexpected result or pattern and is removed by finding the specific cause.</p>"},{"term":"unit","definition":"One item of process output: one invoice, one patient discharge, one pump. Defects per unit and yield are counted per unit.","lesson_day":3,"aliases":["units"],"definition_html":"<p>One item of process output: one invoice, one patient discharge, one pump. Defects per unit and yield are counted per unit.</p>"},{"term":"opportunity","definition":"One distinct, pre-defined chance for a unit to be wrong. An invoice with five fields that can be wrong has five opportunities. Total opportunities equals units multiplied by opportunities per unit.","lesson_day":3,"aliases":["opportunities","defect opportunity"],"definition_html":"<p>One distinct, pre-defined chance for a unit to be wrong. An invoice with five fields that can be wrong has five opportunities. Total opportunities equals units multiplied by opportunities per unit.</p>"},{"term":"DPU","definition":"Defects per unit: total defects divided by total units inspected. It can be greater than 1 because a unit may carry several defects.","lesson_day":3,"aliases":["defects per unit"],"definition_html":"<p>Defects per unit: total defects divided by total units inspected. It can be greater than 1 because a unit may carry several defects.</p>"},{"term":"DPO","definition":"Defects per opportunity: total defects divided by total opportunities (units × opportunities per unit). A proportion between 0 and 1.","lesson_day":3,"aliases":["defects per opportunity"],"definition_html":"<p>Defects per opportunity: total defects divided by total opportunities (units × opportunities per unit). A proportion between 0 and 1.</p>"},{"term":"DPMO","definition":"Defects per million opportunities: DPO multiplied by 1 000 000. The standard scale for comparing processes and the input to the sigma table.","lesson_day":3,"aliases":["defects per million opportunities"],"definition_html":"<p>Defects per million opportunities: DPO multiplied by 1 000 000. The standard scale for comparing processes and the input to the sigma table.</p>"},{"term":"yield","definition":"The proportion of units that come out right. First time yield excludes units that needed rework; final yield, measured after rework, hides the cost of fixing things.","lesson_day":3,"aliases":["final yield"],"definition_html":"<p>The proportion of units that come out right. First time yield excludes units that needed rework; final yield, measured after rework, hides the cost of fixing things.</p>"},{"term":"first time yield","definition":"For one process step, the number of units that pass without any rework or scrap divided by the number that entered. Units repaired and then passed do not count.","lesson_day":3,"aliases":["FTY","first pass yield","FPY"],"definition_html":"<p>For one process step, the number of units that pass without any rework or scrap divided by the number that entered. Units repaired and then passed do not count.</p>"},{"term":"rolled throughput yield","definition":"The first time yields of every step in a process multiplied together: the probability that a unit passes through the whole process without a single defect. Always lower than the worst single step.","lesson_day":3,"aliases":["RTY"],"definition_html":"<p>The first time yields of every step in a process multiplied together: the probability that a unit passes through the whole process without a single defect. Always lower than the worst single step.</p>"},{"term":"cycle time","definition":"The time a process takes to complete one unit, from when work starts on that unit to when it is finished.","lesson_day":3,"definition_html":"<p>The time a process takes to complete one unit, from when work starts on that unit to when it is finished.</p>"},{"term":"lead time","definition":"The total elapsed time from the customer's request to delivery, including all waiting. Lead time is what the customer feels; cycle time is what the process is doing.","lesson_day":3,"definition_html":"<p>The total elapsed time from the customer's request to delivery, including all waiting. Lead time is what the customer feels; cycle time is what the process is doing.</p>"},{"term":"sigma level","definition":"A single number describing how many defects a process makes, read from DPMO using the standard sigma table. Higher is better; 6 sigma is 3.4 DPMO with the 1.5-sigma shift included.","lesson_day":3,"aliases":["process sigma","sigma score","Z level"],"definition_html":"<p>A single number describing how many defects a process makes, read from DPMO using the standard sigma table. Higher is better; 6 sigma is 3.4 DPMO with the 1.5-sigma shift included.</p>"},{"term":"1.5-sigma shift","definition":"The convention, from Motorola, that a process measured over a short period drifts by about 1.5 standard deviations in the long run. The standard sigma table adds 1.5 to the value the normal distribution would give, so 3.4 DPMO is called 6 sigma rather than 4.5.","lesson_day":3,"aliases":["1.5 sigma shift","sigma shift"],"definition_html":"<p>The convention, from Motorola, that a process measured over a short period drifts by about 1.5 standard deviations in the long run. The standard sigma table adds 1.5 to the value the normal distribution would give, so 3.4 DPMO is called 6 sigma rather than 4.5.</p>"},{"term":"cost of poor quality","definition":"The total cost an organisation incurs because its output is not right first time. Sorted into four categories: internal failure, external failure, appraisal and prevention.","lesson_day":3,"aliases":["COPQ","cost of quality"],"definition_html":"<p>The total cost an organisation incurs because its output is not right first time. Sorted into four categories: internal failure, external failure, appraisal and prevention.</p>"},{"term":"internal failure cost","definition":"The cost of defects found before the output reaches the customer: scrap, rework, re-testing, downtime, sorting.","lesson_day":3,"aliases":["internal failure"],"definition_html":"<p>The cost of defects found before the output reaches the customer: scrap, rework, re-testing, downtime, sorting.</p>"},{"term":"external failure cost","definition":"The cost of defects found after delivery to the customer: warranty claims, returns, refunds, complaint handling, penalties, recalls and lost customers. The most expensive category per defect.","lesson_day":3,"aliases":["external failure"],"definition_html":"<p>The cost of defects found after delivery to the customer: warranty claims, returns, refunds, complaint handling, penalties, recalls and lost customers. The most expensive category per defect.</p>"},{"term":"appraisal cost","definition":"The cost of checking and inspecting to find defects: inspection, testing, audits, calibration, document review. Incurred whether or not defects are found.","lesson_day":3,"aliases":["appraisal"],"definition_html":"<p>The cost of checking and inspecting to find defects: inspection, testing, audits, calibration, document review. Incurred whether or not defects are found.</p>"},{"term":"prevention cost","definition":"The cost of stopping defects from happening: training, mistake-proofing, process design, supplier qualification. The cheapest way to spend a quality dollar.","lesson_day":3,"aliases":["prevention"],"definition_html":"<p>The cost of stopping defects from happening: training, mistake-proofing, process design, supplier qualification. The cheapest way to spend a quality dollar.</p>"},{"term":"hidden factory","definition":"The unofficial rework and checking that exists only to fix the output of the official process. Most of its cost never appears in the accounts.","lesson_day":3,"definition_html":"<p>The unofficial rework and checking that exists only to fix the output of the official process. Most of its cost never appears in the accounts.</p>"},{"term":"Pareto analysis","definition":"Ranking categories of a problem from largest to smallest to find the few that produce most of the effect. Based on the 80:20 rule and applied to quality by Joseph Juran.","lesson_day":3,"aliases":["Pareto principle"],"definition_html":"<p>Ranking categories of a problem from largest to smallest to find the few that produce most of the effect. Based on the 80:20 rule and applied to quality by Joseph Juran.</p>"},{"term":"80:20 rule","definition":"The observation that roughly 80% of an effect comes from roughly 20% of the causes. The split is rarely exactly 80:20; the point is that a few categories dominate.","lesson_day":3,"aliases":["80/20 rule","Pareto rule"],"definition_html":"<p>The observation that roughly 80% of an effect comes from roughly 20% of the causes. The split is rarely exactly 80:20; the point is that a few categories dominate.</p>"},{"term":"vital few","definition":"The small number of categories that produce most of a problem, as opposed to the trivial many (also called the useful many). Juran's terms.","lesson_day":3,"aliases":["trivial many","useful many"],"definition_html":"<p>The small number of categories that produce most of a problem, as opposed to the trivial many (also called the useful many). Juran's terms.</p>"},{"term":"Pareto chart","definition":"A bar chart of categories sorted from the largest count to the smallest, with a line showing the cumulative percentage. The tall bars on the left are the vital few.","lesson_day":3,"definition_html":"<p>A bar chart of categories sorted from the largest count to the smallest, with a line showing the cumulative percentage. The tall bars on the left are the vital few.</p>"},{"term":"rework","definition":"Work done to fix a defective unit so that it passes. An internal failure cost, and part of the hidden factory.","lesson_day":3,"definition_html":"<p>Work done to fix a defective unit so that it passes. An internal failure cost, and part of the hidden factory.</p>"},{"term":"scrap","definition":"Output that is thrown away because it cannot be fixed economically. An internal failure cost.","lesson_day":3,"definition_html":"<p>Output that is thrown away because it cannot be fixed economically. An internal failure cost.</p>"},{"term":"customer","definition":"Whoever receives the output of a process. Customers can be external (outside the organisation) or internal (the next process or department).","lesson_day":4,"definition_html":"<p>Whoever receives the output of a process. Customers can be external (outside the organisation) or internal (the next process or department).</p>"},{"term":"internal customer","definition":"A person or team inside the organisation that receives the output of a process. Payroll is the internal customer of the timesheet process. Internal customers have requirements and can receive defects.","lesson_day":4,"definition_html":"<p>A person or team inside the organisation that receives the output of a process. Payroll is the internal customer of the timesheet process. Internal customers have requirements and can receive defects.</p>"},{"term":"external customer","definition":"A person or organisation outside the business that pays for or uses its output.","lesson_day":4,"definition_html":"<p>A person or organisation outside the business that pays for or uses its output.</p>"},{"term":"requirement","definition":"Something the customer needs the output to be or do, whether stated or assumed. Requirements come from the customer, not from what the organisation finds convenient to promise.","lesson_day":4,"aliases":["customer requirement","requirements"],"definition_html":"<p>Something the customer needs the output to be or do, whether stated or assumed. Requirements come from the customer, not from what the organisation finds convenient to promise.</p>"},{"term":"critical to quality","definition":"A customer need translated into a measurable characteristic of the output, with a measure, a target and a specification limit. The CTQ is the project's Y.","lesson_day":4,"aliases":["CTQ","CTQs","critical to quality characteristic"],"definition_html":"<p>A customer need translated into a measurable characteristic of the output, with a measure, a target and a specification limit. The CTQ is the project's Y.</p>"},{"term":"CTQ tree","definition":"A three-level diagram that drills from a customer need to its drivers to measurable critical to quality characteristics.","lesson_day":4,"aliases":["critical to quality tree"],"definition_html":"<p>A three-level diagram that drills from a customer need to its drivers to measurable critical to quality characteristics.</p>"},{"term":"Kano model","definition":"A way of sorting customer needs into basic needs (expected, anger if missing), performance needs (more is better) and delighters (unexpected, pleasing). Developed by Noriaki Kano.","lesson_day":4,"aliases":["Kano","Kano analysis"],"definition_html":"<p>A way of sorting customer needs into basic needs (expected, anger if missing), performance needs (more is better) and delighters (unexpected, pleasing). Developed by Noriaki Kano.</p>"},{"term":"operational definition","definition":"A written description of exactly how a measure is taken (what counts, which clock, which record) so that two people measuring the same thing get the same answer.","lesson_day":4,"definition_html":"<p>A written description of exactly how a measure is taken (what counts, which clock, which record) so that two people measuring the same thing get the same answer.</p>"},{"term":"process boundary","definition":"The first step (the trigger) and the last step (the handover of the output) that define where a process starts and ends. Boundaries set the scope of a project.","lesson_day":4,"aliases":["process boundaries","boundaries"],"definition_html":"<p>The first step (the trigger) and the last step (the handover of the output) that define where a process starts and ends. Boundaries set the scope of a project.</p>"},{"term":"project charter","definition":"The one- or two-page document that authorises a project: business case, problem statement, goal statement, scope, team and timeline. Signed by the Champion, it is the main Define deliverable and is revisited at every tollgate.","lesson_day":4,"aliases":["charter"],"definition_html":"<p>The one- or two-page document that authorises a project: business case, problem statement, goal statement, scope, team and timeline. Signed by the Champion, it is the main Define deliverable and is revisited at every tollgate.</p>"},{"term":"problem statement","definition":"A short statement of what is wrong, where, since when, how much (a measured Y) and with what impact. It
