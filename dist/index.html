<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tollgate</title>
<meta name="description" content="Self-study for the IASSC Certified Lean Six Sigma Green Belt: lessons, practice questions, calculators and timed mocks.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
:root{--paper:#F6F1E8;--paper2:#ECE5D8;--ink:#1C1A17;--ink2:#655F57;--rule:#D8CFC0;--green:#1F6B45;--greenT:#DFEBE2;--amber:#9A5B0B;--amberT:#F3E3C6;--onGreen:#F6F1E8;--desk:#E4DDD0;--greenHover:#185637;--greenPress:#124229;
--sans:'IBM Plex Sans',system-ui,sans-serif;--mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;--serif:'Source Serif 4',Georgia,serif;--prose:var(--serif)}
:root[data-theme="dark"]{--paper:#1F1D1A;--paper2:#2A2723;--ink:#EDE7DB;--ink2:#A69F92;--rule:#3B3730;--green:#5AA97D;--greenT:#243C30;--amber:#D9A24A;--amberT:#3E3221;--onGreen:#141311;--desk:#141311;--greenHover:#6CB88E;--greenPress:#4E965F}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#1F1D1A;--paper2:#2A2723;--ink:#EDE7DB;--ink2:#A69F92;--rule:#3B3730;--green:#5AA97D;--greenT:#243C30;--amber:#D9A24A;--amberT:#3E3221;--onGreen:#141311;--desk:#141311;--greenHover:#6CB88E;--greenPress:#4E965F}}
:root[data-prose="sans"]{--prose:var(--sans)}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font:15px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
a{color:var(--green)}
button{font:500 15px var(--sans);cursor:pointer;border-radius:4px;height:44px;padding:0 16px;border:1px solid var(--rule);background:transparent;color:var(--ink);min-width:44px}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--green);outline-offset:2px}
button:disabled{opacity:.4;cursor:default}
button.primary{background:var(--green);color:var(--onGreen);border:0}
button.primary:hover{background:var(--greenHover)}button.primary:active{background:var(--greenPress)}
button.secondary:hover{border-color:var(--ink)}button.secondary:active{background:var(--paper2);border-color:var(--ink)}
button.ink{background:var(--ink);color:var(--paper);border:0}
button.warn{color:var(--amber);border-color:var(--amber)}button.warn:hover{background:var(--amberT)}button.warn.on{background:var(--amber);color:var(--paper)}
button.ghost{border:0;color:var(--ink2)}
button.sm{height:40px;font-size:14px}
input,select,textarea{font:16px var(--mono);height:44px;padding:0 12px;border:1px solid var(--rule);border-radius:4px;background:var(--paper);color:var(--ink);width:100%;min-width:0}
input.sans,select.sans{font-family:var(--sans);font-size:15px}
textarea{height:auto;min-height:120px;padding:12px;font:15px/1.5 var(--sans);resize:vertical}
input:focus,textarea:focus,select:focus{border-color:var(--green);outline:2px solid var(--greenT)}
.eyebrow{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink2)}
.mono{font-family:var(--mono)}.muted{color:var(--ink2)}.small{font-size:14px}.caption{font-size:13px;color:var(--ink2)}
.amber{color:var(--amber)}.green{color:var(--green)}
.card{border:1px solid var(--rule);border-radius:6px;padding:16px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.stack{display:flex;flex-direction:column;gap:12px}
h1,h2,h3{margin:0;font-weight:500}
h2.page{font-size:22px}
.hr{border-top:1px solid var(--rule)}
/* layout */
#app{min-height:100%;display:flex;flex-direction:column}
.shell{display:flex;min-height:100vh}
.sidebar{display:none}
.main{flex:1;min-width:0;padding:20px 20px 88px;display:flex;flex-direction:column;gap:24px;max-width:100%}
.tabbar{position:fixed;left:0;right:0;bottom:0;height:calc(56px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);display:flex;border-top:1px solid var(--rule);background:var(--paper);z-index:20}
.tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;color:var(--ink2);text-decoration:none;gap:2px}
.tabbar a.on{color:var(--green);font-weight:500}
@media (min-width:900px){
 .sidebar{display:flex;flex-direction:column;gap:2px;width:220px;flex-shrink:0;border-right:1px solid var(--rule);padding:24px 16px;font-size:14px;position:sticky;top:0;height:100vh}
 .sidebar .brand{font:500 17px var(--sans);padding:0 10px 20px}
 .sidebar a{padding:8px 10px;color:var(--ink2);text-decoration:none;border-radius:4px}
 .sidebar a.on{background:var(--paper2);color:var(--ink);font-weight:500}
 .sidebar .foot{margin-top:auto;padding:0 10px;font:13px/1.5 var(--mono);color:var(--ink2)}
 .main{padding:44px 56px;gap:32px;max-width:1180px}
 .tabbar{display:none}
 h2.page{font-size:26px}
 .card{padding:24px}
}
/* bars */
.bar{position:relative;height:6px;background:var(--paper2)}
.bar>i{display:block;height:100%;background:var(--green)}
.bar.low>i{background:var(--amber)}
.bar.pass::after{content:"";position:absolute;left:70%;top:-4px;height:14px;width:1px;background:var(--green)}
.bar.big{height:10px}.bar.big.pass::after{top:-5px;height:20px}
.bar.thin{height:4px}.bar.thin.pass::after{top:-3px;height:10px}
.passlabel{position:absolute;left:70%;top:14px;transform:translateX(-50%);font:11px var(--mono);color:var(--green)}
/* options */
.opt{min-height:48px;display:flex;align-items:center;gap:12px;padding:8px 12px;border:1px solid var(--rule);border-radius:4px;background:transparent;color:var(--ink);text-align:left;width:100%;font:400 15px/1.4 var(--sans);height:auto}
.opt .k{font:13px var(--mono);color:var(--ink2);flex-shrink:0}
.opt.sel{border-color:var(--ink);background:var(--paper2)}
.opt.right{border-color:var(--green);background:var(--greenT)}
.opt.wrong{border-color:var(--amber);background:var(--amberT)}
.opt.dim{color:var(--ink2)}
.opt p{margin:0}
/* tables in content */
.prose table,table.data{border-collapse:collapse;width:100%;font:14px/1.5 var(--mono)}
.prose th,table.data th{text-align:left;padding:6px 8px;font-weight:500;border-bottom:1px solid var(--ink)}
.prose td,table.data td{padding:6px 8px;border-bottom:1px solid var(--rule)}
.prose tr:last-child td,table.data tr:last-child td{border-bottom:0}
.prose td.num,.prose th.num{text-align:right}
@media (max-width:480px){.prose table,table.data{font-size:13px}.prose td,.prose th,table.data td,table.data th{padding:5px 6px}}
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
/* prose */
.prose{font:18px/1.6 var(--prose);max-width:680px}
.prose p{margin:0 0 1em}.prose p:last-child{margin-bottom:0}
.prose ul,.prose ol{margin:0 0 1em;padding-left:22px}.prose li{margin-bottom:.35em}
.prose h3{font:600 20px/1.3 var(--prose);margin:1.2em 0 .5em}.prose h3:first-child{margin-top:0}
.prose h4{font:500 16px var(--sans);margin:1em 0 .4em}
.prose code{font:14px var(--mono);background:var(--paper2);padding:1px 5px;border-radius:3px}
.prose pre{font:13px/1.6 var(--mono);background:var(--paper2);padding:12px 14px;border-radius:6px;overflow-x:auto;margin:0 0 1em}
.prose pre code{background:none;padding:0;font-size:13px}
.prose strong{font-weight:600}
.prose table{font-size:14px}
.prose.small{font-size:17px}
.term{border-bottom:1px dotted var(--green);color:var(--green);cursor:pointer}
.termpop{border:1px solid var(--rule);border-radius:6px;padding:12px 14px;background:var(--paper2);display:flex;flex-direction:column;gap:4px;font:14px/1.45 var(--sans);margin:8px 0}
.lesson{display:flex;flex-direction:column;gap:28px}
.block{display:flex;flex-direction:column;gap:10px}
@media (min-width:900px){.lesson{gap:36px;max-width:900px}.block{display:grid;grid-template-columns:180px 1fr;gap:24px}.block>.eyebrow{padding-top:8px}.lesson .prose{max-width:680px}}
.formula{border:1px solid var(--rule);border-radius:6px;padding:14px 16px;font:14px/1.8 var(--mono)}
.formula p{margin:0}.formula ul{margin:0;padding-left:18px}.formula table{font-size:14px}.formula code{background:none;padding:0;font-size:14px}
.steps details{border-bottom:1px solid var(--rule);padding:12px 0}.steps details:first-of-type{border-top:1px solid var(--rule)}
.steps summary{cursor:pointer;font-weight:500;list-style:none;display:flex;justify-content:space-between;align-items:center}
.steps summary::-webkit-details-marker{display:none}
.steps summary::after{content:"+";color:var(--ink2)}.steps details[open] summary::after{content:"−"}
.steps .body{padding-top:10px}
/* nav grid */
.navgrid{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.navgrid button{height:28px;min-width:0;padding:0;font:11px var(--mono);border-radius:2px;border:1px solid var(--rule);color:var(--ink2);background:transparent}
.navgrid button.ans{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.navgrid button.flag{border:2px solid var(--amber)}
.navgrid button.cur{border:2px solid var(--green)}
@media (min-width:900px){.navgrid{grid-template-columns:repeat(20,1fr);gap:6px}.navgrid button{height:36px;font-size:13px;border-radius:3px}}
/* exam */
.exam{position:fixed;inset:0;background:var(--paper);display:flex;flex-direction:column;z-index:30}
.exam .top{padding:14px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--rule)}
.exam .pace{padding:8px 20px;display:flex;justify-content:space-between;font-size:12px;color:var(--ink2);border-bottom:1px solid var(--rule)}
.exam .body{flex:1;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:16px}
.exam .body .stem{font-size:16px;line-height:1.5}
.exam .tools{display:flex;justify-content:space-between;padding:0 20px;border-top:1px solid var(--rule)}
.exam .tools button{border:0;height:40px;font-size:13px;color:var(--ink2);padding:0 8px}
.exam .foot{display:grid;grid-template-columns:1fr 1fr 1fr;height:calc(56px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);border-top:1px solid var(--rule)}
.exam .foot button{border:0;border-radius:0;height:100%;border-right:1px solid var(--rule)}.exam .foot button:last-child{border-right:0;font-weight:500}
.timer{font:500 20px var(--mono)}.timer.pressure{color:var(--amber)}
@media (min-width:900px){
 .exam .top{padding:16px 48px;display:grid;grid-template-columns:1fr auto 1fr}.timer{font-size:32px}
 .exam .pace{display:none}
 .exam .mid{flex:1;display:grid;grid-template-columns:1fr 320px;overflow:hidden}
 .exam .body{padding:40px 48px;gap:24px;max-width:840px}.exam .body .stem{font-size:18px;line-height:1.55}
 .exam .side{border-left:1px solid var(--rule);padding:32px 24px;display:flex;flex-direction:column;gap:20px;font-size:14px;overflow:auto}
 .exam .tools{display:none}
 .exam .foot{display:flex;justify-content:space-between;align-items:center;padding:12px 48px;height:auto}
 .exam .foot button{border:1px solid var(--rule);border-radius:4px;height:44px;padding:0 20px}
 .exam .foot button.warn{border-color:var(--amber)}.exam .foot button.ink{border:0}
}
@media (max-width:899px){.exam .side{display:none}.exam .mid{flex:1;display:flex;flex-direction:column;overflow:hidden}}
/* sheets */
.sheet-bg{position:fixed;inset:0;background:var(--ink);opacity:.4;z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:88vh;background:var(--paper);border-top:1px solid var(--rule);border-radius:12px 12px 0 0;z-index:41;display:flex;flex-direction:column;overflow:hidden}
.sheet .head{padding:14px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--rule);font-weight:500}
.sheet .head button{border:0;color:var(--ink2);height:36px}
.sheet .tabs{display:flex;border-bottom:1px solid var(--rule);font-size:14px}
.sheet .tabs button{flex:1;border:0;border-radius:0;color:var(--ink2);height:44px}.sheet .tabs button.on{color:var(--ink);font-weight:500;border-bottom:2px solid var(--green)}
.sheet .content{flex:1;overflow:auto;padding:16px 20px;display:flex;flex-direction:column;gap:12px}
@media (min-width:900px){.sheet{left:auto;top:0;width:560px;max-height:none;border-radius:0;border-top:0;border-left:1px solid var(--rule)}.sheet .head{padding:20px 32px;font-size:20px}.sheet .content{padding:24px 32px}}
.ref{font:13px/1.7 var(--mono);display:flex;flex-direction:column;gap:12px}.ref .g{display:flex;flex-direction:column}.ref .g span:first-child{color:var(--ink2)}
/* calculator */
.calc{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.calc button{height:48px;font:16px var(--mono);min-width:0;padding:0}
.calc button.op{background:var(--paper2)}.calc button.eq{background:var(--green);color:var(--onGreen);border:0}
.calc .disp{grid-column:1/-1;font:500 28px var(--mono);text-align:right;padding:8px 12px;border:1px solid var(--rule);border-radius:4px;min-height:52px;word-break:break-all}
.calc .expr{grid-column:1/-1;font:13px var(--mono);color:var(--ink2);text-align:right;min-height:18px}
/* misc */
.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:4px;font-size:14px;z-index:60}
.pill{font:13px var(--mono);border:1px solid var(--rule);border-radius:3px;padding:2px 6px;color:var(--ink2)}
.seg{display:flex;gap:8px}.seg button{flex:1;font:500 14px var(--mono);min-width:0;padding:0}.seg button.on{border-color:var(--ink);background:var(--paper2)}
.list{display:flex;flex-direction:column;border-top:1px solid var(--rule)}
.list>*{display:flex;justify-content:space-between;align-items:center;min-height:48px;border-bottom:1px solid var(--rule);text-decoration:none;color:var(--ink);font-size:14px;gap:12px;padding:6px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:1fr;gap:24px}
@media (min-width:900px){.grid3{grid-template-columns:repeat(3,1fr)}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:32px}}
.big{font:500 32px/1.1 var(--mono)}.huge{font:500 64px/1 var(--mono)}
@media (min-width:900px){.huge{font-size:96px}.big{font-size:40px}}
.heat{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.heat div{height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:3px;background:var(--greenT);color:var(--green);font:500 14px var(--mono);cursor:pointer}
.heat div.low{background:var(--amberT);color:var(--amber)}.heat div.none{background:var(--paper2);color:var(--ink2)}
.heat div small{font-size:10px;font-weight:400}
@media (min-width:900px){.heat{grid-template-columns:repeat(17,1fr)}.heat div{height:64px}}
.dot{width:8px;height:8px;border-radius:50%;border:1px solid var(--rule);flex-shrink:0}.dot.done{background:var(--green);border-color:var(--green)}.dot.prog{background:var(--amber);border-color:var(--amber)}
.dayrow{display:grid;grid-template-columns:10px 26px 1fr auto;gap:10px;align-items:center;min-height:40px;font-size:14px;text-decoration:none;color:var(--ink)}
.dayrow .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.feedback{font-size:14px;margin:0}
.checkq{display:flex;flex-direction:column;gap:10px}
.checkq .q{font:17px/1.5 var(--prose);margin:0}
.checkq .opts{display:flex;flex-direction:column;gap:6px}
@media (min-width:900px){.checkq .opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}}
.expl{font-size:14px;color:var(--ink)}
.expl p{margin:0}
.wrap{display:flex;flex-wrap:wrap;gap:8px}
.kbd{font:12px var(--mono);border:1px solid var(--rule);border-radius:3px;padding:0 5px;color:var(--ink2)}
.center{text-align:center}
@media print{.sidebar,.tabbar,button{display:none !important}.main{padding:0}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const DATA = {"bok":{"source":"https://iassc.org/body-of-knowledge/green-belt-body-of-knowledge/","phases":[{"key":"Define","code":"D","sections":[{"id":"1.1","title":"The Basics of Six Sigma","subtopics":["Meanings of Six Sigma","General History of Six Sigma & Continuous Improvement","Deliverables of a Lean Six Sigma Project","The Problem Solving Strategy Y = f(x)","Voice of the Customer, Business and Employee","Six Sigma Roles & Responsibilities"]},{"id":"1.2","title":"The Fundamentals of Six Sigma","subtopics":["Defining a Process","Critical to Quality Characteristics (CTQ's)","Cost of Poor Quality (COPQ)","Pareto Analysis (80:20 rule)","Basic Six Sigma Metrics (DPU, DPMO, FTY, RTY, Cycle Time)"]},{"id":"1.3","title":"Selecting Lean Six Sigma Projects","subtopics":["Building a Business Case & Project Charter","Developing Project Metrics","Financial Evaluation & Benefits Capture"]},{"id":"1.4","title":"The Lean Enterprise","subtopics":["Understanding Lean","The History of Lean","Lean & Six Sigma","The Seven Elements of Waste","5S (Sort, Straighten, Shine, Standardize, Self-Discipline)"]}]},{"key":"Measure","code":"M","sections":[{"id":"2.1","title":"Process Definition","subtopics":["Cause & Effect / Fishbone Diagrams","Process Mapping, SIPOC, Value Stream Map","X-Y Diagram","Failure Modes & Effects Analysis (FMEA)"]},{"id":"2.2","title":"Six Sigma Statistics","subtopics":["Basic Statistics","Descriptive Statistics","Normal Distributions & Normality","Graphical Analysis"]},{"id":"2.3","title":"Measurement System Analysis","subtopics":["Precision & Accuracy","Bias, Linearity & Stability","Gage Repeatability & Reproducibility","Variable & Attribute MSA"]},{"id":"2.4","title":"Process Capability","subtopics":["Capability Analysis","Concept of Stability","Attribute & Discrete Capability","Monitoring Techniques"]}]},{"key":"Analyse","code":"A","sections":[{"id":"3.1","title":"Patterns of Variation","subtopics":["Multi-Vari Analysis","Classes of Distributions"]},{"id":"3.2","title":"Inferential Statistics","subtopics":["Understanding Inference","Sampling Techniques & Uses","Central Limit Theorem"]},{"id":"3.3","title":"Hypothesis Testing","subtopics":["General Concepts & Goals of Hypothesis Testing","Significance; Practical vs. Statistical","Risk; Alpha & Beta","Types of Hypothesis Test"]},{"id":"3.4","title":"Hypothesis Testing with Normal Data","subtopics":["1 & 2 sample t-tests","1 sample variance","One Way ANOVA"]},{"id":"3.5","title":"Hypothesis Testing with Non-Normal Data","subtopics":["Mann-Whitney","Kruskal-Wallis","Mood's Median","Friedman","1 Sample Sign","1 Sample Wilcoxon","One and Two Sample Proportion","Chi-Squared (Contingency Tables)"]}]},{"key":"Improve","code":"I","sections":[{"id":"4.1","title":"Simple Linear Regression","subtopics":["Correlation","Regression Equations","Residuals Analysis"]},{"id":"4.2","title":"Multiple Regression Analysis","subtopics":["Non-Linear Regression","Multiple Linear Regression","Confidence & Prediction Intervals","Residuals Analysis","Data Transformation, Box Cox"]}]},{"key":"Control","code":"C","sections":[{"id":"5.1","title":"Lean Controls","subtopics":["Control Methods for 5S","Kanban","Poka-Yoke (Mistake Proofing)"]},{"id":"5.2","title":"Statistical Process Control (SPC)","subtopics":["Data Collection for SPC","I-MR Chart","Xbar-R Chart","U Chart","P Chart","NP Chart","Xbar-S Chart","CuSum Chart","EWMA Chart","Control Methods"]},{"id":"5.3","title":"Six Sigma Control Plans","subtopics":["Cost Benefit Analysis","Elements of the Control Plan","Elements of the Response Plan"]}]}],"schedule":[{"day":1,"week":1,"kind":"lesson","phase":"Define","title":"What Lean Six Sigma Is","sections":["1.1"]},{"day":2,"week":1,"kind":"lesson","phase":"Define","title":"Lean and the Seven Wastes","sections":["1.4"]},{"day":3,"week":1,"kind":"lesson","phase":"Define","title":"Variation, Metrics and the Cost of Poor Quality","sections":["1.2"]},{"day":4,"week":1,"kind":"lesson","phase":"Define","title":"Customers, CTQs and the Project Charter","sections":["1.1","1.2","1.3"]},{"day":5,"week":1,"kind":"lesson","phase":"Define","title":"SIPOC, Project Metrics and Benefits","sections":["1.2","1.3","2.1"]},{"day":6,"week":2,"kind":"lesson","phase":"Measure","title":"Data Types and Sampling","sections":["2.2","3.2"]},{"day":7,"week":2,"kind":"lesson","phase":"Measure","title":"Describing Data with Numbers and Pictures","sections":["2.2"]},{"day":8,"week":2,"kind":"lesson","phase":"Measure","title":"The Normal Distribution and Z-Scores","sections":["2.2"]},{"day":9,"week":2,"kind":"lesson","phase":"Measure","title":"Process Maps and Value Stream Maps","sections":["2.1"]},{"day":10,"week":2,"kind":"lesson","phase":"Measure","title":"Can You Trust Your Measurements? (MSA)","sections":["2.3"]},{"day":11,"week":3,"kind":"lesson","phase":"Measure","title":"Process Capability","sections":["2.4"]},{"day":12,"week":3,"kind":"lesson","phase":"Measure","title":"Capability Practice and Sigma Level","sections":["2.4","1.2"]},{"day":13,"week":3,"kind":"lesson","phase":"Analyse","title":"Finding Causes: Fishbone, X-Y Diagram and FMEA","sections":["2.1"]},{"day":14,"week":3,"kind":"lesson","phase":"Analyse","title":"Inference and Hypothesis Testing Concepts","sections":["3.2","3.3"]},{"day":15,"week":3,"kind":"mock","phase":"Analyse","title":"Mid-Point Mock (50 Questions)","mock":50},{"day":16,"week":4,"kind":"lesson","phase":"Analyse","title":"t-Tests and the 1-Sample Variance Test","sections":["3.4"]},{"day":17,"week":4,"kind":"lesson","phase":"Analyse","title":"One-Way ANOVA","sections":["3.4"]},{"day":18,"week":4,"kind":"lesson","phase":"Analyse","title":"Proportions and Chi-Square","sections":["3.5"]},{"day":19,"week":4,"kind":"lesson","phase":"Analyse","title":"Tests for Non-Normal Data","sections":["3.5"]},{"day":20,"week":4,"kind":"lesson","phase":"Analyse","title":"Multi-Vari and Classes of Distributions","sections":["3.1"]},{"day":21,"week":5,"kind":"lesson","phase":"Improve","title":"Correlation and Simple Linear Regression","sections":["4.1"]},{"day":22,"week":5,"kind":"lesson","phase":"Improve","title":"Multiple Regression, Intervals and Box-Cox","sections":["4.2"]},{"day":23,"week":5,"kind":"lesson","phase":"Control","title":"Lean Controls: 5S, Kanban and Poka-Yoke","sections":["5.1"]},{"day":24,"week":5,"kind":"lesson","phase":"Control","title":"Statistical Process Control","sections":["5.2"]},{"day":25,"week":5,"kind":"lesson","phase":"Control","title":"Control Plans, Response Plans and Cost-Benefit","sections":["5.3"]},{"day":26,"week":6,"kind":"mock","phase":"Exam","title":"Full Mock 1 (100 Questions)","mock":100},{"day":27,"week":6,"kind":"review","phase":"Exam","title":"Weak-Section Review"},{"day":28,"week":6,"kind":"mock","phase":"Exam","title":"Full Mock 2 (100 Questions)","mock":100},{"day":29,"week":6,"kind":"review","phase":"Exam","title":"Revisit Queue Final Review"},{"day":30,"week":6,"kind":"exam","phase":"Exam","title":"Exam Day"}]},"lessons":[{"day":1,"week":1,"phase":"Define","title":"What Lean Six Sigma Is","minutes":50,"sections":["1.1"],"objectives":["Say in one sentence what Lean Six Sigma is for and where it came from","Explain the idea Y = f(x) and use it to separate a result from its causes","Name the five DMAIC phases in order and say what each one produces","Describe the belt roles and who does what on a project","Tell the difference between the voice of the customer, the business and the employee"],"terms":["Lean Six Sigma","process","defect","variation","Six Sigma","Lean","DMAIC","Y = f(x)","Green Belt","Black Belt","Master Black Belt","Champion","Yellow Belt","voice of the customer","voice of the business","voice of the employee","continuous improvement","sigma","standard deviation","deliverable"],"check":["D-1.1-001","D-1.1-002","D-1.1-003","D-1.1-004","D-1.1-005"],"html":{"The Idea":"<h3>A method for fixing work that keeps going wrong</h3>\n<p>Every organisation has work that keeps producing the wrong result. Paperwork that comes back incomplete. Deliveries that are late one week and early the next. Reports that need three rounds of correction. Most people respond by trying harder, adding a checklist, or blaming whoever touched it last. The result rarely changes for long.</p>\n<p><strong>Lean Six Sigma</strong> is a structured way of fixing that kind of problem. It treats the work as a <strong>process</strong>: a repeatable sequence of steps that turns inputs (information, materials, requests) into an output that somebody uses. If the output is wrong too often, the method says the cause is somewhere in the steps or the inputs, and it gives you tools to find that cause with evidence rather than opinion, fix it, and keep it fixed.</p>\n<p>Two words in the name point to its two halves.</p>\n<p><strong>Lean</strong> is about speed and waste. It comes from the Toyota Production System developed in Japan after the Second World War, where engineers such as Taiichi Ohno worked out how to make cars with far less inventory, space and rework than American factories used. Lean asks: which steps actually add value for the customer, and how do we remove the rest?</p>\n<p><strong>Six Sigma</strong> is about consistency and defects. It was created at Motorola in the 1980s by an engineer named Bill Smith, then made famous by General Electric under Jack Welch in the 1990s. Six Sigma asks: how much does our output vary from what the customer wants, and what is causing that variation?</p>\n<p>The two were combined in the early 2000s because they answer different questions about the same process. A fast process that produces errors is no good; a perfect process that takes three weeks is no good either. <strong>Continuous improvement</strong> is the broader habit both belong to: treating every process as something that can always be made better, in small steps, using data.</p>\n<h3>Where the name comes from</h3>\n<p><strong>Sigma</strong> (the Greek letter σ) is the symbol statisticians use for <strong>standard deviation</strong>, which is a number that describes how spread out a set of values is. A small standard deviation means the values sit close together; a large one means they are scattered. You will learn to calculate it in Week 2. For now, treat it as \"how much the output wanders.\"</p>\n<p>A process that runs at \"six sigma\" is one where the customer's limits sit six standard deviations away from the process average on each side. That is an extremely consistent process: about 3.4 <strong>defects</strong> per million opportunities, where a defect is any output that fails a customer requirement. Almost nobody actually needs six-sigma performance on every process. The name stuck as a label for the method, not a target every project must hit.</p>\n<h3>Y = f(x): results are caused upstream</h3>\n<p>The single most useful idea in the whole method is written <strong>Y = f(x)</strong>, read aloud as \"Y is a function of x.\"</p>\n<ul>\n<li><strong>Y</strong> is the result you care about: the output measure. Late deliveries per month. Errors per hundred forms. Minutes to answer a call.</li>\n<li><strong>x</strong> stands for the inputs and process factors that drive that result: the causes. Which supplier was used. Whether the form was filled in on screen or by hand. How many people were rostered.</li>\n<li><strong>f( )</strong> just means \"depends on.\"</li>\n</ul>\n<p>The message is that you cannot fix Y by staring at Y. If late deliveries are your problem, counting late deliveries more carefully changes nothing. You have to find the x's that produce lateness and change those. Every tool in this course is a way of either measuring Y honestly or finding and proving which x's matter.</p>\n<p>Y is also called the <strong>output</strong>, the <strong>dependent variable</strong>, or the <strong>CTQ</strong> (critical to quality, covered on Day 4). The x's are called <strong>inputs</strong>, <strong>factors</strong>, or <strong>independent variables</strong>. The exam uses all of these names interchangeably.</p>\n<h3>DMAIC: five phases, one story</h3>\n<p>Lean Six Sigma projects follow a fixed sequence called <strong>DMAIC</strong> (pronounced \"duh-may-ick\"). Each letter is a phase, and each phase has to be finished before the next begins. The end of each phase is a review meeting called a <strong>tollgate</strong>, where the sponsor checks the work and approves moving on. That is where this app gets its name.</p>\n<table>\n<thead>\n<tr>\n<th>Phase</th>\n<th>Question it answers</th>\n<th>Main deliverables</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Define</strong></td>\n<td>What is the problem, for whom, and what will \"fixed\" look like?</td>\n<td>Project charter, problem statement, customer requirements, high-level process map</td>\n</tr>\n<tr>\n<td><strong>Measure</strong></td>\n<td>How bad is it now, measured honestly?</td>\n<td>Data collection plan, checked measurement system, baseline performance</td>\n</tr>\n<tr>\n<td><strong>Analyse</strong></td>\n<td>What is actually causing it?</td>\n<td>List of causes tested with data; the vital few x's confirmed</td>\n</tr>\n<tr>\n<td><strong>Improve</strong></td>\n<td>What change removes the cause, and does it work?</td>\n<td>Solution chosen, piloted and shown to move Y</td>\n</tr>\n<tr>\n<td><strong>Control</strong></td>\n<td>How do we make sure it stays fixed?</td>\n<td>Control plan, monitoring charts, updated procedures, handover to the process owner</td>\n</tr>\n</tbody>\n</table>\n<p>A <strong>deliverable</strong> is a concrete output a phase must produce before its tollgate. Exam questions often describe a deliverable and ask which phase it belongs to, so learn the right-hand column.</p>\n<h3>Who does what: the belts</h3>\n<p>Six Sigma borrowed the martial-arts belt idea to name roles. The colours describe training and responsibility, not seniority in the company.</p>\n<ul>\n<li><strong>Champion</strong> (also called the sponsor): a senior manager who owns the business problem, picks the project, removes obstacles and attends tollgates. Does not run the analysis.</li>\n<li><strong>Master Black Belt</strong>: a full-time expert who trains and coaches Black and Green Belts and looks after the improvement programme across the organisation.</li>\n<li><strong>Black Belt</strong>: usually full-time on improvement. Leads complex, cross-department projects and mentors Green Belts.</li>\n<li><strong>Green Belt</strong>: a person with a normal job who has been trained to lead smaller projects in their own area, typically part-time. This is the level this course prepares you for.</li>\n<li><strong>Yellow Belt</strong> (and White Belt in some schemes): basic awareness. Team members who help collect data and take part in improvement events.</li>\n<li><strong>Process owner</strong>: the manager responsible for the process day to day. Receives the improved process at the end of Control and keeps it running.</li>\n</ul>\n<h3>Three voices</h3>\n<p>A project has to satisfy three groups, and the method gives each a name.</p>\n<ul>\n<li><strong>Voice of the customer (VOC)</strong>: what the people who receive the output need and complain about. Gathered from complaints, surveys, interviews and observation. This is where requirements come from.</li>\n<li><strong>Voice of the business (VOB)</strong>: what the organisation needs, such as cost, margin, compliance and growth. Sets the reason the project is worth doing.</li>\n<li><strong>Voice of the employee (VOE)</strong>: what the people doing the work know about frustrations, workarounds and obstacles. Often the fastest route to the real causes.</li>\n</ul>\n<p>When a question asks where a project's requirements or defect definitions should come from, the answer is the voice of the customer. When it asks why the business is funding the project, the answer is the voice of the business.</p>","Worked Example":"<p>A regional courier receives complaints that parcels arrive late. Follow how a Green Belt would frame this before touching any data.</p>\n<ol>\n<li><strong>Name the process and its output.</strong> The process is \"deliver a parcel from depot to customer.\" The output measure (Y) is the percentage of parcels delivered after the promised time. Last month: 1 480 of 12 300 parcels were late, which is 12.0%.</li>\n<li><strong>Separate Y from the x's.</strong> Brainstormed causes (x's): driver route order, parcels sorted to the wrong van, address errors on the label, van breakdowns, traffic on two particular routes, and parcels arriving at the depot after the morning cut-off. None of these is proven yet; they are candidates.</li>\n<li><strong>Check which voice each fact comes from.</strong> \"Late means after the time we promised on the tracking page\" is the voice of the customer. \"Each late parcel costs about $9 in re-delivery and refunds, so 1 480 late parcels cost about $13 300 a month\" is the voice of the business. \"The sort screen freezes twice a shift, so we guess the van\" is the voice of the employee, and it points to a likely x.</li>\n<li><strong>Place the work in DMAIC.</strong> Everything above is Define: naming the problem and its output measure. Measure would confirm the 12.0% with a reliable count and break it down by route and day. Analyse would test whether, say, late depot arrivals really do produce late deliveries. Improve would trial a fix for the confirmed cause. Control would keep the late rate on a chart so it does not creep back.</li>\n<li><strong>Assign roles.</strong> The operations manager is the Champion. The depot supervisor is the process owner. You, as Green Belt, lead the project part-time with two drivers and a sorter as team members.</li>\n</ol>\n<p>Nothing has been fixed yet, and that is the point. Rushing to a solution before Define and Measure is the most common way projects fail.</p>","Formula Card":"<ul>\n<li><code>Y = f(x)</code> — the result Y depends on the input and process factors x. Fix x's to change Y.</li>\n<li><code>Defect</code> — any output that fails a customer requirement. <code>Defective</code> — a unit with one or more defects.</li>\n<li><code>Six sigma performance ≈ 3.4 defects per million opportunities</code> (with the standard 1.5-sigma shift, covered on Day 3).</li>\n<li>DMAIC order: Define → Measure → Analyse → Improve → Control.</li>\n</ul>","Exam Traps":"<ul>\n<li>Lean is about waste and speed; Six Sigma is about variation and defects. Questions swap them.</li>\n<li>Six Sigma originated at Motorola (Bill Smith), not General Electric. GE made it famous.</li>\n<li>Lean originated at Toyota (Taiichi Ohno and colleagues), not in the United States.</li>\n<li>The Champion sponsors and removes obstacles; the Black Belt leads complex projects; the Green Belt leads smaller projects part-time. Do not give the Champion analysis tasks.</li>\n<li>Requirements and defect definitions come from the voice of the customer, not the voice of the business.</li>\n<li>A deliverable belongs to the phase that produces it. Charter is Define; baseline is Measure; confirmed causes is Analyse; piloted solution is Improve; control plan is Control.</li>\n<li>\"Six sigma\" describes a level of performance (3.4 defects per million opportunities). It is not the number of phases, tools or belts.</li>\n</ul>","Applied Task":"<p>List three processes in your own workplace that produce a result people complain about. For each, write one line naming the process, one line naming its output measure Y as something you could count or time, and three candidate x's. Mark which of the three voices (customer, business, employee) each complaint came from. Paste the list to your coach.</p>"}}],"questions":[{"id":"D-1.1-001","phase":"Define","section":"1.1","subtopic":"Meanings of Six Sigma","type":"concept","difficulty":1,"check":true,"answer":1,"lesson_day":1,"stem_html":"<p>A process is described as performing at a six sigma level. What does this tell you?</p>","options_html":["<p>It has six process steps between input and output</p>","<p>Its customer limits sit six standard deviations from the process average, about 3.4 defects per million opportunities</p>","<p>It has passed six DMAIC tollgate reviews</p>","<p>Six people have been trained as belts on the project</p>"],"explanation_html":"<p>Sigma is the symbol for standard deviation. A six sigma process has six standard deviations between its average and the nearest customer limit, which corresponds to about 3.4 defects per million opportunities. It describes performance, not structure (Day 1).</p>","distractor_html":["<p>The number six refers to standard deviations, not process steps.</p>",null,"<p>DMAIC has five phases and five tollgates, not six.</p>","<p>Belt counts have nothing to do with sigma level.</p>"]},{"id":"D-1.1-002","phase":"Define","section":"1.1","subtopic":"The Problem Solving Strategy Y = f(x)","type":"concept","difficulty":1,"check":true,"answer":1,"lesson_day":1,"stem_html":"<p>In the expression Y = f(x), what does Y represent?</p>","options_html":["<p>The root cause the team must remove</p>","<p>The output or result the project is trying to improve</p>","<p>The number of factors in the process</p>","<p>The financial benefit of the project</p>"],"explanation_html":"<p>Y is the output measure, the result you care about, such as late deliveries per month. The x's are the inputs and process factors that cause it. The strategy is to improve Y by finding and changing the right x's (Day 1).</p>","distractor_html":["<p>Causes are the x's, not Y.</p>",null,"<p>Y is a single result measure, not a count of factors.</p>","<p>Financial benefit may follow from improving Y but is not what Y stands for.</p>"]},{"id":"D-1.1-003","phase":"Define","section":"1.1","subtopic":"Deliverables of a Lean Six Sigma Project","type":"concept","difficulty":2,"check":true,"answer":1,"lesson_day":1,"stem_html":"<p>A team has just completed a data collection plan, checked that its measurement system is reliable and established the current defect rate. Which DMAIC phase has it finished?</p>","options_html":["<p>Define</p>","<p>Measure</p>","<p>Analyse</p>","<p>Improve</p>"],"explanation_html":"<p>Data collection plan, verified measurement system and baseline performance are the deliverables of Measure. Define produces the charter; Analyse produces confirmed causes; Improve produces a piloted solution (Day 1).</p>","distractor_html":["<p>Define ends with a charter and customer requirements, before data is collected.</p>",null,"<p>Analyse tests causes; it starts once a baseline exists.</p>","<p>Improve trials solutions, well after the baseline is set.</p>"]},{"id":"D-1.1-004","phase":"Define","section":"1.1","subtopic":"Six Sigma Roles & Responsibilities","type":"concept","difficulty":1,"check":true,"answer":2,"lesson_day":1,"stem_html":"<p>Which role selects the project, removes organisational obstacles and approves each tollgate, but does not perform the analysis?</p>","options_html":["<p>Green Belt</p>","<p>Black Belt</p>","<p>Champion</p>","<p>Master Black Belt</p>"],"explanation_html":"<p>The Champion, also called the sponsor, is the senior manager who owns the business problem. They choose the project, clear obstacles and sign off tollgates. Analysis is done by the Green or Black Belt leading the project (Day 1).</p>","distractor_html":["<p>A Green Belt leads smaller projects and does the analysis part-time.</p>","<p>A Black Belt leads complex projects full-time and does the analysis.</p>",null,"<p>A Master Black Belt coaches belts and runs the programme; they are not the project's sponsor.</p>"]},{"id":"D-1.1-005","phase":"Define","section":"1.1","subtopic":"Voice of the Customer, Business and Employee","type":"concept","difficulty":2,"check":true,"answer":1,"lesson_day":1,"stem_html":"<p>A project team is deciding how to define a \"defective invoice\". Which source should the definition come from?</p>","options_html":["<p>The voice of the business, because invoices affect cash flow</p>","<p>The voice of the customer, because a defect is a failure to meet a customer requirement</p>","<p>The voice of the employee, because staff know which invoices are hard to produce</p>","<p>The Black Belt's judgement, because they have the most training</p>"],"explanation_html":"<p>A defect is any output that fails a customer requirement, so the definition of a defective invoice must come from what the customer needs. The business and employee voices matter for why the project is funded and where causes lie, but not for defining defects (Day 1).</p>","distractor_html":["<p>The voice of the business explains why the project matters, not what counts as a defect.</p>",null,"<p>The voice of the employee helps find causes, not define requirements.</p>","<p>Requirements come from customers, not from the belt's opinion.</p>"]},{"id":"D-1.1-006","phase":"Define","section":"1.1","subtopic":"General History of Six Sigma & Continuous Improvement","type":"concept","difficulty":1,"answer":1,"lesson_day":1,"stem_html":"<p>Where did Six Sigma originate?</p>","options_html":["<p>Toyota, Japan, in the 1950s</p>","<p>Motorola, United States, in the 1980s</p>","<p>General Electric, United States, in the 1990s</p>","<p>Ford, United States, in the 1910s</p>"],"explanation_html":"<p>Six Sigma was developed at Motorola in the 1980s, with engineer Bill Smith usually credited. General Electric adopted and popularised it in the 1990s. Toyota is the origin of Lean, not Six Sigma (Day 1).</p>","distractor_html":["<p>Toyota is where Lean came from.</p>",null,"<p>GE made Six Sigma famous but did not invent it.</p>","<p>Ford's assembly line influenced Lean thinking but is not the origin of Six Sigma.</p>"]},{"id":"D-1.1-007","phase":"Define","section":"1.1","subtopic":"General History of Six Sigma & Continuous Improvement","type":"concept","difficulty":1,"answer":0,"lesson_day":1,"stem_html":"<p>Lean thinking developed mainly from which source?</p>","options_html":["<p>The Toyota Production System</p>","<p>Motorola's quality programme</p>","<p>The United States military's sampling standards</p>","<p>Bell Laboratories' control chart work</p>"],"explanation_html":"<p>Lean grew out of the Toyota Production System, developed in Japan after the Second World War by engineers including Taiichi Ohno. It focuses on removing waste so value flows faster (Day 1).</p>","distractor_html":[null,"<p>Motorola is the origin of Six Sigma.</p>","<p>Military sampling standards contributed to acceptance sampling, not Lean.</p>","<p>Bell Labs (Walter Shewhart) gave us control charts, which are a Six Sigma tool.</p>"]},{"id":"D-1.1-008","phase":"Define","section":"1.1","subtopic":"Meanings of Six Sigma","type":"concept","difficulty":2,"answer":1,"lesson_day":1,"stem_html":"<p>Which statement best distinguishes the focus of Lean from the focus of Six Sigma?</p>","options_html":["<p>Lean reduces variation; Six Sigma removes waste</p>","<p>Lean removes waste and delay; Six Sigma reduces variation and defects</p>","<p>Lean applies to manufacturing; Six Sigma applies to services</p>","<p>Lean uses statistics; Six Sigma uses visual management</p>"],"explanation_html":"<p>Lean asks which steps add value and removes the rest, attacking waste and delay. Six Sigma asks how much output varies from requirements and finds the causes of that variation. Both apply to any industry (Day 1).</p>","distractor_html":["<p>This reverses the two.</p>",null,"<p>Both methods apply to manufacturing and services alike.</p>","<p>Statistics belong mainly to Six Sigma; visual management is a Lean tool.</p>"]},{"id":"D-1.1-009","phase":"Define","section":"1.1","subtopic":"Deliverables of a Lean Six Sigma Project","type":"concept","difficulty":1,"answer":2,"lesson_day":1,"stem_html":"<p>Which deliverable belongs to the Control phase?</p>","options_html":["<p>Project charter</p>","<p>Baseline defect rate</p>","<p>Control plan and monitoring chart handed to the process owner</p>","<p>List of confirmed root causes</p>"],"explanation_html":"<p>Control makes sure the improvement lasts: a control plan, monitoring charts and updated procedures are handed to the process owner. The charter is Define, the baseline is Measure and confirmed causes are Analyse (Day 1).</p>","distractor_html":["<p>The charter is produced in Define.</p>","<p>The baseline is produced in Measure.</p>",null,"<p>Confirmed causes are the output of Analyse.</p>"]},{"id":"D-1.1-010","phase":"Define","section":"1.1","subtopic":"Deliverables of a Lean Six Sigma Project","type":"concept","difficulty":2,"answer":1,"lesson_day":1,"stem_html":"<p>What is the purpose of a tollgate review?</p>","options_html":["<p>To let the team choose which DMAIC phase to do next</p>","<p>To have the sponsor confirm a phase's deliverables are complete before the next phase starts</p>","<p>To measure the process capability at the end of the project</p>","<p>To train Yellow Belts in the tools used so far</p>"],"explanation_html":"<p>A tollgate is the review at the end of each phase where the Champion checks the deliverables and approves moving on. DMAIC phases run in a fixed order, so the review is about readiness, not choosing a direction (Day 1).</p>","distractor_html":["<p>The phase order is fixed: Define, Measure, Analyse, Improve, Control.</p>",null,"<p>Capability is measured in Measure and rechecked in Control, not at tollgates as such.</p>","<p>Training is not the purpose of a tollgate.</p>"]},{"id":"D-1.1-011","phase":"Define","section":"1.1","subtopic":"The Problem Solving Strategy Y = f(x)","type":"interpretation","difficulty":2,"answer":1,"lesson_day":1,"stem_html":"<p>A call centre wants to cut average call handling time. A team member proposes \"measure handling time every day and display it on a big screen so people try harder.\" In terms of Y = f(x), what is the weakness of this proposal?</p>","options_html":["<p>It measures the wrong Y; call volume should be measured instead</p>","<p>It acts only on Y and does not identify or change any x that causes long calls</p>","<p>It uses too many x's at once</p>","<p>It confuses the voice of the customer with the voice of the business</p>"],"explanation_html":"<p>Handling time is the Y. Displaying Y more prominently does not change the causes of long calls, such as system lookups, unclear scripts or call transfers. Y = f(x) says you change results by changing the x's that drive them (Day 1).</p>","distractor_html":["<p>Handling time is a reasonable Y for this problem.</p>",null,"<p>The proposal names no x's at all.</p>","<p>The proposal is not about which voice is used.</p>"]},{"id":"D-1.1-012","phase":"Define","section":"1.1","subtopic":"Six Sigma Roles & Responsibilities","type":"concept","difficulty":2,"answer":1,"lesson_day":1,"stem_html":"<p>Which description best fits a Green Belt?</p>","options_html":["<p>Works full-time on improvement and leads complex cross-functional projects</p>","<p>Leads smaller projects in their own area, usually part-time alongside a normal job</p>","<p>Trains Black Belts and manages the organisation's improvement programme</p>","<p>Owns the business problem and funds the project</p>"],"explanation_html":"<p>Green Belts keep their normal role and lead smaller, local projects part-time. Black Belts are full-time on complex projects, Master Black Belts coach and run the programme, and the Champion owns and funds the problem (Day 1).</p>","distractor_html":["<p>That describes a Black Belt.</p>",null,"<p>That describes a Master Black Belt.</p>","<p>That describes the Champion or sponsor.</p>"]},{"id":"D-1.1-013","phase":"Define","section":"1.1","subtopic":"Six Sigma Roles & Responsibilities","type":"concept","difficulty":2,"answer":2,"lesson_day":1,"stem_html":"<p>At the end of the Control phase, who takes responsibility for keeping the improved process running day to day?</p>","options_html":["<p>The Master Black Belt</p>","<p>The Green Belt who led the project</p>","<p>The process owner</p>","<p>The Champion</p>"],"explanation_html":"<p>The process owner is the manager responsible for the process in normal operation. Control ends with handover to them, including the control plan and monitoring charts. The belt moves on to the next project (Day 1).</p>","distractor_html":["<p>The Master Black Belt coaches belts; they do not run processes.</p>","<p>The Green Belt hands the process back and moves to other work.</p>",null,"<p>The Champion sponsors projects; the process owner runs the process.</p>"]},{"id":"D-1.1-014","phase":"Define","section":"1.1","subtopic":"Voice of the Customer, Business and Employee","type":"interpretation","difficulty":2,"answer":1,"lesson_day":1,"stem_html":"<p>\"Each late shipment costs us about $9 in refunds, which is roughly $13 000 a month.\" Which voice is this statement an example of?</p>","options_html":["<p>Voice of the customer</p>","<p>Voice of the business</p>","<p>Voice of the employee</p>","<p>Voice of the process</p>"],"explanation_html":"<p>Cost, margin and financial impact are the voice of the business: they explain why the organisation should fund the project. The customer's voice would describe what \"late\" means to them; the employee's voice would describe obstacles in doing the work (Day 1).</p>","distractor_html":["<p>Customers care about receiving parcels on time, not about the company's refund costs.</p>",null,"<p>Employees' voice is about how the work feels and where it goes wrong.</p>","<p>\"Voice of the process\" describes measured process behaviour, not money.</p>"]},{"id":"D-1.1-015","phase":"Define","section":"1.1","subtopic":"Voice of the Customer, Business and Employee","type":"concept","difficulty":1,"answer":1,"lesson_day":1,"stem_html":"<p>Which of these is the most direct method of collecting the voice of the customer?</p>","options_html":["<p>Reviewing the annual budget</p>","<p>Interviewing customers and analysing their complaints</p>","<p>Reading the team's shift handover notes</p>","<p>Calculating the process sigma level</p>"],"explanation_html":"<p>The voice of the customer is gathered from customers themselves: interviews, surveys, complaints and observation. Budgets are the voice of the business, handover notes the voice of the employee, and sigma level is a process measure (Day 1).</p>","distractor_html":["<p>The budget reflects the business's needs, not the customer's.</p>",null,"<p>Handover notes capture the employee's view.</p>","<p>Sigma level is a measurement of the process, not a customer input.</p>"]},{"id":"D-1.1-016","phase":"Define","section":"1.1","subtopic":"Meanings of Six Sigma","type":"concept","difficulty":2,"answer":1,"lesson_day":1,"stem_html":"<p>Which statement about the term \"sigma\" is correct?</p>","options_html":["<p>Sigma is the Greek letter used for the mean of a population</p>","<p>Sigma is the Greek letter used for standard deviation, a measure of spread</p>","<p>Sigma is the number of defects found per unit</p>","<p>Sigma is the number of steps in a process</p>"],"explanation_html":"<p>Sigma (σ) is the statistical symbol for standard deviation, which measures how spread out values are. The mean is written μ (mu). Defects per unit and step counts have their own names (Day 1).</p>","distractor_html":["<p>The population mean is μ, not σ.</p>",null,"<p>Defects per unit is DPU.</p>","<p>Step count is not a statistical symbol.</p>"]},{"id":"D-1.1-017","phase":"Define","section":"1.1","subtopic":"Deliverables of a Lean Six Sigma Project","type":"interpretation","difficulty":3,"answer":1,"lesson_day":1,"stem_html":"<p>A team ran a two-week trial of a new sorting screen on one shift and showed the late-parcel rate fell from 12% to 7% on that shift. Which phase does this work belong to, and what should come next?</p>","options_html":["<p>Analyse; next, write the project charter</p>","<p>Improve; next, build a control plan and hand over to the process owner</p>","<p>Measure; next, brainstorm causes</p>","<p>Control; next, pilot the solution on other shifts</p>"],"explanation_html":"<p>Piloting a solution and showing it moves Y is the Improve phase. The next phase is Control: standardise the change, set up monitoring and hand over so the gain holds. Charters come first (Define) and cause-finding is Analyse (Day 1).</p>","distractor_html":["<p>Analyse finds causes; the charter was written back in Define.</p>",null,"<p>Measure establishes the baseline before causes are tested.</p>","<p>Piloting belongs to Improve; Control comes after the pilot succeeds.</p>"]},{"id":"D-1.1-018","phase":"Define","section":"1.1","subtopic":"General History of Six Sigma & Continuous Improvement","type":"concept","difficulty":2,"answer":1,"lesson_day":1,"stem_html":"<p>Why were Lean and Six Sigma combined into a single method?</p>","options_html":["<p>Because Six Sigma had been discredited and needed a new name</p>","<p>Because a process can be fast but error-prone, or accurate but slow, and the two methods address these different problems</p>","<p>Because Lean only works in Japan and Six Sigma only works in the United States</p>","<p>Because regulators required both</p>"],"explanation_html":"<p>Lean attacks delay and waste; Six Sigma attacks variation and defects. A process usually needs both. Combining them lets one project use whichever tools the problem calls for (Day 1).</p>","distractor_html":["<p>Six Sigma was not discredited; it remains widely used.</p>",null,"<p>Both methods are used worldwide across industries.</p>","<p>No regulator requires either method.</p>"]},{"id":"D-1.1-019","phase":"Define","section":"1.1","subtopic":"The Problem Solving Strategy Y = f(x)","type":"concept","difficulty":1,"answer":2,"lesson_day":1,"stem_html":"<p>In Y = f(x), which of the following is an example of an x rather than a Y?</p>","options_html":["<p>Percentage of orders shipped late</p>","<p>Number of complaints per month</p>","<p>Which supplier provided the packaging</p>","<p>Average minutes to resolve a ticket</p>"],"explanation_html":"<p>The supplier used is an input factor that may cause a result, so it is an x. The other three are all output measures (results) and would be Y's (Day 1).</p>","distractor_html":["<p>Late shipment percentage is a result, so it is a Y.</p>","<p>Complaints per month is a result: a Y.</p>",null,"<p>Resolution time is a result: a Y.</p>"]},{"id":"D-1.1-020","phase":"Define","section":"1.1","subtopic":"Six Sigma Roles & Responsibilities","type":"concept","difficulty":1,"answer":0,"lesson_day":1,"stem_html":"<p>Which role provides basic awareness-level support, such as helping to collect data during a project?</p>","options_html":["<p>Yellow Belt</p>","<p>Black Belt</p>","<p>Champion</p>","<p>Master Black Belt</p>"],"explanation_html":"<p>Yellow Belts (and White Belts in some schemes) have basic training and support projects as team members, often collecting data or joining improvement events. The other roles lead, coach or sponsor (Day 1).</p>","distractor_html":[null,"<p>Black Belts lead complex projects full-time.</p>","<p>The Champion sponsors the project.</p>","<p>The Master Black Belt coaches belts and runs the programme.</p>"]},{"id":"M-2.4-001","phase":"Measure","section":"2.4","subtopic":"Capability Analysis","type":"calculation","difficulty":2,"generator":"stats:cpk","answer":1,"lesson_day":11,"stem_html":"<p>A filling process has an upper specification limit of 10.4 g, a lower specification limit of 9.6 g, a mean of 10.1 g and a short-term standard deviation of 0.1 g. What is Cpk?</p>","options_html":["<p>1.33</p>","<p>1.00</p>","<p>1.67</p>","<p>0.67</p>"],"explanation_html":"<p>Cpk uses the nearer specification limit. USL − mean = 0.3 and mean − LSL = 0.5, so the nearer distance is 0.3. Cpk = 0.3 ÷ (3 × 0.1) = 1.00 (Day 11).</p>","distractor_html":["<p>1.33 is Cp: (10.4 − 9.6) ÷ (6 × 0.1). Cp ignores centring.</p>",null,"<p>1.67 uses the farther limit (0.5 ÷ 0.3).</p>","<p>0.67 divides 0.3 by 4.5 standard deviations; the divisor is 3σ.</p>"]},{"id":"M-2.4-002","phase":"Measure","section":"2.4","subtopic":"Capability Analysis","type":"calculation","difficulty":1,"generator":"stats:cp","answer":1,"lesson_day":11,"stem_html":"<p>Using the same filling process (USL 10.4 g, LSL 9.6 g, short-term standard deviation 0.1 g), what is Cp?</p>","options_html":["<p>2.67</p>","<p>1.33</p>","<p>0.80</p>","<p>1.00</p>"],"explanation_html":"<p>Cp compares the specification width with six standard deviations: (10.4 − 9.6) ÷ (6 × 0.1) = 0.8 ÷ 0.6 = 1.33. It does not depend on the mean (Day 11).</p>","distractor_html":["<p>2.67 divides by 3σ instead of 6σ.</p>",null,"<p>0.80 is the specification width itself, not divided by 6σ.</p>","<p>1.00 is Cpk for this process, which accounts for centring.</p>"]},{"id":"M-2.4-003","phase":"Measure","section":"2.4","subtopic":"Capability Analysis","type":"concept","difficulty":2,"answer":1,"lesson_day":11,"stem_html":"<p>A process has Cp = 1.8 and Cpk = 0.9. What is the most likely explanation?</p>","options_html":["<p>The process has too much variation to meet the specification</p>","<p>The process variation is small enough, but the process is not centred between the limits</p>","<p>The specification limits are too wide</p>","<p>The data were collected over too short a period</p>"],"explanation_html":"<p>Cp measures potential capability from spread alone, and 1.8 says the spread would fit comfortably. Cpk is lower because it also accounts for centring. A large gap between them means the mean sits close to one limit. Centring the process would raise Cpk towards Cp (Day 11).</p>","distractor_html":["<p>Cp = 1.8 shows the variation is small relative to the specification.</p>",null,"<p>Wide limits would raise both indices, not separate them.</p>","<p>Data period affects Pp/Ppk versus Cp/Cpk, not the Cp–Cpk gap.</p>"]}],"glossary":[{"term":"Lean Six Sigma","definition":"A structured method for improving how work is done. It combines Lean (removing waste and delay) with Six Sigma (reducing variation and defects), and follows the DMAIC phases.","lesson_day":1,"aliases":["LSS"],"definition_html":"<p>A structured method for improving how work is done. It combines Lean (removing waste and delay) with Six Sigma (reducing variation and defects), and follows the DMAIC phases.</p>"},{"term":"process","definition":"A repeatable sequence of steps that turns inputs (information, materials, requests) into an output someone uses.","lesson_day":1,"definition_html":"<p>A repeatable sequence of steps that turns inputs (information, materials, requests) into an output someone uses.</p>"},{"term":"defect","definition":"Any output that fails a customer requirement. A single unit can have several defects. Compare defective: a unit with at least one defect.","lesson_day":1,"aliases":["defects"],"definition_html":"<p>Any output that fails a customer requirement. A single unit can have several defects. Compare defective: a unit with at least one defect.</p>"},{"term":"variation","definition":"The fact that repeated outputs of a process are not identical. Measured with the range or the standard deviation. Six Sigma exists to understand and reduce it.","lesson_day":1,"definition_html":"<p>The fact that repeated outputs of a process are not identical. Measured with the range or the standard deviation. Six Sigma exists to understand and reduce it.</p>"},{"term":"Six Sigma","definition":"A data-driven method for reducing variation and defects, created at Motorola in the 1980s. Named after the statistical symbol for standard deviation.","lesson_day":1,"definition_html":"<p>A data-driven method for reducing variation and defects, created at Motorola in the 1980s. Named after the statistical symbol for standard deviation.</p>"},{"term":"Lean","definition":"A method for removing waste and delay from a process so that value flows to the customer faster. Developed from the Toyota Production System.","lesson_day":1,"definition_html":"<p>A method for removing waste and delay from a process so that value flows to the customer faster. Developed from the Toyota Production System.</p>"},{"term":"DMAIC","definition":"The five phases of a Lean Six Sigma project: Define, Measure, Analyse, Improve, Control. Each ends with a tollgate review before the next begins.","lesson_day":1,"definition_html":"<p>The five phases of a Lean Six Sigma project: Define, Measure, Analyse, Improve, Control. Each ends with a tollgate review before the next begins.</p>"},{"term":"Y = f(x)","definition":"Read \"Y is a function of x.\" The result you care about (Y) is caused by the inputs and process factors (x). To change a result, find and change its causes.","lesson_day":1,"aliases":["Y is a function of x"],"definition_html":"<p>Read \"Y is a function of x.\" The result you care about (Y) is caused by the inputs and process factors (x). To change a result, find and change its causes.</p>"},{"term":"Green Belt","definition":"A person trained to lead smaller improvement projects in their own area, usually part-time alongside a normal job.","lesson_day":1,"definition_html":"<p>A person trained to lead smaller improvement projects in their own area, usually part-time alongside a normal job.</p>"},{"term":"Black Belt","definition":"A full-time improvement specialist who leads complex, cross-functional projects and mentors Green Belts.","lesson_day":1,"definition_html":"<p>A full-time improvement specialist who leads complex, cross-functional projects and mentors Green Belts.</p>"},{"term":"Master Black Belt","definition":"An expert who trains and coaches Black and Green Belts and manages the improvement programme across an organisation.","lesson_day":1,"aliases":["MBB"],"definition_html":"<p>An expert who trains and coaches Black and Green Belts and manages the improvement programme across an organisation.</p>"},{"term":"Champion","definition":"The senior manager who sponsors a project: owns the business problem, selects the project, removes obstacles and approves tollgates. Also called the sponsor.","lesson_day":1,"aliases":["sponsor","project sponsor"],"definition_html":"<p>The senior manager who sponsors a project: owns the business problem, selects the project, removes obstacles and approves tollgates. Also called the sponsor.</p>"},{"term":"Yellow Belt","definition":"Basic awareness level. Team members who help collect data and take part in improvement events.","lesson_day":1,"definition_html":"<p>Basic awareness level. Team members who help collect data and take part in improvement events.</p>"},{"term":"voice of the customer","definition":"What the people who receive a process output need, expect and complain about. The source of requirements and defect definitions.","lesson_day":1,"aliases":["VOC"],"definition_html":"<p>What the people who receive a process output need, expect and complain about. The source of requirements and defect definitions.</p>"},{"term":"voice of the business","definition":"What the organisation needs from a process: cost, margin, compliance, growth. Sets why a project is worth doing.","lesson_day":1,"aliases":["VOB"],"definition_html":"<p>What the organisation needs from a process: cost, margin, compliance, growth. Sets why a project is worth doing.</p>"},{"term":"voice of the employee","definition":"What the people doing the work know about frustrations, workarounds and obstacles. Often the quickest route to real causes.","lesson_day":1,"aliases":["VOE"],"definition_html":"<p>What the people doing the work know about frustrations, workarounds and obstacles. Often the quickest route to real causes.</p>"},{"term":"continuous improvement","definition":"The habit of treating every process as something that can always be made better, in small steps, using data. Lean and Six Sigma are both forms of it.","lesson_day":1,"aliases":["kaizen mindset"],"definition_html":"<p>The habit of treating every process as something that can always be made better, in small steps, using data. Lean and Six Sigma are both forms of it.</p>"},{"term":"sigma","definition":"The Greek letter σ, used in statistics for the standard deviation of a population. A \"sigma level\" describes how many standard deviations fit between the process average and the nearest customer limit.","lesson_day":1,"aliases":["σ"],"definition_html":"<p>The Greek letter σ, used in statistics for the standard deviation of a population. A \"sigma level\" describes how many standard deviations fit between the process average and the nearest customer limit.</p>"},{"term":"standard deviation","definition":"A number describing how spread out a set of values is. Small means the values sit close together; large means they are scattered. Calculated on Day 7.","lesson_day":1,"aliases":["SD"],"definition_html":"<p>A number describing how spread out a set of values is. Small means the values sit close together; large means they are scattered. Calculated on Day 7.</p>"},{"term":"deliverable","definition":"A concrete output a DMAIC phase must produce before its tollgate, such as a charter (Define) or a control plan (Control).","lesson_day":1,"aliases":["deliverables"],"definition_html":"<p>A concrete output a DMAIC phase must produce before its tollgate, such as a charter (Define) or a control plan (Control).</p>"},{"term":"tollgate","definition":"The review meeting at the end of each DMAIC phase where the sponsor checks the deliverables and approves moving to the next phase.","lesson_day":1,"aliases":["tollgate review","gate review"],"definition_html":"<p>The review meeting at the end of each DMAIC phase where the sponsor checks the deliverables and approves moving to the next phase.</p>"},{"term":"process owner","definition":"The manager responsible for a process day to day. Receives the improved process at the end of Control and keeps it running.","lesson_day":1,"definition_html":"<p>The manager responsible for a process day to day. Receives the improved process at the end of Control and keeps it running.</p>"},{"term":"output","definition":"What a process produces for its customer. The output measure is the Y in Y = f(x).","lesson_day":1,"definition_html":"<p>What a process produces for its customer. The output measure is the Y in Y = f(x).</p>"},{"term":"input","definition":"Anything a process consumes or acts on: materials, information, requests, people's time. Inputs are among the x's in Y = f(x).","lesson_day":1,"aliases":["inputs"],"definition_html":"<p>Anything a process consumes or acts on: materials, information, requests, people's time. Inputs are among the x's in Y = f(x).</p>"},{"term":"defective","definition":"A unit of output that has one or more defects. A unit with three defects is one defective.","lesson_day":1,"definition_html":"<p>A unit of output that has one or more defects. A unit with three defects is one defective.</p>"},{"term":"Cpk","definition":"A capability index that compares the distance from the process mean to the nearest specification limit with three standard deviations. Falls when the process is off-centre.","lesson_day":11,"aliases":["process capability index"],"definition_html":"<p>A capability index that compares the distance from the process mean to the nearest specification limit with three standard deviations. Falls when the process is off-centre.</p>"},{"term":"Cp","definition":"Potential capability: the specification width divided by six standard deviations. Ignores where the process is centred.","lesson_day":11,"definition_html":"<p>Potential capability: the specification width divided by six standard deviations. Ignores where the process is centred.</p>"},{"term":"specification limit","definition":"The customer's boundary for acceptable output. The upper specification limit (USL) and lower specification limit (LSL) define the tolerance.","lesson_day":11,"aliases":["spec limit","USL","LSL"],"definition_html":"<p>The customer's boundary for acceptable output. The upper specification limit (USL) and lower specification limit (LSL) define the tolerance.</p>"}],"ztable":[[0.5,0.504,0.508,0.512,0.516,0.5199,0.5239,0.5279,0.5319,0.5359],[0.5398,0.5438,0.5478,0.5517,0.5557,0.5596,0.5636,0.5675,0.5714,0.5753],[0.5793,0.5832,0.5871,0.591,0.5948,0.5987,0.6026,0.6064,0.6103,0.6141],[0.6179,0.6217,0.6255,0.6293,0.6331,0.6368,0.6406,0.6443,0.648,0.6517],[0.6554,0.6591,0.6628,0.6664,0.67,0.6736,0.6772,0.6808,0.6844,0.6879],[0.6915,0.695,0.6985,0.7019,0.7054,0.7088,0.7123,0.7157,0.719,0.7224],[0.7257,0.7291,0.7324,0.7357,0.7389,0.7422,0.7454,0.7486,0.7517,0.7549],[0.758,0.7611,0.7642,0.7673,0.7704,0.7734,0.7764,0.7794,0.7823,0.7852],[0.7881,0.791,0.7939,0.7967,0.7995,0.8023,0.8051,0.8078,0.8106,0.8133],[0.8159,0.8186,0.8212,0.8238,0.8264,0.8289,0.8315,0.834,0.8365,0.8389],[0.8413,0.8438,0.8461,0.8485,0.8508,0.8531,0.8554,0.8577,0.8599,0.8621],[0.8643,0.8665,0.8686,0.8708,0.8729,0.8749,0.877,0.879,0.881,0.883],[0.8849,0.8869,0.8888,0.8907,0.8925,0.8944,0.8962,0.898,0.8997,0.9015],[0.9032,0.9049,0.9066,0.9082,0.9099,0.9115,0.9131,0.9147,0.9162,0.9177],[0.9192,0.9207,0.9222,0.9236,0.9251,0.9265,0.9279,0.9292,0.9306,0.9319],[0.9332,0.9345,0.9357,0.937,0.9382,0.9394,0.9406,0.9418,0.9429,0.9441],[0.9452,0.9463,0.9474,0.9484,0.9495,0.9505,0.9515,0.9525,0.9535,0.9545],[0.9554,0.9564,0.9573,0.9582,0.9591,0.9599,0.9608,0.9616,0.9625,0.9633],[0.9641,0.9649,0.9656,0.9664,0.9671,0.9678,0.9686,0.9693,0.9699,0.9706],[0.9713,0.9719,0.9726,0.9732,0.9738,0.9744,0.975,0.9756,0.9761,0.9767],[0.9772,0.9778,0.9783,0.9788,0.9793,0.9798,0.9803,0.9808,0.9812,0.9817],[0.9821,0.9826,0.983,0.9834,0.9838,0.9842,0.9846,0.985,0.9854,0.9857],[0.9861,0.9864,0.9868,0.9871,0.9875,0.9878,0.9881,0.9884,0.9887,0.989],[0.9893,0.9896,0.9898,0.9901,0.9904,0.9906,0.9909,0.9911,0.9913,0.9916],[0.9918,0.992,0.9922,0.9925,0.9927,0.9929,0.9931,0.9932,0.9934,0.9936],[0.9938,0.994,0.9941,0.9943,0.9945,0.9946,0.9948,0.9949,0.9951,0.9952],[0.9953,0.9955,0.9956,0.9957,0.9959,0.996,0.9961,0.9962,0.9963,0.9964],[0.9965,0.9966,0.9967,0.9968,0.9969,0.997,0.9971,0.9972,
