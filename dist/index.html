<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tollgate</title>
<meta name="description" content="Self-study for the IASSC Certified Lean Six Sigma Green Belt: lessons, practice questions, calculators and timed mocks.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
:root{--paper:#F6F1E8;--paper2:#ECE5D8;--ink:#1C1A17;--ink2:#655F57;--rule:#D8CFC0;--green:#1F6B45;--greenT:#DFEBE2;--amber:#9A5B0B;--amberT:#F3E3C6;--onGreen:#F6F1E8;--desk:#E4DDD0;--greenHover:#185637;--greenPress:#124229;
--sans:'IBM Plex Sans',system-ui,sans-serif;--mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;--serif:'Source Serif 4',Georgia,serif;--prose:var(--serif)}
:root[data-theme="dark"]{--paper:#1F1D1A;--paper2:#2A2723;--ink:#EDE7DB;--ink2:#A69F92;--rule:#3B3730;--green:#5AA97D;--greenT:#243C30;--amber:#D9A24A;--amberT:#3E3221;--onGreen:#141311;--desk:#141311;--greenHover:#6CB88E;--greenPress:#4E965F}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#1F1D1A;--paper2:#2A2723;--ink:#EDE7DB;--ink2:#A69F92;--rule:#3B3730;--green:#5AA97D;--greenT:#243C30;--amber:#D9A24A;--amberT:#3E3221;--onGreen:#141311;--desk:#141311;--greenHover:#6CB88E;--greenPress:#4E965F}}
:root[data-prose="sans"]{--prose:var(--sans)}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font:15px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
a{color:var(--green)}
button{font:500 15px var(--sans);cursor:pointer;border-radius:4px;height:44px;padding:0 16px;border:1px solid var(--rule);background:transparent;color:var(--ink);min-width:44px}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--green);outline-offset:2px}
button:disabled{opacity:.4;cursor:default}
button.primary{background:var(--green);color:var(--onGreen);border:0}
button.primary:hover{background:var(--greenHover)}button.primary:active{background:var(--greenPress)}
button.secondary:hover{border-color:var(--ink)}button.secondary:active{background:var(--paper2);border-color:var(--ink)}
button.ink{background:var(--ink);color:var(--paper);border:0}
button.warn{color:var(--amber);border-color:var(--amber)}button.warn:hover{background:var(--amberT)}button.warn.on{background:var(--amber);color:var(--paper)}
button.ghost{border:0;color:var(--ink2)}
button.sm{height:40px;font-size:14px}
input,select,textarea{font:16px var(--mono);height:44px;padding:0 12px;border:1px solid var(--rule);border-radius:4px;background:var(--paper);color:var(--ink);width:100%;min-width:0}
input.sans,select.sans{font-family:var(--sans);font-size:15px}
textarea{height:auto;min-height:120px;padding:12px;font:15px/1.5 var(--sans);resize:vertical}
input:focus,textarea:focus,select:focus{border-color:var(--green);outline:2px solid var(--greenT)}
.eyebrow{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink2)}
.mono{font-family:var(--mono)}.muted{color:var(--ink2)}.small{font-size:14px}.caption{font-size:13px;color:var(--ink2)}
.amber{color:var(--amber)}.green{color:var(--green)}
.card{border:1px solid var(--rule);border-radius:6px;padding:16px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.stack{display:flex;flex-direction:column;gap:12px}
h1,h2,h3{margin:0;font-weight:500}
h2.page{font-size:22px}
.hr{border-top:1px solid var(--rule)}
/* layout */
#app{min-height:100%;display:flex;flex-direction:column}
.shell{display:flex;min-height:100vh}
.sidebar{display:none}
.main{flex:1;min-width:0;padding:20px 20px 88px;display:flex;flex-direction:column;gap:24px;max-width:100%}
.tabbar{position:fixed;left:0;right:0;bottom:0;height:calc(56px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);display:flex;border-top:1px solid var(--rule);background:var(--paper);z-index:20}
.tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;color:var(--ink2);text-decoration:none;gap:2px}
.tabbar a.on{color:var(--green);font-weight:500}
@media (min-width:900px){
 .sidebar{display:flex;flex-direction:column;gap:2px;width:220px;flex-shrink:0;border-right:1px solid var(--rule);padding:24px 16px;font-size:14px;position:sticky;top:0;height:100vh}
 .sidebar .brand{font:500 17px var(--sans);padding:0 10px 20px}
 .sidebar a{padding:8px 10px;color:var(--ink2);text-decoration:none;border-radius:4px}
 .sidebar a.on{background:var(--paper2);color:var(--ink);font-weight:500}
 .sidebar .foot{margin-top:auto;padding:0 10px;font:13px/1.5 var(--mono);color:var(--ink2)}
 .main{padding:44px 56px;gap:32px;max-width:1180px}
 .tabbar{display:none}
 h2.page{font-size:26px}
 .card{padding:24px}
}
/* bars */
.bar{position:relative;height:6px;background:var(--paper2)}
.bar>i{display:block;height:100%;background:var(--green)}
.bar.low>i{background:var(--amber)}
.bar.pass::after{content:"";position:absolute;left:70%;top:-4px;height:14px;width:1px;background:var(--green)}
.bar.big{height:10px}.bar.big.pass::after{top:-5px;height:20px}
.bar.thin{height:4px}.bar.thin.pass::after{top:-3px;height:10px}
.passlabel{position:absolute;left:70%;top:14px;transform:translateX(-50%);font:11px var(--mono);color:var(--green)}
/* options */
.opt{min-height:48px;display:flex;align-items:center;gap:12px;padding:8px 12px;border:1px solid var(--rule);border-radius:4px;background:transparent;color:var(--ink);text-align:left;width:100%;font:400 15px/1.4 var(--sans);height:auto}
.opt .k{font:13px var(--mono);color:var(--ink2);flex-shrink:0}
.opt.sel{border-color:var(--ink);background:var(--paper2)}
.opt.right{border-color:var(--green);background:var(--greenT)}
.opt.wrong{border-color:var(--amber);background:var(--amberT)}
.opt.dim{color:var(--ink2)}
.opt p{margin:0}
/* tables in content */
.prose table,table.data{border-collapse:collapse;width:100%;font:14px/1.5 var(--mono)}
.prose th,table.data th{text-align:left;padding:6px 8px;font-weight:500;border-bottom:1px solid var(--ink)}
.prose td,table.data td{padding:6px 8px;border-bottom:1px solid var(--rule)}
.prose tr:last-child td,table.data tr:last-child td{border-bottom:0}
.prose td.num,.prose th.num{text-align:right}
@media (max-width:480px){.prose table,table.data{font-size:13px}.prose td,.prose th,table.data td,table.data th{padding:5px 6px}}
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
/* prose */
.prose{font:18px/1.6 var(--prose);max-width:680px}
.prose p{margin:0 0 1em}.prose p:last-child{margin-bottom:0}
.prose ul,.prose ol{margin:0 0 1em;padding-left:22px}.prose li{margin-bottom:.35em}
.prose h3{font:600 20px/1.3 var(--prose);margin:1.2em 0 .5em}.prose h3:first-child{margin-top:0}
.prose h4{font:500 16px var(--sans);margin:1em 0 .4em}
.prose code{font:14px var(--mono);background:var(--paper2);padding:1px 5px;border-radius:3px}
.prose pre{font:13px/1.6 var(--mono);background:var(--paper2);padding:12px 14px;border-radius:6px;overflow-x:auto;margin:0 0 1em}
.prose pre code{background:none;padding:0;font-size:13px}
.prose strong{font-weight:600}
.prose table{font-size:14px}
.prose.small{font-size:17px}
.term{border-bottom:1px dotted var(--green);color:var(--green);cursor:pointer}
.termpop{border:1px solid var(--rule);border-radius:6px;padding:12px 14px;background:var(--paper2);display:flex;flex-direction:column;gap:4px;font:14px/1.45 var(--sans);margin:8px 0}
.lesson{display:flex;flex-direction:column;gap:28px}
.block{display:flex;flex-direction:column;gap:10px}
@media (min-width:900px){.lesson{gap:36px;max-width:900px}.block{display:grid;grid-template-columns:180px 1fr;gap:24px}.block>.eyebrow{padding-top:8px}.lesson .prose{max-width:680px}}
.formula{border:1px solid var(--rule);border-radius:6px;padding:14px 16px;font:14px/1.8 var(--mono)}
.formula p{margin:0}.formula ul{margin:0;padding-left:18px}.formula table{font-size:14px}.formula code{background:none;padding:0;font-size:14px}
.steps details{border-bottom:1px solid var(--rule);padding:12px 0}.steps details:first-of-type{border-top:1px solid var(--rule)}
.steps summary{cursor:pointer;font-weight:500;list-style:none;display:flex;justify-content:space-between;align-items:center}
.steps summary::-webkit-details-marker{display:none}
.steps summary::after{content:"+";color:var(--ink2)}.steps details[open] summary::after{content:"−"}
.steps .body{padding-top:10px}
/* nav grid */
.navgrid{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.navgrid button{height:28px;min-width:0;padding:0;font:11px var(--mono);border-radius:2px;border:1px solid var(--rule);color:var(--ink2);background:transparent}
.navgrid button.ans{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.navgrid button.flag{border:2px solid var(--amber)}
.navgrid button.cur{border:2px solid var(--green)}
@media (min-width:900px){.navgrid{grid-template-columns:repeat(20,1fr);gap:6px}.navgrid button{height:36px;font-size:13px;border-radius:3px}.exam .side .navgrid{grid-template-columns:repeat(10,1fr);gap:4px}.exam .side .navgrid button{height:24px;font-size:11px}}
/* exam */
.exam{position:fixed;inset:0;background:var(--paper);display:flex;flex-direction:column;z-index:30}
.exam .top{padding:14px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--rule)}
.exam .pace{padding:8px 20px;display:flex;justify-content:space-between;font-size:12px;color:var(--ink2);border-bottom:1px solid var(--rule)}
.exam .body{flex:1;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:16px}
.exam .body .stem{font-size:16px;line-height:1.5}
.exam .tools{display:flex;justify-content:space-between;padding:0 20px;border-top:1px solid var(--rule)}
.exam .tools button{border:0;height:40px;font-size:13px;color:var(--ink2);padding:0 8px}
.exam .foot{display:grid;grid-template-columns:1fr 1fr 1fr;height:calc(56px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);border-top:1px solid var(--rule)}
.exam .foot button{border:0;border-radius:0;height:100%;border-right:1px solid var(--rule)}.exam .foot button:last-child{border-right:0;font-weight:500}
.timer{font:500 20px var(--mono)}.timer.pressure{color:var(--amber)}
@media (min-width:900px){
 .exam .top{padding:16px 48px;display:grid;grid-template-columns:1fr auto 1fr}.timer{font-size:32px}
 .exam .pace{display:none}
 .exam .mid{flex:1;display:grid;grid-template-columns:1fr 320px;overflow:hidden}
 .exam .body{padding:40px 48px;gap:24px;max-width:840px}.exam .body .stem{font-size:18px;line-height:1.55}
 .exam .side{border-left:1px solid var(--rule);padding:32px 24px;display:flex;flex-direction:column;gap:20px;font-size:14px;overflow:auto}
 .exam .tools{display:none}
 .exam .foot{display:flex;justify-content:space-between;align-items:center;padding:12px 48px;height:auto}
 .exam .foot button{border:1px solid var(--rule);border-radius:4px;height:44px;padding:0 20px}
 .exam .foot button.warn{border-color:var(--amber)}.exam .foot button.ink{border:0}
}
@media (max-width:899px){.exam .side{display:none}.exam .mid{flex:1;display:flex;flex-direction:column;overflow:hidden}}
/* sheets */
.sheet-bg{position:fixed;inset:0;background:var(--ink);opacity:.4;z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:88vh;background:var(--paper);border-top:1px solid var(--rule);border-radius:12px 12px 0 0;z-index:41;display:flex;flex-direction:column;overflow:hidden}
.sheet .head{padding:14px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--rule);font-weight:500}
.sheet .head button{border:0;color:var(--ink2);height:36px}
.sheet .tabs{display:flex;border-bottom:1px solid var(--rule);font-size:14px}
.sheet .tabs button{flex:1;border:0;border-radius:0;color:var(--ink2);height:44px}.sheet .tabs button.on{color:var(--ink);font-weight:500;border-bottom:2px solid var(--green)}
.sheet .content{flex:1;overflow:auto;padding:16px 20px;display:flex;flex-direction:column;gap:12px}
@media (min-width:900px){.sheet{left:auto;top:0;width:560px;max-height:none;border-radius:0;border-top:0;border-left:1px solid var(--rule)}.sheet .head{padding:20px 32px;font-size:20px}.sheet .content{padding:24px 32px}}
.ref{font:13px/1.7 var(--mono);display:flex;flex-direction:column;gap:12px}.ref .g{display:flex;flex-direction:column}.ref .g span:first-child{color:var(--ink2)}
/* calculator */
.calc{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.calc button{height:48px;font:16px var(--mono);min-width:0;padding:0}
.calc button.op{background:var(--paper2)}.calc button.eq{background:var(--green);color:var(--onGreen);border:0}
.calc .disp{grid-column:1/-1;font:500 28px var(--mono);text-align:right;padding:8px 12px;border:1px solid var(--rule);border-radius:4px;min-height:52px;word-break:break-all}
.calc .expr{grid-column:1/-1;font:13px var(--mono);color:var(--ink2);text-align:right;min-height:18px}
/* misc */
.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:4px;font-size:14px;z-index:60}
.pill{font:13px var(--mono);border:1px solid var(--rule);border-radius:3px;padding:2px 6px;color:var(--ink2)}
.seg{display:flex;gap:8px}.seg button{flex:1;font:500 14px var(--mono);min-width:0;padding:0}.seg button.on{border-color:var(--ink);background:var(--paper2)}
.list{display:flex;flex-direction:column;border-top:1px solid var(--rule)}
.list>*{display:flex;justify-content:space-between;align-items:center;min-height:48px;border-bottom:1px solid var(--rule);text-decoration:none;color:var(--ink);font-size:14px;gap:12px;padding:6px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:1fr;gap:24px}
@media (min-width:900px){.grid3{grid-template-columns:repeat(3,1fr)}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:32px}}
.big{font:500 32px/1.1 var(--mono)}.huge{font:500 64px/1 var(--mono)}
@media (min-width:900px){.huge{font-size:96px}.big{font-size:40px}}
.heat{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.heat div{height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:3px;background:var(--greenT);color:var(--green);font:500 14px var(--mono);cursor:pointer}
.heat div.low{background:var(--amberT);color:var(--amber)}.heat div.none{background:var(--paper2);color:var(--ink2)}
.heat div small{font-size:10px;font-weight:400}
@media (min-width:900px){.heat{grid-template-columns:repeat(17,1fr)}.heat div{height:64px}}
.dot{width:8px;height:8px;border-radius:50%;border:1px solid var(--rule);flex-shrink:0}.dot.done{background:var(--green);border-color:var(--green)}.dot.prog{background:var(--amber);border-color:var(--amber)}
.dayrow{display:grid;grid-template-columns:10px 26px 1fr auto;gap:10px;align-items:center;min-height:40px;font-size:14px;text-decoration:none;color:var(--ink)}
.dayrow .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.feedback{font-size:14px;margin:0}
.checkq{display:flex;flex-direction:column;gap:10px}
.checkq .q{font:17px/1.5 var(--prose);margin:0}
.checkq .opts{display:flex;flex-direction:column;gap:6px}
@media (min-width:900px){.checkq .opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}}
.expl{font-size:14px;color:var(--ink)}
.expl p{margin:0}
.wrap{display:flex;flex-wrap:wrap;gap:8px}
.kbd{font:12px var(--mono);border:1px solid var(--rule);border-radius:3px;padding:0 5px;color:var(--ink2)}
.center{text-align:center}
@media print{.sidebar,.tabbar,button{display:none !important}.main{padding:0}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const DATA = {"bok":{"source":"https://iassc.org/body-of-knowledge/green-belt-body-of-knowledge/","phases":[{"key":"Define","code":"D","sections":[{"id":"1.1","title":"The Basics of Six Sigma","subtopics":["Meanings of Six Sigma","General History of Six Sigma & Continuous Improvement","Deliverables of a Lean Six Sigma Project","The Problem Solving Strategy Y = f(x)","Voice of the Customer, Business and Employee","Six Sigma Roles & Responsibilities"]},{"id":"1.2","title":"The Fundamentals of Six Sigma","subtopics":["Defining a Process","Critical to Quality Characteristics (CTQ's)","Cost of Poor Quality (COPQ)","Pareto Analysis (80:20 rule)","Basic Six Sigma Metrics (DPU, DPMO, FTY, RTY, Cycle Time)"]},{"id":"1.3","title":"Selecting Lean Six Sigma Projects","subtopics":["Building a Business Case & Project Charter","Developing Project Metrics","Financial Evaluation & Benefits Capture"]},{"id":"1.4","title":"The Lean Enterprise","subtopics":["Understanding Lean","The History of Lean","Lean & Six Sigma","The Seven Elements of Waste","5S (Sort, Straighten, Shine, Standardize, Self-Discipline)"]}]},{"key":"Measure","code":"M","sections":[{"id":"2.1","title":"Process Definition","subtopics":["Cause & Effect / Fishbone Diagrams","Process Mapping, SIPOC, Value Stream Map","X-Y Diagram","Failure Modes & Effects Analysis (FMEA)"]},{"id":"2.2","title":"Six Sigma Statistics","subtopics":["Basic Statistics","Descriptive Statistics","Normal Distributions & Normality","Graphical Analysis"]},{"id":"2.3","title":"Measurement System Analysis","subtopics":["Precision & Accuracy","Bias, Linearity & Stability","Gage Repeatability & Reproducibility","Variable & Attribute MSA"]},{"id":"2.4","title":"Process Capability","subtopics":["Capability Analysis","Concept of Stability","Attribute & Discrete Capability","Monitoring Techniques"]}]},{"key":"Analyse","code":"A","sections":[{"id":"3.1","title":"Patterns of Variation","subtopics":["Multi-Vari Analysis","Classes of Distributions"]},{"id":"3.2","title":"Inferential Statistics","subtopics":["Understanding Inference","Sampling Techniques & Uses","Central Limit Theorem"]},{"id":"3.3","title":"Hypothesis Testing","subtopics":["General Concepts & Goals of Hypothesis Testing","Significance; Practical vs. Statistical","Risk; Alpha & Beta","Types of Hypothesis Test"]},{"id":"3.4","title":"Hypothesis Testing with Normal Data","subtopics":["1 & 2 sample t-tests","1 sample variance","One Way ANOVA"]},{"id":"3.5","title":"Hypothesis Testing with Non-Normal Data","subtopics":["Mann-Whitney","Kruskal-Wallis","Mood's Median","Friedman","1 Sample Sign","1 Sample Wilcoxon","One and Two Sample Proportion","Chi-Squared (Contingency Tables)"]}]},{"key":"Improve","code":"I","sections":[{"id":"4.1","title":"Simple Linear Regression","subtopics":["Correlation","Regression Equations","Residuals Analysis"]},{"id":"4.2","title":"Multiple Regression Analysis","subtopics":["Non-Linear Regression","Multiple Linear Regression","Confidence & Prediction Intervals","Residuals Analysis","Data Transformation, Box Cox"]}]},{"key":"Control","code":"C","sections":[{"id":"5.1","title":"Lean Controls","subtopics":["Control Methods for 5S","Kanban","Poka-Yoke (Mistake Proofing)"]},{"id":"5.2","title":"Statistical Process Control (SPC)","subtopics":["Data Collection for SPC","I-MR Chart","Xbar-R Chart","U Chart","P Chart","NP Chart","Xbar-S Chart","CuSum Chart","EWMA Chart","Control Methods"]},{"id":"5.3","title":"Six Sigma Control Plans","subtopics":["Cost Benefit Analysis","Elements of the Control Plan","Elements of the Response Plan"]}]}],"schedule":[{"day":1,"week":1,"kind":"lesson","phase":"Define","title":"What Lean Six Sigma Is","sections":["1.1"]},{"day":2,"week":1,"kind":"lesson","phase":"Define","title":"Lean and the Seven Wastes","sections":["1.4"]},{"day":3,"week":1,"kind":"lesson","phase":"Define","title":"Variation, Metrics and the Cost of Poor Quality","sections":["1.2"]},{"day":4,"week":1,"kind":"lesson","phase":"Define","title":"Customers, CTQs and the Project Charter","sections":["1.1","1.2","1.3"]},{"day":5,"week":1,"kind":"lesson","phase":"Define","title":"SIPOC, Project Metrics and Benefits","sections":["1.2","1.3","2.1"]},{"day":6,"week":2,"kind":"lesson","phase":"Measure","title":"Data Types and Sampling","sections":["2.2","3.2"]},{"day":7,"week":2,"kind":"lesson","phase":"Measure","title":"Describing Data with Numbers and Pictures","sections":["2.2"]},{"day":8,"week":2,"kind":"lesson","phase":"Measure","title":"The Normal Distribution and Z-Scores","sections":["2.2"]},{"day":9,"week":2,"kind":"lesson","phase":"Measure","title":"Process Maps and Value Stream Maps","sections":["2.1"]},{"day":10,"week":2,"kind":"lesson","phase":"Measure","title":"Can You Trust Your Measurements? (MSA)","sections":["2.3"]},{"day":11,"week":3,"kind":"lesson","phase":"Measure","title":"Process Capability","sections":["2.4"]},{"day":12,"week":3,"kind":"lesson","phase":"Measure","title":"Capability Practice and Sigma Level","sections":["2.4","1.2"]},{"day":13,"week":3,"kind":"lesson","phase":"Analyse","title":"Finding Causes: Fishbone, X-Y Diagram and FMEA","sections":["2.1"]},{"day":14,"week":3,"kind":"lesson","phase":"Analyse","title":"Inference and Hypothesis Testing Concepts","sections":["3.2","3.3"]},{"day":15,"week":3,"kind":"mock","phase":"Analyse","title":"Mid-Point Mock (50 Questions)","mock":50},{"day":16,"week":4,"kind":"lesson","phase":"Analyse","title":"t-Tests and the 1-Sample Variance Test","sections":["3.4"]},{"day":17,"week":4,"kind":"lesson","phase":"Analyse","title":"One-Way ANOVA","sections":["3.4"]},{"day":18,"week":4,"kind":"lesson","phase":"Analyse","title":"Proportions and Chi-Square","sections":["3.5"]},{"day":19,"week":4,"kind":"lesson","phase":"Analyse","title":"Tests for Non-Normal Data","sections":["3.5"]},{"day":20,"week":4,"kind":"lesson","phase":"Analyse","title":"Multi-Vari and Classes of Distributions","sections":["3.1"]},{"day":21,"week":5,"kind":"lesson","phase":"Improve","title":"Correlation and Simple Linear Regression","sections":["4.1"]},{"day":22,"week":5,"kind":"lesson","phase":"Improve","title":"Multiple Regression, Intervals and Box-Cox","sections":["4.2"]},{"day":23,"week":5,"kind":"lesson","phase":"Control","title":"Lean Controls: 5S, Kanban and Poka-Yoke","sections":["5.1"]},{"day":24,"week":5,"kind":"lesson","phase":"Control","title":"Statistical Process Control","sections":["5.2"]},{"day":25,"week":5,"kind":"lesson","phase":"Control","title":"Control Plans, Response Plans and Cost-Benefit","sections":["5.3"]},{"day":26,"week":6,"kind":"mock","phase":"Exam","title":"Full Mock 1 (100 Questions)","mock":100},{"day":27,"week":6,"kind":"review","phase":"Exam","title":"Weak-Section Review"},{"day":28,"week":6,"kind":"mock","phase":"Exam","title":"Full Mock 2 (100 Questions)","mock":100},{"day":29,"week":6,"kind":"review","phase":"Exam","title":"Revisit Queue Final Review"},{"day":30,"week":6,"kind":"exam","phase":"Exam","title":"Exam Day"}]},"lessons":[{"day":1,"week":1,"phase":"Define","title":"What Lean Six Sigma Is","minutes":50,"sections":["1.1"],"objectives":["Say in one sentence what Lean Six Sigma is for and where it came from","Explain the idea Y = f(x) and use it to separate a result from its causes","Name the five DMAIC phases in order and say what each one produces","Describe the belt roles and who does what on a project","Tell the difference between the voice of the customer, the business and the employee"],"terms":["Lean Six Sigma","process","defect","variation","Six Sigma","Lean","DMAIC","Y = f(x)","Green Belt","Black Belt","Master Black Belt","Champion","Yellow Belt","voice of the customer","voice of the business","voice of the employee","continuous improvement","sigma","standard deviation","deliverable"],"check":["D-1.1-001","D-1.1-002","D-1.1-003","D-1.1-004","D-1.1-005"],"html":{"The Idea":"<h3>A method for fixing work that keeps going wrong</h3>\n<p>Every organisation has work that keeps producing the wrong result. Paperwork that comes back incomplete. Deliveries that are late one week and early the next. Reports that need three rounds of correction. Most people respond by trying harder, adding a checklist, or blaming whoever touched it last. The result rarely changes for long.</p>\n<p><strong>Lean Six Sigma</strong> is a structured way of fixing that kind of problem. It treats the work as a <strong>process</strong>: a repeatable sequence of steps that turns inputs (information, materials, requests) into an output that somebody uses. If the output is wrong too often, the method says the cause is somewhere in the steps or the inputs, and it gives you tools to find that cause with evidence rather than opinion, fix it, and keep it fixed.</p>\n<p>Two words in the name point to its two halves.</p>\n<p><strong>Lean</strong> is about speed and waste. It comes from the Toyota Production System developed in Japan after the Second World War, where engineers such as Taiichi Ohno worked out how to make cars with far less inventory, space and rework than American factories used. Lean asks: which steps actually add value for the customer, and how do we remove the rest?</p>\n<p><strong>Six Sigma</strong> is about consistency and defects. It was created at Motorola in the 1980s by an engineer named Bill Smith, then made famous by General Electric under Jack Welch in the 1990s. Six Sigma asks: how much does our output vary from what the customer wants, and what is causing that variation?</p>\n<p>The two were combined in the early 2000s because they answer different questions about the same process. A fast process that produces errors is no good; a perfect process that takes three weeks is no good either. <strong>Continuous improvement</strong> is the broader habit both belong to: treating every process as something that can always be made better, in small steps, using data.</p>\n<h3>Where the name comes from</h3>\n<p><strong>Sigma</strong> (the Greek letter σ) is the symbol statisticians use for <strong>standard deviation</strong>, which is a number that describes how spread out a set of values is. A small standard deviation means the values sit close together; a large one means they are scattered. You will learn to calculate it in Week 2. For now, treat it as \"how much the output wanders.\"</p>\n<p>A process that runs at \"six sigma\" is one where the customer's limits sit six standard deviations away from the process average on each side. That is an extremely consistent process: about 3.4 <strong>defects</strong> per million opportunities, where a defect is any output that fails a customer requirement. Almost nobody actually needs six-sigma performance on every process. The name stuck as a label for the method, not a target every project must hit.</p>\n<h3>Y = f(x): results are caused upstream</h3>\n<p>The single most useful idea in the whole method is written <strong>Y = f(x)</strong>, read aloud as \"Y is a function of x.\"</p>\n<ul>\n<li><strong>Y</strong> is the result you care about: the output measure. Late deliveries per month. Errors per hundred forms. Minutes to answer a call.</li>\n<li><strong>x</strong> stands for the inputs and process factors that drive that result: the causes. Which supplier was used. Whether the form was filled in on screen or by hand. How many people were rostered.</li>\n<li><strong>f( )</strong> just means \"depends on.\"</li>\n</ul>\n<p>The message is that you cannot fix Y by staring at Y. If late deliveries are your problem, counting late deliveries more carefully changes nothing. You have to find the x's that produce lateness and change those. Every tool in this course is a way of either measuring Y honestly or finding and proving which x's matter.</p>\n<p>Y is also called the <strong>output</strong>, the <strong>dependent variable</strong>, or the <strong>CTQ</strong> (critical to quality, covered on Day 4). The x's are called <strong>inputs</strong>, <strong>factors</strong>, or <strong>independent variables</strong>. The exam uses all of these names interchangeably.</p>\n<h3>DMAIC: five phases, one story</h3>\n<p>Lean Six Sigma projects follow a fixed sequence called <strong>DMAIC</strong> (pronounced \"duh-may-ick\"). Each letter is a phase, and each phase has to be finished before the next begins. The end of each phase is a review meeting called a <strong>tollgate</strong>, where the sponsor checks the work and approves moving on. That is where this app gets its name.</p>\n<table>\n<thead>\n<tr>\n<th>Phase</th>\n<th>Question it answers</th>\n<th>Main deliverables</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Define</strong></td>\n<td>What is the problem, for whom, and what will \"fixed\" look like?</td>\n<td>Project charter, problem statement, customer requirements, high-level process map</td>\n</tr>\n<tr>\n<td><strong>Measure</strong></td>\n<td>How bad is it now, measured honestly?</td>\n<td>Data collection plan, checked measurement system, baseline performance</td>\n</tr>\n<tr>\n<td><strong>Analyse</strong></td>\n<td>What is actually causing it?</td>\n<td>List of causes tested with data; the vital few x's confirmed</td>\n</tr>\n<tr>\n<td><strong>Improve</strong></td>\n<td>What change removes the cause, and does it work?</td>\n<td>Solution chosen, piloted and shown to move Y</td>\n</tr>\n<tr>\n<td><strong>Control</strong></td>\n<td>How do we make sure it stays fixed?</td>\n<td>Control plan, monitoring charts, updated procedures, handover to the process owner</td>\n</tr>\n</tbody>\n</table>\n<p>A <strong>deliverable</strong> is a concrete output a phase must produce before its tollgate. Exam questions often describe a deliverable and ask which phase it belongs to, so learn the right-hand column.</p>\n<h3>Who does what: the belts</h3>\n<p>Six Sigma borrowed the martial-arts belt idea to name roles. The colours describe training and responsibility, not seniority in the company.</p>\n<ul>\n<li><strong>Champion</strong> (also called the sponsor): a senior manager who owns the business problem, picks the project, removes obstacles and attends tollgates. Does not run the analysis.</li>\n<li><strong>Master Black Belt</strong>: a full-time expert who trains and coaches Black and Green Belts and looks after the improvement programme across the organisation.</li>\n<li><strong>Black Belt</strong>: usually full-time on improvement. Leads complex, cross-department projects and mentors Green Belts.</li>\n<li><strong>Green Belt</strong>: a person with a normal job who has been trained to lead smaller projects in their own area, typically part-time. This is the level this course prepares you for.</li>\n<li><strong>Yellow Belt</strong> (and White Belt in some schemes): basic awareness. Team members who help collect data and take part in improvement events.</li>\n<li><strong>Process owner</strong>: the manager responsible for the process day to day. Receives the improved process at the end of Control and keeps it running.</li>\n</ul>\n<h3>Three voices</h3>\n<p>A project has to satisfy three groups, and the method gives each a name.</p>\n<ul>\n<li><strong>Voice of the customer (VOC)</strong>: what the people who receive the output need and complain about. Gathered from complaints, surveys, interviews and observation. This is where requirements come from.</li>\n<li><strong>Voice of the business (VOB)</strong>: what the organisation needs, such as cost, margin, compliance and growth. Sets the reason the project is worth doing.</li>\n<li><strong>Voice of the employee (VOE)</strong>: what the people doing the work know about frustrations, workarounds and obstacles. Often the fastest route to the real causes.</li>\n</ul>\n<p>When a question asks where a project's requirements or defect definitions should come from, the answer is the voice of the customer. When it asks why the business is funding the project, the answer is the voice of the business.</p>","Worked Example":"<p>A regional courier receives complaints that parcels arrive late. Follow how a Green Belt would frame this before touching any data.</p>\n<ol>\n<li><strong>Name the process and its output.</strong> The process is \"deliver a parcel from depot to customer.\" The output measure (Y) is the percentage of parcels delivered after the promised time. Last month: 1 480 of 12 300 parcels were late, which is 12.0%.</li>\n<li><strong>Separate Y from the x's.</strong> Brainstormed causes (x's): driver route order, parcels sorted to the wrong van, address errors on the label, van breakdowns, traffic on two particular routes, and parcels arriving at the depot after the morning cut-off. None of these is proven yet; they are candidates.</li>\n<li><strong>Check which voice each fact comes from.</strong> \"Late means after the time we promised on the tracking page\" is the voice of the customer. \"Each late parcel costs about $9 in re-delivery and refunds, so 1 480 late parcels cost about $13 300 a month\" is the voice of the business. \"The sort screen freezes twice a shift, so we guess the van\" is the voice of the employee, and it points to a likely x.</li>\n<li><strong>Place the work in DMAIC.</strong> Everything above is Define: naming the problem and its output measure. Measure would confirm the 12.0% with a reliable count and break it down by route and day. Analyse would test whether, say, late depot arrivals really do produce late deliveries. Improve would trial a fix for the confirmed cause. Control would keep the late rate on a chart so it does not creep back.</li>\n<li><strong>Assign roles.</strong> The operations manager is the Champion. The depot supervisor is the process owner. You, as Green Belt, lead the project part-time with two drivers and a sorter as team members.</li>\n</ol>\n<p>Nothing has been fixed yet, and that is the point. Rushing to a solution before Define and Measure is the most common way projects fail.</p>","Formula Card":"<ul>\n<li><code>Y = f(x)</code> — the result Y depends on the input and process factors x. Fix x's to change Y.</li>\n<li><code>Defect</code> — any output that fails a customer requirement. <code>Defective</code> — a unit with one or more defects.</li>\n<li><code>Six sigma performance ≈ 3.4 defects per million opportunities</code> (with the standard 1.5-sigma shift, covered on Day 3).</li>\n<li>DMAIC order: Define → Measure → Analyse → Improve → Control.</li>\n</ul>","Exam Traps":"<ul>\n<li>Lean is about waste and speed; Six Sigma is about variation and defects. Questions swap them.</li>\n<li>Six Sigma originated at Motorola (Bill Smith), not General Electric. GE made it famous.</li>\n<li>Lean originated at Toyota (Taiichi Ohno and colleagues), not in the United States.</li>\n<li>The Champion sponsors and removes obstacles; the Black Belt leads complex projects; the Green Belt leads smaller projects part-time. Do not give the Champion analysis tasks.</li>\n<li>Requirements and defect definitions come from the voice of the customer, not the voice of the business.</li>\n<li>A deliverable belongs to the phase that produces it. Charter is Define; baseline is Measure; confirmed causes is Analyse; piloted solution is Improve; control plan is Control.</li>\n<li>\"Six sigma\" describes a level of performance (3.4 defects per million opportunities). It is not the number of phases, tools or belts.</li>\n</ul>","Applied Task":"<p>List three processes in your own workplace that produce a result people complain about. For each, write one line naming the process, one line naming its output measure Y as something you could count or time, and three candidate x's. Mark which of the three voices (customer, business, employee) each complaint came from. Paste the list to your coach.</p>"}},{"day":2,"week":1,"phase":"Define","title":"Lean and the Seven Wastes","minutes":50,"sections":["1.4"],"objectives":["State the five Lean principles and say what \"value\" means to a customer","Outline where Lean came from and name the people and companies the exam asks about","Explain why Lean and Six Sigma are used together and which problems each one suits","Name the seven wastes, recognise each one in an office or a factory, and sort activities into value-added and non-value-added","Describe the five steps of 5S and what a 5S workplace looks like"],"terms":["value","value-added","non-value-added","value stream","flow","pull","push","waste","Toyota Production System","just-in-time","jidoka","kaizen","seven wastes","transport","inventory","motion","waiting","overproduction","over-processing","5S","work in process","batch","visual management","gemba"],"check":["D-1.4-001","D-1.4-004","D-1.4-007","D-1.4-010","D-1.4-013"],"html":{"The Idea":"<h3>What Lean is for</h3>\n<p>Day 1 introduced Lean as the half of Lean Six Sigma that deals with speed and waste. Today goes deeper, because the exam has a whole section on it and because most of the quick wins in a Green Belt project are Lean wins.</p>\n<p>Lean starts from one question: what does the customer actually pay for? The answer is <strong>value</strong>: the parts of the work that change the product or service into something the customer wants. Everything else the process does, however busy it looks, is cost. Lean calls that cost <strong>waste</strong> (the Japanese word is <em>muda</em>). The aim of Lean is to find the waste in a process and remove it, so that value reaches the customer faster, with less effort and at lower cost.</p>\n<p>An activity is <strong>value-added</strong> if it passes all three of these tests:</p>\n<ol>\n<li>The customer would be willing to pay for it if they knew it was happening.</li>\n<li>It physically changes the product or moves the service forward (it transforms something).</li>\n<li>It is done right the first time.</li>\n</ol>\n<p>Anything that fails one of the tests is <strong>non-value-added</strong>. Some non-value-added work is still required, for example a legal check or a safety inspection; Lean calls this <strong>business non-value-added</strong> (or necessary non-value-added) and tries to make it as small as possible rather than remove it. Studies of ordinary processes routinely find that value-added time is less than 5% of the total time an item spends in the process. The rest is waiting, moving, checking and re-doing.</p>\n<h3>The five Lean principles</h3>\n<p>Two researchers, James Womack and Daniel Jones, summarised Lean in 1996 as five principles. The exam expects you to know them in order.</p>\n<ol>\n<li><strong>Specify value</strong> from the customer's point of view, not from the organisation's.</li>\n<li><strong>Identify the value stream</strong>: the full sequence of steps, across departments, that delivers a product or service. Mapping it shows where waste sits. (You will draw one on Day 9.)</li>\n<li><strong>Make value flow</strong>: arrange the steps so the item moves through them without stopping, waiting or going backwards. <strong>Flow</strong> is the opposite of piling work up between steps.</li>\n<li><strong>Let the customer pull</strong>: do work only when the next step, and ultimately the customer, asks for it. <strong>Pull</strong> means producing to actual demand. <strong>Push</strong> means producing to a forecast or a schedule and sending the work on whether the next step is ready or not. Push creates piles; pull creates flow.</li>\n<li><strong>Pursue perfection</strong>: repeat the cycle. There is always more waste to find.</li>\n</ol>\n<h3>Where Lean came from</h3>\n<p>Henry Ford's assembly line in 1913 was the first large-scale example of flow: cars moved past workers instead of workers walking to cars. But Ford's system only worked for one product made in huge volumes.</p>\n<p>After the Second World War, Toyota in Japan could not afford Ford-style mass production. It had little cash, small local demand and needed to build several models on the same lines. Engineer Taiichi Ohno, with the consultant Shigeo Shingo and under the Toyoda family, developed what became the <strong>Toyota Production System</strong> (usually shortened to TPS) during the 1950s to 1970s. Its two pillars are:</p>\n<ul>\n<li><strong>Just-in-time</strong>: make and deliver only what is needed, when it is needed, in the amount needed. This is pull in practice, and it forces inventory down.</li>\n<li><strong>Jidoka</strong>: build quality in by giving machines and people the ability to stop the line the moment a defect appears, so the problem is fixed at its source rather than passed on. Sometimes translated as \"automation with a human touch.\"</li>\n</ul>\n<p>TPS also gave us <strong>kaizen</strong> (continuous small improvements made by the people who do the work), the seven wastes described below, and the habit of going to <strong>gemba</strong>, the actual place where the work happens, to see problems first hand instead of reading about them in a report.</p>\n<p>The word \"Lean\" itself is American. Researcher John Krafcik used \"lean production\" in a 1988 article to describe Toyota's approach because it used less of everything: less space, less inventory, less effort, fewer defects. A study of the world's car plants by the Massachusetts Institute of Technology (MIT), published in 1990 as <em>The Machine That Changed the World</em> (Womack, Jones and Roos), made the term famous. From there Lean spread to every industry, including hospitals, banks and government.</p>\n<h3>Lean and Six Sigma together</h3>\n<p>Lean and Six Sigma solve different problems with different tools, and a real process usually has both problems.</p>\n<table>\n<thead>\n<tr>\n<th></th>\n<th>Lean</th>\n<th>Six Sigma</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Enemy</td>\n<td>Waste and delay</td>\n<td>Variation and defects</td>\n</tr>\n<tr>\n<td>Typical question</td>\n<td>Why does this take three weeks?</td>\n<td>Why does this come out wrong one time in ten?</td>\n</tr>\n<tr>\n<td>Typical tools</td>\n<td>Value stream map (Day 9), 5S, pull, standard work (an agreed best way of doing each step)</td>\n<td>Statistical tests, capability and control charts (all taught from Week 3 on)</td>\n</tr>\n<tr>\n<td>Typical result</td>\n<td>Shorter total time from request to delivery, less inventory, freed-up space</td>\n<td>Fewer defects, more predictable output</td>\n</tr>\n</tbody>\n</table>\n<p>Used alone, Lean can make a process fast but leave it inconsistent, and Six Sigma can make a process consistent but leave it slow and expensive. Combined, one project can use the value stream map to find where time goes and the statistics to find out why quality varies. In practice, most Green Belt projects use Lean tools to remove obvious waste early, then Six Sigma tools to attack the variation that remains. The DMAIC structure from Day 1 holds both.</p>\n<h3>The seven wastes</h3>\n<p>Ohno listed seven kinds of waste. IASSC (the International Association for Six Sigma Certification, which sets the exam) counts seven, and the exam will test you on them by description, so learn what each one looks like in practice. The mnemonic <strong>TIMWOOD</strong> puts them in a memorable order.</p>\n<table>\n<thead>\n<tr>\n<th>Letter</th>\n<th>Waste</th>\n<th>What it is</th>\n<th>Office example</th>\n<th>Factory example</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>T</td>\n<td><strong>Transport</strong></td>\n<td>Moving product, materials or documents between locations. Movement of the <em>thing being worked on</em>.</td>\n<td>A form carried between three buildings for signatures</td>\n<td>Parts trucked between two plants</td>\n</tr>\n<tr>\n<td>I</td>\n<td><strong>Inventory</strong></td>\n<td>Anything held that is not being worked on right now: raw material, finished goods, or <strong>work in process</strong> (items part-way through).</td>\n<td>400 unread emails; a backlog of claims</td>\n<td>Pallets of parts waiting beside a machine</td>\n</tr>\n<tr>\n<td>M</td>\n<td><strong>Motion</strong></td>\n<td>Movement of <em>people</em> that adds no value: walking, reaching, searching, clicking between screens.</td>\n<td>Walking to a shared printer 40 times a day</td>\n<td>Bending to pick parts from a low bin</td>\n</tr>\n<tr>\n<td>W</td>\n<td><strong>Waiting</strong></td>\n<td>Idle time when the item or the person is waiting for the next step, an approval, a machine or information.</td>\n<td>A quote sitting in a manager's inbox for two days</td>\n<td>Operator waiting for a forklift</td>\n</tr>\n<tr>\n<td>O</td>\n<td><strong>Overproduction</strong></td>\n<td>Making more than is needed, or making it earlier than needed. Ohno called this the worst waste because it causes the others.</td>\n<td>Printing 200 reports when 20 are read</td>\n<td>Building to a forecast that never arrives</td>\n</tr>\n<tr>\n<td>O</td>\n<td><strong>Over-processing</strong></td>\n<td>Doing more work than the customer requires: extra approvals, unnecessary precision, re-entering the same data, gold-plating (adding quality the customer did not ask for).</td>\n<td>Five signatures on a $50 purchase</td>\n<td>Polishing a surface the customer never sees</td>\n</tr>\n<tr>\n<td>D</td>\n<td><strong>Defects</strong></td>\n<td>Output that is wrong and must be scrapped, reworked, corrected or re-explained.</td>\n<td>An invoice with the wrong address that has to be re-issued</td>\n<td>A weld that fails inspection</td>\n</tr>\n</tbody>\n</table>\n<p>Two of the wastes are easy to confuse. Transport is the movement of the <em>item</em>; motion is the movement of the <em>person</em>. A clerk walking to a filing cabinet is motion. A file being couriered to another office is transport.</p>\n<p>Many Lean books add an eighth waste, unused human talent or skills. The IASSC Green Belt syllabus lists seven, so if a question asks how many wastes Ohno identified, the answer is seven.</p>\n<h3>Why overproduction is the worst</h3>\n<p>Overproduction is singled out because it manufactures the other wastes. Making too much creates inventory. Inventory has to be moved (transport) and stored, so people walk around it (motion). Items sit (waiting), and defects hide in the pile until someone finally uses the item, by which time hundreds more have been made the same way. Working to pull, so that nothing is made until it is needed, is the main defence.</p>\n<h3>Batches and flow</h3>\n<p>Most offices and factories work in a <strong>batch</strong>: collect a pile of items, then process the whole pile at each step. Batching feels efficient, but it means every item waits for the whole pile at every step. If ten forms are processed in a batch through three steps that each take one minute per form, the first form is not finished until minute 21 and the last until minute 30. Processed one at a time in flow, the first form is finished at minute 3 and the last at minute 12. Reducing batch size is one of the fastest ways to cut the total time an item spends in a process, and it costs nothing.</p>\n<h3>5S</h3>\n<p><strong>5S</strong> is a Lean method for organising a workplace so that waste, especially motion, waiting and defects, becomes visible and stops recurring. The five steps come from five Japanese words beginning with S; the English versions used by IASSC (the International Association for Six Sigma Certification, the body that sets the exam you are studying for) are listed below. The exam paper spells the fourth step \"Standardize\"; this course uses the Australian spelling.</p>\n<ol>\n<li><strong>Sort</strong> (<em>seiri</em>): remove from the area everything that is not needed for the current work. A red tag is placed on doubtful items and they are removed if nobody claims them within an agreed period.</li>\n<li><strong>Straighten</strong> (<em>seiton</em>, also called Set in Order): give everything that remains a fixed, labelled place, close to where it is used. \"A place for everything and everything in its place.\" Shadow boards for tools (boards with an outline of each tool where it hangs, so a missing tool is obvious) and marked floor areas are typical.</li>\n<li><strong>Shine</strong> (<em>seiso</em>): clean the area and the equipment, and keep them clean. Cleaning is also inspection: leaks, wear and loose parts are found early.</li>\n<li><strong>Standardise</strong> (<em>seiketsu</em>): write down the agreed arrangement and cleaning routine so every shift and every person keeps the first three S's the same way. Photographs of the correct state, checklists and colour codes are common.</li>\n<li><strong>Self-discipline</strong> (<em>shitsuke</em>, also called Sustain): make the standard a habit through training, regular audits and management attention. Without this step the area slides back within weeks.</li>\n</ol>\n<p>5S applies to offices and computer drives as much as to workshops: a shared drive with 30 000 unnamed files is an unsorted workplace. 5S is also the foundation of <strong>visual management</strong>: arranging the workplace so that anyone can see at a glance whether things are normal or abnormal, such as a marked shelf that shows when stock is low.</p>\n<p>The exam sometimes asks which S a described activity belongs to. Removing unneeded items is Sort; labelling locations is Straighten; cleaning as inspection is Shine; writing the routine down is Standardise; auditing and habit-building is Self-discipline.</p>","Worked Example":"<p>A hospital pathology laboratory receives blood samples from wards and returns results. Staff complain that results take too long. A Green Belt walks the process at gemba with a stopwatch and follows one routine sample.</p>\n<ol>\n<li><strong>Record what happens to the sample.</strong></li>\n</ol>\n<table>\n<thead>\n<tr>\n<th>Step</th>\n<th>What happens</th>\n<th>Minutes</th>\n<th>Value-added?</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1</td>\n<td>Sample sits in a ward collection tray until the porter's hourly round</td>\n<td>38</td>\n<td>No: waiting</td>\n</tr>\n<tr>\n<td>2</td>\n<td>Porter carries the tray to the lab</td>\n<td>6</td>\n<td>No: transport</td>\n</tr>\n<tr>\n<td>3</td>\n<td>Sample sits in the lab reception basket until a batch of 20 is ready</td>\n<td>25</td>\n<td>No: waiting (batching)</td>\n</tr>\n<tr>\n<td>4</td>\n<td>Technician walks to the label printer and back for each sample</td>\n<td>3</td>\n<td>No: motion</td>\n</tr>\n<tr>\n<td>5</td>\n<td>Sample is spun in the centrifuge</td>\n<td>10</td>\n<td>Yes: transforms the sample</td>\n</tr>\n<tr>\n<td>6</td>\n<td>Analyser runs the test</td>\n<td>12</td>\n<td>Yes: produces the result</td>\n</tr>\n<tr>\n<td>7</td>\n<td>Result is printed, then typed into a second system by a clerk</td>\n<td>4</td>\n<td>No: over-processing</td>\n</tr>\n<tr>\n<td>8</td>\n<td>1 in 25 samples is rejected as mislabelled and re-collected</td>\n<td>90 (averaged: 3.6)</td>\n<td>No: defects</td>\n</tr>\n</tbody>\n</table>\n<ol start=\"2\">\n<li>\n<p><strong>Add up the time.</strong> Total time from collection to result: 38 + 6 + 25 + 3 + 10 + 12 + 4 + 3.6 = 101.6 minutes. Value-added time: 10 + 12 = 22 minutes.</p>\n</li>\n<li>\n<p><strong>Calculate the share that is value-added.</strong> 22 ÷ 101.6 = 0.2165, so about 21.7%. Nearly four-fifths of the time is waste.</p>\n</li>\n<li>\n<p><strong>Name the wastes.</strong> Waiting (steps 1 and 3), transport (2), motion (4), over-processing (7) and defects (8). Inventory is visible too: the batch of 20 in step 3 is work in process. Overproduction is the only waste not seen for a single sample.</p>\n</li>\n<li>\n<p><strong>Pick the first targets.</strong> The two waiting steps are 63 minutes of the 101.6. Sending samples as they are collected (pull, smaller batches) rather than in hourly rounds and batches of 20 would remove most of that without any new equipment. The double data entry in step 7 is a candidate for removal once the two systems can share data. The mislabelling defects are a Six Sigma problem: the team needs data on where the labels go wrong before fixing them.</p>\n</li>\n</ol>\n<p>A single lab sample at 21.7% is already better than most office processes, where value-added time is often below 5%. Nothing here needed statistics. Walking the process and classifying each step as value-added or waste found 80 minutes of opportunity in a single walk of the process.</p>","Formula Card":"<p>No formulas in this lesson, but two lists to memorise.</p>\n<ul>\n<li>The seven wastes, TIMWOOD: Transport, Inventory, Motion, Waiting, Overproduction, Over-processing, Defects.</li>\n<li>5S in order: Sort, Straighten, Shine, Standardise, Self-discipline.</li>\n<li>Value-added test: the customer would pay for it, it transforms the item, and it is done right first time. All three must be true.</li>\n</ul>","Exam Traps":"<ul>\n<li>Transport is movement of the item; motion is movement of the person. Questions describe a person walking and offer \"transport\" as a distractor.</li>\n<li>Overproduction is making too much or too early, and is described as the worst waste because it causes the others. It is not the same as over-processing, which is doing more work per item than needed.</li>\n<li>Inventory includes work in process and information (unread emails, unprocessed claims), not only physical stock.</li>\n<li>IASSC lists seven wastes. \"Unused talent\" is a common eighth in books, but the answer to \"how many\" is seven.</li>\n<li>The five Lean principles run in order: value, value stream, flow, pull, perfection. Pull is the customer triggering work; push is producing to a schedule or forecast.</li>\n<li>The Toyota Production System came from Taiichi Ohno (with Shigeo Shingo). The word \"Lean\" was coined by John Krafcik in 1988 and popularised by the 1990 MIT study by Womack, Jones and Roos. Six Sigma came from Motorola. Questions mix these up.</li>\n<li>Just-in-time and jidoka are the two pillars of TPS. Kaizen is the habit of small continuous improvements, not a pillar.</li>\n<li>5S order matters: you cannot Straighten before you Sort. Standardise is writing the arrangement down; Self-discipline (Sustain) is keeping it going through audits and habit.</li>\n<li>Business non-value-added work (a legally required check) is still non-value-added. It is minimised, not counted as value.</li>\n</ul>","Applied Task":"<p>If you have not yet chosen the improvement project you will use for the applied tasks in this course, choose it now: one process in your own organisation, with a result people complain about, that you can get historical data for. You will draft its charter on Day 4.</p>\n<p>For today, choose one process in your organisation that people say is slow (it can be your project process). Follow one item through it, using historical timestamps from your system if you cannot watch it live (for example, the time a request was logged, assigned, actioned and closed). Build a table like the worked example: each step, its minutes, whether it is value-added, and which of the seven wastes it is if not. Calculate the value-added percentage. Under the table, write which two wastes you would attack first and one pull or batch-size change that would reduce them. Paste the table and your two sentences to your coach.</p>"}},{"day":3,"week":1,"phase":"Define","title":"Variation, Metrics and the Cost of Poor Quality","minutes":50,"sections":["1.2"],"objectives":["Explain why variation, not the average, is the enemy of a process","Tell a unit, an opportunity, a defect and a defective apart","Calculate defects per unit (DPU), defects per opportunity (DPO), defects per million opportunities (DPMO), first time yield and rolled throughput yield from counts","Convert DPMO to a sigma level using the sigma table and say what the 1.5-sigma shift means","Sort quality costs into the four cost of poor quality categories","Build a Pareto chart from category counts and read the vital few from it"],"terms":["common cause variation","special cause variation","unit","opportunity","DPU","DPO","DPMO","yield","first time yield","rolled throughput yield","cycle time","lead time","sigma level","1.5-sigma shift","cost of poor quality","internal failure cost","external failure cost","appraisal cost","prevention cost","hidden factory","Pareto analysis","80:20 rule","vital few","Pareto chart","rework","scrap"],"check":["D-1.2-001","D-1.2-004","D-1.2-008","D-1.2-011","D-1.2-016"],"html":{"The Idea":"<h3>Variation is the enemy</h3>\n<p>Day 1 said that Six Sigma is about consistency. Here is why that matters more than the average.</p>\n<p>Suppose a customer needs a delivery within 3 days. (In statistics the ordinary average is called the <strong>mean</strong>; the two words are used interchangeably in this course.) Courier A averages 2.0 days and every delivery lands between 1.5 and 2.5 days. Courier B also averages 2.0 days, but deliveries range from 0.5 to 4.5 days. Both have the same average. Only Courier A meets the customer's need every time. The difference between them is <strong>variation</strong>: how far individual results scatter around the average. A customer experiences individual deliveries, not averages, so the scatter is what produces defects.</p>\n<p>Variation has two sources, and telling them apart runs through the whole course.</p>\n<ul>\n<li><strong>Common cause variation</strong> is the ordinary, ever-present scatter built into the process: slight differences in traffic, in how people work, in materials. It is there all the time and it is predictable in the sense that the process stays within a stable band. You reduce it only by changing the process itself.</li>\n<li><strong>Special cause variation</strong> comes from something unusual that is not normally part of the process: a road closure, a new untrained driver, a machine fault. It shows up as an unexpected result or pattern. You deal with it by finding the specific cause and removing it.</li>\n</ul>\n<p>A process with only common cause variation is called <strong>stable</strong> or \"in control\". The control charts you meet on Day 24 exist to tell the two kinds apart. For now, the lesson is that a bad result is not automatically a special cause; it may be the ordinary variation of a process that is not good enough.</p>\n<h3>Counting defects properly: units, opportunities, defects</h3>\n<p>To measure how bad a process is you need four words with exact meanings.</p>\n<ul>\n<li>A <strong>unit</strong> is one item of output: one invoice, one patient discharge, one pump, one insurance claim.</li>\n<li>An <strong>opportunity</strong> is one distinct chance for a unit to be wrong, defined in advance. An invoice with five fields that can be wrong has five opportunities. Only count things the customer would see as a defect and that the process could reasonably get wrong; padding the opportunity count is a known way to make a process look better than it is.</li>\n<li>A <strong>defect</strong> is one failure to meet a requirement. A single unit can carry several defects.</li>\n<li>A <strong>defective</strong> is a unit with one or more defects. A unit with three defects is one defective.</li>\n</ul>\n<p>From these come the basic Six Sigma metrics. Each is a count divided by a count, and the exam expects you to do the division.</p>\n<p><strong>DPU</strong>, defects per unit: total defects divided by total units inspected. It tells you how many defects the average unit carries. DPU can be more than 1.</p>\n<p><strong>DPO</strong>, defects per opportunity: total defects divided by total opportunities, where total opportunities = units × opportunities per unit. It is a proportion between 0 and 1.</p>\n<p><strong>DPMO</strong>, defects per million opportunities: DPO multiplied by 1 000 000. It scales DPO to a whole number that is easy to compare across processes and is the input to the sigma table.</p>\n<p><strong>Yield</strong> is the proportion of units that come out right. Two versions matter.</p>\n<ul>\n<li><strong>First time yield</strong> (FTY) for one step is the number of units that pass the step without any rework or scrap, divided by the number that entered it. If 500 invoices were raised and 455 had no defects at all, first time yield is 455 ÷ 500 = 91%. Units that were fixed and then passed do not count as first-time passes; that is the whole point of the measure. Yield measured after rework is called final yield and hides the cost of fixing things.</li>\n<li><strong>Rolled throughput yield</strong> (RTY) for a whole process with several steps is the first time yields of the steps multiplied together. It is the probability that a unit goes through every step without a single defect. Because it multiplies, RTY is never higher than the worst individual step, and a process of ten 95% steps has an RTY of only 0.95 to the power 10, about 60%.</li>\n</ul>\n<p>When you have DPU but not the unit counts, the exam convention estimates the yield as <code>e^(−DPU)</code>, where e is the mathematical constant 2.718 (use the e^x key on a calculator). For DPU = 0.12 that gives e^(−0.12) = 0.887, or 88.7%: the chance that a unit carries no defects at all. When defects are rare this is close to 1 − DPU, but the exponential version is the one the exam expects, so use it whenever a question gives DPU and asks for yield. When you have the counts, use them.</p>\n<p><strong>Cycle time</strong> is how long a process takes to complete one unit, measured from when work starts on that unit to when it is finished. <strong>Lead time</strong> is the total elapsed time from the customer's request to delivery, including all the waiting from Day 2. Lead time is what the customer feels; cycle time is what the process is doing. Day 9 uses both in the value stream map.</p>\n<h3>Sigma level and the 1.5-sigma shift</h3>\n<p>A <strong>sigma level</strong> is a single number that describes how many defects a process makes, on a scale where higher is better. It is read from DPMO using the standard sigma table (the reference sheet in this app has one). The table is built from the normal distribution you meet on Day 8, but you do not need the maths to use it. The main landmarks:</p>\n<table>\n<thead>\n<tr>\n<th>Sigma level</th>\n<th>DPMO</th>\n<th>Yield</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1</td>\n<td>691 462</td>\n<td>30.9%</td>\n</tr>\n<tr>\n<td>2</td>\n<td>308 538</td>\n<td>69.1%</td>\n</tr>\n<tr>\n<td>3</td>\n<td>66 807</td>\n<td>93.3%</td>\n</tr>\n<tr>\n<td>4</td>\n<td>6 210</td>\n<td>99.38%</td>\n</tr>\n<tr>\n<td>5</td>\n<td>233</td>\n<td>99.977%</td>\n</tr>\n<tr>\n<td>6</td>\n<td>3.4</td>\n<td>99.99966%</td>\n</tr>\n</tbody>\n</table>\n<p>If you look at the normal distribution (the bell-shaped curve that describes how most measured things scatter around their average; Day 8), a process whose limits sit six standard deviations from its mean makes about 0.002 defects per million, not 3.4. The 3.4 figure includes the <strong>1.5-sigma shift</strong>: a convention, introduced at Motorola, that a process measured over a short period will drift over the long run, and that the drift is worth about 1.5 standard deviations. So a process that is at 6 sigma in the short term behaves like a 4.5-sigma process in the long term, and 4.5 sigma on the normal distribution is 3.4 defects per million.</p>\n<p>In plain terms: the standard sigma table reports short-term sigma, and it does so by adding 1.5 to the number the normal distribution would give for the observed DPMO. When a question gives you a DPMO and asks for the sigma level, read the standard table; the shift is already built in. When a question says \"long-term sigma\" or \"without the shift\", subtract 1.5. Day 12 practises this.</p>\n<h3>Cost of poor quality</h3>\n<p>Defects cost money, and the <strong>cost of poor quality</strong> (COPQ) is the total cost an organisation incurs because its output is not right first time. The exam uses four categories. The first two are the costs of failure; the second two are the costs of trying to stop failure.</p>\n<table>\n<thead>\n<tr>\n<th>Category</th>\n<th>Meaning</th>\n<th>Examples</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Internal failure cost</strong></td>\n<td>Defects found before the customer receives the output</td>\n<td><strong>Scrap</strong> (output thrown away), <strong>rework</strong> (fixing output so it passes), re-testing, downtime, sorting, expediting (rushing late work through)</td>\n</tr>\n<tr>\n<td><strong>External failure cost</strong></td>\n<td>Defects found after delivery to the customer</td>\n<td>Warranty claims, returns, refunds, complaint handling, lost customers, penalties, recalls</td>\n</tr>\n<tr>\n<td><strong>Appraisal cost</strong></td>\n<td>Checking and inspecting to find defects</td>\n<td>Inspection, testing, audits, calibration (checking a measuring instrument against a known standard), reviewing documents</td>\n</tr>\n<tr>\n<td><strong>Prevention cost</strong></td>\n<td>Stopping defects from happening</td>\n<td>Training, mistake-proofing (designing the work so the error cannot be made; Day 23), process design, supplier qualification, planning</td>\n</tr>\n</tbody>\n</table>\n<p>External failure is the most expensive category per defect because it includes the customer's reaction. Prevention is the cheapest way to spend a quality dollar. A classic improvement moves spending from failure and appraisal into prevention.</p>\n<p>Most of the cost of poor quality is invisible in the accounts. The visible part (scrap, warranty, returns) is the tip of an iceberg; below the water sit overtime to catch up after rework, expediting, excess inventory held as a safeguard, lost sales and management time. The rework and checking that a process does routinely is sometimes called the <strong>hidden factory</strong>: a second, unofficial process that exists only to fix the output of the first. Estimates of total cost of poor quality in a typical organisation run at 15% to 25% of revenue.</p>\n<h3>Pareto analysis and the 80:20 rule</h3>\n<p>Once you have a list of defect types, complaint types or cost categories, the next question is where to start. <strong>Pareto analysis</strong> answers it. The <strong>80:20 rule</strong> (named after the economist Vilfredo Pareto, and applied to quality by Joseph Juran) observes that in most situations roughly 80% of the effect comes from roughly 20% of the causes. Juran called those causes the <strong>vital few</strong> and the rest the \"trivial many\" (later softened to \"useful many\").</p>\n<p>A <strong>Pareto chart</strong> is a bar chart of categories sorted from the largest count to the smallest, with a line above showing the cumulative percentage. Reading it:</p>\n<ol>\n<li>The tallest bars on the left are the vital few. Work on them first.</li>\n<li>Follow the cumulative line to where it crosses 80%; the categories to the left of that point are the ones that matter.</li>\n<li>The numbers rarely come out at exactly 80:20. It might be 70:30 or 90:10. The principle is that a small number of categories dominates, not the precise split.</li>\n</ol>\n<p>Two cautions. First, Pareto by count and Pareto by cost can rank categories differently; a rare but expensive defect may deserve attention before a common cheap one. Second, if the bars are all roughly the same height, Pareto is telling you that the categories you chose are not the right way to split the problem, and you should try another way to categorise.</p>","Worked Example":"<p>An accounts team raises about 3 000 customer invoices a month. Each invoice has five fields that can be wrong: customer name, address, purchase order number, line items and total. Each month a clerk checks a sample of 500 invoices. Last month the check found 60 defects, spread over 45 invoices.</p>\n<ol>\n<li><strong>DPU.</strong> 60 defects ÷ 500 units = 0.12 defects per unit.</li>\n<li><strong>DPO.</strong> Total opportunities = 500 × 5 = 2 500. DPO = 60 ÷ 2 500 = 0.024.</li>\n<li><strong>DPMO.</strong> 0.024 × 1 000 000 = 24 000 defects per million opportunities.</li>\n<li><strong>First time yield.</strong> 45 invoices had at least one defect, so 500 − 45 = 455 were right first time. FTY = 455 ÷ 500 = 0.91, or 91%. Note that 60 defects on 45 invoices means some invoices carried more than one defect; the defect count is 60, the defective count is 45.</li>\n<li><strong>Sigma level.</strong> Look up 24 000 DPMO on the sigma table. It lies between 3 sigma (66 807) and 4 sigma (6 210); the exact figure is about 3.5. With the 1.5 shift already in the table, the invoice process is running at roughly 3.5 sigma.</li>\n<li><strong>Rolled throughput yield.</strong> Invoicing is actually three steps: data entry (first time yield 95%), pricing (90%) and approval (98%). RTY = 0.95 × 0.90 × 0.98 = 0.8379, about 83.8%. So even though no single step is worse than 90%, only 84 invoices in 100 get through all three steps untouched.</li>\n<li><strong>Cost of poor quality.</strong> Each reworked invoice costs about $18 of staff time (internal failure). Invoices that reach the customer wrong are paid on average 21 days late and generate a <strong>credit note</strong> (a document cancelling part or all of an invoice so the customer pays less) costing $65 to process (external failure). The clerk spends four hours a month checking the 500-invoice sample ($140, appraisal). The team spent $600 on a one-off training session on the pricing screen (prevention). Sorting the costs this way shows the failure categories dominate.</li>\n<li><strong>Pareto.</strong> The 60 defects by field:</li>\n</ol>\n<table>\n<thead>\n<tr>\n<th>Field</th>\n<th>Defects</th>\n<th>Percent</th>\n<th>Cumulative %</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Purchase order number</td>\n<td>27</td>\n<td>45.0</td>\n<td>45.0</td>\n</tr>\n<tr>\n<td>Line items</td>\n<td>18</td>\n<td>30.0</td>\n<td>75.0</td>\n</tr>\n<tr>\n<td>Address</td>\n<td>8</td>\n<td>13.3</td>\n<td>88.3</td>\n</tr>\n<tr>\n<td>Total</td>\n<td>4</td>\n<td>6.7</td>\n<td>95.0</td>\n</tr>\n<tr>\n<td>Customer name</td>\n<td>3</td>\n<td>5.0</td>\n<td>100.0</td>\n</tr>\n</tbody>\n</table>\n<p>Two fields out of five (40% of categories) produce 75% of the defects. Those are the vital few. The project should start with the purchase order number.</p>","Formula Card":"<ul>\n<li><code>DPU = D ÷ U</code> — D is total defects, U is total units inspected.</li>\n<li><code>DPO = D ÷ (U × O)</code> — O is opportunities per unit.</li>\n<li><code>DPMO = DPO × 1 000 000</code>.</li>\n<li><code>FTY = units passing first time without rework ÷ units entering the step</code>.</li>\n<li><code>RTY = FTY₁ × FTY₂ × … × FTYₙ</code> — multiply the first time yields of every step.</li>\n<li><code>Yield from DPU = e^(−DPU)</code> — e = 2.718; the exam convention when only DPU is given. Use counts when you have them.</li>\n<li>Sigma level: read DPMO from the standard sigma table (includes the 1.5 shift). <code>Long-term sigma = short-term sigma − 1.5</code>.</li>\n<li><code>Percent of category = category count ÷ total count × 100</code>; cumulative percent adds down the sorted list.</li>\n</ul>","Exam Traps":"<ul>\n<li>Defects and defectives are different counts. 60 defects on 45 invoices: DPU uses 60; first time yield uses 45.</li>\n<li>DPO divides by units × opportunities, not by units. Dividing by units alone gives DPU.</li>\n<li>DPMO is DPO × 1 000 000, not DPU × 1 000 000. A question that gives DPU and asks for DPMO also needs opportunities per unit.</li>\n<li>First time yield excludes units that were reworked and then passed. If a question gives \"units started\" and \"units passed without rework\", use those; \"units shipped\" includes rework and is final yield.</li>\n<li>Rolled throughput yield multiplies step yields; it does not average them and it does not take the lowest.</li>\n<li>Yield from DPU is e^(−DPU), not 1 − DPU. For DPU = 0.5 the exam expects 60.7%, not 50%.</li>\n<li>The sigma table already includes the 1.5-sigma shift. 3.4 DPMO = 6 sigma on the table = 4.5 sigma on the plain normal distribution. Do not add 1.5 a second time.</li>\n<li>Cost categories: found before delivery is internal failure; found after delivery is external failure; inspection is appraisal even when it finds nothing; training is prevention.</li>\n<li>The Pareto principle is \"a few causes produce most of the effect\". The split is not always exactly 80:20 and the chart is sorted by size, not alphabetically or by time.</li>\n<li>Same average, different spread: the question is about variation. The process with the smaller spread is the better one.</li>\n</ul>","Applied Task":"<p>Take one month of historical output from the process in your own improvement project. Define the unit and list the opportunities per unit (write them down; you will be asked to defend the count). From your organisation's error, complaint or rework records, count the defects and the defective units for that month. Calculate DPU, DPO, DPMO, first time yield and the sigma level from the table. Then split the defects by type into a Pareto table with cumulative percentages and name the vital few. Finish with an estimate of last month's cost of poor quality, sorted into the four categories, using your organisation's labour rates and rework times. Paste the metrics, the Pareto table and the cost estimate to your coach.</p>"}},{"day":4,"week":1,"phase":"Define","title":"Customers, CTQs and the Project Charter","minutes":50,"sections":["1.1","1.2","1.3"],"objectives":["Distinguish internal from external customers and reactive from proactive ways of gathering their voice","Translate a vague customer statement into a critical to quality characteristic with a measure, a target and a limit","Define a process by naming its boundaries, inputs, outputs and owner","Write a problem statement and a goal statement that pass the exam's tests","List the elements of a project charter and a business case and say what each is for"],"terms":["customer","internal customer","external customer","requirement","critical to quality","CTQ tree","Kano model","operational definition","process boundary","project charter","problem statement","goal statement","scope","business case","milestone","stakeholder","SMART goal","affinity diagram"],"check":["D-1.3-001","D-1.3-003","D-1.2-020","D-1.1-021","D-1.3-006"],"html":{"The Idea":"<h3>Who the customer is</h3>\n<p>A <strong>customer</strong> is whoever receives the output of a process. Day 1 described the customer as whoever receives the output of a process. Most people picture the <strong>external customer</strong>: someone outside the organisation who pays for or uses the output. But most processes hand their output to another process inside the same organisation. The team that receives it is an <strong>internal customer</strong>. Payroll is the internal customer of the timesheet process; the surgeon is the internal customer of the sterilisation department. Internal customers have requirements too, and a defect that reaches them is still a defect. When a question describes a downstream department complaining, it is describing an internal customer.</p>\n<p>A <strong>requirement</strong> is something the customer needs the output to be or do. Requirements can be spoken (\"I need it by Friday\") or unspoken (\"I assume it will not arrive damaged\"). Six Sigma is strict that requirements come from the customer, not from what the organisation finds convenient to promise.</p>\n<h3>Gathering the voice of the customer</h3>\n<p>The voice of the customer is not a single survey. Sources fall into two groups.</p>\n<ul>\n<li><strong>Reactive</strong> sources arrive without being asked: complaints, returns, warranty claims, calls to the help desk, online reviews, credit notes. They are cheap and honest, but only the unhappiest customers speak up, so they under-count problems.</li>\n<li><strong>Proactive</strong> sources are collected on purpose: interviews, surveys, focus groups, observing the customer using the product, and market research. They cost more but reach the quiet majority and uncover needs the customer has never said aloud.</li>\n</ul>\n<p>A good project uses both. The raw material is a pile of statements in the customer's own words (\"your invoices are a nightmare\"), and the next job is to turn them into something measurable. A common first step is an <strong>affinity diagram</strong>: writing each statement on a card and grouping the cards into themes, so that 200 comments become 8 needs.</p>\n<p>The <strong>Kano model</strong> (Noriaki Kano, 1984) sorts needs into three kinds, and the exam occasionally asks about them.</p>\n<ul>\n<li><strong>Basic</strong> (must-be) needs: expected without being asked. Meeting them earns nothing; missing them causes anger. Brakes that work.</li>\n<li><strong>Performance</strong> needs: the more the better, and customers will say so. Battery life, delivery speed.</li>\n<li><strong>Delighters</strong> (excitement needs): unexpected features that please. Nobody complains when they are absent. Over time delighters become basics.</li>\n</ul>\n<h3>From need to critical to quality characteristic</h3>\n<p>A customer need is usually vague. A <strong>critical to quality</strong> characteristic (CTQ) is that need translated into a measurable feature of the output, with a target and a limit. Most projects get there with a <strong>CTQ tree</strong>, which drills down in three levels:</p>\n<ol>\n<li><strong>Need</strong>: what the customer wants, in their words. \"I want my order quickly.\"</li>\n<li><strong>Driver</strong>: what has to happen for the need to be met. \"Orders are picked promptly.\" \"Orders are shipped the day they are picked.\"</li>\n<li><strong>CTQ</strong>: a measurable characteristic with a specification. \"Order lead time from confirmation to dispatch, target 24 hours, upper limit 48 hours.\"</li>\n</ol>\n<p>A CTQ needs three things: a <strong>measure</strong> (what number will be collected and in what units), a <strong>target</strong> (the value the customer really wants) and a <strong>specification limit</strong> (the point beyond which the output is a defect). Specification limits are the customer's boundaries, not the process's usual performance. Day 11 measures how well a process fits inside them.</p>\n<p>Two more terms travel with CTQs. The <strong>operational definition</strong> is a written description of exactly how a measure is taken, so that two people measuring the same thing get the same answer: what counts as \"dispatched\", which clock is used, and where the record comes from. Without one, the data collected in Measure means different things to different people. And the CTQ is the project's Y from Day 1: the output measure that Y = f(x) is trying to move.</p>\n<h3>Defining a process</h3>\n<p>Before a problem can be measured, the team has to agree what the process is. Defining a process means stating:</p>\n<ul>\n<li>Its <strong>process boundaries</strong>: the first step (the trigger that starts it) and the last step (the point where the output is handed over). A boundary chosen too wide makes the project unmanageable; too narrow and the cause may sit outside it.</li>\n<li>Its <strong>inputs</strong> and who supplies them, and its <strong>outputs</strong> and who receives them.</li>\n<li>Its <strong>process owner</strong>, the manager accountable for how it runs.</li>\n<li>The high-level steps between the boundaries, usually five to seven. Day 5 introduces the SIPOC diagram (Suppliers, Inputs, Process, Outputs, Customers), which is the standard way of writing this down on one page.</li>\n</ul>\n<p>Exam questions on \"defining a process\" are usually about boundaries: they describe a project that keeps growing, or a cause that sits with a supplier, and ask what was missed.</p>\n<h3>The business case</h3>\n<p>A <strong>business case</strong> is the short argument for why the organisation should spend time and money on this project rather than another. It states what the problem costs now (using the cost of poor quality thinking from Day 3), what the improvement would be worth, how the project supports the organisation's strategy, and what happens if nothing is done. The business case i
