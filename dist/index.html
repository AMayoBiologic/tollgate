s the voice of the business written down, and it is what the Champion uses to defend the project to other managers. It should be no more than a few sentences, and its numbers must be checkable.</p>\n<h3>The project charter</h3>\n<p>The <strong>project charter</strong> is the one- or two-page document that authorises the project. It is the main deliverable of Define, it is signed by the Champion, and it is the reference every tollgate comes back to. The exam asks about its elements individually, so learn each one and what it is for.</p>\n<table>\n<thead>\n<tr>\n<th>Element</th>\n<th>What it says</th>\n<th>Test</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Business case</strong></td>\n<td>Why this project matters to the organisation, in money or strategic terms</td>\n<td>Would a manager fund it?</td>\n</tr>\n<tr>\n<td><strong>Problem statement</strong></td>\n<td>What is wrong, where, since when, how big, and what it costs</td>\n<td>Does it contain a measurable Y? Does it avoid causes, blame and solutions?</td>\n</tr>\n<tr>\n<td><strong>Goal statement</strong></td>\n<td>What the Y will be by when</td>\n<td>Is it specific, measurable and dated? (the SMART test, explained below)</td>\n</tr>\n<tr>\n<td><strong>Scope</strong></td>\n<td>Which process, which boundaries, which sites or products are in and out</td>\n<td>Could two people disagree about whether something is included?</td>\n</tr>\n<tr>\n<td><strong>Team</strong></td>\n<td>Champion, process owner, Green Belt, team members, and how much time each gives</td>\n<td>Is anyone missing who owns a step?</td>\n</tr>\n<tr>\n<td><strong>Timeline</strong></td>\n<td>Planned dates for each DMAIC tollgate; the <strong>milestones</strong></td>\n<td>Is it realistic? Green Belt projects typically run 3 to 6 months</td>\n</tr>\n</tbody>\n</table>\n<p>The charter is a living document. It is drafted in Define, but the numbers are refined once Measure produces a real baseline (the measured starting value of the Y, covered on Day 5), and scope may be tightened with the Champion's agreement. What must not change quietly is the goal.</p>\n<p><strong>Stakeholders</strong> are everyone with an interest in the process or the project, including people outside the team who can help or block it. Many charters list them, with a note on how each will be kept informed. Ignoring a stakeholder who owns part of the process is a common reason Improve stalls.</p>\n<h3>Writing a problem statement</h3>\n<p>A good problem statement answers five questions in two or three sentences: <strong>what</strong> is wrong, <strong>where</strong> it happens, <strong>when</strong> it started or was measured, <strong>how much</strong> (the measured size, the Y), and the <strong>impact</strong> on the customer or the business. It must not say why, and it must not say what to do about it. Both of those belong to later phases, and putting them in the charter commits the team to a cause before any data has been collected.</p>\n<p>Weak: \"Invoicing is a mess because the pricing system is out of date and we need to replace it.\"</p>\n<p>Strong: \"Between January and June, 9% of the 3 000 invoices raised each month at the Perth office contained at least one error, causing an average 21-day payment delay and about $15 400 a month in credit notes and rework.\"</p>\n<p>The weak version names a cause and a solution and has no number. The strong version has a place, a period, a measured Y, and an impact, and it leaves the cause open.</p>\n<h3>Writing a goal statement</h3>\n<p>A <strong>goal statement</strong> says what the Y will be and by when. The usual test is <strong>SMART</strong>: Specific, Measurable, Achievable, Relevant, Time-bound. It uses the same measure as the problem statement, so that success can be checked. \"Reduce the invoice error rate from 9% to 3% by 30 November\" is a goal. \"Improve invoicing\" is not. Aggressive but achievable is the norm; a Green Belt goal that halves the defect rate, or better, is typical. A goal must not describe the solution (\"implement the new pricing system by November\") because the solution is not known yet.</p>","Worked Example":"<p>Return to the courier from Day 1. The Champion has agreed there is a project. Follow how the Green Belt builds the charter.</p>\n<ol>\n<li>\n<p><strong>Gather the voice of the customer.</strong> Reactive: 312 complaints in three months, 240 of them about late arrival, 40 about damage, 32 about missed delivery windows. Proactive: 25 phone interviews with business customers. The interviews reveal an unspoken requirement: customers plan staff around the promised window, so a delivery two hours early is nearly as bad as one two hours late.</p>\n</li>\n<li>\n<p><strong>Build the CTQ tree.</strong>\n   - Need: \"Arrive when you said you would.\"\n   - Drivers: parcel loaded on the correct van; van follows a route that reaches the customer inside the window; depot cut-off met.\n   - CTQ: parcel arrival time relative to the promised window. Target: inside the window. Specification limits: no earlier than 30 minutes before the window opens, no later than the window closes. Operational definition: arrival is the driver's scan at the customer's door, from the handheld scanner clock; the window is the one printed on the tracking page. The current 12.0% figure counts late arrivals only; Measure will re-baseline the metric with early arrivals included.</p>\n</li>\n<li>\n<p><strong>Define the process.</strong> Boundary start: parcel scanned into the depot. Boundary end: driver's delivery scan. Out of scope: the long-distance trucking from the interstate hub to the depot, and parcels for the two remote routes served by contractors. Process owner: the depot supervisor.</p>\n</li>\n<li>\n<p><strong>Write the business case.</strong> 1 480 of 12 300 parcels a month (12.0%) miss the window. Each costs about $9 in re-delivery and refunds, about $13 300 a month, or $160 000 a year, plus three business accounts lost in the last quarter citing reliability.</p>\n</li>\n<li>\n<p><strong>Write the problem statement.</strong> \"From April to June, 12.0% of the 12 300 parcels delivered each month from the Perth metro depot arrived outside the promised delivery window, costing about $13 300 a month in re-delivery and refunds and contributing to the loss of three business accounts.\"</p>\n</li>\n<li>\n<p><strong>Write the goal statement.</strong> \"Reduce the percentage of parcels delivered outside the promised window from 12.0% to 5.0% by 31 October.\"</p>\n</li>\n<li>\n<p><strong>Name the team and the timeline.</strong> Champion: operations manager. Process owner: depot supervisor. Green Belt: you, one day a week. Team: two drivers, one sorter, one customer service officer. Tollgates: Define 31 July, Measure 21 August, Analyse 18 September, Improve 31 October (the goal is demonstrated here), Control 28 November.</p>\n</li>\n</ol>\n<p>Check the problem statement against the five questions: what (arrived outside the window), where (Perth metro depot), when (April to June), how much (12.0% of 12 300 a month), impact ($13 300 a month, three accounts). No cause, no solution. Check the goal: specific measure, number, date.</p>","Formula Card":"<p>No formulas in this lesson.</p>\n<ul>\n<li>Problem statement answers: what, where, when, how much, impact. Never why, never what to do.</li>\n<li>Goal statement is SMART: Specific, Measurable, Achievable, Relevant, Time-bound, and uses the same Y as the problem statement.</li>\n<li>CTQ tree: need → driver → CTQ (measure + target + specification limit).</li>\n<li>Charter elements: business case, problem statement, goal statement, scope, team, timeline.</li>\n</ul>","Exam Traps":"<ul>\n<li>A problem statement that contains a cause (\"because the system is old\") or a solution (\"we need to replace it\") is wrong, however well written. Questions offer these as the polished-sounding distractor.</li>\n<li>The problem statement and goal statement must use the same measure. A problem about error rate with a goal about cycle time is a mismatch.</li>\n<li>The goal is written in Define before causes are known, so it cannot name the solution.</li>\n<li>Internal customers count. The next department is a customer, and its requirements define defects for the upstream process.</li>\n<li>Complaints are reactive voice of the customer; surveys and interviews are proactive. Complaints alone under-count problems because most unhappy customers do not complain.</li>\n<li>A CTQ is measurable and has a target and a limit. \"Friendly service\" is a need; \"call answered within 30 seconds\" is a CTQ.</li>\n<li>Specification limits come from the customer. They are not the process's current best and worst.</li>\n<li>Scope creep (the project's boundaries growing after the charter is agreed) is a boundary problem. The fix is the charter's scope statement, agreed with the Champion, not a bigger team.</li>\n<li>The charter is signed by the Champion, is a Define deliverable, and is revisited at every tollgate. It is not frozen, but the goal is not changed without the Champion.</li>\n<li>Kano: basic needs cause dissatisfaction when missing but no satisfaction when present; delighters do the reverse; performance needs go both ways.</li>\n</ul>","Applied Task":"<p>Draft the charter for your own improvement project. Pull three months of historical figures for the Y from your organisation's records so that the problem statement has a real number, a place and a period. Write: the business case (two sentences with a dollar or hours figure), the problem statement (test it against what, where, when, how much, impact, and strike out any cause or solution), the goal statement (SMART, same measure), scope with the first and last step named, team with roles, and five tollgate dates. Add a three-level CTQ tree for the main customer need, ending in a CTQ with a measure, target, limit and operational definition. Paste the charter and the tree to your coach.</p>"}},{"day":5,"week":1,"phase":"Define","title":"SIPOC, Project Metrics and Benefits","minutes":50,"sections":["1.2","1.3","2.1"],"objectives":["Build a SIPOC diagram for a process and say what each column is for","Choose a primary metric, the secondary metrics that explain it and the consequential metrics that guard it","Set a baseline and a target and express the gap as a measurable benefit","Separate hard benefits from soft benefits and calculate an annual saving, a payback period and a return on investment","Explain how benefits are validated and tracked after the project closes"],"terms":["SIPOC","supplier","primary metric","secondary metric","baseline","target","hard benefit","soft benefit","cost avoidance","payback period","return on investment","net present value","benefits capture","financial representative","project selection","one-off cost","recurring saving"],"check":["M-2.1-001","M-2.1-003","D-1.3-009","D-1.3-012","D-1.2-023"],"html":{"The Idea":"<h3>SIPOC: the process on one page</h3>\n<p>Day 4 said that defining a process means fixing its boundaries, inputs, outputs and owner. The standard tool for writing that down is the <strong>SIPOC</strong> diagram, a five-column table whose name is its columns: <strong>Suppliers, Inputs, Process, Outputs, Customers</strong>.</p>\n<table>\n<thead>\n<tr>\n<th>Column</th>\n<th>Question it answers</th>\n<th>Example (invoice process)</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>S</strong>uppliers</td>\n<td>Who or what provides the inputs?</td>\n<td>Sales team, pricing system, customer master file</td>\n</tr>\n<tr>\n<td><strong>I</strong>nputs</td>\n<td>What does the process need to start and run?</td>\n<td>Signed order, price list, customer details, delivery note</td>\n</tr>\n<tr>\n<td><strong>P</strong>rocess</td>\n<td>The five to seven high-level steps between the boundaries</td>\n<td>Receive order → enter lines → price → approve → issue invoice</td>\n</tr>\n<tr>\n<td><strong>O</strong>utputs</td>\n<td>What does the process produce?</td>\n<td>Invoice, credit note, invoice record in ledger</td>\n</tr>\n<tr>\n<td><strong>C</strong>ustomers</td>\n<td>Who receives each output?</td>\n<td>Customer's accounts payable team, finance (internal), sales (internal)</td>\n</tr>\n</tbody>\n</table>\n<p>A <strong>supplier</strong> in SIPOC is anyone or anything that provides an input, whether an outside company, another department, a computer system or the customer themselves (a patient supplies the referral letter). Suppliers can also be customers of the same process, as when a customer supplies an order and receives an invoice.</p>\n<p>SIPOC is built in a particular order, and the exam sometimes asks for it. Start with the <strong>Process</strong> column: agree the first and last step (the boundaries from Day 4) and fill in five to seven steps between them. Then list the <strong>Outputs</strong> and the <strong>Customers</strong> who receive them. Then the <strong>Inputs</strong> each step needs, and finally the <strong>Suppliers</strong> of those inputs. Starting from the middle keeps the diagram at the right level of detail.</p>\n<p>SIPOC is deliberately high level. It does not show decisions, loops or who does what; that is the detailed process map on Day 9. Its purpose in Define is to get the team and the Champion agreeing on the same process, to show where the inputs come from (the x's often live with suppliers), and to list every customer whose requirements matter. It is also the frame for the data collection plan (the Measure document listing what will be measured, how and by whom): every input and output is a candidate for measurement.</p>\n<h3>Project metrics</h3>\n<p>A project needs a small set of numbers that say whether it is working. Day 4 turned the customer need into a CTQ. Today that CTQ becomes the <strong>primary metric</strong>: the single measure of the Y that the problem statement and goal statement are written in, that the team will baseline in Measure and track through Control. There is one primary metric per project. If a team cannot name it in a sentence, the project is not yet defined.</p>\n<p>IASSC names two further classes of project metric.</p>\n<ul>\n<li><strong>Secondary metrics</strong> are the process measures (x's) and related outputs the team expects to move along with the primary metric and that help explain why it moved. The percentage of orders received with a valid purchase order number is a secondary metric for an invoice error project.</li>\n<li><strong>Consequential metrics</strong> (also called guard-rail metrics) protect against fixing one thing by breaking another. If the primary metric is invoice error rate, a consequential metric is invoice cycle time, because the easiest way to cut errors is to check everything twice and slow the process down. Cost per invoice and staff overtime are other candidates. A consequential metric must not get worse while the primary metric improves.</li>\n</ul>\n<p>Each metric needs the operational definition from Day 4, a <strong>baseline</strong> (its value now, measured over a long enough period to capture normal variation, typically three to twelve months of historical data) and a <strong>target</strong> (the value in the goal statement). The gap between baseline and target, converted into money, is the project's benefit. Baselines come from Measure; the Define phase records the best available historical figure and flags it as provisional.</p>\n<h3>Financial evaluation</h3>\n<p>Benefits are sorted into two kinds, and the distinction matters both in the exam and to finance departments.</p>\n<ul>\n<li><strong>Hard benefits</strong> (hard savings) show up in the profit and loss account (the statement of the organisation's income and expenses): lower spending, more revenue, or cash released. Fewer rejected parts, less overtime, fewer credit notes, freed inventory, a contract cancelled. They can be audited (checked by an independent person against the records).</li>\n<li><strong>Soft benefits</strong> are real but do not appear directly as money: staff time freed (which is only a hard saving if a position is removed or the time is redeployed to paid work), better customer satisfaction, lower risk, improved safety, better morale, and <strong>cost avoidance</strong> (spending that would have been needed but now is not, such as a planned second shift that is no longer required). Organisations differ on whether cost avoidance counts as hard or soft; most treat it as soft unless a budgeted cost is cancelled.</li>\n</ul>\n<p>Four calculations appear in exam questions and in every business case.</p>\n<ol>\n<li><strong>Annual saving.</strong> Saving per unit × units per year, or monthly saving × 12. A <strong>recurring saving</strong> repeats every year; a <strong>one-off cost</strong> (training, a software change, a new fixture) is paid once. Keep the two apart.</li>\n<li><strong>Payback period.</strong> How long until the saving repays the cost: one-off cost ÷ saving per period, in the same period units. A project costing $48 000 that saves $6 500 a month pays back in 7.4 months.</li>\n<li><strong>Return on investment</strong> (ROI). (Benefit − cost) ÷ cost, as a percentage, usually over one year. Benefit $78 000 in year one against cost $48 000 is (78 000 − 48 000) ÷ 48 000 = 62.5%.</li>\n<li><strong>Net present value</strong> (NPV). Money received next year is worth less than money received today, because today's money could be invested. NPV adds up all the project's cash flows, each one reduced (\"discounted\") by the organisation's discount rate, the yearly return it requires from investments, for the number of years until it arrives, and subtracts the up-front cost. A positive NPV means the project earns more than the organisation's required rate. Green Belts are expected to know what NPV means and that a positive value is good; the discounting itself is done by finance.</li>\n</ol>\n<p>Finance departments usually count benefits for twelve months after the improvement is in place, and they insist that the calculation uses the organisation's own cost figures (labour rates, overhead rates, scrap values), not the team's estimates.</p>\n<h3>Benefits capture</h3>\n<p><strong>Benefits capture</strong> (or benefits realisation) is the discipline of making sure the money the charter promised actually arrives. Its parts:</p>\n<ul>\n<li>A <strong>financial representative</strong> (a member of the finance team assigned to the project) validates the baseline cost, agrees the calculation method in Define, and signs off the realised saving in Control. This person, not the Green Belt, decides what counts as hard.</li>\n<li>The saving is measured against the baseline, using the same operational definition, for an agreed period after handover (commonly twelve months), and reported at intervals.</li>\n<li>Benefits are net of costs: the one-off project costs and any new ongoing costs are subtracted.</li>\n<li>Benefits are not double-counted across projects that touch the same process.</li>\n</ul>\n<p>The exam asks who validates benefits (finance, not the belt) and when benefits are counted (after the improvement is implemented, on measured results, not on the forecast in the charter).</p>\n<h3>Project selection</h3>\n<p>Organisations usually have more candidate projects than belts. <strong>Project selection</strong> compares candidates on a small set of criteria: size of the benefit, link to strategy, probability of success, time and resources needed, and data availability. A weighted scoring matrix, with each criterion scored 1 to 5 and multiplied by a weight, is the usual tool. A good Green Belt project has a clear Y, a process that runs often enough to produce data within weeks, a problem the Champion cares about, causes that are not already known, and a scope one person can lead part-time in three to six months. A problem whose solution is already known is not a Six Sigma project; it is a task.</p>","Worked Example":"<p>The invoice team from Day 3 is preparing the Define tollgate. Their Green Belt completes the SIPOC, the metrics and the financial evaluation.</p>\n<ol>\n<li>\n<p><strong>SIPOC.</strong> Process first: (1) receive signed order, (2) enter order lines, (3) apply pricing, (4) approve invoice, (5) issue invoice. Outputs: invoice, ledger entry, credit note when wrong. Customers: the customer's accounts payable team (the people who pay invoices); finance (internal, receives the ledger entry, the record of the sale in the accounts); sales (internal, receives the credit note report). Inputs: signed order, customer master record (the stored details for each customer), price list, approval rules. Suppliers: sales team, customer master system, pricing team, finance policy.</p>\n</li>\n<li>\n<p><strong>Primary metric.</strong> Percentage of invoices with at least one error, measured by the monthly check of a 500-invoice sample, using the operational definition \"an error is any field that the customer's accounts payable team would reject or that requires a credit note\". Baseline from the last six months: 9.0%.</p>\n</li>\n<li>\n<p><strong>Secondary and consequential metrics.</strong> Secondary: percentage of orders arriving with a valid purchase order number (baseline 71%). Consequential: invoice cycle time from order receipt to invoice issue (baseline 2.3 days), and checking hours per month (baseline 4 hours).</p>\n</li>\n<li>\n<p><strong>Target and gap.</strong> Goal statement: 9.0% to 3.0%. On 3 000 invoices a month, 9.0% is 270 defective invoices and 3.0% is 90, a reduction of 180 a month.</p>\n</li>\n<li>\n<p><strong>Hard benefit.</strong> Each defective invoice costs $18 of rework and, for the 60% that reach the customer, a $65 credit note and handling cost. Average cost per defective invoice: 18 + 0.6 × 65 = 18 + 39 = $57. Monthly saving: 180 × 57 = $10 260. Annual hard saving: 10 260 × 12 = $123 120. Finance also values the 21-day payment delay on the affected invoices at about $1 400 a month in interest; the financial representative treats that as a soft benefit because it does not appear as a line in the profit and loss account.</p>\n</li>\n<li>\n<p><strong>Soft benefit.</strong> The clerk's four checking hours a month will not be removed, so they are a soft benefit unless redeployed. Fewer angry calls from customers is soft. Neither goes into the ROI.</p>\n</li>\n<li>\n<p><strong>Costs.</strong> One-off: a change to the order entry screen ($24 000), training ($4 000), and the Green Belt's time (finance estimates $20 000). Total one-off cost: $48 000. No new recurring costs.</p>\n</li>\n<li>\n<p><strong>Payback and ROI.</strong> Payback: 48 000 ÷ 10 260 = 4.7 months. First-year ROI: (123 120 − 48 000) ÷ 48 000 = 1.565, so 156.5%. The financial representative agrees the method and notes that the saving will be measured from the monthly sample check for twelve months after the change is switched on.</p>\n</li>\n</ol>\n<p>The Champion now has, on one page, what the process is, how it will be measured, what the improvement is worth, and who will confirm it.</p>","Formula Card":"<ul>\n<li><code>Annual saving = saving per unit × units per year</code> (or monthly saving × 12). Recurring, not one-off.</li>\n<li><code>Payback period = one-off cost ÷ saving per period</code> — answer is in the period's units (months if the saving is monthly).</li>\n<li><code>ROI (%) = (benefit − cost) ÷ cost × 100</code> — benefit and cost over the same period, usually one year.</li>\n<li><code>NPV = (sum of future cash flows, each discounted for the years until it arrives) − initial cost</code>. Positive NPV is good. Green Belts interpret; finance calculates.</li>\n<li><code>Gap = baseline − target</code> in the primary metric's units; convert to money with the cost per defect.</li>\n<li>SIPOC build order: Process, then Outputs and Customers, then Inputs and Suppliers.</li>\n</ul>","Exam Traps":"<ul>\n<li>SIPOC columns are Suppliers, Inputs, Process, Outputs, Customers, and the Process column holds five to seven high-level steps, not a detailed flowchart. Detailed mapping comes later.</li>\n<li>Build SIPOC from the Process column outwards. Questions that ask \"what is defined first\" want the process steps and boundaries.</li>\n<li>One primary metric per project, and it is the same measure as the goal statement. Secondary metrics are the x's and related measures expected to move with it; consequential metrics guard against unintended harm.</li>\n<li>A consequential metric guards against unintended harm (speed up, quality drops). Questions describe a side effect and ask what should have been tracked; the answer is consequential, not secondary.</li>\n<li>Hard savings hit the profit and loss account and are auditable. Freed staff time is soft unless the position or hours are actually removed. Cost avoidance is usually soft.</li>\n<li>Payback period = cost ÷ saving per period. ROI = (benefit − cost) ÷ cost, not benefit ÷ cost.</li>\n<li>Benefits are validated by the financial representative, on measured results after implementation, net of costs, for an agreed period (usually twelve months). They are not the forecast in the charter.</li>\n<li>A problem with a known solution is not a project. Project selection looks for benefit, strategic fit, data availability and a scope that fits a part-time belt in three to six months.</li>\n</ul>","Applied Task":"<p>Build the SIPOC for your own improvement project, starting from the Process column, with the same boundaries as the charter you drafted on Day 4. Then complete a metrics sheet: the primary metric with its operational definition and a baseline calculated from at least three months of your organisation's historical data; one secondary metric and two consequential metrics with their baselines; and the target. Finish with a financial evaluation: hard benefit per year using your organisation's actual cost figures, soft benefits listed separately, one-off costs, payback period in months and first-year ROI. Name the person in finance who will validate the saving. Paste the SIPOC, the metrics sheet and the financial evaluation to your coach.</p>"}}],"questions":[{"id":"D-1.1-001","phase":"Define","section":"1.1","subtopic":"Meanings of Six Sigma","type":"concept","difficulty":1,"check":true,"answer":1,"lesson_day":1,"stem_html":"<p>A process is described as performing at a six sigma level. What does this tell you?</p>","options_html":["<p>Its output falls within specification about 99.9% of the time</p>","<p>Its customer limits sit six standard deviations from the process average, about 3.4 defects per million opportunities</p>","<p>It has passed six DMAIC tollgate reviews</p>","<p>It has six process steps between input and output</p>"],"explanation_html":"<p>Sigma is the symbol for standard deviation. A six sigma process has six standard deviations between its average and the nearest customer limit, which corresponds to about 3.4 defects per million opportunities. It describes performance, not structure (Day 1).</p>","distractor_html":["<p>99.9% within specification is roughly 4.6 sigma on the table; six sigma is 99.99966%.</p>",null,"<p>DMAIC has five phases and five tollgates, not six.</p>","<p>The number six refers to standard deviations, not process steps.</p>"]},{"id":"D-1.1-002","phase":"Define","section":"1.1","subtopic":"The Problem Solving Strategy Y = f(x)","type":"concept","difficulty":1,"check":true,"answer":3,"lesson_day":1,"stem_html":"<p>In the expression Y = f(x), what does Y represent?</p>","options_html":["<p>The financial benefit of the project</p>","<p>The root cause the team must remove</p>","<p>The number of factors in the process</p>","<p>The output or result the project is trying to improve</p>"],"explanation_html":"<p>Y is the output measure, the result you care about, such as late deliveries per month. The x's are the inputs and process factors that cause it. The strategy is to improve Y by finding and changing the right x's (Day 1).</p>","distractor_html":["<p>Financial benefit may follow from improving Y but is not what Y stands for.</p>","<p>Causes are the x's, not Y.</p>","<p>Y is a single result measure, not a count of factors.</p>",null]},{"id":"D-1.1-003","phase":"Define","section":"1.1","subtopic":"Deliverables of a Lean Six Sigma Project","type":"concept","difficulty":2,"check":true,"answer":0,"lesson_day":1,"stem_html":"<p>A team has just completed a data collection plan, checked that its measurement system is reliable and established the current defect rate. Which DMAIC phase has it finished?</p>","options_html":["<p>Measure</p>","<p>Define</p>","<p>Improve</p>","<p>Analyse</p>"],"explanation_html":"<p>Data collection plan, verified measurement system and baseline performance are the deliverables of Measure. Define produces the charter; Analyse produces confirmed causes; Improve produces a piloted solution (Day 1).</p>","distractor_html":[null,"<p>Define ends with a charter and customer requirements, before data is collected.</p>","<p>Improve trials solutions, well after the baseline is set.</p>","<p>Analyse tests causes; it starts once a baseline exists.</p>"]},{"id":"D-1.1-004","phase":"Define","section":"1.1","subtopic":"Six Sigma Roles & Responsibilities","type":"concept","difficulty":1,"check":true,"answer":2,"lesson_day":1,"stem_html":"<p>Which role selects the project, removes organisational obstacles and approves each tollgate, but does not perform the analysis?</p>","options_html":["<p>Black Belt</p>","<p>Green Belt</p>","<p>Champion</p>","<p>Master Black Belt</p>"],"explanation_html":"<p>The Champion, also called the sponsor, is the senior manager who owns the business problem. They choose the project, clear obstacles and sign off tollgates. Analysis is done by the Green or Black Belt leading the project (Day 1).</p>","distractor_html":["<p>A Black Belt leads complex projects full-time and does the analysis.</p>","<p>A Green Belt leads smaller projects and does the analysis part-time.</p>",null,"<p>A Master Black Belt coaches belts and runs the programme; they are not the project's sponsor.</p>"]},{"id":"D-1.1-005","phase":"Define","section":"1.1","subtopic":"Voice of the Customer, Business and Employee","type":"concept","difficulty":2,"check":true,"answer":3,"lesson_day":1,"stem_html":"<p>A project team is deciding how to define a \"defective invoice\". Which source should the definition come from?</p>","options_html":["<p>The voice of the employee, because staff know which invoices are hard to produce</p>","<p>The Black Belt's judgement, because they have the most training</p>","<p>The voice of the business, because invoices affect cash flow</p>","<p>The voice of the customer, because a defect is a failure to meet a customer requirement</p>"],"explanation_html":"<p>A defect is any output that fails a customer requirement, so the definition of a defective invoice must come from what the customer needs. The business and employee voices matter for why the project is funded and where causes lie, but not for defining defects (Day 1).</p>","distractor_html":["<p>The voice of the employee helps find causes, not define requirements.</p>","<p>Requirements come from customers, not from the belt's opinion.</p>","<p>The voice of the business explains why the project matters, not what counts as a defect.</p>",null]},{"id":"D-1.1-006","phase":"Define","section":"1.1","subtopic":"General History of Six Sigma & Continuous Improvement","type":"concept","difficulty":1,"answer":1,"lesson_day":1,"stem_html":"<p>Where did Six Sigma originate?</p>","options_html":["<p>Toyota, Japan, in the 1950s</p>","<p>Motorola, United States, in the 1980s</p>","<p>Ford, United States, in the 1910s</p>","<p>General Electric, United States, in the 1990s</p>"],"explanation_html":"<p>Six Sigma was developed at Motorola in the 1980s, with engineer Bill Smith usually credited. General Electric adopted and popularised it in the 1990s. Toyota is the origin of Lean, not Six Sigma (Day 1).</p>","distractor_html":["<p>Toyota is where Lean came from.</p>",null,"<p>Ford's assembly line influenced Lean thinking but is not the origin of Six Sigma.</p>","<p>GE made Six Sigma famous but did not invent it.</p>"]},{"id":"D-1.1-007","phase":"Define","section":"1.1","subtopic":"General History of Six Sigma & Continuous Improvement","type":"concept","difficulty":1,"answer":0,"lesson_day":1,"stem_html":"<p>Lean thinking developed mainly from which source?</p>","options_html":["<p>The Toyota Production System</p>","<p>Motorola's quality programme</p>","<p>The United States military's sampling standards</p>","<p>Bell Laboratories' control chart work</p>"],"explanation_html":"<p>Lean grew out of the Toyota Production System, developed in Japan after the Second World War by engineers including Taiichi Ohno. It focuses on removing waste so value flows faster (Day 1).</p>","distractor_html":[null,"<p>Motorola is the origin of Six Sigma.</p>","<p>Military sampling standards contributed to acceptance sampling, not Lean.</p>","<p>Bell Labs (Walter Shewhart) gave us control charts, which are a Six Sigma tool.</p>"]},{"id":"D-1.1-008","phase":"Define","section":"1.1","subtopic":"Meanings of Six Sigma","type":"concept","difficulty":2,"answer":1,"lesson_day":1,"stem_html":"<p>Which statement best distinguishes the focus of Lean from the focus of Six Sigma?</p>","options_html":["<p>Lean applies to manufacturing; Six Sigma applies to services</p>","<p>Lean removes waste and delay; Six Sigma reduces variation and defects</p>","<p>Lean reduces variation; Six Sigma removes waste</p>","<p>Lean uses statistics; Six Sigma uses visual management</p>"],"explanation_html":"<p>Lean asks which steps add value and removes the rest, attacking waste and delay. Six Sigma asks how much output varies from requirements and finds the causes of that variation. Both apply to any industry (Day 1).</p>","distractor_html":["<p>Both methods apply to manufacturing and services alike.</p>",null,"<p>This reverses the two.</p>","<p>Statistics belong mainly to Six Sigma; visual management is a Lean tool.</p>"]},{"id":"D-1.1-009","phase":"Define","section":"1.1","subtopic":"Deliverables of a Lean Six Sigma Project","type":"concept","difficulty":1,"answer":0,"lesson_day":1,"stem_html":"<p>Which deliverable belongs to the Control phase?</p>","options_html":["<p>Control plan and monitoring chart handed to the process owner</p>","<p>Baseline defect rate</p>","<p>List of confirmed root causes</p>","<p>Project charter</p>"],"explanation_html":"<p>Control makes sure the improvement lasts: a control plan, monitoring charts and updated procedures are handed to the process owner. The charter is Define, the baseline is Measure and confirmed causes are Analyse (Day 1).</p>","distractor_html":[null,"<p>The baseline is produced in Measure.</p>","<p>Confirmed causes are the output of Analyse.</p>","<p>The charter is produced in Define.</p>"]},{"id":"D-1.1-010","phase":"Define","section":"1.1","subtopic":"Deliverables of a Lean Six Sigma Project","type":"concept","difficulty":2,"answer":1,"lesson_day":1,"stem_html":"<p>What is the purpose of a tollgate review?</p>","options_html":["<p>To let the team choose which DMAIC phase to do next</p>","<p>To have the sponsor confirm a phase's deliverables are complete before the next phase starts</p>","<p>To train Yellow Belts in the tools used so far</p>","<p>To measure the process capability at the end of the project</p>"],"explanation_html":"<p>A tollgate is the review at the end of each phase where the Champion checks the deliverables and approves moving on. DMAIC phases run in a fixed order, so the review is about readiness, not choosing a direction (Day 1).</p>","distractor_html":["<p>The phase order is fixed: Define, Measure, Analyse, Improve, Control.</p>",null,"<p>Training is not the purpose of a tollgate.</p>","<p>Capability is measured in Measure and rechecked in Control, not at tollgates as such.</p>"]},{"id":"D-1.1-011","phase":"Define","section":"1.1","subtopic":"The Problem Solving Strategy Y = f(x)","type":"interpretation","difficulty":2,"answer":3,"lesson_day":1,"stem_html":"<p>A call centre wants to cut average call handling time. A team member proposes \"measure handling time every day and display it on a big screen so people try harder.\" In terms of Y = f(x), what is the weakness of this proposal?</p>","options_html":["<p>It confuses the voice of the customer with the voice of the business</p>","<p>It uses too many x's at once</p>","<p>It measures the wrong Y; call volume should be measured instead</p>","<p>It acts only on Y and does not identify or change any x that causes long calls</p>"],"explanation_html":"<p>Handling time is the Y. Displaying Y more prominently does not change the causes of long calls, such as system lookups, unclear scripts or call transfers. Y = f(x) says you change results by changing the x's that drive them (Day 1).</p>","distractor_html":["<p>The proposal is not about which voice is used.</p>","<p>The proposal names no x's at all.</p>","<p>Handling time is a reasonable Y for this problem.</p>",null]},{"id":"D-1.1-012","phase":"Define","section":"1.1","subtopic":"Six Sigma Roles & Responsibilities","type":"concept","difficulty":2,"answer":2,"lesson_day":1,"stem_html":"<p>Which description best fits a Green Belt?</p>","options_html":["<p>Trains Black Belts and manages the organisation's improvement programme</p>","<p>Owns the business problem and funds the project</p>","<p>Leads smaller projects in their own area, usually part-time alongside a normal job</p>","<p>Works full-time on improvement and leads complex cross-functional projects</p>"],"explanation_html":"<p>Green Belts keep their normal role and lead smaller, local projects part-time. Black Belts are full-time on complex projects, Master Black Belts coach and run the programme, and the Champion owns and funds the problem (Day 1).</p>","distractor_html":["<p>That describes a Master Black Belt.</p>","<p>That describes the Champion or sponsor.</p>",null,"<p>That describes a Black Belt.</p>"]},{"id":"D-1.1-013","phase":"Define","section":"1.1","subtopic":"Six Sigma Roles & Responsibilities","type":"concept","difficulty":2,"answer":3,"lesson_day":1,"stem_html":"<p>At the end of the Control phase, who takes responsibility for keeping the improved process running day to day?</p>","options_html":["<p>The Master Black Belt</p>","<p>The Champion</p>","<p>The Green Belt who led the project</p>","<p>The process owner</p>"],"explanation_html":"<p>The process owner is the manager responsible for the process in normal operation. Control ends with handover to them, including the control plan and monitoring charts. The belt moves on to the next project (Day 1).</p>","distractor_html":["<p>The Master Black Belt coaches belts; they do not run processes.</p>","<p>The Champion sponsors projects; the process owner runs the process.</p>","<p>The Green Belt hands the process back and moves to other work.</p>",null]},{"id":"D-1.1-014","phase":"Define","section":"1.1","subtopic":"Voice of the Customer, Business and Employee","type":"interpretation","difficulty":2,"answer":0,"lesson_day":1,"stem_html":"<p>\"Each late shipment costs us about $9 in refunds, which is roughly $13 000 a month.\" Which voice is this statement an example of?</p>","options_html":["<p>Voice of the business</p>","<p>Voice of the customer</p>","<p>Voice of the employee</p>","<p>Voice of the process</p>"],"explanation_html":"<p>Cost, margin and financial impact are the voice of the business: they explain why the organisation should fund the project. The customer's voice would describe what \"late\" means to them; the employee's voice would describe obstacles in doing the work (Day 1).</p>","distractor_html":[null,"<p>Customers care about receiving parcels on time, not about the company's refund costs.</p>","<p>Employees' voice is about how the work feels and where it goes wrong.</p>","<p>\"Voice of the process\" describes measured process behaviour, not money.</p>"]},{"id":"D-1.1-015","phase":"Define","section":"1.1","subtopic":"Voice of the Customer, Business and Employee","type":"concept","difficulty":1,"answer":1,"lesson_day":1,"stem_html":"<p>Which of these is the most direct method of collecting the voice of the customer?</p>","options_html":["<p>Reviewing the annual budget</p>","<p>Interviewing customers and analysing their complaints</p>","<p>Reading the team's shift handover notes</p>","<p>Calculating the process sigma level</p>"],"explanation_html":"<p>The voice of the customer is gathered from customers themselves: interviews, surveys, complaints and observation. Budgets are the voice of the business, handover notes the voice of the employee, and sigma level is a process measure (Day 1).</p>","distractor_html":["<p>The budget reflects the business's needs, not the customer's.</p>",null,"<p>Handover notes capture the employee's view.</p>","<p>Sigma level is a measurement of the process, not a customer input.</p>"]},{"id":"D-1.1-016","phase":"Define","section":"1.1","subtopic":"Meanings of Six Sigma","type":"concept","difficulty":2,"answer":0,"lesson_day":1,"stem_html":"<p>Which statement about the term \"sigma\" is correct?</p>","options_html":["<p>Sigma is the Greek letter used for standard deviation, a measure of spread</p>","<p>Sigma is the number of steps in a process</p>","<p>Sigma is the number of defects found per unit</p>","<p>Sigma is the Greek letter used for the mean of a population</p>"],"explanation_html":"<p>Sigma (σ) is the statistical symbol for standard deviation, which measures how spread out values are. The mean is written μ (mu). Defects per unit and step counts have their own names (Day 1).</p>","distractor_html":[null,"<p>Step count is not a statistical symbol.</p>","<p>Defects per unit is DPU.</p>","<p>The population mean is μ, not σ.</p>"]},{"id":"D-1.1-017","phase":"Define","section":"1.1","subtopic":"Deliverables of a Lean Six Sigma Project","type":"interpretation","difficulty":3,"answer":0,"lesson_day":1,"stem_html":"<p>A team ran a two-week trial of a new sorting screen on one shift and showed the late-parcel rate fell from 12% to 7% on that shift. Which phase does this work belong to, and what should come next?</p>","options_html":["<p>Improve; next, roll the change out fully and move to Control with a control plan and handover</p>","<p>Control; next, pilot the solution on other shifts</p>","<p>Measure; next, brainstorm causes</p>","<p>Analyse; next, write the project charter</p>"],"explanation_html":"<p>Piloting a solution and showing it moves Y is the Improve phase. The next phase is Control: standardise the change, set up monitoring and hand over so the gain holds. Charters come first (Define) and cause-finding is Analyse (Day 1).</p>","distractor_html":[null,"<p>Piloting belongs to Improve; Control comes after the pilot succeeds.</p>","<p>Measure establishes the baseline before causes are tested.</p>","<p>Analyse finds causes; the charter was written back in Define.</p>"]},{"id":"D-1.1-018","phase":"Define","section":"1.1","subtopic":"General History of Six Sigma & Continuous Improvement","type":"concept","difficulty":2,"answer":1,"lesson_day":1,"stem_html":"<p>Why were Lean and Six Sigma combined into a single method?</p>","options_html":["<p>Because Six Sigma had been discredited and needed a new name</p>","<p>Because a process can be fast but error-prone, or accurate but slow, and the two methods address these different problems</p>","<p>Because regulators required both</p>","<p>Because Lean only works in Japan and Six Sigma only works in the United States</p>"],"explanation_html":"<p>Lean attacks delay and waste; Six Sigma attacks variation and defects. A process usually needs both. Combining them lets one project use whichever tools the problem calls for (Day 1).</p>","distractor_html":["<p>Six Sigma was not discredited; it remains widely used.</p>",null,"<p>No regulator requires either method.</p>","<p>Both methods are used worldwide across industries.</p>"]},{"id":"D-1.1-019","phase":"Define","section":"1.1","subtopic":"The Problem Solving Strategy Y = f(x)","type":"concept","difficulty":1,"answer":1,"lesson_day":1,"stem_html":"<p>In Y = f(x), which of the following is an example of an x rather than a Y?</p>","options_html":["<p>Average minutes to resolve a ticket</p>","<p>Which supplier provided the packaging</p>","<p>Percentage of orders shipped late</p>","<p>Number of complaints per month</p>"],"explanation_html":"<p>The supplier used is an input factor that may cause a result, so it is an x. The other three are all output measures (results) and would be Y's (Day 1).</p>","distractor_html":["<p>Resolution time is a result: a Y.</p>",null,"<p>Late shipment percentage is a result, so it is a Y.</p>","<p>Complaints per month is a result: a Y.</p>"]},{"id":"D-1.1-020","phase":"Define","section":"1.1","subtopic":"Six Sigma Roles & Responsibilities","type":"concept","difficulty":1,"answer":3,"lesson_day":1,"stem_html":"<p>Which role provides basic awareness-level support, such as helping to collect data during a project?</p>","options_html":["<p>Champion</p>","<p>Master Black Belt</p>","<p>Black Belt</p>","<p>Yellow Belt</p>"],"explanation_html":"<p>Yellow Belts (and White Belts in some schemes) have basic training and support projects as team members, often collecting data or joining improvement events. The other roles lead, coach or sponsor (Day 1).</p>","distractor_html":["<p>The Champion sponsors the project.</p>","<p>The Master Black Belt coaches belts and runs the programme.</p>","<p>Black Belts lead complex projects full-time.</p>",null]},{"id":"D-1.4-001","phase":"Define","section":"1.4","subtopic":"The Seven Elements of Waste","type":"interpretation","difficulty":1,"check":true,"answer":0,"lesson_day":2,"stem_html":"<p>A claims clerk walks to a shared printer about 40 times a day to collect printed forms. Which of the seven wastes does the walking represent?</p>","options_html":["<p>Motion</p>","<p>Over-processing</p>","<p>Waiting</p>","<p>Transport</p>"],"explanation_html":"<p>Motion is movement of people that adds no value: walking, reaching, searching. The clerk is moving, not the forms. Transport would be the forms themselves being carried between locations (Day 2).</p>","distractor_html":[null,"<p>Over-processing is doing more work per item than needed, such as extra approvals.</p>","<p>Waiting is idle time; the clerk is busy, not idle.</p>","<p>Transport is movement of the item being worked on, not of the person.</p>"]},{"id":"D-1.4-002","phase":"Define","section":"1.4","subtopic":"Understanding Lean","type":"concept","difficulty":2,"answer":0,"lesson_day":2,"stem_html":"<p>Which list gives the five Lean principles in the order described by Womack and Jones?</p>","options_html":["<p>Value, value stream, flow, pull, perfection</p>","<p>Flow, pull, value, value stream, perfection</p>","<p>Value stream, value, pull, flow, perfection</p>","<p>Perfection, value, flow, pull, value stream</p>"],"explanation_html":"<p>The principles run from defining what the customer values, through mapping the value stream, making it flow, letting the customer pull, and then repeating the cycle in pursuit of perfection (Day 2).</p>","distractor_html":[null,"<p>Value must be specified before anything else.</p>","<p>Value comes before the value stream, and flow comes before pull.</p>","<p>Perfection is the last principle, not the first.</p>"]},{"id":"D-1.4-003","phase":"Define","section":"1.4","subtopic":"Understanding Lean","type":"interpretation","difficulty":3,"answer":1,"lesson_day":2,"stem_html":"<p>In an insurance claims process, which of the following activities is value-added according to the three-part Lean test?</p>","options_html":["<p>The claim file waits in a queue for the assessor to become free</p>","<p>The assessor calculates the payout from the policy terms and the damage report</p>","<p>The claim is photocopied for a backup paper file</p>","<p>A second manager re-checks the claim amount that the first manager already approved</p>"],"explanation_html":"<p>Calculating the payout transforms the claim towards its outcome, the customer would pay for it and, done correctly, it is done once. The other options are over-processing, waiting and over-processing again: none changes the claim in a way the customer values (Day 2).</p>","distractor_html":["<p>Queue time is waiting, a non-value-added activity.</p>",null,"<p>A backup copy does not change the claim or move it forward.</p>","<p>A repeated check adds no transformation; it is over-processing.</p>"]},{"id":"D-1.4-004","phase":"Define","section":"1.4","subtopic":"The History of Lean","type":"concept","difficulty":1,"check":true,"answer":2,"lesson_day":2,"stem_html":"<p>What are the two pillars of the Toyota Production System?</p>","options_html":["<p>Kaizen and 5S</p>","<p>Push production and batch processing</p>","<p>Just-in-time and jidoka</p>","<p>Six Sigma and statistical process control</p>"],"explanation_html":"<p>The Toyota Production System rests on just-in-time (make only what is needed, when needed) and jidoka (stop the process when a defect appears and fix it at the source). Kaizen and 5S are practices within it, not the pillars (Day 2).</p>","distractor_html":["<p>Kaizen and 5S are Lean practices but are not named as the two pillars.</p>","<p>Push and batching are what the Toyota Production System replaced.</p>",null,"<p>Six Sigma and statistical process control come from Motorola and Bell Labs, not Toyota.</p>"]},{"id":"D-1.4-005","phase":"Define","section":"1.4","subtopic":"The History of Lean","type":"concept","difficulty":2,"answer":2,"lesson_day":2,"stem_html":"<p>Which publication popularised the word \"Lean\" as the name for Toyota's production approach?</p>","options_html":["<p>Motorola's Six Sigma training material of the 1980s</p>","<p>Taiichi Ohno's internal Toyota manuals of the 1950s</p>","<p>The 1990 MIT study published as The Machine That Changed the World</p>","<p>Henry Ford's 1913 description of the moving assembly line</p>"],"explanation_html":"<p>The term \"lean production\" was coined by researcher John Krafcik in 1988 and popularised by the Massachusetts Institute of Technology study published in 1990 as The Machine That Changed the World, by Womack, Jones and Roos. Toyota called its approach the Toyota Production System (Day 2).</p>","distractor_html":["<p>Motorola's material is the origin of Six Sigma, not the word Lean.</p>","<p>Ohno developed the system but the English word Lean came later, from the MIT study.</p>",null,"<p>Ford's line was an early example of flow but the term Lean did not exist then.</p>"]},{"id":"D-1.4-006","phase":"Define","section":"1.4","subtopic":"Lean & Six Sigma","type":"interpretation","difficulty":2,"answer":2,"lesson_day":2,"stem_html":"<p>A loan approval process takes 15 working days, of which about 14 are spent waiting between steps. Applications are almost never approved incorrectly. Which set of tools should the Green Belt reach for first?</p>","options_html":["<p>A larger inspection team to check each application</p>","<p>Hypothesis tests and capability analysis to find the sources of variation</p>","<p>Value stream mapping, batch-size reduction and pull to remove waiting</p>","<p>A new customer survey to redefine the requirement</p>"],"explanation_html":"<p>The problem is delay, not defects, so it is a Lean problem. Value stream mapping shows where the waiting sits, and smaller batches and pull remove it. Six Sigma's statistical tools are for variation and defects, which this process does not have (Day 2).</p>","distractor_html":["<p>More inspection adds appraisal cost and does nothing about waiting.</p>","<p>Statistical tools attack variation and defects; the process has a delay problem.</p>",null,"<p>The requirement (approve quickly and correctly) is not in doubt.</p>"]},{"id":"D-1.4-007","phase":"Define","section":"1.4","subtopic":"5S (Sort, Straighten, Shine, Standardize, Self-Discipline)","type":"concept","difficulty":1,"check":true,"answer":2,"lesson_day":2,"stem_html":"<p>In 5S, giving every remaining item a fixed, labelled location close to where it is used belongs to which step?</p>","options_html":["<p>Sort</p>","<p>Shine</p>","<p>Straighten</p>","<p>Standardise</p>"],"explanation_html":"<p>Straighten (also called Set in Order) is \"a place for everything and everything in its place\": shadow boards, labels and marked floor areas. Sort removes what is not needed, Shine cleans, and Standardise writes the arrangement down (Day 2).</p>","distractor_html":["<p>Sort is removing unneeded items, which happens before locations are assigned.</p>","<p>Shine is cleaning and inspecting.</p>",null,"<p>Standardise documents the agreed arrangement so everyone keeps it the same.</p>"]},{"id":"D-1.4-008","phase":"Define","section":"1.4","subtopic":"The Seven Elements of Waste","type":"concept","difficulty":2,"answer":3,"lesson_day":2,"stem_html":"<p>Why did Taiichi Ohno describe overproduction as the worst of the seven wastes?</p>","options_html":["<p>Because it only occurs in manufacturing</p>","<p>Because it is the hardest waste to measure</p>","<p>Because it is the only waste that customers notice</p>","<p>Because it generates the other wastes: inventory, transport, motion, waiting and hidden defects</p>"],"explanation_html":"<p>Making too much or too early creates inventory, which must be moved and stored, causes people to walk around it, sits waiting, and hides defects until the items are finally used. Overproduction manufactures the other wastes (Day 2).</p>","distractor_html":["<p>Overproduction occurs in offices too, such as printing reports nobody reads.</p>","<p>Overproduction is easy to measure: count what was made against what was needed.</p>","<p>Customers notice defects and waiting more directly than overproduction.</p>",null]},{"id":"D-1.4-009","phase":"Define","section":"1.4","subtopic":"The Seven Elements of Waste","type":"interpretation","difficulty":2,"answer":3,"lesson_day":2,"stem_html":"<p>A signed contract is couriered from the Sydney office to the Perth office for a second signature and then couriered back. Which waste is this an example of?</p>","options_html":["<p>Overproduction</p>","<p>Motion</p>","<p>Inventory</p>","<p>Transport</p>"],"explanation_html":"<p>The item being worked on, the contract, is being moved between locations. That is transport. Motion would be the person walking or searching; here the people stay put and the document travels (Day 2).</p>","distractor_html":["<p>Nothing extra is being produced.</p>","<p>Motion is movement of people; here it is the document that moves.</p>","<p>Inventory is items held and not being worked on; the contract is in transit, not stockpiled.</p>",null]},{"id":"D-1.4-010","phase":"Define","section":"1.4","subtopic":"Understanding Lean","type":"concept","difficulty":2,"check":true,"answer":1,"lesson_day":2,"stem_html":"<p>Which statement correctly describes a pull system?</p>","options_html":["<p>Work is inspected at every step before it is passed on</p>","<p>Work is started only when the next step, and ultimately the customer, signals a need for it</p>","<p>Work is grouped into large batches to reduce the number of changeovers</p>","<p>Work is released according to a forecast so that machines are never idle</p>"],"explanation_html":"<p>Pull means producing to actual demand: the downstream step or the customer triggers the work. Producing to a forecast or schedule regardless of demand is push, which builds inventory between steps (Day 2).</p>","distractor_html":["<p>Inspection at each step describes appraisal, not the pull principle.</p>",null,"<p>Large batches are the opposite of flow and are not what defines pull.</p>","<p>Producing to a forecast is push, not pull.</p>"]},{"id":"D-1.4-011","phase":"Define","section":"1.4","subtopic":"Understanding Lean","type":"concept","difficulty":3,"answer":3,"lesson_day":2,"stem_html":"<p>A regulator requires that every export shipment is checked against a sanctions list before it leaves. How does Lean classify this check?</p>","options_html":["<p>Waste, to be eliminated at the first opportunity</p>","<p>Value-added, because it is legally required</p>","<p>Overproduction, because it produces a record nobody reads</p>","<p>Business non-value-added: necessary, but to be made as small as possible</p>"],"explanation_html":"<p>The check does not transform the shipment and the customer would not choose to pay for it, so it is not value-added. Because it is required, Lean calls it business non-value-added (or necessary non-value-added) and works to make it quick and cheap rather than remove it (Day 2).</p>","distractor_html":["<p>The check cannot be removed while the law requires it.</p>","<p>Legal necessity does not make an activity value-added; it still fails the transformation test.</p>","<p>The check is not making excess output.</p>",null]},{"id":"D-1.4-012","phase":"Define","section":"1.4","subtopic":"Understanding Lean","type":"calculation","difficulty":3,"generator":"stats:expr","answer":0,"lesson_day":2,"stem_html":"<p>Ten forms are processed as a batch through three steps. Each step takes one minute per form, and a step does not start until the whole batch arrives. At what minute is the first form completely finished?</p>","options_html":["<p>21 minutes</p>","<p>3 minutes</p>","<p>12 minutes</p>","<p>30 minutes</p>"],"explanation_html":"<p>Step 1 finishes the batch at minute 10 and step 2 at minute 20. Step 3 then completes the first form at minute 21. In one-piece flow the first form would be finished at minute 3, which shows what batching costs (Day 2).</p>","distractor_html":[null,"<p>3 minutes is the one-piece-flow result, not the batch result.</p>","<p>12 minutes is when the last form is finished under one-piece flow.</p>","<p>30 minutes is when the last form is finished, not the first.</p>"]},{"id":"D-1.4-013","phase":"Define","section":"1.4","subtopic":"5S (Sort, Straighten, Shine, Standardize, Self-Discipline)","type":"concept","difficulty":1,"check":true,"answer":2,"lesson_day":2,"stem_html":"<p>A supervisor audits the workshop every week against the agreed 5S standard and coaches staff who let it slip. Which 5S step is this?</p>","options_html":["<p>Standardise</p>","<p>Shine</p>","<p>Self-discipline</p>","<p>Sort</p>"],"explanation_html":"<p>Self-discipline (also called Sustain) is making the standard a habit through audits, training and management attention. Standardise is the earlier step of writing the standard down; auditing against it is Self-discipline (Day 2).</p>","distractor_html":["<p>Standardise creates the written standard and photographs; auditing against them is the next step.</p>","<p>Shine is cleaning and inspection.</p>",null,"<p>Sort removes unneeded items.</p>"]},{"id":"D-1.4-014","phase":"Define","section":"1.4","subtopic":"The History of Lean","type":"concept","difficulty":2,"answer":3,"lesson_day":2,"stem_html":"<p>What does jidoka mean in the Toyota Production System?</p>","options_html":["<p>Producing only what is needed, when it is needed</p>","<p>Organising the workplace in five steps</p>","<p>Continuous small improvements by the people who do the work</p>","<p>Stopping the process as soon as a defect is detected so the problem is fixed at its source</p>"],"explanation_html":"<p>Jidoka, sometimes translated as \"automation with a human touch\", gives machines and people the ability to stop the line when something goes wrong so that defects are not passed on. It builds quality in rather than inspecting it in (Day 2).</p>","distractor_html":["<p>Producing only what is needed is just-in-time, the other pillar.</p>","<p>The five-step workplace method is 5S.</p>","<p>Continuous small improvements are kaizen.</p>",null]},{"id":"D-1.4-015","phase":"Define","section":"1.4","subtopic":"The Seven Elements of Waste","type":"interpretation","difficulty":2,"answer":3,"lesson_day":2,"stem_html":"<p>A shared mailbox holds 1 200 customer requests that nobody has opened yet. Which of the seven wastes best describes this?</p>","options_html":["<p>Transport</p>","<p>Motion</p>","<p>Over-processing</p>","<p>Inventory</p>"],"explanation_html":"<p>Inventory is anything held that is not being worked on right now, and that includes information. Unopened requests are work in process sitting in a queue, exactly like pallets beside a machine (Day 2).</p>","distractor_html":["<p>The requests are not being moved between locations.</p>","<p>Nobody is moving; the requests are sitting still.</p>","<p>No work at all is being done on the requests, so it cannot be excess work.</p>",null]},{"id":"D-1.4-016","phase":"Define","section":"1.4","subtopic":"Lean & Six Sigma","type":"interpretation","difficulty":3,"answer":2,"lesson_day":2,"stem_html":"<p>A team used value stream mapping and smaller batches to cut a lab's turnaround time from 12 hours to 4 hours, but the rate of mislabelled samples stayed at 8%. What should the team do next?</p>","options_html":["<p>Reduce batch size further, because Lean tools solve all process problems</p>","<p>Declare the project complete because lead time was the primary metric</p>","<p>Use Six Sigma tools to collect data on the mislabelling and find its causes</p>","<p>Add a full-time checker to catch mislabelled samples</p>"],"explanation_html":"<p>Delay was a Lean problem and Lean fixed it. Defects are a variation problem, which is what Six Sigma's data-driven cause-finding is for. That is why the two are combined: each addresses what the other leaves behind (Day 2).</p>","distractor_html":["<p>Batch size affects waiting, not why labels are wrong.</p>","<p>An 8% defect rate is a live problem whether or not it was the primary metric, and the team was asked what to do next.</p>",null,"<p>A checker is appraisal cost that catches defects instead of preventing them.</p>"]},{"id":"D-1.4-017","phase":"Define","section":"1.4","subtopic":"Understanding Lean","type":"concept","difficulty":1,"answer":2,"lesson_day":2,"stem_html":"<p>What is kaizen?</p>","options_html":["<p>A method for calculating the sigma level of a process</p>","<p>The Japanese name for the Six Sigma belt system</p>","<p>Continuous small improvements made by the people who do the work</p>","<p>A one-off large investment in new equipment</p>"],"explanation_html":"<p>Kaizen means improvement in small steps, made continuously and mostly by the workers themselves, often in short focused events. It is part of the Toyota Production System and of the continuous improvement habit (Day 2).</p>","distractor_html":["<p>Sigma level is a Six Sigma metric unrelated to kaizen.</p>","<p>Belts are a Six Sigma idea from Motorola and GE, not a Japanese term.</p>",null,"<p>Kaizen is the opposite of a one-off large investment.</p>"]},{"id":"D-1.4-018","phase":"Define","section":"1.4","subtopic":"5S (Sort, Straighten, Shine, Standardize, Self-Discipline)","type":"concept","difficulty":3,"answer":0,"lesson_day":2,"stem_html":"<p>During the Sort step of 5S, what is a red tag used for?</p>","options_html":["<p>To mark items whose need is uncertain so they can be removed if nobody claims them within an agreed period</p>","<p>To mark items that have been cleaned and inspected</p>","<p>To mark the standard location of a tool on a shadow board</p>","<p>To mark the results of the weekly audit</p>"],"explanation_html":"<p>Sort removes everything not needed for the current work. Items nobody is sure about get a red tag and go to a holding area; if nobody claims them in the agreed time they are removed. The other options describe Shine, Straighten and Self-discipline (Day 2).</p>","distractor_html":[null,"<p>Cleaning and inspection is Shine, which does not use red tags.</p>","<p>Locations and shadow boards belong to Straighten.</p>","<p>Audits belong to Self-discipline.</p>"]},{"id":"D-1.4-019","phase":"Define","section":"1.4","subtopic":"Lean & Six Sigma","type":"concept","difficulty":1,"answer":0,"lesson_day":2,"stem_html":"<p>Which of the following is a Lean tool rather than a Six Sigma tool?</p>","options_html":["<p>5S</p>","<p>Process capability index</p>","<p>Control chart</p>","<p>Hypothesis test</p>"],"explanation_html":"<p>5S organises the workplace to remove waste, which is Lean's purpose. Hypothesis tests, capability indices and control charts are statistical tools used to understand and reduce variation, which is Six Sigma's purpose (Day 2).</p>","distractor_html":[null,"<p>Capability indices measure variation against specifications, a Six Sigma tool.</p>","<p>Control charts come from Shewhart's statistical work and belong to Six Sigma.</p>","<p>Hypothesis tests are Six Sigma statistics.</p>"]},{"id":"D-1.4-020","phase":"Define","section":"1.4","subtopic":"Understanding Lean","type":"calculation","difficulty":2,"generator":"stats:pce_pct","answer":0,"lesson_day":2,"stem_html":"<p>A sample spends 101.6 minutes in a laboratory process from collection to result. Only the centrifuge (10 minutes) and the analyser (12 minutes) transform the sample. What percentage of the time is value-added?</p>","options_html":["<p>21.7%</p>","<p>78.3%</p>","<p>45.5%</p>","<p>9.8%</p>"],"explanation_html":"<p>Value-added time is 10 + 12 = 22 minutes. 22 ÷ 101.6 = 0.217, or 21.7%. The remaining 78.3% is waiting, transport, motion, over-processing and rework (Day 2).</p>","distractor_html":[null,"<p>78.3% is the non-value-added share, the complement of the answer.</p>","<p>45.5% divides 10 by 22, comparing the two value-added steps with each other.</p>","<p>9.8% uses only the centrifuge time (10 ÷ 101.6).</p>"]},{"id":"D-1.2-001","phase":"Define","section":"1.2","subtopic":"Basic Six Sigma Metrics (DPU, DPMO, FTY, RTY, Cycle Time)","type":"calculation","difficulty":1,"check":true,"generator":"stats:dpu","answer":2,"lesson_day":3,"stem_html":"<p>An audit of 500 invoices found 60 defects spread over 45 invoices. What is the DPU (defects per unit)?</p>","options_html":["<p>8.33</p>","<p>0.024</p>","<p>0.12</p>","<p>0.09</p>"],"explanation_html":"<p>DPU is total defects divided by total units: 60 ÷ 500 = 0.12. The 45 defective invoices are not used for DPU; they would be used for yield (Day 3).</p>","distractor_html":["<p>8.33 is 500 ÷ 60, the division the wrong way round.</p>","<p>0.024 is DPO, which divides by opportunities as well.</p>",null,"<p>0.09 is 45 ÷ 500, the proportion of defective units, not defects per unit.</p>"]},{"id":"D-1.2-002","phase":"Define","section":"1.2","subtopic":"Basic Six Sigma Metrics (DPU, DPMO, FTY, RTY, Cycle Time)","type":"calculation","difficulty":2,"generator":"stats:dpo","answer":0,"lesson_day":3,"stem_html":"<p>A purchase order has 6 fields that can be wrong. In 400 orders, 48 defects were found. What is the DPO (defects per opportunity)?</p>","options_html":["<p>0.02</p>","<p>0.12</p>","<p>0.0033</p>","<p>0.08</p>"],"explanation_html":"<p>Total opportunities are 400 × 6 = 2 400. DPO = 48 ÷ 2 400 = 0.02. Dividing by units alone would give DPU (Day 3).</p>","distractor_html":[null,"<p>0.12 is DPU (48 ÷ 400); DPO also divides by opportunities per unit.</p>","<p>0.0033 divides 48 by 400 × 6 × 6, applying the opportunity count twice.</p>","<p>0.08 is 48 ÷ 600, using opportunities plus units instead of their product.</p>"]},{"id":"D-1.2-003","phase":"Define","section":"1.2","subtopic":"Basic Six Sigma Metrics (DPU, DPMO, FTY, RTY, Cycle Time)","type":"calculation","difficulty":2,"generator":"stats:dpmo","answer":3,"lesson_day":3,"stem_html":"<p>A packing line inspects 700 cartons, each with 4 opportunities for a defect, and finds 35 defects. What is the DPMO?</p>","options_html":["<p>200,000</p>","<p>50,000</p>","<p>3,125</p>","<p>12,500</p>"],"explanation_html":"<p>DPO = 35 ÷ (700 × 4) = 35 ÷ 2 800 = 0.0125. DPMO = 0.0125 × 1 000 000 = 12 500 (Day 3).</p>","distractor_html":["<p>200,000 is 35 ÷ 700 × 4 × 1 000 000, multiplying by opportunities instead of dividing.</p>","<p>50,000 is DPU × 1 000 000 (35 ÷ 700), forgetting the opportunities.</p>","<p>3,125 divides by 700 × 4 × 4.</p>",null]},{"id":"D-1.2-004","phase":"Define","section":"1.2","subtopic":"Basic Six Sigma Metrics (DPU, DPMO, FTY, RTY, Cycle Time)","type":"concept","difficulty":1,"check":true,"answer":0,"lesson_day":3,"stem_html":"<p>An inspector finds three errors on one insurance application form. How is this recorded in Six Sigma terms?</p>","options_html":["<p>One defective and three defects</p>","<p>One defective and one defect</p>","<p>Three defectives and one defect</p>","<p>Three defectives and three defects</p>"],"explanation_html":"<p>A defect is one failure to meet a requirement; a defective is a unit with at least one defect. One form with three errors is one defective unit carrying three defects. DPU uses the defect count; yield uses the defective count (Day 3).</p>","distractor_html":[null,"<p>Each error is a separate defect, so there are three.</p>","<p>The counts are the wrong way round.</p>","<p>There is only one unit, so there can be only one defective.</p>"]},{"id":"D-1.2-005","phase":"Define","section":"1.2","subtopic":"Basic Six Sigma Metrics (DPU, DPMO, FTY, RTY, Cycle Time)","type":"calculation","difficulty":2,"generator":"stats:rty_pct","answer":0,"lesson_day":3,"stem_html":"<p>A four-step process has first time yields of 96%, 97%, 95% and 98%. What is the rolled throughput yield?</p>","options_html":["<p>86.7%</p>","<p>98.0%</p>","<p>95.0%</p>","<p>96.5%</p>"],"explanation_html":"<p>Rolled throughput yield multiplies the step yields: 0.96 × 0.97 × 0.95 × 0.98 = 0.8669, about 86.7%. Only 87 units in 100 pass every step untouched (Day 3).</p>","distractor_html":[null,"<p>98.0% is the best single step.</p>","<p>95.0% is the worst single step, not the combined yield.</p>","<p>96.5% is the average of the four yields; RTY multiplies, it does not average.</p>"]},{"id":"D-1.2-006","phase":"Define","section":"1.2","subtopic":"Basic Six Sigma Metrics (DPU, DPMO, FTY, RTY, Cycle Time)","type":"calculation","difficulty":2,"generator":"stats:fty_pct","answer":0,"lesson_day":3,"stem_html":"<p>1,200 pumps entered final test. 1,080 passed without any rework. A further 60 failed, were repaired and then passed; 60 were scrapped. What is the first time yield of the test step?</p>","options_html":["<p>90.0%</p>","<p>95.0%</p>","<p>85.0%</p>","<p>5.0%</p>"],"explanation_html":"<p>First time yield counts only units that passed without rework: 1 080 ÷ 1 200 = 0.90, or 90%. The 60 repaired pumps did eventually pass, but not the first time, so they are excluded (Day 3).</p>","distractor_html":[null,"<p>95.0% includes the repaired pumps (1 140 ÷ 1 200); that is final yield, which hides rework.</p>","<p>85.0% subtracts both the repaired and the scrapped pumps twice over.</p>","<p>5.0% is the scrap rate, not a yield.</p>"]},{"id":"D-1.2-007","phase":"Define","section":"1.2","subtopic":"Basic Six Sigma Metrics (DPU, DPMO, FTY, RTY, Cycle Time)","type":"calculation","difficulty":3,"generator":"stats:sigma_from_dpmo","answer":2,"lesson_day":3,"stem_html":"<p>A process runs at 24,000 DPMO. Using the standard sigma table (which includes the 1.5-sigma shift), what is its sigma level, to two decimal places?</p>","options_html":["<p>2.50</p>","<p>1.98</p>","<p>3.48</p>","<p>4.98</p>"],"explanation_html":"<p>24 000 DPMO is a defect proportion of 0.024, so 97.6% of opportunities are defect-free. On the normal distribution that is 1.98 standard deviations; the standard table adds the 1.5 shift to give 3.48 sigma (Day 3).</p>","distractor_html":["<p>2.50 is a guess halfway between 2 and 3 sigma; the table value is 3.48.</p>","<p>1.98 is the long-term value without the 1.5 shift; the standard table includes the shift.</p>",null,"<p>4.98 adds the 1.5 shift twice.</p>"]},{"id":"D-1.2-008","phase":"Define","section":"1.2","subtopic":"Cost of Poor Quality (COPQ)","type":"concept","difficulty":1,"check":true,"answer":1,"lesson_day":3,"stem_html":"<p>A customer returns a faulty appliance under warranty and the company pays for the repair and the freight. Into which cost of poor quality category does this fall?</p>","options_html":["<p>Prevention cost</p>","<p>External failure cost</p>","<p>Internal failure cost</p>","<p>Appraisal cost</p>"],"explanation_html":"<p>The defect was found after delivery to the customer, so the repair, freight and claim handling are external failure costs, the most expensive category per defect (Day 3).</p>","distractor_html":["<p>Prevention is the cost of stopping defects before they happen.</p>",null,"<p>Internal failure is for defects caught before the customer receives the product.</p>","<p>Appraisal is the cost of inspecting and testing.</p>"]},{"id":"D-1.2-009","phase":"Define","section":"1.2","subtopic":"Cost of Poor Quality (COPQ)","type":"concept","difficulty":3,"answer":0,"lesson_day":3,"stem_html":"<p>A pharmaceutical plant employs four analysts to test every batch before release. Most batches pass. How is the analysts' cost classified?</p>","options_html":["<p>Appraisal cost, because it is the cost of checking for defects</p>","<p>Internal failure cost, because it is triggered by the possibility of defects</p>","<p>External failure cost, because it protects the customer</p>","<p>Prevention cost, because testing stops bad batches reaching patients</p>"],"explanation_html":"<p>Testing and inspection are appraisal costs whether or not they find anything. Prevention would be work that stops defects being made in the first place, such as process design or training. Failure costs are incurred only when defects actually occur (Day 3).</p>","distractor_html":[null,"<p>Internal failure costs arise from actual defects (scrap, rework), not from checking.</p>","<p>External failure is incurred after the customer has received a defect.</p>","<p>Testing finds defects; it does not prevent them from being made.</p>"]},{"id":"D-1.2-010","phase":"Define","section":"1.2","subtopic":"Pareto Analysis (80:20 rule)","type":"interpretation","difficulty":2,"answer":2,"lesson_day":3,"stem_html":"<p>A hospital pharmacy classified 240 dispensing errors from the last quarter:</p>\n<table>\n<thead>\n<tr>\n<th>Error type</th>\n<th>Count</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Wrong dose</td>\n<td>96</td>\n</tr>\n<tr>\n<td>Wrong patient label</td>\n<td>72</td>\n</tr>\n<tr>\n<td>Wrong drug</td>\n<td>30</td>\n</tr>\n<tr>\n<td>Missing instructions</td>\n<td>24</td>\n</tr>\n<tr>\n<td>Late dispensing</td>\n<td>18</td>\n</tr>\n</tbody>\n</table>\n<p>Using Pareto analysis, which error types are the vital few the project should address first?</p>","options_html":["<p>Wrong drug and late dispensing, because they are the most dangerous</p>","<p>All five types equally, because each is a patient safety risk</p>","<p>Wrong dose and wrong patient label, which together account for 70% of the errors</p>","<p>Missing instructions, because it is the easiest to fix</p>"],"explanation_html":"<p>Sorted from largest to smallest, wrong dose (96) and wrong patient label (72) total 168 of 240 errors, or 70%. Two of five categories produce most of the effect: those are the vital few. Pareto by count says start there (Day 3).</p>","distractor_html":["<p>Pareto by count ranks by frequency. Danger might justify a separate Pareto by severity, but the question asks for count-based analysis.</p>","<p>Treating every category equally is what Pareto analysis exists to avoid.</p>",null,"<p>Ease of fixing is not a Pareto criterion.</p>"]},{"id":"D-1.2-011","phase":"Define","section":"1.2","subtopic":"Pareto Analysis (80:20 rule)","type":"concept","difficulty":1,"check":true,"answer":1,"lesson_day":3,"stem_html":"<p>What does the 80:20 rule state?</p>","options_html":["<p>Exactly 80% of defects always come from exactly 20% of defect types</p>","<p>Roughly 80% of an effect comes from roughly 20% of the causes</p>","<p>80% of projects fail and 20% succeed</p>","<p>A process should be at least 80% efficient and no more than 20% waste</p>"],"explanation_html":"<p>The Pareto principle, named after Vilfredo Pareto and applied to quality by Joseph Juran, observes that a small number of causes (the vital few) produce most of the effect. The split is rarely exactly 80:20 (Day 3).</p>","distractor_html":["<p>The split is approximate; 70:30 or 90:10 are equally consistent with the principle.</p>",null,"<p>The rule is about causes and effects, not project success rates.</p>","<p>The rule says nothing about efficiency targets.</p>"]},{"id":"D-1.2-012","phase":"Define","section":"1.2","subtopic":"Pareto Analysis (80:20 rule)","type":"calculation","difficulty":2,"generator":"stats:expr","answer":3,"lesson_day":3,"stem_html":"<p>Sixty invoice defects were classified: purchase order number 27, line items 18, address 8, total 4, customer name 3. What is the cumulative percentage after the two largest categories on a Pareto chart?</p>","options_html":["<p>30.0%</p>","<p>88.3%</p>","<p>45.0%</p>","<p>75.0%</p>"],"explanation_html":"<p>Sort largest first: 27 then 18. Cumulative count after two categories is 45. 45 ÷ 60 × 100 = 75.0%. The cumulative line on the chart passes through 45.0% after the first bar and 75.0% after the second (Day 3).</p>","distractor_html":["<p>30.0% is the second category on its own.</p>","<p>88.3% is the cumulative percentage after three categories.</p>","<p>45.0% is the cumulative percentage after only the first category.</p>",null]},{"id":"D-1.2-013","phase":"Define","section":"1.2","subtopic":"Basic Six Sigma Metrics (DPU, DPMO, FTY, RTY, Cycle Time)","type":"interpretation","difficulty":2,"answer":3,"lesson_day":3,"stem_html":"<p>Two suppliers both deliver in an average of 5.0 days. Supplier A's deliveries range from 4.5 to 5.5 days; Supplier B's range from 2 to 8 days. The customer needs delivery within 6 days. Which statement is correct?</p>","options_html":["<p>Neither supplier meets the need, because 5.0 days is too close to 6</p>","<p>The suppliers perform equally because their averages are the same</p>","<p>Supplier B is better because some deliveries arrive in 2 days</p>","<p>Supplier A is better because its smaller variation means every delivery meets the 6-day need</p>"],"explanation_html":"<p>Customers experience individual deliveries, not averages. Supplier A's spread stays inside the requirement every time; Supplier B's spread produces late deliveries even though its average is identical. Variation, not the average, is what creates defects (Day 3).</p>","distractor_html":["<p>An average of 5.0 with a spread of 4.5 to 5.5 meets a 6-day limit comfortably.</p>","<p>Equal averages hide very different spreads; the spread decides how many defects occur.</p>","<p>Early deliveries do not compensate the customers who receive 8-day deliveries.</p>",null]},{"id":"D-1.2-014","phase":"Define","section":"1.2","subtopic":"Basic Six Sigma Metrics (DPU, DPMO, FTY, RTY, Cycle Time)","type":"concept","difficulty":1,"answer":1,"lesson_day":3,"stem_html":"<p>What is the difference between cycle time and lead time?</p>","options_html":["<p>They are two names for the same measure</p>","<p>Cycle time is the time to complete one unit once work starts; lead time is the total time from customer request to delivery, including waiting</p>","<p>Lead time applies only to manufacturing; cycle time applies only to services</p>","<p>Cycle time is measured in days; lead time is measured in hours</p>"],"explanation_html":"<p>Cycle time is what the process is doing to a unit; lead time is what the customer waits, which includes every queue and delay. Lead time is usually much longer than cycle time because of waiting. Some Lean texts also use cycle time for the interval between successive units leaving a process; the exam contrast is always cycle time versus lead time (Day 3).</p>","distractor_html":["<p>They differ by the waiting time between and before steps.</p>
