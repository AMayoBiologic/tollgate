<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tollgate</title>
<meta name="description" content="Self-study for the IASSC Certified Lean Six Sigma Green Belt: lessons, practice questions, calculators and timed mocks.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
:root{--paper:#F6F1E8;--paper2:#ECE5D8;--ink:#1C1A17;--ink2:#655F57;--rule:#D8CFC0;--green:#1F6B45;--greenT:#DFEBE2;--amber:#9A5B0B;--amberT:#F3E3C6;--onGreen:#F6F1E8;--desk:#E4DDD0;--greenHover:#185637;--greenPress:#124229;
--sans:'IBM Plex Sans',system-ui,sans-serif;--mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;--serif:'Source Serif 4',Georgia,serif;--prose:var(--serif)}
:root[data-theme="dark"]{--paper:#1F1D1A;--paper2:#2A2723;--ink:#EDE7DB;--ink2:#A69F92;--rule:#3B3730;--green:#5AA97D;--greenT:#243C30;--amber:#D9A24A;--amberT:#3E3221;--onGreen:#141311;--desk:#141311;--greenHover:#6CB88E;--greenPress:#4E965F}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#1F1D1A;--paper2:#2A2723;--ink:#EDE7DB;--ink2:#A69F92;--rule:#3B3730;--green:#5AA97D;--greenT:#243C30;--amber:#D9A24A;--amberT:#3E3221;--onGreen:#141311;--desk:#141311;--greenHover:#6CB88E;--greenPress:#4E965F}}
:root[data-prose="sans"]{--prose:var(--sans)}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font:15px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
a{color:var(--green)}
button{font:500 15px var(--sans);cursor:pointer;border-radius:4px;height:44px;padding:0 16px;border:1px solid var(--rule);background:transparent;color:var(--ink);min-width:44px}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--green);outline-offset:2px}
button:disabled{opacity:.4;cursor:default}
button.primary{background:var(--green);color:var(--onGreen);border:0}
button.primary:hover{background:var(--greenHover)}button.primary:active{background:var(--greenPress)}
button.secondary:hover{border-color:var(--ink)}button.secondary:active{background:var(--paper2);border-color:var(--ink)}
button.ink{background:var(--ink);color:var(--paper);border:0}
button.warn{color:var(--amber);border-color:var(--amber)}button.warn:hover{background:var(--amberT)}button.warn.on{background:var(--amber);color:var(--paper)}
button.ghost{border:0;color:var(--ink2)}
button.sm{height:40px;font-size:14px}
input,select,textarea{font:16px var(--mono);height:44px;padding:0 12px;border:1px solid var(--rule);border-radius:4px;background:var(--paper);color:var(--ink);width:100%;min-width:0}
input.sans,select.sans{font-family:var(--sans);font-size:15px}
textarea{height:auto;min-height:120px;padding:12px;font:15px/1.5 var(--sans);resize:vertical}
input:focus,textarea:focus,select:focus{border-color:var(--green);outline:2px solid var(--greenT)}
.eyebrow{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink2)}
.mono{font-family:var(--mono)}.muted{color:var(--ink2)}.small{font-size:14px}.caption{font-size:13px;color:var(--ink2)}
.amber{color:var(--amber)}.green{color:var(--green)}
.card{border:1px solid var(--rule);border-radius:6px;padding:16px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.stack{display:flex;flex-direction:column;gap:12px}
h1,h2,h3{margin:0;font-weight:500}
h2.page{font-size:22px}
.hr{border-top:1px solid var(--rule)}
/* layout */
#app{min-height:100%;display:flex;flex-direction:column}
.shell{display:flex;min-height:100vh}
.sidebar{display:none}
.main{flex:1;min-width:0;padding:20px 20px 88px;display:flex;flex-direction:column;gap:24px;max-width:100%}
.tabbar{position:fixed;left:0;right:0;bottom:0;height:calc(56px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);display:flex;border-top:1px solid var(--rule);background:var(--paper);z-index:20}
.tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;color:var(--ink2);text-decoration:none;gap:2px}
.tabbar a.on{color:var(--green);font-weight:500}
@media (min-width:900px){
 .sidebar{display:flex;flex-direction:column;gap:2px;width:220px;flex-shrink:0;border-right:1px solid var(--rule);padding:24px 16px;font-size:14px;position:sticky;top:0;height:100vh}
 .sidebar .brand{font:500 17px var(--sans);padding:0 10px 20px}
 .sidebar a{padding:8px 10px;color:var(--ink2);text-decoration:none;border-radius:4px}
 .sidebar a.on{background:var(--paper2);color:var(--ink);font-weight:500}
 .sidebar .foot{margin-top:auto;padding:0 10px;font:13px/1.5 var(--mono);color:var(--ink2)}
 .main{padding:44px 56px;gap:32px;max-width:1180px}
 .tabbar{display:none}
 h2.page{font-size:26px}
 .card{padding:24px}
}
/* bars */
.bar{position:relative;height:6px;background:var(--paper2)}
.bar>i{display:block;height:100%;background:var(--green)}
.bar.low>i{background:var(--amber)}
.bar.pass::after{content:"";position:absolute;left:70%;top:-4px;height:14px;width:1px;background:var(--green)}
.bar.big{height:10px}.bar.big.pass::after{top:-5px;height:20px}
.bar.thin{height:4px}.bar.thin.pass::after{top:-3px;height:10px}
.passlabel{position:absolute;left:70%;top:14px;transform:translateX(-50%);font:11px var(--mono);color:var(--green)}
/* options */
.opt{min-height:48px;display:flex;align-items:center;gap:12px;padding:8px 12px;border:1px solid var(--rule);border-radius:4px;background:transparent;color:var(--ink);text-align:left;width:100%;font:400 15px/1.4 var(--sans);height:auto}
.opt .k{font:13px var(--mono);color:var(--ink2);flex-shrink:0}
.opt.sel{border-color:var(--ink);background:var(--paper2)}
.opt.right{border-color:var(--green);background:var(--greenT)}
.opt.wrong{border-color:var(--amber);background:var(--amberT)}
.opt.dim{color:var(--ink2)}
.opt p{margin:0}
/* tables in content */
.prose table,table.data{border-collapse:collapse;width:100%;font:14px/1.5 var(--mono)}
.prose th,table.data th{text-align:left;padding:6px 8px;font-weight:500;border-bottom:1px solid var(--ink)}
.prose td,table.data td{padding:6px 8px;border-bottom:1px solid var(--rule)}
.prose tr:last-child td,table.data tr:last-child td{border-bottom:0}
.prose td.num,.prose th.num{text-align:right}
@media (max-width:480px){.prose table,table.data{font-size:13px}.prose td,.prose th,table.data td,table.data th{padding:5px 6px}}
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
/* prose */
.prose{font:18px/1.6 var(--prose);max-width:680px}
.prose p{margin:0 0 1em}.prose p:last-child{margin-bottom:0}
.prose ul,.prose ol{margin:0 0 1em;padding-left:22px}.prose li{margin-bottom:.35em}
.prose h3{font:600 20px/1.3 var(--prose);margin:1.2em 0 .5em}.prose h3:first-child{margin-top:0}
.prose h4{font:500 16px var(--sans);margin:1em 0 .4em}
.prose code{font:14px var(--mono);background:var(--paper2);padding:1px 5px;border-radius:3px}
.prose pre{font:13px/1.6 var(--mono);background:var(--paper2);padding:12px 14px;border-radius:6px;overflow-x:auto;margin:0 0 1em}
.prose pre code{background:none;padding:0;font-size:13px}
.prose strong{font-weight:600}
.prose table{font-size:14px}
.prose.small{font-size:17px}
.term{border-bottom:1px dotted var(--green);color:var(--green);cursor:pointer}
.termpop{border:1px solid var(--rule);border-radius:6px;padding:12px 14px;background:var(--paper2);display:flex;flex-direction:column;gap:4px;font:14px/1.45 var(--sans);margin:8px 0}
.lesson{display:flex;flex-direction:column;gap:28px}
.block{display:flex;flex-direction:column;gap:10px}
@media (min-width:900px){.lesson{gap:36px;max-width:900px}.block{display:grid;grid-template-columns:180px 1fr;gap:24px}.block>.eyebrow{padding-top:8px}.lesson .prose{max-width:680px}}
.formula{border:1px solid var(--rule);border-radius:6px;padding:14px 16px;font:14px/1.8 var(--mono)}
.formula p{margin:0}.formula ul{margin:0;padding-left:18px}.formula table{font-size:14px}.formula code{background:none;padding:0;font-size:14px}
.steps details{border-bottom:1px solid var(--rule);padding:12px 0}.steps details:first-of-type{border-top:1px solid var(--rule)}
.steps summary{cursor:pointer;font-weight:500;list-style:none;display:flex;justify-content:space-between;align-items:center}
.steps summary::-webkit-details-marker{display:none}
.steps summary::after{content:"+";color:var(--ink2)}.steps details[open] summary::after{content:"−"}
.steps .body{padding-top:10px}
/* nav grid */
.navgrid{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.navgrid button{height:28px;min-width:0;padding:0;font:11px var(--mono);border-radius:2px;border:1px solid var(--rule);color:var(--ink2);background:transparent}
.navgrid button.ans{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.navgrid button.flag{border:2px solid var(--amber)}
.navgrid button.cur{border:2px solid var(--green)}
@media (min-width:900px){.navgrid{grid-template-columns:repeat(20,1fr);gap:6px}.navgrid button{height:36px;font-size:13px;border-radius:3px}.exam .side .navgrid{grid-template-columns:repeat(10,1fr);gap:4px}.exam .side .navgrid button{height:24px;font-size:11px}}
/* exam */
.exam{position:fixed;inset:0;background:var(--paper);display:flex;flex-direction:column;z-index:30}
.exam .top{padding:14px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--rule)}
.exam .pace{padding:8px 20px;display:flex;justify-content:space-between;font-size:12px;color:var(--ink2);border-bottom:1px solid var(--rule)}
.exam .body{flex:1;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:16px}
.exam .body .stem{font-size:16px;line-height:1.5}
.exam .tools{display:flex;justify-content:space-between;padding:0 20px;border-top:1px solid var(--rule)}
.exam .tools button{border:0;height:40px;font-size:13px;color:var(--ink2);padding:0 8px}
.exam .foot{display:grid;grid-template-columns:1fr 1fr 1fr;height:calc(56px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);border-top:1px solid var(--rule)}
.exam .foot button{border:0;border-radius:0;height:100%;border-right:1px solid var(--rule)}.exam .foot button:last-child{border-right:0;font-weight:500}
.timer{font:500 20px var(--mono)}.timer.pressure{color:var(--amber)}
@media (min-width:900px){
 .exam .top{padding:16px 48px;display:grid;grid-template-columns:1fr auto 1fr}.timer{font-size:32px}
 .exam .pace{display:none}
 .exam .mid{flex:1;display:grid;grid-template-columns:1fr 320px;overflow:hidden}
 .exam .body{padding:40px 48px;gap:24px;max-width:840px}.exam .body .stem{font-size:18px;line-height:1.55}
 .exam .side{border-left:1px solid var(--rule);padding:32px 24px;display:flex;flex-direction:column;gap:20px;font-size:14px;overflow:auto}
 .exam .tools{display:none}
 .exam .foot{display:flex;justify-content:space-between;align-items:center;padding:12px 48px;height:auto}
 .exam .foot button{border:1px solid var(--rule);border-radius:4px;height:44px;padding:0 20px}
 .exam .foot button.warn{border-color:var(--amber)}.exam .foot button.ink{border:0}
}
@media (max-width:899px){.exam .side{display:none}.exam .mid{flex:1;display:flex;flex-direction:column;overflow:hidden}}
/* sheets */
.sheet-bg{position:fixed;inset:0;background:var(--ink);opacity:.4;z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:88vh;background:var(--paper);border-top:1px solid var(--rule);border-radius:12px 12px 0 0;z-index:41;display:flex;flex-direction:column;overflow:hidden}
.sheet .head{padding:14px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--rule);font-weight:500}
.sheet .head button{border:0;color:var(--ink2);height:36px}
.sheet .tabs{display:flex;border-bottom:1px solid var(--rule);font-size:14px}
.sheet .tabs button{flex:1;border:0;border-radius:0;color:var(--ink2);height:44px}.sheet .tabs button.on{color:var(--ink);font-weight:500;border-bottom:2px solid var(--green)}
.sheet .content{flex:1;overflow:auto;padding:16px 20px;display:flex;flex-direction:column;gap:12px}
@media (min-width:900px){.sheet{left:auto;top:0;width:560px;max-height:none;border-radius:0;border-top:0;border-left:1px solid var(--rule)}.sheet .head{padding:20px 32px;font-size:20px}.sheet .content{padding:24px 32px}}
.ref{font:13px/1.7 var(--mono);display:flex;flex-direction:column;gap:12px}.ref .g{display:flex;flex-direction:column}.ref .g span:first-child{color:var(--ink2)}
/* calculator */
.calc{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.calc button{height:48px;font:16px var(--mono);min-width:0;padding:0}
.calc button.op{background:var(--paper2)}.calc button.eq{background:var(--green);color:var(--onGreen);border:0}
.calc .disp{grid-column:1/-1;font:500 28px var(--mono);text-align:right;padding:8px 12px;border:1px solid var(--rule);border-radius:4px;min-height:52px;word-break:break-all}
.calc .expr{grid-column:1/-1;font:13px var(--mono);color:var(--ink2);text-align:right;min-height:18px}
/* misc */
.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:4px;font-size:14px;z-index:60}
.pill{font:13px var(--mono);border:1px solid var(--rule);border-radius:3px;padding:2px 6px;color:var(--ink2)}
.seg{display:flex;gap:8px}.seg button{flex:1;font:500 14px var(--mono);min-width:0;padding:0}.seg button.on{border-color:var(--ink);background:var(--paper2)}
.list{display:flex;flex-direction:column;border-top:1px solid var(--rule)}
.list>*{display:flex;justify-content:space-between;align-items:center;min-height:48px;border-bottom:1px solid var(--rule);text-decoration:none;color:var(--ink);font-size:14px;gap:12px;padding:6px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:1fr;gap:24px}
@media (min-width:900px){.grid3{grid-template-columns:repeat(3,1fr)}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:32px}}
.big{font:500 32px/1.1 var(--mono)}.huge{font:500 64px/1 var(--mono)}
@media (min-width:900px){.huge{font-size:96px}.big{font-size:40px}}
.heat{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.heat div{height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:3px;background:var(--greenT);color:var(--green);font:500 14px var(--mono);cursor:pointer}
.heat div.low{background:var(--amberT);color:var(--amber)}.heat div.none{background:var(--paper2);color:var(--ink2)}
.heat div small{font-size:10px;font-weight:400}
@media (min-width:900px){.heat{grid-template-columns:repeat(17,1fr)}.heat div{height:64px}}
.dot{width:8px;height:8px;border-radius:50%;border:1px solid var(--rule);flex-shrink:0}.dot.done{background:var(--green);border-color:var(--green)}.dot.prog{background:var(--amber);border-color:var(--amber)}
.dayrow{display:grid;grid-template-columns:10px 26px 1fr auto;gap:10px;align-items:center;min-height:40px;font-size:14px;text-decoration:none;color:var(--ink)}
.dayrow .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.feedback{font-size:14px;margin:0}
.checkq{display:flex;flex-direction:column;gap:10px}
.checkq .q{font:17px/1.5 var(--prose);margin:0}
.checkq .opts{display:flex;flex-direction:column;gap:6px}
@media (min-width:900px){.checkq .opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}}
.expl{font-size:14px;color:var(--ink)}
.expl p{margin:0}
.wrap{display:flex;flex-wrap:wrap;gap:8px}
.kbd{font:12px var(--mono);border:1px solid var(--rule);border-radius:3px;padding:0 5px;color:var(--ink2)}
.center{text-align:center}
@media print{.sidebar,.tabbar,button{display:none !important}.main{padding:0}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const DATA = /*__DATA__*/null;
</script>
<script>
/*__APP__*/
</script>
</body>
</html>
